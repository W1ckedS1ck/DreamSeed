; Type checking for the Python tooling (the deploy logic itself is bash).
;
; Scope is explicit: scripts/, lib/, the composite actions, the codemap generator and the tests.
; The server-side Telegram bot (scripts/telegram_bot.py) is included — it is plain Python too.
;
; `check_untyped_defs` is ON: a function without annotations still gets its BODY checked, which is
; where most of the bugs live. `ignore_missing_imports` stays on because a few deps (pyyaml/jinja2
; in the tests, urllib in stdlib) ship no stubs worth pinning.
[mypy]
python_version = 3.12
files = scripts, lib, .github/actions, docs/codemap, tests
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
strict_equality = true
exclude = (?x)(^|/)(\.venv|\.git|logs|secrets|terraform)/
