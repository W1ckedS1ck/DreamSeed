[extend]
useDefault = true

[[rules]]
id = "grafana-cloud-sa-token"
description = "Grafana Cloud Service Account Token (glsa_)"
regex = '''glsa_[A-Za-z0-9_-]{36}_[A-Za-z0-9_]{8,10}'''
tags = ["grafana", "secret"]

[[rules]]
id = "grafana-sm-api-key"
description = "Grafana Synthetic Monitoring API Key (JWT)"
regex = '''eyJrIjoi[A-Za-z0-9_-]{40,}={0,2}'''
tags = ["grafana", "secret"]

[[rules]]
id = "grafana-cloud-access-policy"
description = "Grafana Cloud Access Policy Token (glc_)"
regex = '''glc_[A-Za-z0-9]{20,}'''
keywords = ["glc_"]
tags = ["grafana", "secret"]

[allowlist]
paths = [
  '''\.claude/''',
  '''\.terraform\.lock\.hcl''',
  # secrets/ is gitignored (vault, LE private keys, rclone.conf, local .bak
  # backups) and must never be committed. A working-tree scan (--no-git) reads
  # those local files and fails while CI stays green, so skip them here — the
  # gate against actually committing them is lint.sh --secrets ("secrets/ not
  # tracked"), which CI runs alongside the history scan.
  # Trade-off: this pattern also skips secrets/ paths in the history scan.
  '''^secrets/''',
]
