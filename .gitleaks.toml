[extend]
useDefault = true

[[rules]]
id = "grafana-cloud-sa-token"
description = "Grafana Cloud Service Account Token (glsa_)"
regex = '''glsa_[A-Za-z0-9_-]{36}_[A-Za-z0-9_]{8,10}'''
tags = ["grafana", "secret"]

[[rules]]
id = "grafana-sm-api-key"
description = "Grafana Synthetic Monitoring API Key (JWT)"
regex = '''eyJrIjoi[A-Za-z0-9_-]{40,}={0,2}'''
tags = ["grafana", "secret"]

[[rules]]
id = "grafana-cloud-access-policy"
description = "Grafana Cloud Access Policy Token (glc_)"
regex = '''glc_[A-Za-z0-9]{20,}'''
keywords = ["glc_"]
tags = ["grafana", "secret"]

# Global allowlist. Keep entries as narrow as possible: everything listed here
# is invisible to EVERY rule, including ones added in the future. `secrets/` is
# deliberately NOT here — it is only skipped for local working-tree scans via
# .gitleaks-local.toml, so CI's full-history scan stays strict.
[[allowlists]]
description = "Local agent state and Terraform provider lock hashes"
paths = [
  '''\.claude/''',
  '''\.terraform\.lock\.hcl''',
]
