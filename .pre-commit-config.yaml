repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-shebang-scripts-are-executable
        exclude_types: [jinja]
        exclude: ^scripts/common_functions\.sh$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
        types: [shell]
        exclude: \.tftpl$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        types: [python]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", "markdownlint-cli2.jsonc"]
        files: \.(md|markdown)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: terraform-docs-aws
        name: terraform-docs (aws)
        entry: bash -c "command -v terraform-docs >/dev/null 2>&1 && cd terraform/aws && terraform-docs markdown table --output-file README.md . || echo 'skip (unavailable)'"
        language: system
        files: ^terraform/aws/.*\.tf$
        pass_filenames: false
      - id: terraform-docs-hetzner
        name: terraform-docs (hetzner)
        entry: bash -c "command -v terraform-docs >/dev/null 2>&1 && cd terraform/hetzner && terraform-docs markdown table --output-file README.md . || echo 'skip (unavailable)'"
        language: system
        files: ^terraform/hetzner/.*\.tf$
        pass_filenames: false
      - id: terraform-docs-grafana
        name: terraform-docs (grafana)
        entry: bash -c "command -v terraform-docs >/dev/null 2>&1 && cd terraform/grafana && terraform-docs markdown table --output-file README.md . || echo 'skip (unavailable)'"
        language: system
        files: ^terraform/grafana/.*\.tf$
        pass_filenames: false
      - id: terraform-docs-cloudflare
        name: terraform-docs (cloudflare)
        entry: bash -c "command -v terraform-docs >/dev/null 2>&1 && cd terraform/cloudflare && terraform-docs markdown table --output-file README.md . || echo 'skip (unavailable)'"
        language: system
        files: ^terraform/cloudflare/.*\.tf$
        pass_filenames: false

  - repo: local
    hooks:
      - id: gitleaks
        name: Check for hardcoded secrets
        entry: gitleaks protect --staged -v
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        # Delegates to scripts/lint.sh so pre-commit, CI and local
        # `deploy.sh --lint` share ONE implementation (single source of truth).
        entry: bash scripts/lint.sh --fmt
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: tflint
        name: TFLint (Terraform)
        entry: bash scripts/lint.sh --tflint
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: gen_codemap
        name: Regenerate code map
        entry: python3 docs/codemap/gen_codemap.py --check
        language: system
        files: |
          (?x)^(
            \.github/|
            ansible/|
            scripts/|
            terraform/|
            lib/|
            docs/
          )
        pass_filenames: false
