repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-shebang-scripts-are-executable
        exclude_types: [jinja]
        exclude: ^scripts/common_functions\.sh$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tflint
        name: tflint
        entry: bash -c 'command -v tflint >/dev/null 2>&1 && exec tflint "$@" || echo "tflint not found, skipping"'
        language: system
        files: \.tf$
        args: [--config, .tflint.hcl, --call-module-type=none]
