repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-shebang-scripts-are-executable
        exclude_types: [jinja]
        exclude: ^scripts/common_functions\.sh$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
        types: [shell]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        types: [python]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.yml"]
        files: \.(md|markdown)$

  - repo: local
    hooks:
      - id: terraform-docs-aws
        name: terraform-docs (aws)
        entry: bash -c "cd terraform/aws && terraform-docs markdown table --output-file README.md ."
        language: system
        files: ^terraform/aws/.*\.tf$
        pass_filenames: false
      - id: terraform-docs-hetzner
        name: terraform-docs (hetzner)
        entry: bash -c "cd terraform/hetzner && terraform-docs markdown table --output-file README.md ."
        language: system
        files: ^terraform/hetzner/.*\.tf$
        pass_filenames: false
      - id: terraform-docs-grafana
        name: terraform-docs (grafana)
        entry: bash -c "cd terraform/grafana && terraform-docs markdown table --output-file README.md ."
        language: system
        files: ^terraform/grafana/.*\.tf$
        pass_filenames: false

  - repo: local
    hooks:
      - id: gitleaks
        name: Check for hardcoded secrets
        entry: gitleaks detect --source . --no-git -v
        language: system
        pass_filenames: false
