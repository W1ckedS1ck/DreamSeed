# Ruff configuration for DreamSeed's Python tooling.
#
# Explicit rule selection keeps results stable across ruff upgrades: a new
# default rule can never silently start failing CI (see
# https://docs.astral.sh/ruff/configuration/). The server-side bot runs on
# Python 3.12, so target-version is the oldest interpreter we must support.
line-length = 88
target-version = "py312"

extend-exclude = [
    ".ansible",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "logs",
    "secrets",
    "terraform",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length is the formatter's job (long URLs are common here)
    "RUF001", # UI/Telegram strings intentionally use typographic glyphs (→, ➖, −)
]

[lint.per-file-ignores]
# pytest is assertion-based; assert is the test API, not a security issue.
# Fixtures use fake tokens and a seeded PRNG; jinja autoescape is irrelevant
# because these tests only check template syntax.
"tests/**/*.py" = ["S101", "S105", "S311", "S603", "S607", "S701"]
# Chatops helpers shell out to `gh` with fixed arguments.
".github/actions/chatops/*.py" = ["S603", "S607"]
# Read-only GitHub/Scorecard API clients use https URLs only.
"scripts/check_required_checks.py" = ["S310"]
"scripts/github_posture.py" = ["S310"]
# Wraps `bash -n` for composite-action run blocks.
"scripts/lint_actions.py" = ["S603", "S607"]
# Generator shells out to git with fixed arguments.
"docs/codemap/gen_codemap.py" = ["S603"]

[format]
quote-style = "double"
docstring-code-format = true
