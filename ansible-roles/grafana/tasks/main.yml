---
- name: Add Grafana GPG key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor -o /usr/share/keyrings/grafana.gpg || curl -fsSL https://apt.grafana.com/gpg.key | gpg --dearmor -o /usr/share/keyrings/grafana.gpg
    executable: /bin/bash
  args:
    creates: /usr/share/keyrings/grafana.gpg
  failed_when: false

- name: Add Grafana repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana={{ grafana_version }}
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Configure Grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Create Grafana systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: Set Grafana systemd memory limits
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/memory.conf
    content: |
      [Service]
      Environment="GOMEMLIMIT=400MiB"
      MemoryMax=480M
      MemoryHigh=400M
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Grafana

- name: Create Grafana directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Deploy Grafana datasource
  ansible.builtin.template:
    src: grafana-datasource.yaml.j2
    dest: /etc/grafana/provisioning/datasources/victoria.yaml
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Deploy Grafana dashboard provisioner
  ansible.builtin.template:
    src: grafana-dashboards.yaml.j2
    dest: /etc/grafana/provisioning/dashboards/dashboards.yaml
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Sync Grafana dashboards  # noqa: jinja[invalid]
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: /var/lib/grafana/dashboards/
    checksum: true
    rsync_path: "sudo rsync"
    rsync_opts: "{{ web_excludes + common_rsync_opts }}"
  become: false
  vars:
    web_excludes: "{{ ['--exclude=apache-exporter.json'] if web_server == 'nginx' else ['--exclude=nginx.json', '--exclude=nginx-prometheus.json'] }}"
    common_rsync_opts:
      - "--include=*.json"
      - "--exclude=*"
  notify: Restart Grafana

- name: Fix Grafana dashboard directory ownership and permissions
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    owner: grafana
    group: grafana
    mode: "0755"
    recurse: true
  become: true

- name: Fix Grafana dashboard file permissions
  ansible.builtin.shell:
    cmd: find /var/lib/grafana/dashboards -type f -name "*.json" -exec chmod 0644 {} +
  changed_when: false
  become: true

- name: Create Grafana alerting provisioning directory
  ansible.builtin.file:
    path: /etc/grafana/provisioning/alerting
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Deploy Grafana alerts
  ansible.builtin.template:
    src: grafana-alerts.yaml.j2
    dest: /etc/grafana/provisioning/alerting/alerts.yaml
    owner: grafana
    group: grafana
    mode: "0640"
  notify: Restart Grafana
  when: grafana_telegram_token | default('') | length > 0

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    return_content: false
    status_code: 200
  retries: 14
  delay: 2

- name: Check if Grafana admin password needs reset
  ansible.builtin.stat:
    path: /etc/grafana/.admin_password_set
  register: grafana_password_flag
  when:
    - grafana_admin_password | default('') | length > 0

- name: Reset Grafana admin password via CLI
  ansible.builtin.command:
    cmd: grafana-cli --homepath /usr/share/grafana admin reset-admin-password --password-from-stdin
    stdin: "{{ grafana_admin_password }}"
  no_log: true
  changed_when: true
  register: grafana_cli_result
  when:
    - grafana_admin_password | default('') | length > 0
    - not (grafana_password_flag.stat.exists | default(false))

- name: Mark Grafana admin password as set
  ansible.builtin.copy:
    dest: /etc/grafana/.admin_password_set
    content: ""
    mode: "0600"
    owner: grafana
    group: grafana
  when:
    - grafana_admin_password | default('') | length > 0
    - not (grafana_password_flag.stat.exists | default(false))

- name: Warn if Grafana password reset failed
  ansible.builtin.debug:
    msg: "WARNING: Grafana CLI password reset failed"
  when:
    - grafana_cli_result is defined
    - grafana_cli_result is not skipped
    - grafana_cli_result.rc != 0