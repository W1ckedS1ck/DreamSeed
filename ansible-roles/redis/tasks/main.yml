---
- name: Ensure Redis data directory exists
  become: true
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Set vm.overcommit_memory (required by Redis for BGSAVE)
  become: true
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    reload: true

- name: Create systemd drop-in directory for redis-server
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    mode: "0755"

- name: Deploy Redis auto-restart drop-in
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis-server.service.d/restart.conf
    content: |
      [Service]
      Restart=always
      RestartSec=5s
      OOMScoreAdjust=-900
    mode: "0644"
  notify: Restart Redis

- name: Deploy Redis configuration
  become: true
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  no_log: true
  notify: Restart Redis

- name: Ensure Redis is running
  become: true
  ansible.builtin.systemd:
    name: redis-server
    state: started
    enabled: true
