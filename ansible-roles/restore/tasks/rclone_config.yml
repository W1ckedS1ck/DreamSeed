---
- name: Check if rclone config exists locally
  ansible.builtin.stat:
    path: "{{ secrets_dir }}/rclone.conf"
  register: rclone_config_stat
  delegate_to: localhost
  delegate_facts: true
  when:
    - secrets_dir is defined
    - secrets_dir | length > 0

- name: Create rclone config directory
  ansible.builtin.file:
    path: "/home/ubuntu/.config/rclone"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  when: rclone_config_stat.stat.exists | default(false)

- name: Upload rclone config
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/rclone.conf"
    dest: "/home/ubuntu/.config/rclone/rclone.conf"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  when: rclone_config_stat.stat.exists | default(false)

- name: Create crypt remote for encrypted backups
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      rclone config create gdrive-crypt crypt \
        remote=gdrive: \
        password="$(rclone obscure '{{ rclone_crypt_password }}')" 2>/dev/null || true
    executable: /bin/bash
  become: true
  become_user: ubuntu
  changed_when: false
  no_log: true
  when:
    - rclone_crypt_password is defined
    - rclone_crypt_password | length > 0
