---
- name: Check if rclone config exists locally
  ansible.builtin.stat:
    path: "{{ secrets_dir }}/rclone.conf"
  register: rclone_config_stat
  delegate_to: localhost
  delegate_facts: true
  when:
    - secrets_dir is defined
    - secrets_dir | length > 0

- name: Create rclone config directory
  ansible.builtin.file:
    path: "/home/ubuntu/.config/rclone"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  when: rclone_config_stat.stat.exists | default(false)

- name: Upload rclone config
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/rclone.conf"
    dest: "/home/ubuntu/.config/rclone/rclone.conf"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  when: rclone_config_stat.stat.exists | default(false)

- name: Validate rclone crypt password
  ansible.builtin.assert:
    that:
      - rclone_crypt_password | length > 0
    fail_msg: >-
      rclone_crypt_password is required when rclone config is present.
      Set RCLONE_CRYPT_PASSWORD environment variable or add to secrets/.env.
  when: rclone_config_stat.stat.exists | default(false)

- name: Ensure crypt remote exists (never delete/recreate — would rotate the key)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if rclone listremotes | grep -qx 'gdrive-crypt:'; then
        echo "gdrive-crypt already configured — skipping (recreate would rotate the KDF salt and lose all existing backups)"
      else
        rclone config create gdrive-crypt crypt \
          remote=gdrive: \
          password="$RCLONE_CRYPT_PASSWORD" \
          filename_encryption=off \
          directory_name_encryption=false
      fi
    executable: /bin/bash
  environment:
    RCLONE_CRYPT_PASSWORD: "{{ rclone_crypt_password }}"
  become: true
  become_user: ubuntu
  changed_when: false
  no_log: true
