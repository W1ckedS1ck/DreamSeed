---
- name: Check if rclone config exists locally
  ansible.builtin.stat:
    path: "{{ secrets_dir }}/rclone.conf"
  register: rclone_config_stat
  delegate_to: localhost
  delegate_facts: true
  when:
    - secrets_dir is defined
    - secrets_dir | length > 0

- name: Create rclone config directory
  ansible.builtin.file:
    path: "/home/ubuntu/.config/rclone"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  when: rclone_config_stat.stat.exists | default(false)

- name: Upload rclone config
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/rclone.conf"
    dest: "/home/ubuntu/.config/rclone/rclone.conf"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  when: rclone_config_stat.stat.exists | default(false)

- name: Validate rclone crypt password
  ansible.builtin.assert:
    that:
      - rclone_crypt_password | length > 0
    fail_msg: >-
      rclone_crypt_password is required when rclone config is present.
      Set RCLONE_CRYPT_PASSWORD environment variable or add to secrets/.env.
  when: rclone_config_stat.stat.exists | default(false)

- name: Recreate crypt remote with correct settings (delete if exists)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      rclone config delete gdrive-crypt 2>/dev/null || true
      rclone config create gdrive-crypt crypt \
        remote=gdrive: \
        password="$(rclone obscure '{{ rclone_crypt_password }}')" \
        filename_encryption=off \
        directory_name_encryption=false
    executable: /bin/bash
  become: true
  become_user: ubuntu
  changed_when: false
  no_log: true
