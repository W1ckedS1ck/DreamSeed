---
- name: Upload rclone config
  ansible.builtin.include_tasks: rclone_config.yml

- name: Check if rclone config exists on server
  ansible.builtin.stat:
    path: /home/ubuntu/.config/rclone/rclone.conf
  register: rclone_config_remote

# ========================
#  Restore Project
# ========================
- name: Check if site already restored
  become: true
  ansible.builtin.stat:
    path: "{{ web_root }}/index.php"
  register: restore_site_exists

- name: Warn if site missing and no restore source
  ansible.builtin.debug:
    msg: >-
      ⚠ Site not found at {{ web_root }} and no rclone.conf available.
      Deploy will continue but site won't serve content.
      Fix: add rclone.conf to secrets/ and re-run deploy with -i <IP>.
  when:
    - not restore_site_exists.stat.exists
    - not rclone_config_remote.stat.exists

# NOTE: Dev environments (dev-aws, dev-hetz) intentionally restore backups
# from prod (gdrive:DreamSeed/backups/project/ and db/). There is no
# separate backup pipeline for dev — dev always pulls latest prod data.
# This is by design, not a bug. Dev environments are ephemeral testing
# copies of prod, not independent environments with their own data.
# If you change these paths, make sure dev still gets prod data, not
# dev-specific backups.

- name: Restore project from Google Drive
  when:
    - not restore_site_exists.stat.exists
    - rclone_config_remote.stat.exists
  block:
    - name: List all project backups (newest first)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone lsf gdrive:DreamSeed/backups/project/ --max-depth 1 | sort -r || true
        executable: /bin/bash
      register: restore_project_list
      changed_when: false
      failed_when: false

    - name: Fail if no project backups found
      ansible.builtin.fail:
        msg: "No project backups found on Google Drive"
      when: restore_project_list.stdout | trim == ""

    - name: Validate project backup filenames
      ansible.builtin.fail:
        msg: "Unsafe backup filename: '{{ item }}'"
      loop: "{{ restore_project_list.stdout_lines }}"
      when: not (item | trim | regex_search('^[A-Za-z0-9._-]+$'))

    - name: Validate web_root before destructive operation
      ansible.builtin.fail:
        msg: "Refusing to extract to '{{ web_root }}': path is empty, root, or /var/www"
      when: web_root == '' or web_root == '/' or web_root == '/var/www' or web_root == '/var/www/'

    - name: Set backup cache directory (EBS, not tmpfs)
      ansible.builtin.set_fact:
        restore_cache: "{{ backup_dir }}/.restore_cache"

    - name: Ensure backup cache directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}/.restore_cache"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Download and restore project (try each until one works)
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          _web="{{ web_root }}"
          _remote="gdrive:DreamSeed/backups/project"
          _cache="{{ backup_dir }}/.restore_cache"

          for _archive in {% for f in restore_project_list.stdout_lines if f | trim | length > 0 %}{{ f | trim }} {% endfor %}; do
            _local="$_cache/$_archive"
            rm -f "$_local"

            # Download with retries (rclone copy retries 3x by default) to EBS, not tmpfs
            if ! timeout 600 rclone copy "$_remote/$_archive" "$_cache/" --no-check-dest 2>/dev/null; then
              echo "  ✗ $_archive — download failed, trying next" >&2
              continue
            fi

            # Verify integrity before extraction
            if ! tar -tzf "$_local" > /dev/null 2>&1; then
              echo "  ✗ $_archive — corrupted download, trying next" >&2
              rm -f "$_local"
              continue
            fi

            # Backup existing site
            [ -d "$_web" ] && mv "$_web" "${_web}.bak.$$" || true
            mkdir -p "$_web"

            # Extract
            if tar -xzf "$_local" -C "$(dirname "$_web")" 2>/dev/null; then
              echo "SUCCESS: $_archive"
              rm -rf "${_web}.bak.$$" "$_cache" 2>/dev/null || true
              chown -R www-data:www-data "$_web"
              exit 0
            else
              echo "  ✗ $_archive — extraction failed, trying next" >&2
              rm -rf "$_web" 2>/dev/null || true
              [ -d "${_web}.bak.$$" ] && mv "${_web}.bak.$$" "$_web" || true
              rm -f "$_local"
            fi
          done

          # All backups failed — create placeholder so deploy continues
          echo "WARN: all project backups failed — deploying placeholder" >&2
          rm -rf "$_cache" 2>/dev/null || true
          [ ! -f "$_web/index.php" ] && {
            mkdir -p "$_web"
            ( echo '<?php'; echo 'header("HTTP/1.0 503 Service Unavailable");'
              echo 'echo "<html><body><h1>Site temporarily unavailable</h1>";'
              echo 'echo "<p>Restore from backup failed.</p></body></html>";' ) > "$_web/index.php"
            chown -R www-data:www-data "$_web"
          }
          exit 0
        executable: /bin/bash
      changed_when: false

- name: Skip restore (already exists)
  ansible.builtin.debug:
    msg: "⊘ Site already exists at {{ web_root }}, skipping restore"
  when: restore_site_exists.stat.exists

# ========================
#  Restore Database
# ========================
- name: Check if DB already has tables
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      mysql "{{ db_name }}" -e "SHOW TABLES" 2>/dev/null | wc -l
    executable: /bin/bash
  register: restore_db_tables
  changed_when: false
  failed_when: false

- name: Set db_needs_restore fact
  ansible.builtin.set_fact:
    restore_db_needs_restore: "{{ (restore_db_tables.stdout | default('0') | int) < 2 }}"

# NOTE: See the project-restore block above — same logic applies: dev always
# restores from prod backups. Paths are intentionally prod-only.
# Dev environments have no independent backup pipeline by design.

- name: Restore database from Google Drive
  when:
    - restore_db_needs_restore
    - rclone_config_remote.stat.exists
  block:
    - name: List all DB backups (newest first)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone lsf gdrive:DreamSeed/backups/db/ --max-depth 1 | sort -r || true
        executable: /bin/bash
      register: restore_db_list
      changed_when: false
      failed_when: false

    - name: Fail if no DB backups found
      ansible.builtin.fail:
        msg: "No DB backups found on Google Drive"
      when: restore_db_list.stdout | trim == ""

    - name: Validate DB backup filenames
      ansible.builtin.fail:
        msg: "Unsafe DB backup filename: '{{ item }}'"
      loop: "{{ restore_db_list.stdout_lines }}"
      when: not (item | trim | regex_search('^[A-Za-z0-9._-]+$'))

    - name: Restore database via streaming (try each until one works)
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          _backup_dir="gdrive:DreamSeed/backups/db"
          _db_name="{{ db_name }}"

          for _archive in {% for f in restore_db_list.stdout_lines if f | trim | length > 0 %}{{ f | trim }} {% endfor %}; do
            if rclone cat "$_backup_dir/$_archive" 2>/dev/null | gunzip | mysql "$_db_name" 2>/dev/null; then
              echo "SUCCESS: $_archive"
              exit 0
            else
              echo "  ✗ $_archive — corrupted, trying next" >&2
            fi
          done

          echo "WARN: all DB backups failed — continuing without DB restore" >&2
          exit 0
        executable: /bin/bash
      register: restore_db_result
      changed_when: false

    - name: Extract restored DB filename
      ansible.builtin.set_fact:
        restore_db_name: "{{ restore_db_result.stdout_lines | select('match', '^SUCCESS:') | first | default('') | regex_replace('^SUCCESS: ', '') }}"

    - name: Verify database restore (expect 50+ tables)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          mysql "{{ db_name }}" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ db_name }}';"
        executable: /bin/bash
      register: restore_db_table_count
      changed_when: false
      failed_when: false

    - name: Show restored DB
      ansible.builtin.debug:
        msg: "✓ Restored DB: {{ restore_db_name }} ({{ restore_db_table_count.stdout | default('0') }} tables)"
      when: restore_db_name | length > 0

    - name: Warn if DB has too few tables
      ansible.builtin.debug:
        msg: "⚠ DB has only {{ restore_db_table_count.stdout | default('0') }} tables (expected >= {{ db_min_tables }})"
      when:
        - restore_db_name | length > 0
        - (restore_db_table_count.stdout | default(0) | int) < db_min_tables

    - name: Configure Redis as session handler in MODX
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          mysql "{{ db_name }}" -e "UPDATE {{ db_prefix | default('modx_') }}system_settings SET value='' WHERE key='session_handler_class'" 2>/dev/null || true
        executable: /bin/bash
      changed_when: false
      when: restore_db_name | length > 0

- name: Skip DB restore (already has data)
  ansible.builtin.debug:
    msg: "⊘ Database already has {{ restore_db_tables.stdout | trim }} tables, skipping restore"
  when: not restore_db_needs_restore
