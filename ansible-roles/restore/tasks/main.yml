---
- name: Upload rclone config
  ansible.builtin.include_tasks: rclone_config.yml

- name: Check if rclone config exists on server
  ansible.builtin.stat:
    path: /home/ubuntu/.config/rclone/rclone.conf
  register: rclone_config_remote

# ==== Restore Project ====

- name: Check if MODX already installed (real site, not placeholder)
  become: true
  ansible.builtin.stat:
    path: "{{ web_root }}/core/config/config.inc.php"
  register: restore_site_exists

- name: Warn if site missing and no restore source
  ansible.builtin.debug:
    msg: >-
      ⚠ Site not found at {{ web_root }} and no rclone.conf available.
      Deploy will continue but site won't serve content.
      Fix: add rclone.conf to secrets/ and re-run deploy with -i <IP>.
  when:
    - not restore_site_exists.stat.exists
    - not rclone_config_remote.stat.exists

# Dev restores prod backups by design (no separate pipeline — see group_vars/all.yml).
# If changing paths, keep dev on prod data.

- name: Ensure restore cache directory exists (EBS, not tmpfs)
  ansible.builtin.file:
    path: /home/ubuntu/backups/.restore_cache
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Restore project from Google Drive
  when:
    - not restore_site_exists.stat.exists
    - rclone_config_remote.stat.exists
  block:
    - name: Find latest project backup
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone lsf gdrive-crypt:DreamSeed/backups/project/ --max-depth 1 | sort -r | head -1
        executable: /bin/bash
      register: restore_latest_project
      changed_when: false
      failed_when: false

    - name: Fail if no project backup found
      ansible.builtin.fail:
        msg: "No project backups found on Google Drive (rclone returned empty or failed)"
      when: restore_latest_project.stdout | trim == ""

    - name: Validate project backup filename
      ansible.builtin.fail:
        msg: "Unsafe project backup filename from rclone: '{{ restore_latest_project.stdout | trim }}'"
      when:
        - restore_latest_project.stdout | trim != ""
        - not (restore_latest_project.stdout | trim | regex_search('^[A-Za-z0-9._-]+$'))

    - name: Download project backup to EBS cache
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone --config /home/ubuntu/.config/rclone/rclone.conf copy "gdrive-crypt:DreamSeed/backups/project/{{ restore_latest_project.stdout | trim }}" /home/ubuntu/backups/.restore_cache/
        executable: /bin/bash
      changed_when: false
      when: restore_latest_project.stdout | trim != ""

    - name: Verify project archive integrity
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          tar -tzf "/home/ubuntu/backups/.restore_cache/{{ restore_latest_project.stdout | trim }}" > /dev/null 2>&1
        executable: /bin/bash
      register: restore_archive_check
      changed_when: false
      failed_when: restore_archive_check.rc != 0
      when: restore_latest_project.stdout | trim != ""

    - name: Validate web_root before destructive operation
      ansible.builtin.fail:
        msg: "Refusing to rm -rf '{{ web_root }}': path is empty, root, or /var/www"
      when: >
        restore_latest_project.stdout | trim != "" and
        (web_root == '' or web_root == '/' or
        web_root == '/var/www' or web_root == '/var/www/')

    # NOTE: tmpfs handling for MODX cache.
    # The PHP role (playbook-02) mounts tmpfs at {{ web_root }}/core/cache.
    # We must unmount it before the mv below — otherwise mv drags the mount
    # to the .bak.$$ path, orphans it, and leaves a regular dir in its place.
    # After extraction, mount -a re-mounts tmpfs from the fstab entry.
    - name: Extract project
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          _archive="/home/ubuntu/backups/.restore_cache/{{ restore_latest_project.stdout | trim }}"
          _web="{{ web_root }}"
          _bak="${_web}.bak.$$"
          tar -tzf "$_archive" > /dev/null 2>&1 || { echo "Corrupt archive: $_archive"; exit 1; }
          # Unmount the MODX cache tmpfs BEFORE moving web_root away. Otherwise
          # the mount follows the dir into _bak and rm -rf cannot remove the
          # mountpoint (leaves an orphaned tmpfs + leftover dir).
          mountpoint -q "$_web/core/cache" && umount "$_web/core/cache" || true
          mv "$_web" "$_bak" 2>/dev/null || true
          mkdir -p "$_web"
          if ! tar -xzf "$_archive" -C "$(dirname "$_web")"; then
            mv "$_bak"/* "$_web" 2>/dev/null || true
            rm -rf "$_bak" 2>/dev/null || true
            exit 1
          fi
          # Remount the cache tmpfs. mount -a reads the fstab entry; fall back
          # to an explicit mount if it didn't take (e.g. raced with PHP role).
          mount -a 2>&1 || true
          mountpoint -q "$_web/core/cache" || mount "$_web/core/cache" 2>/dev/null || true
          # A regular dir still works, so this is a WARNING, not a failure.
          mountpoint -q "$_web/core/cache" || echo "WARNING: tmpfs not mounted at $_web/core/cache (check fstab)" >&2
          # Drop the old site. Unmount any cache tmpfs that slipped into _bak
          # first, so rm -rf can actually remove the mountpoint.
          mountpoint -q "$_bak/core/cache" && umount "$_bak/core/cache" || true
          rm -rf "$_bak" 2>/dev/null || true
          chown -R www-data:www-data "$_web"
        executable: /bin/bash
      changed_when: true
      when: restore_latest_project.stdout | trim != ""

    - name: Verify project extraction
      become: true
      ansible.builtin.stat:
        path: "{{ web_root }}/index.php"
      register: restore_index_check
      failed_when: restore_index_check.stat is not defined or not restore_index_check.stat.exists or restore_index_check.stat.size == 0
      when: restore_latest_project.stdout | trim != ""

    - name: Show restored project
      ansible.builtin.debug:
        msg: "✓ Restored project: {{ restore_latest_project.stdout | trim }}"

    - name: Cleanup project archive
      ansible.builtin.file:
        path: "/home/ubuntu/backups/.restore_cache/{{ restore_latest_project.stdout | trim }}"
        state: absent
      when: restore_latest_project.stdout | trim != ""

# Tiles are excluded from the project archive; restore from their own artifact.
- name: Restore map tiles from Google Drive
  when:
    - not restore_site_exists.stat.exists
    - rclone_config_remote.stat.exists
  block:
    - name: Find latest tiles backup (content-addressed names — rank by mtime)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone lsf gdrive-crypt:DreamSeed/backups/tiles/ --files-only --format tp | sort | tail -1 | cut -d';' -f2
        executable: /bin/bash
      register: restore_latest_tiles
      changed_when: false
      failed_when: false

    - name: Skip tiles restore when no tiles backup exists
      ansible.builtin.debug:
        msg: "⊘ No map tiles backup on Google Drive — skipping tiles restore"
      when: restore_latest_tiles.stdout | trim == ""

    - name: Validate tiles backup filename
      ansible.builtin.fail:
        msg: "Unsafe tiles backup filename from rclone: '{{ restore_latest_tiles.stdout | trim }}'"
      when:
        - restore_latest_tiles.stdout | trim != ""
        - not (restore_latest_tiles.stdout | trim | regex_search('^[A-Za-z0-9._-]+$'))

    - name: Download tiles backup to EBS cache
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone --config /home/ubuntu/.config/rclone/rclone.conf copy "gdrive-crypt:DreamSeed/backups/tiles/{{ restore_latest_tiles.stdout | trim }}" /home/ubuntu/backups/.restore_cache/
        executable: /bin/bash
      changed_when: false
      when: restore_latest_tiles.stdout | trim != ""

    - name: Verify tiles archive integrity and top-level dir
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          _a="/home/ubuntu/backups/.restore_cache/{{ restore_latest_tiles.stdout | trim }}"
          tar -tzf "$_a" > /dev/null 2>&1
          _top=$(tar -tzf "$_a" | head -1 | cut -d/ -f1)
          [ "$_top" = "tiles" ] || { echo "unexpected top-level: $_top"; exit 1; }
        executable: /bin/bash
      register: restore_tiles_check
      changed_when: false
      failed_when: restore_tiles_check.rc != 0
      when: restore_latest_tiles.stdout | trim != ""

    - name: Extract map tiles
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          _a="/home/ubuntu/backups/.restore_cache/{{ restore_latest_tiles.stdout | trim }}"
          mkdir -p "{{ web_root }}"
          tar -xzf "$_a" -C "{{ web_root }}"
          chown -R www-data:www-data "{{ web_root }}/tiles"
        executable: /bin/bash
      changed_when: true
      when: restore_latest_tiles.stdout | trim != ""

    - name: Cleanup tiles archive
      ansible.builtin.file:
        path: "/home/ubuntu/backups/.restore_cache/{{ restore_latest_tiles.stdout | trim }}"
        state: absent
      when: restore_latest_tiles.stdout | trim != ""

    - name: Show restored tiles
      ansible.builtin.debug:
        msg: "✓ Restored map tiles: {{ restore_latest_tiles.stdout | trim }}"
      when: restore_latest_tiles.stdout | trim != ""

# Fail-closed: a new-format project (empty tiles/ marker) without its tiles
# artifact must not provision a map-less server silently.
- name: Fail when project expects tiles but none were restored
  become: true
  ansible.builtin.shell:
    cmd: |
      if [ -d "{{ web_root }}/tiles" ] && [ -z "$(ls -A "{{ web_root }}/tiles")" ]; then
        echo "project archive carries an empty tiles/ marker but no tiles backup was restored — restore would lose the map" >&2
        exit 1
      fi
      exit 0
  changed_when: false
  when:
    - not restore_site_exists.stat.exists
    - restore_latest_tiles is not defined or restore_latest_tiles.stdout | default('') | trim == ""

- name: Skip restore (already exists)
  ansible.builtin.debug:
    msg: "⊘ Site already exists at {{ web_root }}, skipping restore"
  when: restore_site_exists.stat.exists

- name: Ensure MODX cache directory exists for tmpfs mount
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}/core/cache"
    state: directory
    mode: '0755'
    owner: www-data
    group: www-data

- name: Check if MODX cache tmpfs is already mounted
  become: true
  ansible.builtin.command: mountpoint -q {{ web_root }}/core/cache
  register: restore_cache_mounted
  failed_when: false
  changed_when: false

- name: Mount tmpfs for MODX cache (fstab entry exists from PHP role)
  become: true
  ansible.builtin.command: mount {{ web_root }}/core/cache
  when: restore_cache_mounted.rc != 0
  failed_when: false # preserve original tolerance — verify task below reports state
  changed_when: true

- name: Verify tmpfs mount for MODX cache
  become: true
  ansible.builtin.shell:
    cmd: awk '$2 == path {print $1, $2, $3}' path="{{ web_root }}/core/cache" /proc/mounts
    executable: /bin/bash
  register: restore_tmpfs_check
  changed_when: false
  failed_when: false

# ==== Restore Database ====

- name: Check if DB already has tables
  ansible.builtin.shell:
    cmd: mysql -N "{{ db_name }}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()" 2>/dev/null
  register: restore_db_tables
  changed_when: false
  failed_when: false

- name: Fail if DB table-count check errored (never treat as empty DB)
  ansible.builtin.fail:
    msg: >-
      mysql table-count check failed (rc={{ restore_db_tables.rc }}) —
      refusing to decide restore; fix DB access first.
  when: restore_db_tables.rc != 0

- name: Set db_needs_restore fact
  ansible.builtin.set_fact:
    restore_db_needs_restore: "{{ (restore_db_tables.stdout | default('0') | int) < 3 }}"

# A half-imported DB (>3 tables, no config) looks "restored" to the table-count
# gate below. If a previous run died mid-import, the in-progress marker stays
# on disk and forces a full re-import instead of a silent skip.
- name: Check for unfinished DB import marker (previous run failed mid-import)
  ansible.builtin.stat:
    path: /home/ubuntu/backups/.restore_cache/.db_import_in_progress
  register: restore_db_import_marker

- name: Force DB re-import (unfinished import marker found)
  ansible.builtin.set_fact:
    restore_db_needs_restore: true
  when: restore_db_import_marker.stat.exists

# Same as project restore: dev pulls prod backups by design (see group_vars/all.yml).

- name: Restore database from Google Drive
  when:
    - restore_db_needs_restore
    - rclone_config_remote.stat.exists
  block:
    - name: Find latest DB backup
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone lsf gdrive-crypt:DreamSeed/backups/db/ --max-depth 1 | sort -r | head -1
        executable: /bin/bash
      register: restore_latest_db
      changed_when: false
      failed_when: false

    - name: Fail if no DB backup found
      ansible.builtin.fail:
        msg: "No DB backups found on Google Drive (rclone returned empty or failed)"
      when: restore_latest_db.stdout | trim == ""

    - name: Validate DB backup filename
      ansible.builtin.fail:
        msg: "Unsafe DB backup filename from rclone: '{{ restore_latest_db.stdout | trim }}'"
      when:
        - restore_latest_db.stdout | trim != ""
        - not (restore_latest_db.stdout | trim | regex_search('^[A-Za-z0-9._-]+$'))

    - name: Download DB backup to EBS cache
      become: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rclone --config /home/ubuntu/.config/rclone/rclone.conf copy "gdrive-crypt:DreamSeed/backups/db/{{ restore_latest_db.stdout | trim }}" /home/ubuntu/backups/.restore_cache/
        executable: /bin/bash
      changed_when: false
      when: restore_latest_db.stdout | trim != ""

    # Cleared only after the table-count verify below passes. If the import
    # dies mid-stream (disk full, timeout), the marker survives and forces a
    # re-import on the next run instead of the "Skip DB restore" path.
    - name: Mark DB import as in progress
      ansible.builtin.file:
        path: /home/ubuntu/backups/.restore_cache/.db_import_in_progress
        state: touch
        mode: "0600"

    - name: Restore database
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          gunzip -c "/home/ubuntu/backups/.restore_cache/{{ restore_latest_db.stdout | trim }}" | mysql "{{ db_name }}"
        executable: /bin/bash
      register: restore_db_result
      changed_when: true
      failed_when: restore_db_result.rc != 0
      when: restore_latest_db.stdout | trim != ""

    - name: Verify database restore (minimum table count = {{ db_min_tables }})
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          mysql "{{ db_name }}" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ db_name }}';"
        executable: /bin/bash
      register: restore_db_table_count
      changed_when: false
      failed_when: (restore_db_table_count.stdout | int) < db_min_tables
      when: restore_latest_db.stdout | trim != ""

    - name: Clear DB import in-progress marker (restore verified)
      ansible.builtin.file:
        path: /home/ubuntu/backups/.restore_cache/.db_import_in_progress
        state: absent
      when: restore_latest_db.stdout | trim != ""

    - name: Cleanup DB archive
      ansible.builtin.file:
        path: "/home/ubuntu/backups/.restore_cache/{{ restore_latest_db.stdout | trim }}"
        state: absent
      when: restore_latest_db.stdout | trim != ""

    - name: Show restored DB
      ansible.builtin.debug:
        msg: "✓ Restored DB: {{ restore_latest_db.stdout | trim }} ({{ restore_db_table_count.stdout | default('?') }} tables)"

    - name: Check MODX system_settings table
      ansible.mariadb.mariadb_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        login_user: root
        query: "SELECT COUNT(*) AS cnt FROM information_schema.tables WHERE table_schema = '{{ db_name }}' AND table_name = '{{ db_prefix | default('modx_') }}system_settings'"
      register: restore_modx_check
      become: true
      failed_when: false
      when: restore_latest_db.stdout | trim != ""

    - name: Configure Redis as session handler in MODX
      ansible.mariadb.mariadb_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        login_user: root
        query: >
          UPDATE `{{ db_name }}`.`{{ db_prefix | default('modx_') }}system_settings`
          SET `value` = ''
          WHERE `key` = 'session_handler_class' AND `value` <> ''
      become: true
      when:
        - restore_latest_db.stdout | trim != ""
        - restore_modx_check.query_result is defined
        - restore_modx_check.query_result[0][0]['cnt'] | default(0) | int > 0

    - name: Clear MODX system settings cache and restart FPM to apply Redis session handler
      become: true
      when: restore_latest_db.stdout | trim != ""
      block:
        - name: Remove system settings cache
          ansible.builtin.file:
            path: "{{ web_root }}/core/cache/system_settings/"
            state: absent

        # NOTE: Keep tmpfs mount intact. With state: absent on a mount point
        # Ansible would fail (EBUSY). Instead, clear contents with find -exec.
        - name: Clear all MODX cache (keep tmpfs mount intact)
          become: true
          ansible.builtin.shell:
            cmd: find {{ web_root }}/core/cache -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          changed_when: true

        - name: Ensure cache directory exists
          ansible.builtin.file:
            path: "{{ web_root }}/core/cache/"
            state: directory
            owner: "{{ web_user | default('www-data') }}"
            group: "{{ web_group | default('www-data') }}"
            mode: "0755"

        - name: Restart PHP-FPM to clear OPcache
          ansible.builtin.systemd:
            name: php{{ php_version | default('8.3') }}-fpm
            state: restarted
            daemon_reload: true

- name: Skip DB restore (already has data)
  ansible.builtin.debug:
    msg: "⊘ Database already has {{ restore_db_tables.stdout | trim }} tables, skipping restore"
  when: not restore_db_needs_restore
