---
# --- SSH Hardening ---
- name: Deploy SSH hardening config
  become: true
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

- name: Remove EC2 Instance Connect from cloud-init config
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    regexp: '^{{ item }}'
    state: absent
  failed_when: false
  loop:
    - AuthorizedKeysCommand
    - AuthorizedKeysCommandUser
  notify: Restart sshd

- name: Validate sshd configuration
  become: true
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Apply SSH hardening
  ansible.builtin.meta: flush_handlers

# --- Login Banner ---
- name: Deploy legal login banner
  become: true
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: |
      WARNING: Unauthorized access to this system is prohibited.
      All connections are monitored and recorded.
      Disconnect immediately if you are not an authorized user.
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/issue
    - /etc/issue.net

# --- File Permissions ---
- name: Restrict permissions on cron and sshd config files
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/crontab, mode: "0600"}
    - {path: /etc/cron.d, mode: "0700"}
    - {path: /etc/cron.daily, mode: "0700"}
    - {path: /etc/cron.hourly, mode: "0700"}
    - {path: /etc/cron.weekly, mode: "0700"}
    - {path: /etc/cron.monthly, mode: "0700"}
    - {path: /etc/ssh/sshd_config, mode: "0600"}
    - {path: /etc/at.deny, mode: "0600"}

# --- Authorized Keys ---
- name: Validate additional SSH public keys
  ansible.builtin.shell:
    cmd: "echo '{{ item }}' | ssh-keygen -l -f /dev/stdin > /dev/null 2>&1"
  changed_when: false
  loop: "{{ additional_ssh_keys | default([]) }}"

- name: Add additional SSH public keys
  become: true
  ansible.posix.authorized_key:
    user: ubuntu
    state: present
    key: "{{ item }}"
  loop: "{{ additional_ssh_keys | default([]) }}"

# --- Fail2ban ---
- name: Upload fail2ban config
  become: true
  ansible.builtin.copy:
    src: "{{ configs_dir }}/fail2ban/jail.local"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Deploy custom MODX admin filter
  become: true
  ansible.builtin.copy:
    src: fail2ban-modx-admin.filter
    dest: /etc/fail2ban/filter.d/modx-admin.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Deploy Grafana auth filter
  become: true
  ansible.builtin.copy:
    src: fail2ban-grafana.filter
    dest: /etc/fail2ban/filter.d/grafana.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Deploy custom Fail2ban jails
  become: true
  ansible.builtin.template:
    src: fail2ban-custom.jail.j2
    dest: /etc/fail2ban/jail.d/custom.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Test Fail2ban config
  become: true
  ansible.builtin.command: fail2ban-client -t
  register: fail2ban_test
  changed_when: false

- name: Apply Fail2ban configuration
  ansible.builtin.meta: flush_handlers

- name: Enable Fail2ban
  become: true
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# --- Kernel Hardening ---
- name: Deploy sysctl hardening
  become: true
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-z-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Apply sysctl hardening
  ansible.builtin.meta: flush_handlers

# --- Lynis Hardening ---
- name: Install hardening diagnostic packages
  become: true
  ansible.builtin.apt:
    name:
      - debsums
      - apt-show-versions
    state: present

- name: Install libpam-tmpdir for private /tmp
  become: true
  ansible.builtin.apt:
    name: libpam-tmpdir
    state: present

- name: Install PAM password strength checking
  become: true
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: Disable core dumps (limits)
  become: true
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-disable-core.conf
    content: "* hard core 0\n"
    owner: root
    group: root
    mode: "0644"

- name: Disable core dumps (sysctl)
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-disable-core.conf
    content: "fs.suid_dumpable = 0\n"
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Set password max age (90 days)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS'
    line: "PASS_MAX_DAYS\t90"

- name: Set password min age (1 day)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_DAYS'
    line: "PASS_MIN_DAYS\t1"

- name: Set password warn age (14 days)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_WARN_AGE'
    line: "PASS_WARN_AGE\t14"

# --- MODX Security ---
- name: Check if MODX config exists
  become: true
  ansible.builtin.stat:
    path: "{{ web_root }}/core/config/config.inc.php"
  register: modx_config_file

- name: Secure MODX config (hide DB passwords)
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}/core/config/config.inc.php"
    owner: root
    group: www-data
    mode: "0640"
  when: modx_config_file.stat.exists

- name: Secure MODX core directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ item.owner }}"
    group: www-data
    mode: "{{ item.mode }}"
    recurse: true
  loop:
    - {path: "{{ web_root }}/core/cache", owner: www-data, mode: "u=rwX,g=rwX,o=rX"}
    - {path: "{{ web_root }}/core/logs", owner: www-data, mode: "u=rwX,g=rwX,o=rX"}
    - {path: "{{ web_root }}/core/model", owner: root, mode: "u=rwX,g=rwX,o="}
    - {path: "{{ web_root }}/core/components", owner: root, mode: "u=rwX,g=rwX,o="}
  when: modx_config_file.stat.exists

# --- Developer Write Permissions ---
- name: Add ubuntu user to www-data group
  become: true
  ansible.builtin.user:
    name: ubuntu
    groups: www-data
    append: true

- name: Set setgid so new files inherit www-data group
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    mode: g+s
