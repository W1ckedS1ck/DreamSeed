---
# --- SSH Hardening ---
- name: Deploy SSH hardening config
  become: true
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

- name: Remove EC2 Instance Connect from cloud-init config
  become: true
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    regexp: '{{ item }}'
    replace: ''
  failed_when: false
  loop:
    - '^AuthorizedKeysCommand\s+.*$\n?'
    - '^AuthorizedKeysCommandUser\s+.*$\n?'
  notify: Restart sshd

- name: Validate sshd configuration
  become: true
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Apply SSH hardening
  ansible.builtin.meta: flush_handlers

# --- Authorized Keys ---
- name: Add additional SSH public keys
  become: true
  ansible.posix.authorized_key:
    user: ubuntu
    state: present
    key: "{{ item }}"
  loop: "{{ additional_ssh_keys | default([]) }}"

# --- Fail2ban ---
- name: Upload fail2ban config
  become: true
  ansible.builtin.copy:
    src: "{{ configs_dir }}/fail2ban/jail.local"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Deploy custom MODX admin filter
  become: true
  ansible.builtin.copy:
    src: fail2ban-modx-admin.filter
    dest: /etc/fail2ban/filter.d/modx-admin.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Deploy Grafana auth filter
  become: true
  ansible.builtin.copy:
    src: fail2ban-grafana.filter
    dest: /etc/fail2ban/filter.d/grafana.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Deploy custom Fail2ban jails
  become: true
  ansible.builtin.template:
    src: fail2ban-custom.jail.j2
    dest: /etc/fail2ban/jail.d/custom.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Test Fail2ban config
  become: true
  ansible.builtin.command: fail2ban-client -t
  register: fail2ban_test
  changed_when: false

- name: Apply Fail2ban configuration
  ansible.builtin.meta: flush_handlers

- name: Enable Fail2ban
  become: true
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# --- Kernel Hardening ---
- name: Deploy sysctl hardening
  become: true
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Apply sysctl hardening
  ansible.builtin.meta: flush_handlers

# --- MODX Security ---
- name: Check if MODX config exists
  become: true
  ansible.builtin.stat:
    path: "{{ web_root }}/core/config/config.inc.php"
  register: modx_config_file

- name: Secure MODX config (hide DB passwords)
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}/core/config/config.inc.php"
    owner: root
    group: www-data
    mode: "0640"
  when: modx_config_file.stat.exists

- name: Secure MODX core directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    recurse: true
  loop:
    - {path: "{{ web_root }}/core/cache", mode: "0755"}
    - {path: "{{ web_root }}/core/logs", mode: "0755"}
    - {path: "{{ web_root }}/core/model", mode: "0750"}
    - {path: "{{ web_root }}/core/components", mode: "0750"}
  when: modx_config_file.stat.exists