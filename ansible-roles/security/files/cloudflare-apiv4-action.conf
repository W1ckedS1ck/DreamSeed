# Fail2Ban action: Cloudflare API v4 (blocks at edge, no nginx reload)
# Looks up zone from domain, creates IP access rule at Cloudflare edge.
# Requires: cftoken (API token), domain (e.g. aws.vitalikuts.online)

[Definition]
actionstart = mkdir -p /var/lib/fail2ban/cloudflare
    curl -s "https://api.cloudflare.com/client/v4/zones?name=<domain>&status=active" \
    -H "Authorization: Bearer <cftoken>" \
    | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4 \
    > /var/lib/fail2ban/cloudflare/.zone
    if [ ! -s /var/lib/fail2ban/cloudflare/.zone ]; then
    domain=<domain>
    curl -s "https://api.cloudflare.com/client/v4/zones?name=${domain#*.}&status=active" \
    -H "Authorization: Bearer <cftoken>" \
    | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4 \
    > /var/lib/fail2ban/cloudflare/.zone
    fi

actionban = ZONE=$(cat /var/lib/fail2ban/cloudflare/.zone 2>/dev/null)
    [ -z "$ZONE" ] && ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=<domain>&status=active" \
    -H "Authorization: Bearer <cftoken>" \
    | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    [ -n "$ZONE" ] && curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/firewall/access_rules/rules" \
    -H "Authorization: Bearer <cftoken>" \
    -H "Content-Type: application/json" \
    -d '{"mode":"block","notes":"fail2ban <name>","configuration":{"target":"ip","value":"<ip>"}}' \
    | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4 \
    > /var/lib/fail2ban/cloudflare/<ip>

actionunban = if [ -f /var/lib/fail2ban/cloudflare/<ip> ]; then
    RULE="$(cat /var/lib/fail2ban/cloudflare/<ip>)"
    ZONE=$(cat /var/lib/fail2ban/cloudflare/.zone 2>/dev/null || curl -s "https://api.cloudflare.com/client/v4/zones?name=<domain>&status=active" \
    -H "Authorization: Bearer <cftoken>" \
    | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    [ -n "$ZONE" ] && [ -n "$RULE" ] && \
    curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/firewall/access_rules/rules/$RULE" \
    -H "Authorization: Bearer <cftoken>"
    rm -f /var/lib/fail2ban/cloudflare/<ip>
    fi

[Init]
cftoken = REPLACE_ME
domain = REPLACE_ME
