# Fail2Ban action: nginx deny (works behind Cloudflare proxy)
# Bans real visitor IP (via CF-Connecting-IP) in nginx, not iptables.
# nginx sees the real IP thanks to set_real_ip_from + real_ip_header.

[INCLUDES]
before = iptables-common.conf

[Definition]
actionstart = touch /etc/nginx/conf.d/fail2ban-blocked-ips.conf

actionban = echo "deny <ip>;" >> /etc/nginx/conf.d/fail2ban-blocked-ips.conf
            nginx -s reload

actionunban = new=$(grep -v "^deny <ip>;$" /etc/nginx/conf.d/fail2ban-blocked-ips.conf) && \
              echo "$new" > /etc/nginx/conf.d/fail2ban-blocked-ips.conf
              nginx -s reload

[Init]
name = default
