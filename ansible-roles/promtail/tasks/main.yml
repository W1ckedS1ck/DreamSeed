---
# Grafana apt repo (GPG key + deb822_repository) is provisioned once in the
# packages_common role (playbook-01). Here we only install + configure.

- name: Install Promtail
  ansible.builtin.apt:
    name: promtail
    state: present
    update_cache: true
    cache_valid_time: 0
  become: true
  notify: Restart Promtail

- name: Ensure promtail group exists
  ansible.builtin.group:
    name: promtail
    system: true
  become: true

- name: Ensure promtail user exists with correct groups
  ansible.builtin.user:
    name: promtail
    system: true
    create_home: false
    shell: /bin/false
    groups: adm
    append: false
  become: true

- name: Create promtail config dir
  ansible.builtin.file:
    path: /etc/promtail
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Validate credentials
  ansible.builtin.assert:
    that:
      - loki_username | length > 0
      - grafana_cloud_token | length > 0
    fail_msg: "loki_username and grafana_cloud_token are required for Loki (username = Loki
      instance ID, password = Grafana Cloud access policy token with logs write scope)"

- name: Deploy Promtail config
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: /etc/promtail/promtail.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Promtail

- name: Create systemd drop-in directory for Promtail
  ansible.builtin.file:
    path: /etc/systemd/system/promtail.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create Promtail credentials file
  ansible.builtin.copy:
    dest: /etc/promtail/credentials.env
    content: |
      LOKI_USERNAME={{ loki_username }}
      LOKI_PASSWORD={{ grafana_cloud_token }}
    owner: root
    group: promtail
    mode: "0640"
  become: true
  no_log: true
  notify:
    - Reload systemd
    - Restart Promtail

- name: Deploy Promtail systemd drop-in for credentials and expand-env
  ansible.builtin.copy:
    dest: /etc/systemd/system/promtail.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/promtail -config.expand-env=true -config.file=/etc/promtail/promtail.yml
      EnvironmentFile=/etc/promtail/credentials.env
      StateDirectory=promtail
    mode: "0600"
  become: true
  no_log: true
  notify:
    - Reload systemd
    - Restart Promtail

- name: Enable and start Promtail
  ansible.builtin.systemd:
    name: promtail
    state: started
    enabled: true
    daemon_reload: true
  become: true
