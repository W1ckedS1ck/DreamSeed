---
- name: Check if requested PHP version is available
  ansible.builtin.shell: apt-cache show "php{{ php_version }}" >/dev/null 2>&1 && echo ok || echo missing
  args:
    executable: /bin/bash
  register: php_avail
  changed_when: false
  failed_when: false

- name: Fallback to highest available PHP version
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache search '^php[0-9]\.[0-9]$' | grep -oP 'php\K[0-9]\.[0-9]' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: php_fallback
  changed_when: false
  when: php_avail.stdout == "missing"

- name: Set fallback php_version (cached for subsequent playbooks)
  ansible.builtin.set_fact:
    php_version: "{{ php_fallback.stdout }}"
    cacheable: true
  when: php_avail.stdout == "missing" and php_fallback.stdout | length > 0

- name: Fail if no PHP version found
  ansible.builtin.fail:
    msg: "Could not auto-detect PHP version (apt-cache search returned nothing). Check apt sources."
  when: php_avail.stdout == "missing" and php_fallback.stdout | length == 0

- name: Install PHP packages
  become: true
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-gd"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
