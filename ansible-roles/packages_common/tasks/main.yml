---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Check if requested PHP version is available
  ansible.builtin.shell: apt-cache show "php{{ php_version }}" >/dev/null 2>&1 && echo ok || echo missing
  args:
    executable: /bin/bash
  register: php_avail
  changed_when: false
  failed_when: false

- name: Fallback to highest available PHP version
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache search '^php[0-9]\.[0-9]$' | grep -oP 'php\K[0-9]\.[0-9]' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: php_fallback
  changed_when: false
  when: php_avail.stdout == "missing"

- name: Set fallback php_version
  ansible.builtin.set_fact:
    php_version: "{{ php_fallback.stdout }}"
  when: php_avail.stdout == "missing" and php_fallback.stdout | length > 0

- name: Fail if no PHP version found
  ansible.builtin.fail:
    msg: "Could not auto-detect PHP version (apt-cache search returned nothing). Check apt sources."
  when: php_avail.stdout == "missing" and php_fallback.stdout | length == 0

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - mariadb-server
      - certbot
      - fail2ban
      - jq
      - rclone
      - ssl-cert
      - unzip
      - bind9-dnsutils
      - python3-pymysql
      - debsums
      - apt-show-versions
      - libpam-tmpdir
      - "redis-server"
      - "php{{ php_version }}-redis"
      - libpam-pwquality
      - unattended-upgrades
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable unattended-upgrades (security-only auto updates)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Download-Upgradeable-Packages "1";
    mode: "0644"

- name: Ensure 2G swap file
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    if ! swapon --show | grep -q /swapfile; then
      if [ ! -f /swapfile ]; then
        fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048 status=progress
        chmod 600 /swapfile
      fi
      mkswap /swapfile && swapon /swapfile
      grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  args:
    executable: /bin/bash
  timeout: 120
  changed_when: false
