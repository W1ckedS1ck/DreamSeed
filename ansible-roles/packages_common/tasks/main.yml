---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Detect available PHP version
  ansible.builtin.shell: |
    apt-cache search '^php[0-9]\.[0-9]$' | grep -oP 'php\K[0-9]\.[0-9]' | sort -V | tail -1
  register: detected_php
  changed_when: false

- name: Set php_version from detected
  ansible.builtin.set_fact:
    php_version: "{{ detected_php.stdout }}"
    cacheable: true
  when: detected_php.stdout != ""

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-opcache"
      - mariadb-server
      - certbot
      - fail2ban
      - jq
      - rclone
      - unzip
      - dnsutils
      - python3-pymysql
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Clean apt cache to save space
  become: true
  ansible.builtin.shell: apt-get clean
  changed_when: false
