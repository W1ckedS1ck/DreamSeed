---
# Detect if this is a fresh deployment (no MODX installed yet)
- name: Check if MODX already provisioned (fresh deploy detection)
  ansible.builtin.stat:
    path: /var/www/html/core/config/config.inc.php
  register: _modx_config
  changed_when: false

- name: Set fact for deployment type
  ansible.builtin.set_fact:
    is_fresh_deploy: "{{ not _modx_config.stat.exists }}"
    cacheable: true

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: is_fresh_deploy

- name: Install system packages (base OS-level) — fresh deploy only
  become: true
  ansible.builtin.apt:
    name:
      - certbot
      - fail2ban
      - jq
      - rclone
      - ssl-cert
      - unzip
      - bind9-dnsutils
      - python3-pymysql
      - debsums
      - apt-show-versions
      - python3-pip
      - libpam-tmpdir
      - libpam-pwquality
      - unattended-upgrades
    state: present
    update_cache: true
  register: _apt_result
  retries: 3
  delay: 10
  until: _apt_result is success
  when: is_fresh_deploy
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable unattended-upgrades (security-only auto updates)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Download-Upgradeable-Packages "1";
    mode: "0644"

- name: Ensure swap file
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    if ! swapon --show | grep -q /swapfile; then
      if [ ! -f /swapfile ]; then
        fallocate -l {{ swap_size }} /swapfile 2>/dev/null || \
          dd if=/dev/zero of=/swapfile bs=1M count={{ (swap_size | regex_replace('[^0-9]', '') | int) * 1024 }} status=progress
        chmod 600 /swapfile
      fi
      mkswap /swapfile && swapon /swapfile
      grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  args:
    executable: /bin/bash
  timeout: 120
  changed_when: false

- name: Setup PHP version and packages
  ansible.builtin.include_tasks: php.yml

- name: Attach Ubuntu Pro subscription (ESM)
  ansible.builtin.include_tasks: ubuntu-pro.yml

- name: Install redis packages — fresh deploy only
  become: true
  ansible.builtin.apt:
    name:
      - "redis-server"
      - "php{{ php_version }}-redis"
    state: present
  when: is_fresh_deploy
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── Grafana apt repo (shared by grafana + promtail roles) ───────────────
# Provisioned once in the base playbook so the two roles don't duplicate it.
- name: Download Grafana GPG key — fresh deploy only
  become: true
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
  when: is_fresh_deploy

- name: Add Grafana repository — fresh deploy only
  become: true
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    install_python_debian: true
    state: present
  when: is_fresh_deploy
