---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages (base OS-level)
  become: true
  ansible.builtin.apt:
    name:
      - certbot
      - fail2ban
      # fail2ban-custom.jail.j2 sets backend=pyinotify; the module is only a
      # Suggests of fail2ban — without an explicit install jails ERROR at start.
      - python3-pyinotify
      - jq
      - ssl-cert
      - unzip
      - bind9-dnsutils
      - python3-pymysql
      - debsums
      - apt-show-versions
      - python3-pip
      - libpam-tmpdir
      - libpam-pwquality
      - unattended-upgrades
    state: present
  register: _apt_result
  retries: 3
  delay: 10
  until: _apt_result is success
  environment:
    DEBIAN_FRONTEND: noninteractive

# rclone: install the pinned OFFICIAL binary instead of the Ubuntu package
# (24.04 ships 1.60.1, years behind — measurably slower GDrive restores).
# Version is Renovate-tracked in group_vars/all.yml; the .deb SHA256 is verified
# against the upstream SHA256SUMS before install. Idempotent: skipped when the
# wanted version already runs.
- name: Check installed rclone version
  ansible.builtin.command: rclone version
  register: _rclone_version_cmd
  changed_when: false
  failed_when: false

- name: Install/upgrade rclone (official .deb, SHA256-verified)
  when: >
    _rclone_version_cmd.rc != 0 or
    rclone_version not in (_rclone_version_cmd.stdout | default(''))
  block:
    - name: Download rclone .deb
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-amd64.deb"
        dest: "/tmp/rclone-v{{ rclone_version }}-linux-amd64.deb"
        mode: "0644"
        timeout: 120

    - name: Download rclone SHA256SUMS
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/v{{ rclone_version }}/SHA256SUMS"
        dest: "/tmp/rclone-SHA256SUMS"
        mode: "0644"
        timeout: 60

    - name: Verify rclone .deb SHA256
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          asset="rclone-v{{ rclone_version }}-linux-amd64.deb"
          expected=$(awk -v f="$asset" '$2 == f {print $1}' /tmp/rclone-SHA256SUMS)
          if [ -z "$expected" ]; then
            echo "ERROR: no SHA256 entry for $asset in SHA256SUMS" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected" "/tmp/$asset" | sha256sum -c - >/dev/null
        executable: /bin/bash
      changed_when: false

    - name: Install rclone .deb
      become: true
      ansible.builtin.apt:
        deb: "/tmp/rclone-v{{ rclone_version }}-linux-amd64.deb"
        state: present

    - name: Verify rclone runs
      ansible.builtin.command: rclone version
      changed_when: false

    - name: Cleanup rclone installer files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/rclone-v{{ rclone_version }}-linux-amd64.deb"
        - "/tmp/rclone-SHA256SUMS"

- name: Enable unattended-upgrades (security-only auto updates)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Download-Upgradeable-Packages "1";
    mode: "0644"

- name: Validate swap_size format
  ansible.builtin.assert:
    that:
      - swap_size is match('^[0-9]+G$')
    fail_msg: "swap_size must be in GB format (e.g., '2G'), got: {{ swap_size }}"

- name: Ensure swap file
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    if ! swapon --show | grep -q /swapfile; then
      if [ ! -f /swapfile ]; then
        fallocate -l {{ swap_size }} /swapfile 2>/dev/null || \
          dd if=/dev/zero of=/swapfile bs=1M count={{ (swap_size | regex_replace('[^0-9]', '') | int) * 1024 }} status=progress
        chmod 600 /swapfile
      fi
      mkswap /swapfile && swapon /swapfile
      grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  args:
    executable: /bin/bash
  timeout: 120
  changed_when: false

- name: Setup PHP version and packages
  ansible.builtin.include_tasks: php.yml

- name: Install redis packages
  become: true
  ansible.builtin.apt:
    name:
      - "redis-server"
      - "php{{ php_version }}-redis"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── Grafana apt repo (shared by grafana + promtail roles) ───────────────
# Key VENDORED (files/grafana.asc) — pinned trust anchor, no TOFU window.
# Fingerprint: B53A E77B ADB6 30A6 8304 6005 963F A277 1045 8545
# Rotation: apt update fails loudly → refresh file + fingerprint above.
- name: Deploy vendored Grafana GPG key
  become: true
  ansible.builtin.copy:
    src: grafana.asc
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana repository
  become: true
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    install_python_debian: true
    state: present
