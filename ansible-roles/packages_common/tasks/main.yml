---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Check if requested PHP version is available
  ansible.builtin.shell: apt-cache show "php{{ php_version }}" >/dev/null 2>&1 && echo ok || echo missing
  args:
    executable: /bin/bash
  register: php_avail
  changed_when: false
  failed_when: false

- name: Fallback to highest available PHP version
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache search '^php[0-9]\.[0-9]$' | grep -oP 'php\K[0-9]\.[0-9]' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: php_fallback
  changed_when: false
  when: php_avail.stdout == "missing"

- name: Set fallback php_version
  ansible.builtin.set_fact:
    php_version: "{{ php_fallback.stdout }}"
  when: php_avail.stdout == "missing"

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - mariadb-server
      - certbot
      - fail2ban
      - jq
      - rclone
      - ssl-cert
      - unzip
      - bind9-dnsutils
      - python3-pymysql
      - debsums
      - apt-show-versions
      - libpam-tmpdir
      - "redis-server"
      - "php{{ php_version }}-redis"
      - libpam-pwquality
      - unattended-upgrades
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable unattended-upgrades (security-only auto updates)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Download-Upgradeable-Packages "1";
    mode: "0644"

- name: Check if swap file exists
  become: true
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Check if swap is already active
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    swapon --show | wc -l
  args:
    executable: /bin/bash
  register: swap_active_check
  changed_when: false

- name: Set swap_is_active fact
  ansible.builtin.set_fact:
    swap_is_active: "{{ swap_active_check.stdout | int > 0 }}"

- name: Create swap file (2 GB)
  become: true
  ansible.builtin.shell: fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048 status=progress
  args:
    executable: /bin/bash
  when: not swapfile_stat.stat.exists
  changed_when: true
  timeout: 120

- name: Set swap file permissions
  become: true
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when: not swap_is_active

- name: Re-stat swap file after creation
  become: true
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Check if swap file is formatted
  become: true
  ansible.builtin.command: file -s /swapfile
  register: swapfile_type
  changed_when: false
  failed_when: false
  when:
    - swapfile_stat.stat.exists
    - not swap_is_active

- name: Format swap file
  become: true
  ansible.builtin.command: mkswap /swapfile
  when:
    - swapfile_stat.stat.exists
    - not swap_is_active
    - swapfile_type.rc != 0 or 'swap file' not in swapfile_type.stdout
  changed_when: true

- name: Enable swap
  become: true
  ansible.builtin.command: swapon /swapfile
  when: not swap_is_active
  changed_when: true
  register: swap_enable_result
  failed_when: false

- name: Warn if swap enable failed
  ansible.builtin.debug:
    msg: "WARNING: swapon /swapfile failed — system has no swap. Under memory pressure OOM killer may kill PHP/DB. Fix: check filesystem or kernel params."
  when:
    - not swap_is_active
    - swap_enable_result.rc is defined
    - swap_enable_result.rc != 0

- name: Add swap to fstab
  become: true
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
  when: swapfile_stat.stat.exists
