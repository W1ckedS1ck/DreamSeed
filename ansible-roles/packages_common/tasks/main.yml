---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Detect available PHP version
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache search '^php[0-9]\.[0-9]$' | grep -oP 'php\K[0-9]\.[0-9]' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: detected_php
  changed_when: false

- name: Set php_version from detected
  ansible.builtin.set_fact:
    php_version: "{{ detected_php.stdout }}"
    cacheable: true
  when: detected_php.stdout != ""

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - mariadb-server
      - certbot
      - fail2ban
      - jq
      - rclone
      - ssl-cert
      - unzip
      - bind9-dnsutils
      - python3-pymysql
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Check if swap file exists
  become: true
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create swap file (2 GB)
  become: true
  ansible.builtin.shell: fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048 status=progress
  when: not swapfile_stat.stat.exists
  changed_when: true
  timeout: 120

- name: Set swap file permissions
  become: true
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when: not swapfile_stat.stat.exists

- name: Format swap file
  become: true
  ansible.builtin.command: mkswap /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Enable swap
  become: true
  ansible.builtin.command: swapon /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true
  register: swap_enable_result
  failed_when: false

- name: Warn if swap enable failed
  ansible.builtin.debug:
    msg: "WARNING: swapon /swapfile failed — system has no swap. Under memory pressure OOM killer may kill PHP/DB. Fix: check filesystem or kernel params."
  when:
    - not swapfile_stat.stat.exists
    - swap_enable_result is failed

- name: Add swap to fstab
  become: true
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present
