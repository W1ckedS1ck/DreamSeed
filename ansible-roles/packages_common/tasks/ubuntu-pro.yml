---
# Ubuntu Pro (ESM) attachment.
# Runs via Ansible (not cloud-init) so the token is never written into
# Terraform state or instance user-data. Token sourced from UBUNTU_PRO_TOKEN.
# Token passes through --attach-config (not argv), per Canonical docs.

- name: Check Ubuntu Pro subscription status
  become: true
  ansible.builtin.command:
    cmd: pro status --format json
  register: pro_status
  changed_when: false
  failed_when: false
  when: ubuntu_pro_token | length > 0

- name: Write Ubuntu Pro attach config
  become: true
  ansible.builtin.copy:
    content: "token: {{ ubuntu_pro_token }}\n"
    dest: /root/.pro-attach.yaml
    mode: "0600"
  no_log: true
  when:
    - ubuntu_pro_token | length > 0
    - pro_status.rc | default(1) == 0
    - not (pro_status.stdout | default('{}') | from_json).attached | default(false)

- name: Attach Ubuntu Pro subscription
  become: true
  ansible.builtin.shell:
    cmd: |
      timeout --kill-after=10 180 pro attach --attach-config /root/.pro-attach.yaml
      rc=$?
      rm -f /root/.pro-attach.yaml
      exit $rc
  register: pro_attach
  changed_when: false
  failed_when: false
  when:
    - ubuntu_pro_token | length > 0
    - pro_status.rc | default(1) == 0
    - not (pro_status.stdout | default('{}') | from_json).attached | default(false)

- name: Read Ubuntu Pro status after attach
  become: true
  ansible.builtin.command:
    cmd: pro status --format json
  register: pro_status_post
  changed_when: false
  failed_when: false
  when: ubuntu_pro_token | length > 0

# `pro attach` enables only esm-infra/esm-apps; Livepatch must be enabled
# explicitly. Re-apply on every run so a disabled service is brought back.
- name: Enable Canonical Livepatch (Ubuntu Pro)
  become: true
  ansible.builtin.command:
    cmd: pro enable livepatch --assume-yes
  register: pro_livepatch
  changed_when: pro_livepatch.rc | default(1) == 0
  failed_when: false
  when:
    - ubuntu_pro_token | length > 0
    - pro_status_post.rc | default(1) == 0
    - (pro_status_post.stdout | default('{}') | from_json).services
      | selectattr('name', 'equalto', 'livepatch')
      | map(attribute='status') | first | default('') != 'enabled'

- name: Report Livepatch status
  ansible.builtin.debug:
    msg: >-
      Livepatch: {{ 'enabled (rc=' ~ pro_livepatch.rc ~ ')'
      if pro_livepatch is defined and not (pro_livepatch.skipped | default(false))
      else 'already enabled / not changed' }}
  when: ubuntu_pro_token | length > 0

- name: Report Ubuntu Pro attachment status
  when: ubuntu_pro_token | length > 0
  ansible.builtin.debug:
    msg: >-
      Ubuntu Pro: {{ 'already attached / skipped'
      if (pro_attach is not defined or pro_attach.skipped | default(false))
      else ('attached (rc=' ~ pro_attach.rc ~ ')'
      if pro_attach.rc | int == 0
      else 'WARNING — attach failed or timed out (rc=' ~ pro_attach.rc ~ '); continuing deploy, ESM may be missing on this host') }}
