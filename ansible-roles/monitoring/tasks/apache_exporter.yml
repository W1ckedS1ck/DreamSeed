---
- name: Install/Upgrade Apache Exporter
  vars:
    _exp_name: "Apache Exporter"
    bin: apache_exporter
    version: "{{ monitoring_apache_version }}"
    url: "https://github.com/Lusitaniae/apache_exporter/releases/download/v{{ monitoring_apache_version }}/apache_exporter-{{ monitoring_apache_version }}.linux-amd64.tar.gz"
    src_in_tmp: "/tmp/apache_exporter-{{ monitoring_apache_version }}.linux-amd64/apache_exporter"
    cleanup_dirs:
      - "/tmp/{{ bin }}.tar.gz"
      - "/tmp/apache_exporter-{{ monitoring_apache_version }}.linux-amd64"
  ansible.builtin.include_tasks: _install_binary.yml

- name: Create apache_exporter user
  ansible.builtin.user:
    name: apache_exporter
    system: true
    create_home: false
    shell: /bin/false

- name: Deploy Apache Exporter service
  ansible.builtin.copy:
    dest: /etc/systemd/system/apache_exporter.service
    content: |
      [Unit]
      Description=Apache Exporter
      After=network.target

      [Service]
      Type=simple
      User=apache_exporter
      ExecStart=/usr/local/bin/apache_exporter --web.listen-address=127.0.0.1:9117 --scrape_uri=http://127.0.0.1:80/server-status?auto
      Restart=always

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart Apache Exporter