---
- name: Check if Apache Exporter is installed
  ansible.builtin.stat:
    path: /usr/local/bin/apache_exporter
  register: monitoring_ae_bin

- name: Install Apache Exporter (latest)
  when: not monitoring_ae_bin.stat.exists
  block:
    - name: Get latest Apache Exporter version
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -s https://api.github.com/repos/Lusitaniae/apache_exporter/releases/latest | jq -r '.tag_name' | sed 's/^v//'
        executable: /bin/bash
      register: monitoring_ae_version
      changed_when: false

    - name: Download Apache Exporter
      ansible.builtin.get_url:
        url: "https://github.com/Lusitaniae/apache_exporter/releases/download/v{{ monitoring_ae_version.stdout }}/apache_exporter-{{ monitoring_ae_version.stdout }}.linux-amd64.tar.gz"
        dest: /tmp/apache_exporter.tar.gz
        mode: "0644"

    - name: Extract Apache Exporter
      ansible.builtin.unarchive:
        src: /tmp/apache_exporter.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install Apache Exporter binary
      become: true
      ansible.builtin.copy:
        src: "/tmp/apache_exporter-{{ monitoring_ae_version.stdout }}.linux-amd64/apache_exporter"
        dest: /usr/local/bin/apache_exporter
        mode: "0755"
        remote_src: true

    - name: Cleanup Apache Exporter temp files
      ansible.builtin.shell: rm -rf /tmp/apache_exporter*
      changed_when: false

- name: Verify Apache Exporter binary
  ansible.builtin.command: /usr/local/bin/apache_exporter --version
  changed_when: false
  register: monitoring_ae_verify
  failed_when: monitoring_ae_verify.rc != 0

- name: Create apache_exporter user
  become: true
  ansible.builtin.user:
    name: apache_exporter
    system: true
    create_home: false
    shell: /bin/false

- name: Deploy Apache Exporter service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/apache_exporter.service
    content: |
      [Unit]
      Description=Apache Exporter
      After=network.target

      [Service]
      Type=simple
      User=apache_exporter
      ExecStart=/usr/local/bin/apache_exporter --web.listen-address=127.0.0.1:9117 --scrape_uri=http://127.0.0.1:80/server-status?auto
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart Apache Exporter

- name: Enable Apache Exporter
  become: true
  ansible.builtin.systemd:
    name: apache_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for Apache Exporter to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 9117
    timeout: 15