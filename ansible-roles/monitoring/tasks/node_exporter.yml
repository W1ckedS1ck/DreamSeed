---
- name: Install/Upgrade Node Exporter
  vars:
    _exp_name: "Node Exporter"
    bin: node_exporter
    version: "{{ monitoring_node_version }}"
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring_node_version }}/node_exporter-{{ monitoring_node_version }}.linux-amd64.tar.gz"
    src_in_tmp: "/tmp/node_exporter-{{ monitoring_node_version }}.linux-amd64/node_exporter"
    cleanup_dirs:
      - "/tmp/{{ bin }}.tar.gz"
      - "/tmp/node_exporter-{{ monitoring_node_version }}.linux-amd64"
  ansible.builtin.include_tasks: _install_binary.yml

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    create_home: false
    shell: /bin/false

- name: Deploy Node Exporter service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart Node Exporter