---
- name: Check if MySQL Exporter is installed
  ansible.builtin.stat:
    path: /usr/local/bin/mysqld_exporter
  register: monitoring_mysql_bin

- name: Install MySQL Exporter (latest)
  when: not monitoring_mysql_bin.stat.exists
  block:
    - name: Get latest MySQL Exporter version
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -s https://api.github.com/repos/prometheus/mysqld_exporter/releases/latest | jq -r '.tag_name' | sed 's/^v//'
        executable: /bin/bash
      register: monitoring_mysql_version
      changed_when: false

    - name: Download MySQL Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/mysqld_exporter/releases/download/v{{ monitoring_mysql_version.stdout }}/mysqld_exporter-{{ monitoring_mysql_version.stdout }}.linux-amd64.tar.gz"
        dest: /tmp/mysqld_exporter.tar.gz
        mode: "0644"

    - name: Extract MySQL Exporter
      ansible.builtin.unarchive:
        src: /tmp/mysqld_exporter.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install MySQL Exporter binary
      become: true
      ansible.builtin.copy:
        src: "/tmp/mysqld_exporter-{{ monitoring_mysql_version.stdout }}.linux-amd64/mysqld_exporter"
        dest: /usr/local/bin/mysqld_exporter
        mode: "0755"
        remote_src: true

    - name: Cleanup MySQL Exporter temp files
      ansible.builtin.shell: rm -rf /tmp/mysqld_exporter*
      changed_when: false

- name: Verify MySQL Exporter binary
  ansible.builtin.command: /usr/local/bin/mysqld_exporter --version
  changed_when: false
  register: monitoring_mysql_verify
  failed_when: monitoring_mysql_verify.rc != 0

- name: Create mysqld_exporter user
  become: true
  ansible.builtin.user:
    name: mysqld_exporter
    system: true
    create_home: false
    shell: /bin/false

- name: Create .my.cnf for exporter in system location
  become: true
  ansible.builtin.copy:
    dest: /etc/mysql/conf.d/exporter.cnf
    content: |
      [client]
      user = monitoring
      password = {{ db_pass }}
    owner: mysqld_exporter
    group: mysqld_exporter
    mode: "0600"
  when: db_pass | default('') | length > 0

- name: Deploy MySQL Exporter service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/mysqld_exporter.service
    content: |
      [Unit]
      Description=MySQL Exporter
      After=network.target mariadb.service

      [Service]
      Type=simple
      User=mysqld_exporter
      ExecStart=/usr/local/bin/mysqld_exporter --config.my-cnf=/etc/mysql/conf.d/exporter.cnf --web.listen-address=127.0.0.1:9104 --no-collect.slave_status
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart MySQL Exporter

- name: Enable MySQL Exporter
  become: true
  ansible.builtin.systemd:
    name: mysqld_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for MySQL Exporter to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 9104
    timeout: 15