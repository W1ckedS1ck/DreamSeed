---
# Shared binary installer for monitoring exporters.
# Note (audit 2026-08): HTTPS-only, no checksums — accepted for single-maintainer project.
# Usage:
#   - name: Install Foo Exporter
#     ansible.builtin.include_tasks: _install_binary.yml
#     vars:
#       monitor_bin_name: "foo_exporter"
#       monitor_bin_path: "/usr/local/bin/foo_exporter"
#       monitor_version: "{{ monitoring_foo_version }}"
#       monitor_download_url: "https://github.com/org/foo_exporter/releases/download/v{{ monitor_version }}/..."
#       monitor_extracted_binary: "/tmp/foo_exporter-{{ monitor_version }}.linux-amd64/foo_exporter"

- name: "Check installation: {{ monitor_bin_name }}"
  ansible.builtin.stat:
    path: "{{ monitor_bin_path }}"
  register: _monitor_bin

- name: "Get version: {{ monitor_bin_name }}"
  ansible.builtin.command: "{{ monitor_bin_path }} --version"
  changed_when: false
  failed_when: false
  register: _monitor_current_version
  when: _monitor_bin.stat.exists

- name: "Install or upgrade {{ monitor_bin_name }}"
  vars:
    # Extract the first semver triple from --version output. Token-exact
    # matching breaks for binaries that print a "v" prefix (redis_exporter,
    # VictoriaMetrics) — "1.88.0" != "v1.88.0" — causing a re-download on
    # every deploy. regex_search normalizes both sides.
    _monitor_installed_version: "{{ (_monitor_current_version.stdout | default('') + ' ' + _monitor_current_version.stderr | default('')) | regex_search('\\d+\\.\\d+\\.\\d+') | default('') }}"
  when: >
    not _monitor_bin.stat.exists or
    _monitor_installed_version != monitor_version
  block:
    - name: "Download {{ monitor_bin_name }}"
      ansible.builtin.get_url:
        url: "{{ monitor_download_url }}"
        dest: "/tmp/{{ monitor_bin_name }}.tar.gz"
        mode: "0644"
        timeout: 60
      register: _monitor_download

    - name: "Extract {{ monitor_bin_name }}"
      ansible.builtin.unarchive:
        src: "/tmp/{{ monitor_bin_name }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: "Install binary: {{ monitor_bin_name }}"
      ansible.builtin.copy:
        src: "{{ monitor_extracted_binary }}"
        dest: "{{ monitor_bin_path }}"
        mode: "0755"
        remote_src: true
      become: true

    - name: "Verify binary runs: {{ monitor_bin_name }}"
      ansible.builtin.command: "{{ monitor_bin_path }} --version"
      changed_when: true
      register: _monitor_new_version

    - name: "Restart service: {{ monitor_bin_name }}"
      ansible.builtin.systemd:
        name: "{{ monitor_service_name | default(monitor_bin_name) }}"
        state: restarted
      become: true
      when: _monitor_bin.stat.exists

    - name: "Cleanup temp files: {{ monitor_bin_name }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ monitor_bin_name }}.tar.gz"
        - "{{ monitor_extracted_dir | default(monitor_extracted_binary | dirname) }}"
