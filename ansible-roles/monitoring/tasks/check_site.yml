---
- name: Upload check_site.sh
  become: true
  ansible.builtin.template:
    src: check_site.sh.j2
    dest: /usr/local/bin/check_site.sh
    mode: "0755"

- name: Setup check_site cron job
  ansible.builtin.cron:
    name: "Check site availability"
    minute: "*"
    job: "/usr/local/bin/check_site.sh"
