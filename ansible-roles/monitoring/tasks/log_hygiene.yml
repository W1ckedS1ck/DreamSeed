---
- name: Cap systemd journal size and retention
  ansible.builtin.template:
    src: journald-size.conf.j2
    dest: /etc/systemd/journald.conf.d/size.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart journald

- name: Keep check-site lifecycle lines out of syslog (journal keeps them)
  ansible.builtin.template:
    src: rsyslog-check-site.conf.j2
    dest: /etc/rsyslog.d/30-check-site-filter.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart rsyslog
