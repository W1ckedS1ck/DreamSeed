---
- name: Restart Node Exporter
  become: true
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: Restart Apache Exporter
  become: true
  ansible.builtin.systemd:
    name: apache_exporter
    state: restarted
    daemon_reload: true

- name: Restart Nginx Exporter
  become: true
  ansible.builtin.systemd:
    name: nginx_exporter
    state: restarted
    daemon_reload: true

- name: Restart MySQL Exporter
  become: true
  ansible.builtin.systemd:
    name: mysqld_exporter
    state: restarted
    daemon_reload: true

- name: Restart VictoriaMetrics
  become: true
  ansible.builtin.systemd:
    name: victoria-metrics
    state: restarted
    daemon_reload: true

- name: Restart Grafana
  become: true
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
