---
- name: Configure PHP-FPM pool (dynamic pm.max_children)
  become: true
  ansible.builtin.template:
    src: www.conf.j2
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    mode: "0644"
  notify: Restart PHP-FPM

- name: Configure PHP memory limits
  become: true
  ansible.builtin.template:
    src: php_limits.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/conf.d/50-limits.ini"
    mode: "0644"
  notify: Restart PHP-FPM

- name: Configure OPcache
  become: true
  ansible.builtin.template:
    src: opcache.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/conf.d/99-opcache.ini"
    mode: "0644"
  notify: Restart PHP-FPM

- name: Configure Redis session handler in php.ini (overrides defaults)
  become: true
  no_log: true
  ansible.builtin.blockinfile:
    path: "/etc/php/{{ php_version }}/fpm/php.ini"
    marker: "; {mark} ANSIBLE MANAGED BLOCK - Redis Session Handler"
    insertbefore: "^;ffi.preload"
    block: |
      session.save_handler = redis
      session.save_path = "tcp://127.0.0.1:6379{% if redis_password | length > 0 %}?auth={{ redis_password }}{% endif %}"
      session.gc_maxlifetime = 604800
      session.gc_probability = 0
      session.gc_divisor = 1000
  notify: Restart PHP-FPM

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Clear MODX system settings cache
  become: true
  ansible.builtin.command:
    cmd: rm -f /var/www/html/core/cache/system_settings/config.cache.php
  changed_when: false

- name: Ensure PHP-FPM systemd override directory exists
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/php{{ php_version }}-fpm.service.d"
    state: directory
    mode: "0755"

- name: Harden PHP-FPM systemd unit — auto-restart on crash
  become: true
  ansible.builtin.copy:
    dest: "/etc/systemd/system/php{{ php_version }}-fpm.service.d/override.conf"
    content: |
      [Service]
      Restart=always
      RestartSec=5s
    mode: "0644"
  notify: Restart PHP-FPM

- name: Ensure PHP-FPM is running
  become: true
  ansible.builtin.systemd:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true

- name: Ensure cache directory exists
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}/core/cache"
    state: directory
    mode: "0755"
    owner: www-data
    group: www-data

- name: Check cache filesystem type
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && df -T "{{ web_root }}/core/cache" | awk 'NR==2 {print $2}'
    executable: /bin/bash
  register: _cache_fs
  changed_when: false

- name: Backup existing cache to temp
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      mkdir -p /tmp/modx-cache-backup
      if [ -d "{{ web_root }}/core/cache" ] && [ "$(ls -A "{{ web_root }}/core/cache" 2>/dev/null)" ]; then
        cp -a "{{ web_root }}/core/cache/." /tmp/modx-cache-backup/
        chown -R www-data:www-data /tmp/modx-cache-backup/
      fi
    executable: /bin/bash
  changed_when: false
  when: _cache_fs.stdout | trim != "tmpfs"

- name: Mount tmpfs for MODX cache
  become: true
  ansible.posix.mount:
    path: "{{ web_root }}/core/cache"
    src: tmpfs
    fstype: tmpfs
    opts: "size={{ modx_cache_tmpfs_size }},mode=0755,uid=33,gid=33,nofail"
    state: mounted

- name: Restore cache from backup onto tmpfs
  become: true
  ansible.builtin.copy:
    src: /tmp/modx-cache-backup/
    dest: "{{ web_root }}/core/cache/"
    remote_src: true
    owner: www-data
    group: www-data
    mode: preserve
  when: _cache_fs.stdout | trim != "tmpfs"

- name: Cleanup cache backup
  become: true
  ansible.builtin.file:
    path: /tmp/modx-cache-backup
    state: absent
  when: _cache_fs.stdout | trim != "tmpfs"
