---
- name: Configure PHP-FPM pool (dynamic pm.max_children)
  become: true
  ansible.builtin.template:
    src: www.conf.j2
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    owner: root
    group: www-data
    mode: "0640"
    validate: "php-fpm{{ php_version }} -t -y %s"
  no_log: true
  notify: Restart PHP-FPM

- name: Configure PHP memory limits
  become: true
  ansible.builtin.template:
    src: php_limits.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/conf.d/50-limits.ini"
    mode: "0644"
  notify: Restart PHP-FPM

- name: Configure OPcache
  become: true
  ansible.builtin.template:
    src: opcache.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/conf.d/99-opcache.ini"
    mode: "0644"
  notify: Restart PHP-FPM

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Clear MODX system settings cache
  become: true
  ansible.builtin.command:
    cmd: rm -f {{ web_root }}/core/cache/system_settings/config.cache.php
  changed_when: false

- name: Ensure PHP-FPM systemd override directory exists
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/php{{ php_version }}-fpm.service.d"
    state: directory
    mode: "0755"

- name: Harden PHP-FPM systemd unit — auto-restart on crash
  become: true
  ansible.builtin.copy:
    dest: "/etc/systemd/system/php{{ php_version }}-fpm.service.d/override.conf"
    content: |
      [Service]
      Restart=always
      RestartSec=5s
    mode: "0644"
  notify: Restart PHP-FPM

- name: Fix PHP-FPM log permissions (Promtail/audit reads via adm group)
  become: true
  ansible.builtin.file:
    path: "/var/log/php{{ php_version }}-fpm.log"
    owner: root
    group: adm
    mode: "0640"

- name: Deploy PHP-FPM logrotate config
  become: true
  ansible.builtin.copy:
    dest: "/etc/logrotate.d/php{{ php_version }}-fpm"
    content: |
      /var/log/php{{ php_version }}-fpm.log {
          rotate 14
          daily
          missingok
          notifempty
          compress
          delaycompress
          postrotate
              if [ -x /usr/lib/php/php{{ php_version }}-fpm-reopenlogs ]; then
                  /usr/lib/php/php{{ php_version }}-fpm-reopenlogs
              fi
          endscript
          create 0640 root adm
      }
    mode: "0644"

- name: Ensure PHP-FPM is running
  become: true
  ansible.builtin.systemd:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true

- name: Ensure cache directory exists
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}/core/cache"
    state: directory
    mode: "0755"
    owner: www-data
    group: www-data

# FRESH-DEPLOY RACE GUARD: playbook-02 (web) runs concurrently with
# playbook-03 (db+restore) in parallel mode. On a fresh server the restore role
# replaces web_root wholesale (mv → extract → remount), so the cache
# backup/restore dance below must NOT run at the same time — a cp -a racing
# restore's mv would fail the playbook, and a temp-cache copy could recreate
# web_root/core/cache as a plain dir while restore is extracting. The stat
# mirrors restore's own site-exists gate: when config.inc.php is absent the
# site is about to be (re)built by restore, so skip the dance and let restore
# own web_root. The tmpfs MOUNT task below is race-tolerant (see its comment).
- name: Check if MODX site already installed (restore race guard)
  become: true
  ansible.builtin.stat:
    path: "{{ web_root }}/core/config/config.inc.php"
  register: php_site_exists

- name: Check cache filesystem type
  become: true
  ansible.builtin.shell:
    cmd: set -o pipefail && df -T "{{ web_root }}/core/cache" | awk 'NR==2 {print $2}'
    executable: /bin/bash
  register: _cache_fs
  changed_when: false
  failed_when: false  # dir may be gone mid-race (parallel restore); empty => not tmpfs

- name: Backup existing cache to temp
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      mkdir -p /tmp/modx-cache-backup
      if [ -d "{{ web_root }}/core/cache" ] && [ "$(ls -A "{{ web_root }}/core/cache" 2>/dev/null)" ]; then
        cp -a "{{ web_root }}/core/cache/." /tmp/modx-cache-backup/
        chown -R www-data:www-data /tmp/modx-cache-backup/
      fi
    executable: /bin/bash
  changed_when: false
  when:
    - _cache_fs.stdout | trim != "tmpfs"
    - php_site_exists.stat.exists

# Race-tolerant vs parallel restore (playbook-03 mv's web_root away): always
# ensure fstab (idempotent module), but only mount if the dir exists right
# now — else restore mounts.
- name: Ensure fstab entry for MODX cache tmpfs
  become: true
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "tmpfs {{ web_root }}/core/cache tmpfs size={{ modx_cache_tmpfs_size }},mode=0755,uid=33,gid=33,nofail 0 0"
    state: present

- name: Mount tmpfs for MODX cache (race-tolerant)
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      _cache="{{ web_root }}/core/cache"
      [ -d "{{ web_root }}" ] && mkdir -p "$_cache"
      mountpoint -q "$_cache" || mount "$_cache" >/dev/null 2>&1 || true
    executable: /bin/bash
  changed_when: false

- name: Restore cache from backup onto tmpfs
  become: true
  ansible.builtin.copy:
    src: /tmp/modx-cache-backup/
    dest: "{{ web_root }}/core/cache/"
    remote_src: true
    owner: www-data
    group: www-data
    mode: preserve
  when:
    - _cache_fs.stdout | trim != "tmpfs"
    - php_site_exists.stat.exists

- name: Cleanup cache backup
  become: true
  ansible.builtin.file:
    path: /tmp/modx-cache-backup
    state: absent
  when:
    - _cache_fs.stdout | trim != "tmpfs"
    - php_site_exists.stat.exists
