---
- name: Stop Apache if running
  become: true
  ansible.builtin.systemd:
    name: apache2
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure nginx is running
  become: true
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Deploy nginx main config
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: Reload Nginx

- name: Deploy default server (IP-based)
  become: true
  ansible.builtin.template:
    src: vhost-default.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload Nginx

- name: Enable default site
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
    force: true
  notify: Reload Nginx

- name: Deploy MODX vhost config
  become: true
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}"
    mode: "0644"
  notify: Reload Nginx

- name: Enable site
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}"
    dest: "/etc/nginx/sites-enabled/{{ domain }}"
    state: link
    force: true
  notify: Reload Nginx

- name: Deploy Cloudflare real IP updater
  become: true
  ansible.builtin.copy:
    src: "{{ scripts_dir }}/update_cloudflare_ips.sh"
    dest: "{{ scripts_dir_remote }}/update_cloudflare_ips.sh"
    owner: root
    group: root
    mode: "0755"

- name: Run Cloudflare real IP updater (initial)
  become: true
  ansible.builtin.command: "{{ scripts_dir_remote }}/update_cloudflare_ips.sh"
  changed_when: false
  failed_when: false

- name: Ensure weekly cron for Cloudflare IP refresh
  become: true
  ansible.builtin.cron:
    name: update-cloudflare-ips
    job: "{{ scripts_dir_remote }}/update_cloudflare_ips.sh >/dev/null 2>&1"
    hour: "2"
    minute: "0"
    weekday: "0"

- name: Test nginx configuration
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
