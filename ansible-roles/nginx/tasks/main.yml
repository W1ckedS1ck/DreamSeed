---
- name: Stop Apache if running
  become: true
  ansible.builtin.systemd:
    name: apache2
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure nginx is running
  become: true
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Deploy nginx main config
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: Reload Nginx

- name: Deploy default server (IP-based)
  become: true
  ansible.builtin.template:
    src: vhost-default.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload Nginx

- name: Enable default site
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  notify: Reload Nginx

- name: Deploy MODX vhost config
  become: true
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}"
    mode: "0644"
  notify: Reload Nginx

- name: Enable site
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}"
    dest: "/etc/nginx/sites-enabled/{{ domain }}"
    state: link
  notify: Reload Nginx

- name: Test nginx configuration
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
