---
- name: Fail if cloudflare_api_token not set
  ansible.builtin.fail:
    msg: "cloudflare_api_token is required for cache rule"
  when: cloudflare_api_token | default('') | length == 0

- name: Compute zone name (strip subdomain for dev targets)
  ansible.builtin.set_fact:
    _cf_zone_name: "{{ domain | regex_replace('^[^.]+\\.', '') if domain | regex_search('^[^.]+\\.[^.]+\\.[^.]+$') else domain }}"
    _cf_cache_ttl: "{{ cloudflare_cache_ttl | default(3600) }}"

- name: Resolve zone ID from zone name
  ansible.builtin.shell: |
    curl -s -H "Authorization: Bearer {{ cloudflare_api_token }}" \
      "https://api.cloudflare.com/client/v4/zones?name={{ _cf_zone_name }}" | \
      python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])"
  register: _cf_zone_cmd
  delegate_to: localhost
  run_once: true

- name: Set fact for zone ID
  ansible.builtin.set_fact:
    _cf_zone_id: "{{ _cf_zone_cmd.stdout }}"

- name: Find existing cache ruleset
  ansible.builtin.shell: |
    curl -s -H "Authorization: Bearer {{ cloudflare_api_token }}" \
      "https://api.cloudflare.com/client/v4/zones/{{ _cf_zone_id }}/rulesets" | \
      python3 -c "
    import sys,json
    for r in json.load(sys.stdin).get('result',[]):
        if r.get('phase') == 'http_request_cache_settings' and r.get('name','').startswith('MODX Cache Rules'):
            print(r['id'])
            break
    "
  register: _cf_existing_ruleset
  failed_when: false
  delegate_to: localhost
  run_once: true

- name: Delete existing cache ruleset
  ansible.builtin.shell: |
    curl -s -X DELETE -H "Authorization: Bearer {{ cloudflare_api_token }}" \
      "https://api.cloudflare.com/client/v4/zones/{{ _cf_zone_id }}/rulesets/{{ _cf_existing_ruleset.stdout }}"
  when: _cf_existing_ruleset.stdout | length > 0
  changed_when: true
  delegate_to: localhost
  run_once: true

- name: Create cache ruleset
  ansible.builtin.shell: |
    curl -s -X POST \
      -H "Authorization: Bearer {{ cloudflare_api_token }}" \
      -H "Content-Type: application/json" \
      -d '{
        "name": "MODX Cache Rules — {{ _cf_zone_name }}",
        "description": "Cache HTML, bypass admin and logged-in users",
        "kind": "zone",
        "phase": "http_request_cache_settings",
        "rules": [{
          "action": "set_cache_settings",
          "action_parameters": {
            "cache": true,
            "edge_ttl": {"mode": "override_origin", "default": {{ _cf_cache_ttl }}}
          },
          "expression": "(not starts_with(http.request.uri.path, \"/manager/\")) and (not http.cookie contains \"PHPSESSID\")",
          "description": "Cache: all except admin and logged-in users",
          "enabled": true
        }]
      }' \
      "https://api.cloudflare.com/client/v4/zones/{{ _cf_zone_id }}/rulesets"
  register: _cf_create_result
  changed_when: _cf_create_result.stdout is search('"success":true')
  delegate_to: localhost
  run_once: true
