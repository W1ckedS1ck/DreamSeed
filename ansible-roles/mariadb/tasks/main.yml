---
- name: Deploy optimized my.cnf
  become: true
  ansible.builtin.copy:
    content: |
      [mysqld]
      bind-address = 127.0.0.1
      character-set-server = utf8mb4
      collation-server = utf8mb4_unicode_ci
      innodb_flush_method = O_DIRECT
      # Performance optimizations from MySQLTuner
      skip-name-resolve=ON
      tmp_table_size=32M
      max_heap_table_size=32M
      innodb_buffer_pool_size=512M
      innodb_log_file_size=100M
    dest: /etc/mysql/conf.d/99-optimizations.cnf
    mode: "0644"
  notify: Restart MariaDB

- name: Ensure MariaDB is running
  become: true
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Remove anonymous users
  become: true
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove test database
  become: true
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Remove remote root access
  become: true
  community.mysql.mysql_user:
    name: root
    host: "'127.0.0.1'"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create database
  become: true
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create database user
  become: true
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_pass }}"
    priv: "{{ db_name }}.*:ALL"
    host: localhost
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Deploy .my.cnf for ubuntu user
  ansible.builtin.template:
    src: my.cnf.j2
    dest: "/home/ubuntu/.my.cnf"
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Create monitoring user for MySQL exporter (localhost)
  become: true
  community.mysql.mysql_user:
    name: monitoring
    host: localhost
    password: "{{ db_pass }}"
    priv: "*.*:PROCESS,REPLICATION CLIENT,SELECT"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Create monitoring user for MySQL exporter (127.0.0.1)
  become: true
  community.mysql.mysql_user:
    name: monitoring
    host: "127.0.0.1"
    password: "{{ db_pass }}"
    priv: "*.*:PROCESS,REPLICATION CLIENT,SELECT"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true