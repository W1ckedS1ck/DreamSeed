---
- name: Add www-data user to ssl-cert group for certificate access
  become: true
  ansible.builtin.user:
    name: www-data
    groups: ssl-cert
    append: true

- name: Deploy Grafana htpasswd file (nginx basic auth in front of /grafana)
  become: true
  ansible.builtin.copy:
    dest: /etc/nginx/.grafana_htpasswd
    content: "{{ grafana_htpasswd_user }}:{{ grafana_htpasswd }}\n"
    owner: root
    group: www-data
    mode: "0640"
    # Only when the hash is provisioned. If GRAFANA_NGINX_HASH is empty the
    # /grafana location falls through to Grafana's own login (no double gate).
  when: grafana_htpasswd | default('') | length > 0

- name: Deploy Nginx SSL vhost
  become: true
  ansible.builtin.template:
    src: vhost-ssl.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}-ssl.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable SSL site
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}-ssl.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain }}-ssl.conf"
    state: link
    force: true
  notify: Reload Nginx

- name: Test Nginx configuration
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
