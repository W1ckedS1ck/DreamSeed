---
- name: Add www-data user to ssl-cert group for certificate access
  become: true
  ansible.builtin.user:
    name: www-data
    groups: ssl-cert
    append: true

- name: Deploy Grafana htpasswd file (nginx basic auth in front of /grafana)
  become: true
  no_log: true
  ansible.builtin.copy:
    dest: /etc/nginx/.grafana_htpasswd
    content: "{{ grafana_htpasswd_user }}:{{ grafana_htpasswd }}\n"
    owner: root
    group: www-data
    mode: "0640"
    # Only when the hash is provisioned. If GRAFANA_NGINX_HASH is empty the
    # /grafana location falls through to Grafana's own login (no double gate).
  when: grafana_htpasswd | default('') | length > 0

- name: Deploy Nginx cache-control map (HTML TTL per cookie and path)
  become: true
  ansible.builtin.copy:
    src: dreamseed-cache-map.conf
    dest: /etc/nginx/conf.d/dreamseed-cache-map.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Ensure Faro vendor directory exists
  become: true
  ansible.builtin.file:
    path: "{{ web_root }}/theme/js/vendor"
    state: directory
    owner: www-data
    group: www-data
    mode: "2775"
  when: faro_enabled | bool and faro_collector_url | length > 0

- name: Deploy Faro loader
  become: true
  ansible.builtin.template:
    src: faro-loader.js.j2
    dest: "{{ web_root }}{{ faro_loader_path }}"
    owner: www-data
    group: www-data
    mode: "0644"
  when: faro_enabled | bool and faro_collector_url | length > 0

- name: Download Faro Web SDK
  become: true
  ansible.builtin.get_url:
    url: "https://unpkg.com/@grafana/faro-web-sdk@{{ faro_sdk_version }}/dist/bundle/faro-web-sdk.iife.js"
    dest: "{{ web_root }}{{ faro_sdk_path }}"
    owner: www-data
    group: www-data
    mode: "0644"
    force: false
  register: faro_sdk_download
  retries: 3
  delay: 2
  until: faro_sdk_download is succeeded
  when: faro_enabled | bool and faro_collector_url | length > 0

- name: Deploy Nginx SSL vhost
  become: true
  ansible.builtin.template:
    src: vhost-ssl.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}-ssl.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Enable SSL site
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}-ssl.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain }}-ssl.conf"
    state: link
    force: true
  notify: Reload Nginx

- name: Test Nginx configuration
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
