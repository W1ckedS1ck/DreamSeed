# Logged-in users (ds_auth=1) and account/cart paths: never cache.
# Guest HTML: short browser TTL; the edge TTL comes from the Cloudflare Cache Rule.
map "$cookie_ds_auth$request_uri" $dreamseed_cache_control {
    default "public, max-age=120";
    ~^1 "no-store, no-cache, must-revalidate, max-age=0";
    ~^/personal-account "no-store, no-cache, must-revalidate, max-age=0";
    ~^/manager "no-store, no-cache, must-revalidate, max-age=0";
    ~^/canceled-order-completion "no-store, no-cache, must-revalidate, max-age=0";
    ~^/successful-order-completion "no-store, no-cache, must-revalidate, max-age=0";
    ~^/cart "no-store, no-cache, must-revalidate, max-age=0";
    ~^/garden-of-dreamers "no-store, no-cache, must-revalidate, max-age=0";
    ~^/karta-mechtatelej "no-store, no-cache, must-revalidate, max-age=0";
    ~*^/assets/components/dreamseed/map-data\.php "no-store, no-cache, must-revalidate, max-age=0";
    ~*^/assets/components/minishop2/payment/ "no-store, no-cache, must-revalidate, max-age=0";
    ~*[?&]msorder= "no-store, no-cache, must-revalidate, max-age=0";
    ~*[?&]service=logout "no-store, no-cache, must-revalidate, max-age=0";
    ~*[?&]service=delete-account "no-store, no-cache, must-revalidate, max-age=0";
}
map "$cookie_ds_auth$request_uri" $dreamseed_cf_cache_control {
    default "public, s-maxage=3600";
    ~^1 "no-store";
    ~^/personal-account "no-store";
    ~^/manager "no-store";
    ~^/canceled-order-completion "no-store";
    ~^/successful-order-completion "no-store";
    ~^/cart "no-store";
    ~^/garden-of-dreamers "no-store";
    ~^/karta-mechtatelej "no-store";
    ~*^/assets/components/dreamseed/map-data\.php "no-store";
    ~*^/assets/components/minishop2/payment/ "no-store";
    ~*[?&]msorder= "no-store";
    ~*[?&]service=logout "no-store";
    ~*[?&]service=delete-account "no-store";
}
