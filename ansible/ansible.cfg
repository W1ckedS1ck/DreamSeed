[defaults]
callbacks_enabled = ansible.posix.profile_tasks
roles_path = ../ansible-roles
timeout = 60
# Keep deprecation warnings on (Ansible default) — early signal before a future
# Ansible release removes deprecated modules/syntax. Our code is FQCN-clean.
deprecation_warnings = True

remote_tmp = /var/tmp/ansible-root
gathering = smart
inject_facts_as_vars = False
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts_cache
fact_caching_timeout = 1800
forks = 20
strategy = linear

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o StrictHostKeyChecking=yes
pipelining = True

[privilege_escalation]
become = False
