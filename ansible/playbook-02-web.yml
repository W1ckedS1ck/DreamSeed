---
- name: 02 Web Server (Nginx/Apache + PHP + SSL)
  hosts: dreamseed
  become: false
  gather_facts: true

  pre_tasks:
    - name: Use cached php_version fact (fallback from playbook-01)
      ansible.builtin.set_fact:
        php_version: "{{ ansible_facts['php_version'] | default(php_version) }}"

  tasks:
    - name: Configure Nginx
      ansible.builtin.include_role:
        name: nginx
      when: web_server == "nginx"
    - name: Configure Apache HTTP
      ansible.builtin.include_role:
        name: apache_http
      when: web_server == "apache"
    - name: SSL certs
      ansible.builtin.include_role:
        name: ssl
    - name: Configure Nginx SSL
      ansible.builtin.include_role:
        name: nginx-ssl
      when: web_server == "nginx"
    - name: Configure Apache SSL
      ansible.builtin.include_role:
        name: apache_ssl
      when: web_server == "apache"
    - name: Redis
      ansible.builtin.include_role:
        name: redis
    - name: PHP
      ansible.builtin.include_role:
        name: php
