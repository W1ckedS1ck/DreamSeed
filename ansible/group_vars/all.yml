---
# ==== General ====

ansible_python_interpreter: /usr/bin/python3
domain: "{{ lookup('env', 'DEPLOY_DOMAIN') | mandatory('domain required — run via deploy.sh or pass -e domain=...') }}"
admin_email: "hello@dreamseed.online"
web_server: "nginx"

# ==== Ubuntu Pro (ESM) ====

# Attached via Ansible (packages_common role) — not in cloud-init, so the token
# never lands in Terraform state or instance user-data.
ubuntu_pro_token: "{{ lookup('env', 'UBUNTU_PRO_TOKEN') | default('', true) }}"

# ==== Database ====

db_name: "modx_db"
db_user: "modx_user"
db_prefix: "modx_"
db_pass: "{{ lookup('env', 'DB_PASS') | mandatory('DB_PASS environment variable is required') }}"
db_min_tables: 100

# ==== PHP ====
# HARD LOCK: MODX 2.x is incompatible with PHP > 8.3. Never bump (renovate rule + deploy/lint guards enforce).

php_version: "{{ lookup('env', 'PHP_VERSION') | default('8.3', true) }}" # renovate: depName=php

# ==== Redis ====

# Redis intentionally without password: bind 127.0.0.1 only, single-server setup.
# Password would not stop local attacker (already owns the box).
redis_password: "{{ lookup('env', 'REDIS_PASSWORD') | default('', true) }}"

# ==== Backup ====

# DESIGN: Dev has no independent backup pipeline — restore always pulls prod
# paths; dev cloud uploads are never consumed. Intentional (dev = ephemeral copy).
backup_cron_enabled: true
backup_project_keep: 5
backup_db_keep: 15
cloud_project_keep: 10
cloud_db_keep: 100

# ==== Cloudflare ====

cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
# fail2ban bans at the CF edge (cloudflare-token action). Empty = web jails are log-only.
cloudflare_firewall_token: "{{ lookup('env', 'CLOUDFLARE_FIREWALL_TOKEN') | default('', true) }}"
cloudflare_zone_id: "{{ lookup('env', 'CLOUDFLARE_ZONE_ID') | default('', true) }}"

# ==== fail2ban ====
# Space-separated CIDRs whitelisted from ALL jails (sshd, modx-admin, recidive).
# Empty = no operator/monitoring exemption; tighten per env as needed.
# Format example: "203.0.113.0/24 192.0.2.5"
fail2ban_ignoreip: ""

# ==== Monitoring (Grafana + VictoriaMetrics) ====

# Grafana installs as apt-latest (apt repo lags GitHub ~2w); this var = documented
# expected version — Renovate PRs are the release radar, deploy log shows drift.
grafana_version: "{{ lookup('env', 'GRAFANA_VERSION') | default('13.2.0', true) }}" # renovate: depName=grafana/grafana datasource=github-releases
# Grafana admin password (used by /etc/grafana/grafana.env systemd EnvironmentFile)
grafana_admin_password: "{{ lookup('env', 'GRAFANA_PASS') | mandatory('GRAFANA_PASS env var is required') }}"
# Nginx-level auth in front of /grafana (defense-in-depth: gates the
# reverse-proxy path before Grafana's own login form, blocks admin/admin
# brute-force from the public internet). htpasswd is generated at deploy
# time from a separate secret (GRAFANA_NGINX_PASS) so the Grafana password
# is not the same as the one exposed to the public-facing basic auth.
grafana_htpasswd_user: "{{ lookup('env', 'GRAFANA_NGINX_USER') | default('grafana', true) }}"
grafana_htpasswd: "{{ lookup('env', 'GRAFANA_NGINX_HASH') | default('', true) }}"
grafana_port: 3000
monitoring_node_version: "{{ lookup('env', 'MONITORING_NODE_VERSION') | default('1.12.1', true) }}" # renovate: depName=prometheus/node_exporter datasource=github-releases
monitoring_nginx_version: "{{ lookup('env', 'MONITORING_NGINX_VERSION') | default('1.5.3', true) }}" # renovate: depName=nginxinc/nginx-prometheus-exporter datasource=github-releases
monitoring_apache_version: "{{ lookup('env', 'MONITORING_APACHE_VERSION') | default('1.1.1', true) }}" # renovate: depName=Lusitaniae/apache_exporter datasource=github-releases
monitoring_mysql_version: "{{ lookup('env', 'MONITORING_MYSQL_VERSION') | default('0.20.0', true) }}" # renovate: depName=prometheus/mysqld_exporter datasource=github-releases
monitoring_vm_version: "{{ lookup('env', 'MONITORING_VM_VERSION') | default('1.150.0', true) }}" # renovate: depName=VictoriaMetrics/VictoriaMetrics datasource=github-releases
monitoring_vmagent_version: "{{ lookup('env', 'MONITORING_VMAGENT_VERSION') | default('1.150.0', true) }}" # renovate: depName=VictoriaMetrics/VictoriaMetrics datasource=github-releases
monitoring_redis_version: "{{ lookup('env', 'MONITORING_REDIS_VERSION') | default('1.90.0', true) }}" # renovate: depName=oliver006/redis_exporter datasource=github-releases
telegram_bot_version: "{{ lookup('env', 'TELEGRAM_BOT_VERSION') | default('22.8', true) }}" # renovate: depName=python-telegram-bot datasource=pypi
# Pinned uv binary — install path: release .sha256 asset -> get_url checksum (same pattern as setup-gitleaks)
uv_version: "{{ lookup('env', 'UV_VERSION') | default('0.12.7', true) }}" # renovate: depName=astral-sh/uv datasource=github-releases
# Bot venv: created by uv (system CPython 3.12 on 24.04, uv-managed on later releases)
bot_python_version: "3.12"
loki_url: "{{ lookup('env', 'LOKI_URL') | default('', true) }}"
loki_username: "{{ lookup('env', 'LOKI_USERNAME') | default('', true) }}"

vm_retention: 3
monitoring_cron_enabled: true
monitoring_vmagent_enabled: true
monitoring_scrape_interval: "15s"
grafana_telegram_token: "{{ lookup('env', 'TG_TOKEN') }}"
grafana_telegram_chat_id: "{{ lookup('env', 'TG_CHAT_ID') }}"
grafana_telegram_thread_id: "{{ lookup('env', 'TG_THREAD_ID') | default('', true) }}"
grafana_cloud_url: "{{ lookup('env', 'GRAFANA_CLOUD_URL') | default('', true) }}"
grafana_cloud_username: "{{ lookup('env', 'GRAFANA_CLOUD_USERNAME') | default('', true) }}"
# Grafana Cloud authentication token (used by monitoring and logging services)
grafana_cloud_token: "{{ lookup('env', 'GRAFANA_CLOUD_TOKEN') | default('', true) }}"

# ==== MODX cache settings ====

modx_cache_db: "0"
modx_cache_db_session: "1"

# ==== Directories ====

web_root: "/var/www/html"
backup_dir: "/home/ubuntu/backups"
scripts_dir_remote: "/home/ubuntu/Scripts"
bot_venv_dir: "{{ scripts_dir_remote }}/.venv"
scripts_dir: "{{ playbook_dir }}/../scripts"
secrets_dir: "{{ playbook_dir }}/../secrets"

# ==== Environment ====

deploy_env: "{{ lookup('env', 'DEPLOY_ENV') | mandatory('DEPLOY_ENV required — run via deploy.sh or pass -e deploy_env=...') }}"

# ==== Hardware ====

swap_size: "2G"
modx_cache_tmpfs_size: "128M"

# ==== Security ====

additional_ssh_keys: []  # Add extra SSH public keys here if needed (one per line)

# ==== Frontend Observability (Faro — RUM) ====

faro_enabled: true
faro_app_name: "{{ lookup('env', 'FARO_APP_NAME') | default(domain, true) }}"
faro_collector_url: "{{ lookup('env', 'FARO_COLLECTOR_URL') | default('', true) }}"
faro_sdk_version: "2.11.0"  # renovate: depName=@grafana/faro-web-sdk datasource=npm

# ==== SSL ====

ssl_cf_dns_enabled: true  # false → skip certbot DNS-01, use self-signed (for test servers)

# ==== Backup encryption (rclone crypt) ====

rclone_crypt_password: "{{ lookup('env', 'RCLONE_CRYPT_PASSWORD') | default('', true) }}"
