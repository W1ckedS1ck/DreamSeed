---
# ========================
#  General
# ========================
ansible_python_interpreter: /usr/bin/python3
domain: ""
domain_www: true
admin_email: "hello@dreamseed.online"
web_server: "nginx"
server_ip: "{{ ansible_host }}"

# ========================
#  Database
# ========================
db_name: "modx_db"
db_user: "modx_user"
db_pass: "{{ lookup('env', 'DB_PASS') or fail('DB_PASS env var is required') }}"

# ========================
#  PHP
# ========================
php_version: "{{ ansible_facts.php_version | default('8.3') }}"  # auto-detected in playbook-01, cached for subsequent playbooks

# ========================
#  Backup
# ========================
backup_cron_enabled: true

# ========================
#  Cloudflare
# ========================
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"

# ========================
#  SSL
# ========================
# All environments are behind Cloudflare proxy (Full SSL mode) — self-signed on origin is sufficient.
# Set to false to enable Let's Encrypt certbot (DNS-01 via Cloudflare or webroot).
# To use a custom certificate instead, place it in secrets/ssl/letsencrypt/live/<domain>/.
ssl_skip_certbot: true

# ========================
#  Monitoring (Grafana + VictoriaMetrics)
# ========================
grafana_version: "13.0.1"
grafana_admin_password: "{{ lookup('env', 'GRAFANA_PASS') or fail('GRAFANA_PASS env var is required') }}"
grafana_secret_key: "{{ lookup('env', 'GRAFANA_SECRET_KEY') | default('') }}"
grafana_port: 3000
monitoring_node_version: "1.11.1"
monitoring_nginx_version: "1.5.1"
monitoring_apache_version: "1.0.12"
monitoring_mysql_version: "0.19.0"
monitoring_vm_version: "1.143.0"
vm_retention: 3
grafana_telegram_token: "{{ lookup('env', 'TG_TOKEN') }}"
grafana_telegram_chat_id: "{{ lookup('env', 'TG_CHAT_ID') }}"

# ========================
#  Directories
# ========================
web_root: "/var/www/html"
backup_dir: "/home/ubuntu/backups"
scripts_dir_remote: "/home/ubuntu/Scripts"
scripts_dir: "{{ playbook_dir }}/../scripts"
secrets_dir: "{{ playbook_dir }}/../secrets"
configs_dir: "{{ playbook_dir }}/../configs"

# ========================
#  Security
# ========================
additional_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHnlra4vLtdXHPRNmOqtzrHlYh5oqAaGM24jTxM/yUft 2024@DESKTOP-6ADBQSM"
