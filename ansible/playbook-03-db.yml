---
- name: 03 Database & Restore
  hosts: dreamseed
  become: false
  gather_facts: true

  pre_tasks:
    - name: Use cached php_version fact (fallback from playbook-01)
      ansible.builtin.set_fact:
        php_version: "{{ ansible_facts['php_version'] | default(php_version) }}"

    - name: Validate db_prefix and db_name format
      ansible.builtin.include_tasks: ../ansible-roles/backup/tasks/validate_db_vars.yml

  roles:
    - mariadb
    - restore
