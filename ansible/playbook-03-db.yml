---
- name: 03 Database & Restore
  hosts: dreamseed
  become: false
  gather_facts: true

  pre_tasks:
    - name: Use cached php_version fact (fallback from playbook-01)
      ansible.builtin.set_fact:
        php_version: "{{ ansible_facts['php_version'] | default(php_version) }}"

  roles:
    - mariadb
    - restore
