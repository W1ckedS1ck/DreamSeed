---
- name: 01 Base Packages
  hosts: dreamseed
  become: false
  gather_facts: true

  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Wait for apt locks
      become: true
      ansible.builtin.shell: |
        while fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
      changed_when: false
      timeout: 120

  roles:
    - packages_common
    - role: packages_apache
      when: web_server == "apache"
    - role: packages_nginx
      when: web_server == "nginx"

  tasks:
    - name: Pre-cache monitoring binaries (async)
      ansible.builtin.shell:
        cmd: "curl -sLo '/tmp/{{ item.name }}.tar.gz' '{{ item.url }}' && touch '/tmp/{{ item.name }}.done'"
      async: 120
      poll: 0
      loop:
        - name: victoria-metrics
          url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ monitoring_vm_version }}/victoria-metrics-linux-amd64-v{{ monitoring_vm_version }}.tar.gz"
        - name: vmagent
          url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ monitoring_vmagent_version }}/vmutils-linux-amd64-v{{ monitoring_vmagent_version }}.tar.gz"
      when: monitoring_vm_version is defined and monitoring_vmagent_version is defined
