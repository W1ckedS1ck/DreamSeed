---
- name: 01 Base Packages
  hosts: dreamseed
  become: false
  gather_facts: true

  pre_tasks:
    # Pre-create the configured remote_tmp (see ansible.cfg) so module_utils
    # never auto-creates it 0700 and emits the "may cause issues when running
    # as another user" warning. `file` needs no remote_tmp itself (pipelining).
    - name: Ensure Ansible remote_tmp exists (silence 0700 auto-create warning)
      ansible.builtin.file:
        path: /var/tmp/ansible-root
        state: directory
        mode: "0700"
      changed_when: false

    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Wait for apt locks
      become: true
      ansible.builtin.shell: |
        while fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
      changed_when: false
      timeout: 120

    - name: Mark deploy in progress (suppress check-services false alerts)
      become: true
      ansible.builtin.file:
        path: /tmp/.dreamseed_deploying
        state: touch
        mode: "0644"

  roles:
    - packages_common
    - role: packages_apache
      when: web_server == "apache"
    - role: packages_nginx
      when: web_server == "nginx"
