# Template inventory for standalone Ansible runs.
#
# deploy.sh auto-generates a per-workspace inventory
# (ansible/inventory/hosts-<workspace>.yml) on every run and passes it
# with `-i`, so this file is NOT used during normal deployments.
#
# Keep it only as a reference / manual-run template. Replace the
# placeholders below before using directly.
all:
  hosts:
    dreamseed:
      ansible_host: REPLACE_WITH_SERVER_IP
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_PRIVATE_KEY_PATH') | default('~/.ssh/id_rsa', true) }}"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
      server_ip: REPLACE_WITH_SERVER_IP
