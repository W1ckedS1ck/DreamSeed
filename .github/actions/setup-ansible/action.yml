name: Setup Ansible
description: Install Ansible dependencies with uv (cached)

inputs:
  uv-version:
    description: uv release to install (kept in sync with ci.yml UV_VERSION)
    required: false
    default: "0.13.7" # renovate: depName=astral-sh/uv

runs:
  using: composite
  steps:
    # ansible-core 2.22 requires Python >=3.13 and is tested on 3.12-3.14.
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    # uv installs the hash-pinned set ~10x faster than pip. The cache is keyed
    # on the lock file, so a hit makes the install a no-op.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: ansible/requirements-deploy.txt

    - run: uv pip install --system --require-hashes -r ansible/requirements-deploy.txt --quiet
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ansible/collections
        key: ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}
        restore-keys: ansible-collections-${{ runner.os }}-

    # Collection versions pinned in ansible/requirements.yml (Renovate bumps).
    # Installed every run for idempotency; the cache above makes it a no-op on hit.
    - run: ansible-galaxy collection install -r ansible/requirements.yml
      shell: bash
