name: Setup Ansible
description: Cache pip and install dependencies

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles('ansible/requirements-deploy.txt') }}
        restore-keys: pip-${{ runner.os }}-

    - run: pip install -r ansible/requirements-deploy.txt --quiet
      shell: bash

    # ansible.mysql and ansible.posix ship bundled with the `ansible`
    # community pip package — reinstalled via requirements.yml as a safety
    # net in case ansible drops them. Versions are pinned there; Renovate
    # (ansible-galaxy manager) bumps them.
    - run: ansible-galaxy collection install -r ansible/requirements.yml
      shell: bash
