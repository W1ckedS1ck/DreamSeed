name: Setup Ansible
description: Cache pip and Ansible collections, install dependencies

inputs:
  requirements-file:
    description: Path to pip requirements file
    required: false
    default: ansible/requirements-deploy.txt
  collections:
    description: Ansible collections to install
    required: false
    default: ansible.mysql ansible.posix

runs:
  using: composite
  steps:
    - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles(inputs.requirements-file) }}
        restore-keys: uv-${{ runner.os }}-

    - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
      with:
        path: ~/.ansible/collections
        key: ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}
        restore-keys: ansible-collections-${{ runner.os }}-

    - run: |
        python -m pip install --quiet uv
        uv pip install --system --quiet -r ${{ inputs.requirements-file }}
      shell: bash

    - run: ansible-galaxy collection install ${{ inputs.collections }}
      shell: bash
