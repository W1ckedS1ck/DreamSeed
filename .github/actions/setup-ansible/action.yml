name: Setup Ansible
description: Cache pip and Ansible collections, install dependencies

inputs:
  requirements-file:
    description: Path to pip requirements file
    required: false
    default: ansible/requirements-deploy.txt
  collections:
    description: Ansible collections to install
    required: false
    default: ansible.mysql ansible.posix

runs:
  using: composite
  steps:
    - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles(inputs.requirements-file) }}
        restore-keys: pip-${{ runner.os }}-

    - run: pip install -r ${{ inputs.requirements-file }} --quiet
      shell: bash

    # Note: ansible.mysql and ansible.posix ship bundled with the `ansible`
    # community pip package — this is effectively a no-op. Kept as safety net
    # in case a future ansible release drops one of them. No cache step
    # because galaxy installs nothing (cache would be empty).
    - run: ansible-galaxy collection install ${{ inputs.collections }}
      shell: bash
