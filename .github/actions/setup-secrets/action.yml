name: 'Setup secrets'
description: 'Reconstruct secrets files from base64-encoded inputs'
inputs:
  env-file-b64:
    description: 'Base64-encoded .env file'
    required: true
  vault-pass:
    description: 'Ansible vault password'
    required: true
  ssh-key:
    description: 'SSH private key content'
    required: true
  rclone-conf-b64:
    description: 'Base64-encoded rclone.conf'
    required: false
    default: ''
  setup-ssh-config:
    description: 'Create ~/.ssh/config with StrictHostKeyChecking accept-new'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        ENV_FILE_B64: ${{ inputs.env-file-b64 }}
        VAULT_PASS: ${{ inputs.vault-pass }}
        SSH_KEY: ${{ inputs.ssh-key }}
        RCLONE_CONF_B64: ${{ inputs.rclone-conf-b64 }}
        SETUP_SSH_CONFIG: ${{ inputs.setup-ssh-config }}
      run: |
        mkdir -p secrets
        echo "$ENV_FILE_B64" | base64 -d > secrets/.env
        chmod 600 secrets/.env

        echo -n "$VAULT_PASS" > ~/.vault_pass_dreamseed
        chmod 600 ~/.vault_pass_dreamseed

        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/Vitali.pem
        chmod 600 ~/.ssh/Vitali.pem

        if [[ "$SETUP_SSH_CONFIG" == "true" ]]; then
          {
            echo "StrictHostKeyChecking accept-new"
            echo "IdentityFile ~/.ssh/Vitali.pem"
          } > ~/.ssh/config
        fi

        if [[ -n "$RCLONE_CONF_B64" ]]; then
          echo "$RCLONE_CONF_B64" | base64 -d > secrets/rclone.conf
          chmod 600 secrets/rclone.conf
        fi
