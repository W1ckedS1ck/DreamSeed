name: Setup Terraform
description: Checkout, setup Terraform, cache providers

inputs:
  terraform-version:
    description: Terraform version to install
    required: false
    default: latest

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - uses: actions/cache@v5
      with:
        path: |
          terraform/aws/.terraform
          terraform/hetzner/.terraform
        key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/aws/.terraform.lock.hcl', 'terraform/hetzner/.terraform.lock.hcl') }}
        restore-keys: terraform-providers-${{ runner.os }}-
