name: Setup Gitleaks
description: Install pinned gitleaks binary with caching and SHA256 verification

inputs:
  gitleaks-version:
    description: Gitleaks version to install
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/bin/gitleaks
        key: gitleaks-${{ runner.os }}-${{ inputs.gitleaks-version }}
        restore-keys: |
          gitleaks-${{ runner.os }}-

    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
      run: |
        set -euo pipefail
        mkdir -p ~/.cache/bin
        if [ -f ~/.cache/bin/gitleaks ] && ~/.cache/bin/gitleaks version 2>/dev/null | grep -q "$GITLEAKS_VERSION"; then
          sudo cp ~/.cache/bin/gitleaks /usr/local/bin/gitleaks
          exit 0
        fi
        cd /tmp
        curl -sL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sL -o gitleaks_checksums.txt \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum -c -
        sudo tar -xz -C /usr/local/bin -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
        rm -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt
        sudo cp /usr/local/bin/gitleaks ~/.cache/bin/gitleaks
