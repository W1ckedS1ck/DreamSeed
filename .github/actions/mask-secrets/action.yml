name: 'Mask DreamSeed Secrets'
description: 'Mask all repository secrets in CI logs to prevent leakage.
  Uses toJSON(secrets) to auto-detect all secrets — no per-secret maintenance needed.
  Skips non-sensitive identifiers (REGION, GRAFANA_CLOUD_USERNAME) that would
  corrupt legitimate log output if masked.'

inputs:
  secrets_json:
    description: 'Output of toJSON(secrets) — all secret values to mask'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python3 -c '
        import json, os

        SKIP_KEYS = {
            "DEV_GRAFANA_CLOUD_USERNAME",
            "PROD_GRAFANA_CLOUD_USERNAME",
            "DEV_AWS_REGION",
            "PROD_REGION",
        }

        data = json.loads(os.environ.get("SECRETS_JSON", "{}"))

        for k, v in data.items():
            if k not in SKIP_KEYS and v:
                print("::add-mask::" + v)
        '
      env:
        SECRETS_JSON: ${{ inputs.secrets_json }}
