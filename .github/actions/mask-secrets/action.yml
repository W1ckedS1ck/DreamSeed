name: Mask Secrets
description: |
  Emit ::add-mask:: for the given env-var names. Pass variable names, not
  values — this keeps secrets out of the action definition (visible in
  GitHub UI). Callers pass the actual values via `env:` as usual.

  IMPORTANT: every name in `vars:` MUST have a matching `env:` entry, otherwise
  `${!name}` expands to empty and the step no-ops silently (no error).

  Only masks values that are non-empty and at least 8 characters long. GitHub
  replaces every occurrence of a masked value, so masking a short value (for
  example a one-digit Telegram thread ID) would shred unrelated log lines and
  timestamps.

inputs:
  vars:
    description: Newline-separated list of env-var names to mask
    required: true

runs:
  using: composite
  steps:
    - name: Mask
      shell: bash
      env:
        MASK_VARS: ${{ inputs.vars }}
      run: |
        while IFS= read -r name; do
          [[ -z "$name" ]] && continue
          val="${!name:-}"
          # GitHub masks every occurrence of the value. A short value (a digit,
          # a two-letter code) would corrupt unrelated output, so skip it.
          if [[ -n "$val" && ${#val} -ge 8 ]]; then
            echo "::add-mask::$val"
          fi
        done <<< "$MASK_VARS"
