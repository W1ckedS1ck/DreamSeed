name: Setup Environment
description: Mask secrets and vars, then write secrets/.env

inputs:
  tg_token:
    description: Telegram Bot Token
    required: false
    default: ""
  tg_chat_id:
    description: Telegram Chat ID
    required: false
    default: ""
  tg_thread_id:
    description: Telegram Thread ID
    required: false
    default: ""
  db_pass:
    description: Database password
    required: false
    default: ""
  cloudflare_api_token:
    description: Cloudflare API Token
    required: false
    default: ""
  cloudflare_firewall_token:
    description: Cloudflare API Token (fail2ban edge bans, Firewall Services:Edit)
    required: false
    default: ""
  hcloud_token:
    description: Hetzner Cloud Token (dev fallback)
    required: false
    default: ""
  prod_hetz_hcloud_token:
    description: Hetzner Cloud Token (prod)
    required: false
    default: ""
  grafana_pass:
    description: Grafana admin password
    required: false
    default: ""
  betteruptime_api_token:
    description: Better Stack API Token
    required: false
    default: ""
  betteruptime_backup_key:
    description: Better Stack Backup heartbeat key
    required: false
    default: ""
  betteruptime_gdrive_key:
    description: Better Stack GDrive upload heartbeat key
    required: false
    default: ""
  betteruptime_report_daily_key:
    description: Better Stack daily report heartbeat key
    required: false
    default: ""
  betteruptime_report_weekly_key:
    description: Better Stack weekly report heartbeat key
    required: false
    default: ""
  betteruptime_verify_key:
    description: Better Stack backup verify heartbeat key
    required: false
    default: ""
  betteruptime_check_services_key:
    description: Better Stack check services heartbeat key
    required: false
    default: ""
  dev_grafana_cloud_url:
    description: Grafana Cloud URL (dev)
    required: false
    default: ""
  dev_grafana_cloud_username:
    description: Grafana Cloud Username (dev)
    required: false
    default: ""
  dev_grafana_cloud_token:
    description: Grafana Cloud Token (dev)
    required: false
    default: ""
  prod_grafana_cloud_url:
    description: Grafana Cloud URL (prod)
    required: false
    default: ""
  prod_grafana_cloud_username:
    description: Grafana Cloud Username (prod)
    required: false
    default: ""
  prod_grafana_cloud_token:
    description: Grafana Cloud Token (prod)
    required: false
    default: ""
  loki_url:
    description: Loki URL (dev; overridden by loki_url_prod on prod targets)
    required: false
    default: ""
  loki_username:
    description: Loki Username (dev; overridden by loki_username_prod on prod targets)
    required: false
    default: ""
  loki_url_prod:
    description: Loki URL for prod targets (dreamseed stack tenant)
    required: false
    default: ""
  loki_username_prod:
    description: Loki Username for prod targets (dreamseed Loki instance ID)
    required: false
    default: ""
  environment:
    description: 'Deploy target environment (prod, prod-hetz, dev-aws, dev-hetz)'
    required: false
    default: ""
  faro_collector_url:
    description: Faro Collector URL
    required: false
    default: ""
  dev_aws_access_key:
    description: AWS Access Key (dev)
    required: false
    default: ""
  dev_aws_secret_key:
    description: AWS Secret Key (dev)
    required: false
    default: ""
  dev_aws_region:
    description: AWS Region (dev)
    required: false
    default: ""
  prod_access_key:
    description: AWS Access Key (prod)
    required: false
    default: ""
  prod_secret_key:
    description: AWS Secret Key (prod)
    required: false
    default: ""
  prod_region:
    description: AWS Region (prod)
    required: false
    default: ""
  user_ssh_public_key:
    description: User SSH public key
    required: false
    default: ""
  vitali_ssh_public_key:
    description: Vitali SSH public key
    required: false
    default: ""
  rclone_crypt_password:
    description: rclone crypt password
    required: false
    default: ""
  ubuntu_pro_token:
    description: Ubuntu Pro token
    required: false
    default: ""
  ssh_private_key:
    description: SSH deploy key (mask only, not written to .env)
    required: false
    default: ""
  vault_password:
    description: Ansible Vault password (mask only, not written to .env)
    required: false
    default: ""
  rclone_conf_base64:
    description: rclone.conf base64 (mask only, not written to .env)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Mask secrets
      shell: bash
      env:
        TG_TOKEN: ${{ inputs.tg_token }}
        DB_PASS: ${{ inputs.db_pass }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
        CLOUDFLARE_FIREWALL_TOKEN: ${{ inputs.cloudflare_firewall_token }}
        HCLOUD_TOKEN: ${{ inputs.hcloud_token }}
        PROD_HETZ_HCLOUD_TOKEN: ${{ inputs.prod_hetz_hcloud_token }}
        GRAFANA_PASS: ${{ inputs.grafana_pass }}
        BETTERUPTIME_API_TOKEN: ${{ inputs.betteruptime_api_token }}
        BETTERUPTIME_BACKUP_KEY: ${{ inputs.betteruptime_backup_key }}
        BETTERUPTIME_GDRIVE_KEY: ${{ inputs.betteruptime_gdrive_key }}
        BETTERUPTIME_REPORT_DAILY_KEY: ${{ inputs.betteruptime_report_daily_key }}
        BETTERUPTIME_REPORT_WEEKLY_KEY: ${{ inputs.betteruptime_report_weekly_key }}
        BETTERUPTIME_VERIFY_KEY: ${{ inputs.betteruptime_verify_key }}
        BETTERUPTIME_CHECK_SERVICES_KEY: ${{ inputs.betteruptime_check_services_key }}
        DEV_GRAFANA_CLOUD_TOKEN: ${{ inputs.dev_grafana_cloud_token }}
        PROD_GRAFANA_CLOUD_TOKEN: ${{ inputs.prod_grafana_cloud_token }}
        DEV_AWS_ACCESS_KEY: ${{ inputs.dev_aws_access_key }}
        DEV_AWS_SECRET_KEY: ${{ inputs.dev_aws_secret_key }}
        PROD_ACCESS_KEY: ${{ inputs.prod_access_key }}
        PROD_SECRET_KEY: ${{ inputs.prod_secret_key }}
        UBUNTU_PRO_TOKEN: ${{ inputs.ubuntu_pro_token }}
        LOKI_USERNAME: ${{ inputs.loki_username }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
        VAULT_PASSWORD: ${{ inputs.vault_password }}
        RCLONE_CONF_BASE64: ${{ inputs.rclone_conf_base64 }}
      run: |
        for v in \
          "$TG_TOKEN" "$DB_PASS" "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_FIREWALL_TOKEN" "$HCLOUD_TOKEN" \
          "$PROD_HETZ_HCLOUD_TOKEN" "$GRAFANA_PASS" "$BETTERUPTIME_API_TOKEN" \
          "$BETTERUPTIME_BACKUP_KEY" "$BETTERUPTIME_GDRIVE_KEY" \
          "$BETTERUPTIME_REPORT_DAILY_KEY" "$BETTERUPTIME_REPORT_WEEKLY_KEY" \
          "$BETTERUPTIME_VERIFY_KEY" "$BETTERUPTIME_CHECK_SERVICES_KEY" \
          "$DEV_GRAFANA_CLOUD_TOKEN" "$PROD_GRAFANA_CLOUD_TOKEN" \
          "$DEV_AWS_ACCESS_KEY" "$DEV_AWS_SECRET_KEY" "$PROD_ACCESS_KEY" \
          "$PROD_SECRET_KEY" "$UBUNTU_PRO_TOKEN" "$LOKI_USERNAME" \
          "$SSH_PRIVATE_KEY" "$VAULT_PASSWORD" "$RCLONE_CONF_BASE64"; do
          [ -n "$v" ] && echo "::add-mask::$v" || true
        done
        # NOTE: only actual secrets are masked above. Non-secret vars (region, chat IDs,
        # URLs, SSH public keys, etc.) are NOT masked — masking them causes GitHub to
        # auto-mask any output containing those strings (e.g. IP addresses).

    - name: Write secrets/.env
      shell: bash
      env:
        TG_TOKEN: ${{ inputs.tg_token }}
        TG_CHAT_ID: ${{ inputs.tg_chat_id }}
        TG_THREAD_ID: ${{ inputs.tg_thread_id }}
        DB_PASS: ${{ inputs.db_pass }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
        CLOUDFLARE_FIREWALL_TOKEN: ${{ inputs.cloudflare_firewall_token }}
        HCLOUD_TOKEN: ${{ inputs.hcloud_token }}
        PROD_HETZ_HCLOUD_TOKEN: ${{ inputs.prod_hetz_hcloud_token }}
        GRAFANA_PASS: ${{ inputs.grafana_pass }}
        BETTERUPTIME_API_TOKEN: ${{ inputs.betteruptime_api_token }}
        BETTERUPTIME_BACKUP_KEY: ${{ inputs.betteruptime_backup_key }}
        BETTERUPTIME_GDRIVE_KEY: ${{ inputs.betteruptime_gdrive_key }}
        BETTERUPTIME_REPORT_DAILY_KEY: ${{ inputs.betteruptime_report_daily_key }}
        BETTERUPTIME_REPORT_WEEKLY_KEY: ${{ inputs.betteruptime_report_weekly_key }}
        BETTERUPTIME_VERIFY_KEY: ${{ inputs.betteruptime_verify_key }}
        BETTERUPTIME_CHECK_SERVICES_KEY: ${{ inputs.betteruptime_check_services_key }}
        DEV_GRAFANA_CLOUD_URL: ${{ inputs.dev_grafana_cloud_url }}
        DEV_GRAFANA_CLOUD_USERNAME: ${{ inputs.dev_grafana_cloud_username }}
        DEV_GRAFANA_CLOUD_TOKEN: ${{ inputs.dev_grafana_cloud_token }}
        PROD_GRAFANA_CLOUD_URL: ${{ inputs.prod_grafana_cloud_url }}
        PROD_GRAFANA_CLOUD_USERNAME: ${{ inputs.prod_grafana_cloud_username }}
        PROD_GRAFANA_CLOUD_TOKEN: ${{ inputs.prod_grafana_cloud_token }}
        LOKI_URL: ${{ inputs.loki_url }}
        LOKI_USERNAME: ${{ inputs.loki_username }}
        LOKI_URL_PROD: ${{ inputs.loki_url_prod }}
        LOKI_USERNAME_PROD: ${{ inputs.loki_username_prod }}
        ENVIRONMENT: ${{ inputs.environment }}
        FARO_COLLECTOR_URL: ${{ inputs.faro_collector_url }}
        DEV_AWS_ACCESS_KEY: ${{ inputs.dev_aws_access_key }}
        DEV_AWS_SECRET_KEY: ${{ inputs.dev_aws_secret_key }}
        DEV_AWS_REGION: ${{ inputs.dev_aws_region }}
        PROD_ACCESS_KEY: ${{ inputs.prod_access_key }}
        PROD_SECRET_KEY: ${{ inputs.prod_secret_key }}
        PROD_REGION: ${{ inputs.prod_region }}
        USER_SSH_PUBLIC_KEY: ${{ inputs.user_ssh_public_key }}
        VITALI_SSH_PUBLIC_KEY: ${{ inputs.vitali_ssh_public_key }}
        RCLONE_CRYPT_PASSWORD: ${{ inputs.rclone_crypt_password }}
        UBUNTU_PRO_TOKEN: ${{ inputs.ubuntu_pro_token }}
      run: |
        mkdir -p secrets
        # emit_env KEY VALUE — writes KEY='VALUE' (single-quoted) so values with
        # spaces/#/$VAR can't corrupt the .env contract (lib/env.sh parses quotes).
        # Embedded single quotes are OK for single-line values (parser strips the
        # outermost pair). Only used for tokens — never for shell interpolation.
        emit_env() { [ -n "$2" ] && printf "%s='%s'\n" "$1" "$2" || true; }
        {
          # Loki tenant is per-stack (dev=vitalikuts, prod=dreamseed): pick URL/ID
          # by target so promtail never ships prod logs into the dev tenant. Falls
          # back to the shared LOKI_* values when prod vars are not configured.
          case "$ENVIRONMENT" in
            prod*) emit_env LOKI_URL "${LOKI_URL_PROD:-$LOKI_URL}"
                   emit_env LOKI_USERNAME "${LOKI_USERNAME_PROD:-$LOKI_USERNAME}" ;;
            *)     emit_env LOKI_URL "$LOKI_URL"
                   emit_env LOKI_USERNAME "$LOKI_USERNAME" ;;
          esac
          emit_env TG_TOKEN "$TG_TOKEN"
          emit_env TG_CHAT_ID "$TG_CHAT_ID"
          emit_env TG_THREAD_ID "$TG_THREAD_ID"
          emit_env DB_PASS "$DB_PASS"
          emit_env CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          emit_env CLOUDFLARE_FIREWALL_TOKEN "$CLOUDFLARE_FIREWALL_TOKEN"
          emit_env HCLOUD_TOKEN "$HCLOUD_TOKEN"
          emit_env PROD_HETZ_HCLOUD_TOKEN "$PROD_HETZ_HCLOUD_TOKEN"
          emit_env GRAFANA_PASS "$GRAFANA_PASS"
          emit_env BETTERUPTIME_API_TOKEN "$BETTERUPTIME_API_TOKEN"
          emit_env BETTERUPTIME_BACKUP_KEY "$BETTERUPTIME_BACKUP_KEY"
          emit_env BETTERUPTIME_GDRIVE_KEY "$BETTERUPTIME_GDRIVE_KEY"
          emit_env BETTERUPTIME_REPORT_DAILY_KEY "$BETTERUPTIME_REPORT_DAILY_KEY"
          emit_env BETTERUPTIME_REPORT_WEEKLY_KEY "$BETTERUPTIME_REPORT_WEEKLY_KEY"
          emit_env BETTERUPTIME_VERIFY_KEY "$BETTERUPTIME_VERIFY_KEY"
          emit_env BETTERUPTIME_CHECK_SERVICES_KEY "$BETTERUPTIME_CHECK_SERVICES_KEY"
          echo "SSH_PRIVATE_KEY_PATH=${HOME}/.ssh/deploy_key"
          echo "SSH_PUBLIC_KEY_PATH=${HOME}/.ssh/deploy_key.pub"
          if [ -n "$USER_SSH_PUBLIC_KEY" ] || [ -n "$VITALI_SSH_PUBLIC_KEY" ]; then
            printf 'ADDITIONAL_SSH_KEYS="%s\n%s"\n' "${USER_SSH_PUBLIC_KEY:-}" "${VITALI_SSH_PUBLIC_KEY:-}"
          fi
          emit_env DEV_GRAFANA_CLOUD_URL "$DEV_GRAFANA_CLOUD_URL"
          emit_env DEV_GRAFANA_CLOUD_USERNAME "$DEV_GRAFANA_CLOUD_USERNAME"
          emit_env DEV_GRAFANA_CLOUD_TOKEN "$DEV_GRAFANA_CLOUD_TOKEN"
          emit_env PROD_GRAFANA_CLOUD_URL "$PROD_GRAFANA_CLOUD_URL"
          emit_env PROD_GRAFANA_CLOUD_USERNAME "$PROD_GRAFANA_CLOUD_USERNAME"
          emit_env PROD_GRAFANA_CLOUD_TOKEN "$PROD_GRAFANA_CLOUD_TOKEN"
          # LOKI_URL / LOKI_USERNAME are emitted earlier, selected by environment.
          emit_env FARO_COLLECTOR_URL "$FARO_COLLECTOR_URL"
          emit_env DEV_AWS_ACCESS_KEY "$DEV_AWS_ACCESS_KEY"
          emit_env DEV_AWS_SECRET_KEY "$DEV_AWS_SECRET_KEY"
          emit_env DEV_AWS_REGION "$DEV_AWS_REGION"
          emit_env PROD_ACCESS_KEY "$PROD_ACCESS_KEY"
          emit_env PROD_SECRET_KEY "$PROD_SECRET_KEY"
          emit_env PROD_REGION "$PROD_REGION"
          emit_env RCLONE_CRYPT_PASSWORD "$RCLONE_CRYPT_PASSWORD"
          emit_env UBUNTU_PRO_TOKEN "$UBUNTU_PRO_TOKEN"
        } > secrets/.env
        chmod 600 secrets/.env
