name: Backup Restoration Test

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

concurrency:
  group: backup-test
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-restore:
    name: Test backup restoration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Reconstruct secrets
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_BASE64 }}
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p secrets
          echo "$ENV_FILE_B64" | base64 -d > secrets/.env
          chmod 600 secrets/.env

          echo -n "$VAULT_PASS" > ~/.vault_pass_dreamseed
          chmod 600 ~/.vault_pass_dreamseed

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/Vitali.pem
          chmod 600 ~/.ssh/Vitali.pem

          if [ -n "$RCLONE_CONF_B64" ]; then
            echo "$RCLONE_CONF_B64" | base64 -d > secrets/rclone.conf
            chmod 600 secrets/rclone.conf
          fi

      - name: Install Ansible
        run: |
          pip install -r ansible/requirements-deploy.txt --quiet
          ansible-galaxy collection install community.mysql ansible.posix

      - name: Prepare SSH public key
        run: ssh-keygen -y -f ~/.ssh/Vitali.pem > ~/.ssh/Vitali.pub

      - name: Terraform Init
        working-directory: terraform/aws
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init

      - name: Terraform Workspace
        working-directory: terraform/aws
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          terraform workspace new dreamseed-test 2>/dev/null || true
          terraform workspace select dreamseed-test

      - name: Terraform Apply
        id: terraform
        working-directory: terraform/aws
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_environment: test
          TF_VAR_ssh_public_key_path: /home/runner/.ssh/Vitali.pub
        run: |
          terraform apply -auto-approve -no-color \
            -var="environment=test"
          echo "server_ipv4=$(terraform output -raw server_ipv4)" >> $GITHUB_OUTPUT

      - name: Wait for SSH
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "Waiting for SSH on $SERVER_IP..."
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP "exit 0" 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Attempt $i/40 - waiting..."
            sleep 10
          done

      - name: Wait for cloud-init
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "sudo cloud-init status --wait" || true
          sleep 15

      - name: Generate inventory
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          cat > ansible/inventory/hosts-test.yml <<EOF
          all:
            hosts:
              testserver:
                ansible_host: ${SERVER_IP}
            vars:
              web_server: nginx
              domain: test.dreamseed.online
              server_ip: ${SERVER_IP}
              db_name: modx_db
              admin_email: admin@dreamseed.online
              secrets_dir: /home/ubuntu/dreamseed/secrets
              configs_dir: /home/ubuntu/dreamseed/configs
              scripts_dir: /home/ubuntu/Scripts
          EOF

      - name: Generate extra vars file
        run: |
          set -a
          source <(ansible-vault view secrets/.env --vault-password-file ~/.vault_pass_dreamseed)
          set +a
          cat > /tmp/test_vault.yml <<EOF
          db_pass: "${DB_PASS}"
          grafana_admin_password: "${GRAFANA_PASS}"
          server_ip: "${{ steps.terraform.outputs.server_ipv4 }}"
          web_server: nginx
          domain: test.dreamseed.online
          secrets_dir: /home/ubuntu/dreamseed/secrets
          configs_dir: /home/ubuntu/dreamseed/configs
          scripts_dir: /home/ubuntu/Scripts
          cloudflare_api_token: "${CLOUDFLARE_API_TOKEN}"
          EOF
          chmod 600 /tmp/test_vault.yml

      - name: Deploy Base packages
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-01-base.yml -e @/tmp/test_vault.yml

      - name: Deploy Nginx
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-02-nginx.yml -e @/tmp/test_vault.yml

      - name: Deploy Database
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-03-db.yml -e @/tmp/test_vault.yml

      - name: Deploy Monitoring
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-04-monitor.yml -e @/tmp/test_vault.yml

      - name: Deploy Backup role
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-04.5-backup.yml -e @/tmp/test_vault.yml

      - name: Deploy Grafana
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-05-grafana.yml -e @/tmp/test_vault.yml

      - name: Deploy Security
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-06-security.yml -e @/tmp/test_vault.yml

      - name: Wait for services
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          sleep 30
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "systemctl is-active nginx php8.3-fpm mariadb"

      - name: Download backups from GDrive
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem \
            secrets/rclone.conf ubuntu@$SERVER_IP:/home/ubuntu/.config/rclone/rclone.conf
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "mkdir -p /home/ubuntu/backups/{project,db} && \
             rclone copy gdrive:DreamSeed/backups/db /home/ubuntu/backups/db \
               --max-age 7d --include '*.sql.gz' && \
             rclone copy gdrive:DreamSeed/backups/project /home/ubuntu/backups/project \
               --max-age 7d --include '*.tar.gz'"

      - name: Run restore script
        id: restore
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest"

      - name: Run database tests
        id: db_tests
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "systemctl is-active mariadb" && echo "[PASS] MariaDB running" || echo "[FAIL] MariaDB not running"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "mysql modx_db -N -e 'SELECT 1'" && echo "[PASS] DB connect" || echo "[FAIL] DB connect"
          TABLE_COUNT=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM modx_site_content'")
          echo "MODX content rows: $TABLE_COUNT"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "mysqlcheck --all-databases" && echo "[PASS] DB integrity" || echo "[WARN] DB check issues"

      - name: Run web server tests
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "systemctl is-active nginx" && echo "[PASS] Nginx running" || echo "[FAIL] Nginx not running"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "systemctl is-active php8.3-fpm" && echo "[PASS] PHP-FPM running" || echo "[FAIL] PHP-FPM not running"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$SERVER_IP/ -L --max-redirs 3)
          echo "HTTP code: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] && echo "[PASS] HTTP 200" || echo "[WARN] HTTP not 200"

      - name: Run MODX tests
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "test -f /var/www/html/core/config/config.inc.php" && echo "[PASS] Config exists" || echo "[FAIL] Config missing"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "test -d /var/www/html/assets" && echo "[PASS] Assets exists" || echo "[FAIL] Assets missing"

      - name: Run Grafana tests
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "systemctl is-active grafana-server" && echo "[PASS] Grafana running" || echo "[FAIL] Grafana not running"
          GRAFANA_CODE=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health")
          echo "Grafana HTTP: $GRAFANA_CODE"
          [ "$GRAFANA_CODE" = "200" ] && echo "[PASS] Grafana healthy" || echo "[WARN] Grafana not healthy"

      - name: Run system tests
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          DISK_USAGE=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "df -h / | awk 'NR==2 {print \$5}' | sed 's/%//'")
          echo "Disk usage: $DISK_USAGE%"
          [ "$DISK_USAGE" -lt 90 ] && echo "[PASS] Disk space OK" || echo "[WARN] Disk space low"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP \
            "systemctl is-active victoria-metrics" && echo "[PASS] VictoriaMetrics running" || echo "[WARN] VictoriaMetrics not running"

      - name: Cleanup test files
        run: rm -f /tmp/test_vault.yml ansible/inventory/hosts-test.yml

      - name: Terraform Destroy
        if: always()
        working-directory: terraform/aws
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform destroy -auto-approve -no-color

      - name: Send Telegram report
        if: always()
        run: |
          set -a
          source <(ansible-vault view secrets/.env --vault-password-file ~/.vault_pass_dreamseed)
          set +a

          STATUS="${{ steps.db_tests.outcome == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          MSG="$STATUS — Backup Restoration Test $(date '+%Y-%m-%d %H:%M')

          Server: ${{ steps.terraform.outputs.server_ipv4 }}
          Restore: ${{ steps.restore.outcome }}
          DB tests: ${{ steps.db_tests.outcome }}"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=$MSG" > /dev/null || true
