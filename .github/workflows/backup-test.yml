name: BackupRestorationTest

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: Target cloud provider
        type: choice
        options:
          - hetzner
          - aws
        default: hetzner

concurrency:
  group: backup-test
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.environment || 'hetzner' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

jobs:
  test-restore:
    name: Test backup restoration (${{ inputs.environment || 'hetzner' }})
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-terraform

      - name: Record start time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
        id: start_time

      - name: Validate target
        run: |
          if [ "$TARGET" = "aws" ]; then
            echo "::error::AWS target not implemented yet — use 'hetzner'"
            exit 1
          fi
          echo "Target: $TARGET"

      - name: Setup secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          DB_PASS: ${{ secrets.DB_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GRAFANA_PASS: ${{ secrets.GRAFANA_PASS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_BASE64 }}
          DEV_GRAFANA_CLOUD_PUSH_URL: ${{ secrets.DEV_GRAFANA_CLOUD_PUSH_URL }}
          DEV_GRAFANA_CLOUD_USERNAME: ${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}
          DEV_GRAFANA_CLOUD_TOKEN: ${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}
          PROD_GRAFANA_CLOUD_PUSH_URL: ${{ secrets.PROD_GRAFANA_CLOUD_PUSH_URL }}
          PROD_GRAFANA_CLOUD_USERNAME: ${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}
          PROD_GRAFANA_CLOUD_TOKEN: ${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}
        run: |
          mkdir -p secrets ~/.ssh

          {
            echo "TG_TOKEN=$TG_TOKEN"
            echo "TG_CHAT_ID=$TG_CHAT_ID"
            echo "TG_THREAD_ID=$TG_THREAD_ID"
            echo "DB_PASS=$DB_PASS"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_ZONE_ID=$CF_ZONE_ID"
            echo "HCLOUD_TOKEN=$HCLOUD_TOKEN"
            echo "GRAFANA_PASS=$GRAFANA_PASS"
            echo "SSH_PRIVATE_KEY_PATH=${HOME}/.ssh/deploy_key"
            echo "SSH_PUBLIC_KEY_PATH=${HOME}/.ssh/deploy_key.pub"
            echo "HETZNER_SSH_KEY_NAME=Vitali"
            echo "HETZNER_PRIMARY_IP_NAME=primary_ip-1"
            echo "DEV_GRAFANA_CLOUD_URL=$DEV_GRAFANA_CLOUD_PUSH_URL"
            echo "DEV_GRAFANA_CLOUD_USERNAME=$DEV_GRAFANA_CLOUD_USERNAME"
            echo "DEV_GRAFANA_CLOUD_TOKEN=$DEV_GRAFANA_CLOUD_TOKEN"
            echo "PROD_GRAFANA_CLOUD_URL=$PROD_GRAFANA_CLOUD_PUSH_URL"
            echo "PROD_GRAFANA_CLOUD_USERNAME=$PROD_GRAFANA_CLOUD_USERNAME"
            echo "PROD_GRAFANA_CLOUD_TOKEN=$PROD_GRAFANA_CLOUD_TOKEN"
          } > secrets/.env
          chmod 600 secrets/.env

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub

          echo -n "$VAULT_PASSWORD" > ~/.vault_pass_dreamseed
          chmod 600 ~/.vault_pass_dreamseed

          [[ -n "$RCLONE_CONF_B64" ]] && echo "$RCLONE_CONF_B64" | base64 -d > secrets/rclone.conf && chmod 600 secrets/rclone.conf

          echo "StrictHostKeyChecking accept-new" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config

      - name: Load secrets and export TF vars
        run: |
          source secrets/.env
          echo "::add-mask::$HCLOUD_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$TG_TOKEN"
          echo "TF_VAR_hcloud_token=$HCLOUD_TOKEN" >> "$GITHUB_ENV"
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/deploy_key.pub)" >> "$GITHUB_ENV"
          echo "TF_VAR_primary_ip_name=" >> "$GITHUB_ENV"
          echo "TF_VAR_ssh_key_name=Vitali" >> "$GITHUB_ENV"

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible

      - name: Terraform Init
        working-directory: terraform/hetzner
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: test
        run: |
          terraform init -input=false -no-color

      - name: Terraform Apply
        id: terraform
        working-directory: terraform/hetzner
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: test
          TF_VAR_environment: test
        run: |
          terraform apply -auto-approve -no-color \
            -var="environment=test" \
            -replace="hcloud_server.main"
          echo "server_ipv4=$(terraform output -raw server_ipv4)" >> $GITHUB_OUTPUT

      - name: Capture server SSH host key
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          for i in $(seq 1 15); do
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done

      - name: Provision & wait
        run: |
          set -a
          source secrets/.env
          set +a
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"

          RECORD_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=A&name=test.dreamseed.online" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          if [ -n "$RECORD_ID" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"test.dreamseed.online\",\"content\":\"$SERVER_IP\",\"proxied\":false}" > /dev/null
          else
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"A\",\"name\":\"test.dreamseed.online\",\"content\":\"$SERVER_IP\",\"proxied\":false}" > /dev/null
          fi
          echo "DNS: test.dreamseed.online -> $SERVER_IP"

          sleep 15

          echo "Waiting for SSH on $SERVER_IP..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -o BatchMode=yes ubuntu@"$SERVER_IP" "exit 0" 2>/dev/null; then
              echo "SSH is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            [ "$i" -eq 30 ] && {
              echo "SSH never became available. Verbose output:"
              ssh -v -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o BatchMode=yes ubuntu@"$SERVER_IP" "exit 0" 2>&1 || true
              exit 1
            }
            sleep 3
          done

          echo "Waiting for cloud-init to finish..."
          ssh ubuntu@$SERVER_IP \
            "timeout 300 cloud-init status --wait" 2>/dev/null || echo "cloud-init wait timed out, continuing..."
          echo "Waiting for apt lock to release..."
          ssh ubuntu@$SERVER_IP \
            "while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done" 2>/dev/null || true
          sleep 5

      - name: Generate config
        run: |
          set -a
          source secrets/.env
          set +a
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"

          cat > ansible/inventory/hosts-test.yml <<EOF
          all:
            hosts:
              dreamseed:
                ansible_host: ${SERVER_IP}
                ansible_user: ubuntu
                ansible_ssh_private_key_file: ~/.ssh/deploy_key
                ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
            vars:
              web_server: nginx
              domain: test.dreamseed.online
              server_ip: ${SERVER_IP}
              db_name: modx_db
              admin_email: admin@dreamseed.online
          EOF

          cat > /tmp/test_vault.yml <<EOF
          db_pass: "${DB_PASS}"
          server_ip: "${{ steps.terraform.outputs.server_ipv4 }}"
          web_server: nginx
          domain: test.dreamseed.online
          domain_www: false
          environment: test
          php_version: "8.3"
          cloudflare_api_token: "${CLOUDFLARE_API_TOKEN}"
          cloudflare_enabled: false
          grafana_admin_password: "${GRAFANA_PASS}"
          scripts_dir: "${PWD}/scripts"
          secrets_dir: "${PWD}/secrets"
          configs_dir: "${PWD}/configs"
          ssh_public_key_path: "${HOME}/.ssh/deploy_key.pub"
          EOF
          chmod 600 /tmp/test_vault.yml

      - name: Deploy Base packages
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-01-base.yml -e @/tmp/test_vault.yml

      - name: Deploy Nginx + PHP + SSL
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-02-web.yml -e @/tmp/test_vault.yml

      - name: Deploy Database & Restore
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-03-db.yml -e @/tmp/test_vault.yml

      - name: Deploy Monitoring
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-04-monitor.yml -e @/tmp/test_vault.yml

      - name: Deploy Backup
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-05-backup.yml -e @/tmp/test_vault.yml
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Deploy Grafana
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-06-grafana.yml -e @/tmp/test_vault.yml

      - name: Deploy Security
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-07-security.yml -e @/tmp/test_vault.yml

      - name: Wait for stack to settle
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          # Wait for VictoriaMetrics to accept writes
          for i in $(seq 1 30); do
            vm_ok=$(ssh ubuntu@"$SERVER_IP" "curl -sf http://127.0.0.1:8428/health 2>/dev/null || echo 'not_ready'" 2>/dev/null || echo "not_ready")
            [ "$vm_ok" = "OK" ] && echo "VictoriaMetrics ready" && break
            [ "$i" -eq 30 ] && echo "Warning: VictoriaMetrics not ready"
            sleep 2
          done
          # Wait for services to fully start
          sleep 10

      - name: Record initial content count
        id: initial_content
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ROWS=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM modx_site_content' 2>/dev/null || echo 0")
          echo "content_rows_before=$ROWS" >> "$GITHUB_OUTPUT"
          echo "Initial content rows: $ROWS"

      - name: Create backup via smart_backup.sh
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "Running smart_backup.sh manually..."
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/smart_backup.sh" 2>&1
          echo "Backup exit code: $?"

      - name: Verify backup files exist
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Local backups ==="
          ssh ubuntu@"$SERVER_IP" "ls -lh /home/ubuntu/backups/project/ 2>/dev/null || echo 'No project backups'"
          ssh ubuntu@"$SERVER_IP" "ls -lh /home/ubuntu/backups/db/ 2>/dev/null || echo 'No DB backups'"
          PROJ_COUNT=$(ssh ubuntu@"$SERVER_IP" "ls -1 /home/ubuntu/backups/project/DreamSeed_*.tar.gz 2>/dev/null | wc -l" || echo 0)
          DB_COUNT=$(ssh ubuntu@"$SERVER_IP" "ls -1 /home/ubuntu/backups/db/db_*.sql.gz 2>/dev/null | wc -l" || echo 0)
          echo "Project backups: $PROJ_COUNT"
          echo "DB backups: $DB_COUNT"
          if [ "$PROJ_COUNT" -lt 1 ] || [ "$DB_COUNT" -lt 1 ]; then
            echo "::error::Backup creation failed — no backup files found"
            exit 1
          fi
          echo "project_count=$PROJ_COUNT" >> "$GITHUB_OUTPUT"
          echo "db_count=$DB_COUNT" >> "$GITHUB_OUTPUT"
        id: verify_backup

      - name: Destroy data — simulate disaster
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Destroying data to simulate disaster ==="
          # Drop all tables (SET FOREIGN_KEY_CHECKS=0 needed for InnoDB FK constraints)
          ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SET FOREIGN_KEY_CHECKS=0; SELECT CONCAT(\"DROP TABLE IF EXISTS \", table_name, \";\") FROM information_schema.tables WHERE table_schema=\"modx_db\"' | mysql modx_db" 2>&1
          SSH_EXIT=$?
          echo "DROP TABLES exit code: $SSH_EXIT"
          # Remove project files
          ssh ubuntu@"$SERVER_IP" "sudo rm -rf /var/www/html/* /var/www/html/.* 2>/dev/null; sudo rmdir /var/www/html 2>/dev/null; echo 'Project files destroyed'"
          # Verify destruction
          TBL_COUNT=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=\"modx_db\"' 2>/dev/null || echo 0")
          echo "Tables after destruction: $TBL_COUNT (expect 0)"
          FILE_COUNT=$(ssh ubuntu@"$SERVER_IP" "ls -1 /var/www/html/ 2>/dev/null | wc -l" || echo 0)
          echo "Files in web_root after destruction: $FILE_COUNT (expect 0)"

      - name: Restore from backup via RESTORE_ALL.sh
        id: restore
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Running RESTORE_ALL.sh --auto-latest ==="
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest" 2>&1
          RC=$?
          echo "RESTORE_ALL exit code: $RC"
          echo "restore_exit_code=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -ne 0 ] && echo "::error::RESTORE_ALL.sh failed"

      - name: Verify restored content
        id: verify_content
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Verifying restored content ==="

          # Site HTTP
          HTTP_CODE=$(ssh ubuntu@"$SERVER_IP" \
            "curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://localhost/" 2>/dev/null || echo "000")
          echo "site_http=$HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "[PASS] Site HTTP $HTTP_CODE"
          else
            echo "[FAIL] Site returned HTTP $HTTP_CODE"
          fi

          # MODX index.php
          if ssh ubuntu@"$SERVER_IP" "test -f /var/www/html/index.php" 2>/dev/null; then
            echo "[PASS] index.php exists"
          else
            echo "[FAIL] index.php missing"
          fi

          # MODX config
          if ssh ubuntu@"$SERVER_IP" "test -f /var/www/html/core/config/config.inc.php" 2>/dev/null; then
            echo "[PASS] config exists"
          else
            echo "[FAIL] config missing"
          fi

          # DB content rows
          ROWS=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM modx_site_content' 2>/dev/null || echo 0")
          echo "content_rows=$ROWS"
          ROWS_BEFORE="${{ steps.initial_content.outputs.content_rows_before }}"
          echo "Before: $ROWS_BEFORE, After: $ROWS"
          if [ "${ROWS:-0}" -gt 0 ]; then
            echo "[PASS] DB content restored ($ROWS rows)"
          else
            echo "[FAIL] DB content empty"
          fi

          # DB table count
          TBL_COUNT=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=\"modx_db\"'" 2>/dev/null || echo 0)
          echo "table_count=$TBL_COUNT"
          if [ "${TBL_COUNT:-0}" -ge 50 ]; then
            echo "[PASS] DB tables: $TBL_COUNT"
          else
            echo "[FAIL] DB tables: ${TBL_COUNT:-0} (expected 50+)"
          fi

          echo "restore_content_rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "restore_table_count=$TBL_COUNT" >> "$GITHUB_OUTPUT"
          echo "restore_http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

      - name: Run full service tests
        id: service_tests
        run: |
          set -o pipefail
          DB_NAME=modx_db ./.github/scripts/test-restored-server.sh "${{ steps.terraform.outputs.server_ipv4 }}" \
            | tee /dev/stderr | grep -E '^(content_rows|test_summary|test_fails)=' >> "$GITHUB_OUTPUT"

      - name: DAST scan (nuclei)
        id: dast
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "$SERVER_IP test.dreamseed.online" | sudo tee -a /etc/hosts > /dev/null

          NUCLEI_VER=$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name','v3.3.9')[1:])" 2>/dev/null || echo "3.3.9")
          NUCLEI_VER="${NUCLEI_VER:-3.3.9}"
          echo "Using nuclei v$NUCLEI_VER"
          wget -q "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VER}/nuclei_${NUCLEI_VER}_linux_amd64.zip"
          unzip -q nuclei_*.zip nuclei && chmod +x ./nuclei
          ./nuclei -update-templates -silent

          ./nuclei \
            -u "https://test.dreamseed.online/" \
            -tags "misconfig,exposure,headers,tech" \
            -severity "low,medium,high,critical" \
            -silent -json-export /tmp/nuclei.json || true

          COUNT=$(wc -l < /tmp/nuclei.json 2>/dev/null || echo 0)
          echo "dast_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "DAST findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            python3 << 'PYEOF'
          import json, sys
          for line in open('/tmp/nuclei.json'):
              f = json.loads(line)
              print(f"  [{f['info']['severity'].upper()}] {f['template-id']}: {f['matched-at']}")
          PYEOF
          fi

      - name: Run disk check
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          DISK_USAGE=$(ssh ubuntu@$SERVER_IP \
            "df -h / | awk 'NR==2 {print \$5}' | sed 's/%//'" || echo "?")
          echo "Disk usage: $DISK_USAGE%"
          echo "--- Top disk consumers ---"
          ssh ubuntu@$SERVER_IP \
            "sudo du -sh /* 2>/dev/null | sort -rh | head -10" || true
          [ "${DISK_USAGE:-100}" -lt 90 ] && echo "[PASS] Disk space OK" || echo "[WARN] Disk space low"

      - name: Security audit (lynis)
        id: lynis
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "Installing lynis..."
          ssh ubuntu@$SERVER_IP \
            "sudo apt-get update -qq 2>/dev/null && sudo apt-get install -y lynis -qq" || echo "[WARN] lynis install failed"
          echo "Running lynis audit..."
          SCORE=$(ssh ubuntu@$SERVER_IP \
            "sudo lynis audit system --quick --no-colors 2>&1 | \
             awk -F': ' '/Hardening index[[:space:]]*:/ {print \$NF}' | head -1" || true)
          SCORE="${SCORE:-?}"
          echo "lynis_score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "Hardening index: $SCORE"

      - name: Check Lynis score threshold
        run: |
          SCORE="${{ steps.lynis.outputs.lynis_score }}"
          if [ "${SCORE:-0}" -lt 65 ]; then
            echo "::error::Lynis hardening score dropped to $SCORE (threshold: 65)"
            exit 1
          fi
          echo "✅ Lynis score: $SCORE (threshold: 65)"

      - name: Download Lynis report from server
        if: always()
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          scp -o StrictHostKeyChecking=accept-new \
            "ubuntu@$SERVER_IP:/var/log/lynis-report.dat" /tmp/lynis-report.dat 2>/dev/null || \
            echo "[WARN] lynis report not available on remote server"

      - name: Archive Lynis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lynis-report
          path: /tmp/lynis-report.dat

      - name: Cleanup
        if: always()
        run: |
          set -a
          source secrets/.env
          set +a
          rm -f /tmp/test_vault.yml ansible/inventory/hosts-test.yml
          RECORD_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=A&name=test.dreamseed.online" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          [ -n "$RECORD_ID" ] && curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /dev/null && echo "DNS record deleted" || echo "No DNS record to delete"

      - name: Server info on failure
        if: failure()
        run: |
          echo "============================================"
          echo "❌ Tests failed — server kept for debugging"
          echo "Server IP: ${{ steps.terraform.outputs.server_ipv4 }}"
          echo "SSH: ssh -i ~/.ssh/deploy_key ubuntu@${{ steps.terraform.outputs.server_ipv4 }}"
          echo "Domain: https://test.dreamseed.online/"
          echo "Destroy manually when done: gh workflow run deploy.yml -f environment=dev-hetz -f action=destroy -f confirm='destroy dev'"
          echo ""
          echo "=== FAIL diagnostics ==="
          echo "1. Backup not created → check smart_backup.sh logs:"
          echo "   ssh ubuntu@${{ steps.terraform.outputs.server_ipv4 }} 'cat /home/ubuntu/backups/logs/backup_*.log | tail -30'"
          echo "2. RESTORE_ALL failed → SSH and run manually:"
          echo "   ssh ubuntu@${{ steps.terraform.outputs.server_ipv4 }} 'bash -x /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest 2>&1 | tail -50'"
          echo "3. Service test failed → check which:"
          echo "   grep FAIL /tmp/restore_test_output.txt 2>/dev/null || true"
          echo "4. VM logs: ssh ubuntu@${{ steps.terraform.outputs.server_ipv4 }} 'sudo journalctl -u victoria-metrics --no-pager -n 30'"
          echo "============================================"

      - name: Terraform Destroy
        id: destroy
        if: always() && steps.terraform.outputs.server_ipv4 != ''
        working-directory: terraform/hetzner
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: test
          TF_VAR_environment: test
        run: |
          terraform destroy -auto-approve -no-color 2>&1 | tee /tmp/tf_destroy.log || true
          sync
          if grep -q "Destroy complete" /tmp/tf_destroy.log; then
            echo "Destroy OK"
          else
            echo "Destroy exit (ignored — TFC exit code 1 bug)"
          fi

      - name: Send Telegram report
        if: always()
        run: |
          set -a
          source secrets/.env
          set +a

          ok() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          ok_destroy() { [ "$1" = "success" ] && echo "✅" || { [ "$1" = "skipped" ] && echo "⏭️"; }; }
          ok_dast() { [ -z "$1" ] && echo "❓" || { [ "$1" -eq 0 ] && echo "✅" || echo "❌"; }; }

          RESTORE_EXIT="${{ steps.restore.outputs.restore_exit_code }}"
          RESTORE_OK="❌"; [ "$RESTORE_EXIT" = "0" ] && RESTORE_OK="✅"

          TESTS="${{ steps.service_tests.outcome }}"
          DESTROY="${{ steps.destroy.outcome }}"
          ROWS="${{ steps.verify_content.outputs.restore_content_rows }}"
          TABLES="${{ steps.verify_content.outputs.restore_table_count }}"
          HTTP_CODE="${{ steps.verify_content.outputs.restore_http_code }}"
          SUMMARY="${{ steps.service_tests.outputs.test_summary }}"
          FAILS="${{ steps.service_tests.outputs.test_fails }}"
          DAST_COUNT="${{ steps.dast.outputs.dast_count }}"
          LYNIS_SCORE="${{ steps.lynis.outputs.lynis_score }}"
          BACKUP_FILES="${{ steps.verify_backup.outputs.project_count }}+${{ steps.verify_backup.outputs.db_count }}"

          [ "${{ job.status }}" = "success" ] && STATUS="✅" || STATUS="❌"
          ELAPSED=$(( $(date +%s) - ${{ steps.start_time.outputs.start_epoch }} ))
          MINS=$(( ELAPSED / 60 ))
          SECS=$(( ELAPSED % 60 ))
          FAIL_DETAIL=""
          [ -n "$FAILS" ] && [ "$FAILS" != "none" ] && FAIL_DETAIL=" ⚠️ $FAILS"
          HARDENING_OK="❌"; [ -n "$LYNIS_SCORE" ] && [ "$LYNIS_SCORE" -ge 65 ] 2>/dev/null && HARDENING_OK="✅"

          MSG=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "📦 *Backup Restoration Test* $STATUS" \
            "📅 $(date '+%Y-%m-%d %H:%M')  ⏱ ${MINS}m ${SECS}s" \
            "🖥 ${{ steps.terraform.outputs.server_ipv4 }}" \
            "" \
            "Backup     ✅ ${BACKUP_FILES} files" \
            "Restore    ${RESTORE_OK} (${ROWS:-0} rows, ${TABLES:-0} tables, HTTP ${HTTP_CODE:-?})" \
            "Tests      $(ok $TESTS) ${SUMMARY:-?}${FAIL_DETAIL}" \
            "DAST       $(ok_dast $DAST_COUNT) ${DAST_COUNT:-0} issues" \
            "Hardening  $HARDENING_OK ${LYNIS_SCORE:-?}/100" \
            "Destroy    $(ok_destroy $DESTROY)")

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "text=$MSG" > /dev/null || true
