name: "⚡ CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  TFLINT_VERSION: "v0.64.0"
  GITLEAKS_VERSION: "8.30.1"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "ShellCheck started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Install ShellCheck
        run: pip install shellcheck-py
      - name: Run ShellCheck
        run: find . -path ./.git -prune -o -name '*.sh' -print -exec shellcheck --severity=error {} +

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Ansible Lint started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: ./.github/actions/setup-ansible
      - name: Run ansible-lint
        run: bash scripts/lint.sh --ci --ansible-lint

  terraform-checks:
    name: Terraform Lint + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Terraform checks started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: ./.github/actions/setup-terraform
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: true
      - name: Check terraform formatting
        run: terraform fmt -check -recursive terraform/
      - name: Run tflint
        run: bash scripts/lint.sh --ci --tflint
      - name: Validate all providers
        run: bash scripts/lint.sh --ci --validate-terraform

  checkov:
    name: IaC Compliance (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Checkov started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12.3117.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_260,CKV2_AWS_41

  trivy:
    name: Terraform Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Trivy started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf', 'terraform/**/*.hcl', 'terraform/**/*.tftpl') }}
          restore-keys: trivy-${{ runner.os }}-
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: HIGH,CRITICAL

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🚀 Start
        run: echo "Gitleaks started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: ./.github/actions/setup-gitleaks
        with:
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}
      - name: Secret Scan (full history)
        run: bash scripts/lint.sh --ci --gitleaks-full-history

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint (prebuilt binary)
        run: |
          cd /tmp
          curl -sSLo "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "checksums.txt" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          sudo tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin actionlint
      - name: Install shellcheck (inline run scripts)
        run: pip install shellcheck-py
      - name: Run actionlint
        run: actionlint -shellcheck="$(command -v shellcheck)"

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Run yamllint
        run: yamllint --strict .

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🚀 Start
        run: echo "Pre-commit started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: precommit-${{ runner.os }}-
      - uses: ./.github/actions/setup-gitleaks
        with:
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}
      - name: Cache pre-commit system deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bin
          key: sysdeps-${{ runner.os }}-terraform-${{ env.TERRAFORM_VERSION }}-tflint-${{ env.TFLINT_VERSION }}
          restore-keys: |
            sysdeps-${{ runner.os }}-
      - name: Install pre-commit system deps
        run: |
          mkdir -p ~/.cache/bin

          # Terraform (pinned via TERRAFORM_VERSION env var)
          if [ -f ~/.cache/bin/terraform ]; then
            sudo cp ~/.cache/bin/terraform /usr/local/bin/terraform
          else
            curl -sLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${{ env.TERRAFORM_VERSION }}/terraform_${{ env.TERRAFORM_VERSION }}_linux_amd64.zip"
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin > /dev/null 2>&1
            sudo cp /usr/local/bin/terraform ~/.cache/bin/terraform
          fi

          # tflint (pinned via TFLINT_VERSION env var)
          if [ -f ~/.cache/bin/tflint ]; then
            sudo cp ~/.cache/bin/tflint /usr/local/bin/tflint
          else
            curl -sLo /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip"
            sudo unzip -o /tmp/tflint.zip -d /usr/local/bin > /dev/null 2>&1
            tflint --init --config .tflint.hcl 2>/dev/null || true
            sudo cp /usr/local/bin/tflint ~/.cache/bin/tflint
          fi
      - name: Run pre-commit hooks (changed files only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          pip install pre-commit
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            REF="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            REF="$BEFORE"
          else
            REF="HEAD~1"
          fi
          if git rev-parse "$REF" &>/dev/null; then
            pre-commit run --from-ref "$REF" --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi
      - name: Check renovate.json changes
        id: renovate-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            REF="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            REF="$BEFORE"
          else
            REF="HEAD~1"
          fi
          if git diff --name-only "$REF"...HEAD -- renovate.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Renovate config
        if: steps.renovate-check.outputs.changed == 'true'
        env:
          NPM_CONFIG_LOGLEVEL: error
        run: npx --yes --package renovate@44 -- renovate-config-validator

  deploy-check:
    name: Deploy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Push-only: loads real secrets and executes PR-modified code — never run on PRs.
    if: github.event_name != 'pull_request'
    # Smoke-test the REAL deploy.sh orchestration path (CLI parsing, target
    # resolution, .env parsing, preflight, playbook presence + syntax) — the
    # 8 lint/scan checks above never exercise deploy.sh itself. Runs with
    # `-i 0.0.0.0` to skip Terraform (already validated offline by the
    # Terraform job) so no TF_API_TOKEN is exposed. GIT_REF matches the
    # triggering branch, so guard_source_ref never trips.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Deploy Check started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: ./.github/actions/setup-terraform
      - uses: ./.github/actions/setup-ansible
      - uses: ./.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}
      - uses: ./.github/actions/setup-env
        with:
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
      - name: Target config
        run: |
          cat >> secrets/.env << 'EOF'
          DEV_HETZ_SSH_KEY_NAME=Vitali.pub
          DEV_HETZ_PRIMARY_IP_NAME=primary_ip-1
          DEV_HETZ_SERVER_TYPE=cx23
          EOF
      - name: Run Deploy Check (deploy.sh -c)
        env:
          GIT_REF: refs/heads/dev
        run: |
          chmod +x deploy.sh
          ./deploy.sh dev-hetz -c -n -i 0.0.0.0

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "zizmor started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run zizmor
        run: uvx zizmor --min-confidence high .
