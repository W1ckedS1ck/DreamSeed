name: "⚡ CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  TFLINT_VERSION: "v0.64.0"
  ARTIFACT_RETENTION_DAYS: 30
  GITLEAKS_VERSION: "8.30.1"
  TERRAFORM_VERSION: "1.15.8"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🚀 Start
        run: echo "ShellCheck started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Run ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -path ./.git -prune -o -name '*.sh' -print -exec shellcheck --severity=error {} +

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🚀 Start
        run: echo "Ansible Lint started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: ansible/requirements-deploy.txt
      - name: Run ansible-lint
        run: |
          pip install -r ansible/requirements-deploy.txt --quiet
          bash scripts/lint.sh --ci --ansible-lint

  terraform-checks:
    name: Terraform Lint + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🚀 Start
        run: echo "Terraform checks started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: ./.github/actions/setup-terraform
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: true
      - name: Check terraform formatting
        run: terraform fmt -check -recursive terraform/
      - name: Run tflint
        run: bash scripts/lint.sh --ci --tflint
      - name: Validate all providers
        run: bash scripts/lint.sh --ci --validate-terraform

  checkov:
    name: IaC Compliance (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🚀 Start
        run: echo "Checkov started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12.3117.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_260,CKV2_AWS_41

  trivy:
    name: Terraform Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🚀 Start
        run: echo "Trivy started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf', 'terraform/**/*.hcl', 'terraform/**/*.tftpl') }}
          restore-keys: trivy-${{ runner.os }}-
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: HIGH,CRITICAL

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: 🚀 Start
        run: echo "Gitleaks started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: ./.github/actions/setup-gitleaks
        with:
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}
      - name: Secret Scan (full history)
        run: bash scripts/lint.sh --ci --gitleaks-full-history

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🚀 Start
        run: echo "Actionlint started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          args: -shellcheck=

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: 🚀 Start
        run: echo "Pre-commit started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: ansible/requirements-deploy.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-renovate-${{ runner.os }}-${{ hashFiles('renovate.json') }}
          restore-keys: npm-renovate-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: precommit-${{ runner.os }}-
      - uses: ./.github/actions/setup-gitleaks
        with:
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}
      - name: Cache pre-commit system deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bin
          key: sysdeps-${{ runner.os }}-terraform-${{ env.TERRAFORM_VERSION }}-tflint-${{ env.TFLINT_VERSION }}-actionlint-${{ env.ACTIONLINT_VERSION }}
          restore-keys: |
            sysdeps-${{ runner.os }}-
      - name: Install pre-commit system deps
        run: |
          mkdir -p ~/.cache/bin

          # actionlint
          if [ -f ~/.cache/bin/actionlint ]; then
            sudo cp ~/.cache/bin/actionlint /usr/local/bin/actionlint
          else
            curl -sLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz"
            sudo tar -xz -C /usr/local/bin -f /tmp/actionlint.tar.gz actionlint
            sudo cp /usr/local/bin/actionlint ~/.cache/bin/actionlint
          fi

          # Terraform (pinned via TERRAFORM_VERSION env var)
          if [ -f ~/.cache/bin/terraform ]; then
            sudo cp ~/.cache/bin/terraform /usr/local/bin/terraform
          else
            curl -sLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${{ env.TERRAFORM_VERSION }}/terraform_${{ env.TERRAFORM_VERSION }}_linux_amd64.zip"
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin > /dev/null 2>&1
            sudo cp /usr/local/bin/terraform ~/.cache/bin/terraform
          fi

          # tflint (pinned via TFLINT_VERSION env var)
          if [ -f ~/.cache/bin/tflint ]; then
            sudo cp ~/.cache/bin/tflint /usr/local/bin/tflint
          else
            curl -sLo /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip"
            sudo unzip -o /tmp/tflint.zip -d /usr/local/bin > /dev/null 2>&1
            tflint --init --config .tflint.hcl 2>/dev/null || true
            sudo cp /usr/local/bin/tflint ~/.cache/bin/tflint
          fi

          # ansible-lint + PyMySQL (pinned via requirements-deploy.txt)
          pip install -r ansible/requirements-deploy.txt --quiet
      - name: Run pre-commit hooks (changed files only)
        run: |
          pip install pre-commit
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            REF="origin/${{ github.base_ref }}"
          else
            REF="origin/${{ github.ref_name }}"
          fi
          if git rev-parse "$REF" &>/dev/null; then
            pre-commit run --from-ref "$REF" --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi
      - name: Validate Renovate config
        env:
          NPM_CONFIG_LOGLEVEL: error
        run: npx --yes --package renovate@44 -- renovate-config-validator
