name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      python: ${{ steps.filter.outputs.python }}
      ansible: ${{ steps.filter.outputs.ansible }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed paths
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git diff --name-only "$BASE" HEAD 2>/dev/null > /tmp/changed.txt || \
            git diff --name-only HEAD~1 HEAD > /tmp/changed.txt

          grep -qE '\.sh$' /tmp/changed.txt \
            && echo "shell=true" >> "$GITHUB_OUTPUT" || echo "shell=false" >> "$GITHUB_OUTPUT"
          grep -qE '^scripts/.*\.py$' /tmp/changed.txt \
            && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          grep -qE '^ansible(-roles)?/' /tmp/changed.txt \
            && echo "ansible=true" >> "$GITHUB_OUTPUT" || echo "ansible=false" >> "$GITHUB_OUTPUT"
          grep -qE '^terraform/' /tmp/changed.txt \
            && echo "terraform=true" >> "$GITHUB_OUTPUT" || echo "terraform=false" >> "$GITHUB_OUTPUT"

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error
          ignore_paths: >-
            .git

  ruff:
    name: Python Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run ruff
        uses: chartboost/ruff-action@v1

  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - name: Run ansible-lint
        run: |
          pip install -r ansible/requirements.txt --quiet
          bash scripts/lint.sh --ci --ansible-lint

  terraform-checks:
    name: Terraform Lint + Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Run tflint
        run: bash scripts/lint.sh --ci --tflint
      - name: Validate all providers
        run: bash scripts/lint.sh --ci --validate-terraform

  trivy:
    name: Terraform Security
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: trivy-db-${{ runner.os }}
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: HIGH,CRITICAL

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          sudo apt-get install -y gitleaks -qq 2>/dev/null || \
            (curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | \
             sudo tar -xz -C /usr/local/bin gitleaks)
      - name: Secret Scan (full history)
        run: bash scripts/lint.sh --ci --gitleaks-full-history

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: precommit-${{ runner.os }}-
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          sudo apt-get install -y gitleaks -qq 2>/dev/null || \
            (curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | \
             sudo tar -xz -C /usr/local/bin gitleaks)
      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
