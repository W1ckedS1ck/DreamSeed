name: "⚡ CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
concurrency:
  # PRs: a newer push supersedes the old run. main: every commit keeps its full CI run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  # Every CI tool version lives here. Renovate bumps these lines (customManagers
  # in renovate.json); the installs read them through install-pinned-binary.
  TFLINT_VERSION: "v0.66.0"
  GITLEAKS_VERSION: "8.30.1"
  ACTIONLINT_VERSION: "1.7.12"
  TERRAFORM_VERSION: "1.17.1"
  UV_VERSION: "0.13.7"
  RENOVATE_VERSION: "44.223.1"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "ShellCheck started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Install ShellCheck
        run: pip install --require-hashes -r ci/requirements.txt
      - name: Run ShellCheck
        run: bash scripts/lint.sh --ci --shellcheck
      - name: Cloudflare IP updater selftest
        run: bash scripts/update_cloudflare_ips.sh --selftest

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Ansible Lint started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: $/.github/actions/setup-ansible
      - name: Run ansible-lint
        run: bash scripts/lint.sh --ci --ansible-lint

  terraform-checks:
    name: Terraform Lint + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Terraform checks started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: $/.github/actions/setup-terraform
      - name: Install tflint
        uses: $/.github/actions/install-pinned-binary
        with:
          binary: tflint
          version: ${{ env.TFLINT_VERSION }}
          archive-url: https://github.com/terraform-linters/tflint/releases/download/${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
          checksums-url: https://github.com/terraform-linters/tflint/releases/download/${{ env.TFLINT_VERSION }}/checksums.txt
          go-package: github.com/terraform-linters/tflint@${{ env.TFLINT_VERSION }}
      - name: Check terraform formatting
        run: bash scripts/lint.sh --ci --fmt
      - name: Run tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/lint.sh --ci --tflint
      - name: Validate all providers
        run: bash scripts/lint.sh --ci --validate-terraform

  checkov:
    name: IaC Compliance (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Checkov started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_260,CKV2_AWS_41

  trivy:
    name: Terraform Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Trivy started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf', 'terraform/**/*.hcl', 'terraform/**/*.tftpl') }}
          restore-keys: trivy-${{ runner.os }}-
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: HIGH,CRITICAL

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🚀 Start
        run: echo "Gitleaks started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Install gitleaks
        uses: $/.github/actions/install-pinned-binary
        with:
          binary: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          archive-url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          checksums-url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_checksums.txt
          # v8.30.1's go.mod still declares the pre-rename module path.
          go-package: github.com/zricethezav/gitleaks/v8@v${{ env.GITLEAKS_VERSION }}
      - name: Secret Scan (full history)
        run: bash scripts/lint.sh --ci --gitleaks-full-history
      - name: Secrets hygiene audit
        run: bash scripts/lint.sh --secrets

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint
        uses: $/.github/actions/install-pinned-binary
        with:
          binary: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          archive-url: https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
          checksums-url: https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_checksums.txt
          go-package: github.com/rhysd/actionlint/cmd/actionlint@v${{ env.ACTIONLINT_VERSION }}
      - name: Install shellcheck (inline run scripts)
        run: pip install --require-hashes -r ci/requirements.txt
      - name: Run actionlint
        run: actionlint -shellcheck="$(command -v shellcheck)" -ignore 'specifying action "\$/.+" in invalid format because ref is missing'
      - name: Verify required checks match ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --require-hashes -r ci/requirements.txt
          python3 scripts/check_required_checks.py

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "yamllint started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run yamllint
        run: bash scripts/lint.sh --ci --yamllint

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🚀 Start
        run: echo "Pre-commit started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: precommit-${{ runner.os }}-
      - name: Install gitleaks
        uses: $/.github/actions/install-pinned-binary
        with:
          binary: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          archive-url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          checksums-url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_checksums.txt
          go-package: github.com/zricethezav/gitleaks/v8@v${{ env.GITLEAKS_VERSION }}
      - name: Install terraform
        uses: $/.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      - name: Install tflint
        uses: $/.github/actions/install-pinned-binary
        with:
          binary: tflint
          version: ${{ env.TFLINT_VERSION }}
          archive-url: https://github.com/terraform-linters/tflint/releases/download/${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
          checksums-url: https://github.com/terraform-linters/tflint/releases/download/${{ env.TFLINT_VERSION }}/checksums.txt
          go-package: github.com/terraform-linters/tflint@${{ env.TFLINT_VERSION }}
      - name: Init tflint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config .tflint.hcl 2>/dev/null || true
      - name: Run pre-commit hooks (changed files only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          pip install --require-hashes -r ci/requirements.txt
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            REF="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            REF="$BEFORE"
          else
            REF="HEAD~1"
          fi
          if git merge-base --is-ancestor "$REF" HEAD 2>/dev/null; then
            pre-commit run --from-ref "$REF" --to-ref HEAD --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi
      - name: Check renovate.json changes
        id: renovate-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            REF="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            REF="$BEFORE"
          else
            REF="HEAD~1"
          fi
          if git merge-base --is-ancestor "$REF" HEAD 2>/dev/null && git diff --name-only "$REF"...HEAD -- renovate.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Renovate config
        if: steps.renovate-check.outputs.changed == 'true'
        env:
          NPM_CONFIG_LOGLEVEL: error
        run: npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator

  env-contract:
    name: .env Parser Contract
    # The same secrets flow through three independent parsers
    # (lib/env.sh | scripts/common_functions.sh | scripts/env_loader.py).
    # 10 fixtures in tests/env/ assert identical output; this job runs on
    # every PR and push to catch silent parser drift.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "env-contract started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Run parser contract + differential fuzz
        run: |
          bash scripts/check_env_contract.sh
          python3 tests/env/fuzz_env_parsers.py
      - name: Install unit test dependencies
        run: pip install --require-hashes -r ci/requirements.txt
      - name: Run unit tests (templates, bot helpers, CI job names, posture)
        run: python3 -m pytest tests/unit -q

  deploy-check:
    name: Deploy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Push-only: loads real secrets and executes PR-modified code — never run on PRs.
    if: github.event_name != 'pull_request'
    # Smoke-test the REAL deploy.sh orchestration path (CLI parsing, target
    # resolution, .env parsing, preflight, playbook presence + syntax) — the
    # 8 lint/scan checks above never exercise deploy.sh itself. Runs with
    # `-i 0.0.0.0` to skip Terraform (already validated offline by the
    # Terraform job) so no TF_API_TOKEN is exposed. GIT_REF is pinned to
    # refs/heads/dev below so guard_source_ref never trips, even when this
    # job runs on a push to main.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "Deploy Check started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: $/.github/actions/setup-terraform
      - uses: $/.github/actions/setup-ansible
      - uses: $/.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}
      - uses: $/.github/actions/setup-env
        with:
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
      - name: Target config
        run: |
          cat >> secrets/.env << 'EOF'
          DEV_HETZ_SSH_KEY_NAME=Vitali.pub
          DEV_HETZ_PRIMARY_IP_NAME=primary_ip-1
          DEV_HETZ_SERVER_TYPE=cx23
          EOF
      - name: Run Deploy Check (deploy.sh -c)
        env:
          GIT_REF: refs/heads/dev
        run: |
          chmod +x deploy.sh
          ./deploy.sh dev-hetz -c -n -i 0.0.0.0

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 🚀 Start
        run: echo "zizmor started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run zizmor
        run: bash scripts/lint.sh --ci --zizmor
