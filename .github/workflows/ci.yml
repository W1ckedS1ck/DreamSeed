name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error
          ignore_paths: >-
            .git

  ruff:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ruff
        uses: chartboost/ruff-action@v1

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - name: Run ansible-lint
        working-directory: ansible
        run: |
          pip install -r requirements.txt --quiet
          ansible-lint .

  tflint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Init TFLint
        run: tflint --init
      - name: Run TFLint
        run: |
          for dir in terraform/*/; do
            echo "=== Linting $dir ==="
            tflint --chdir="$dir"
          done

  trivy:
    name: Terraform Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
          severity: HIGH,CRITICAL

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - name: Validate all providers
        run: |
          for dir in terraform/*/; do
            echo "=== Validating $dir ==="
            terraform -chdir="$dir" init -backend=false -upgrade
            terraform -chdir="$dir" validate
          done

  infracost:
    name: Infracost
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Generate dummy SSH key for AWS plan
        run: |
          mkdir -p /tmp/dummy-ssh
          ssh-keygen -t rsa -b 2048 -f /tmp/dummy-ssh/id_rsa -N "" -q
      - name: Run Infracost on AWS
        run: |
          infracost breakdown --path=terraform/aws \
            --terraform-plan-flags="-var=ssh_public_key_path=/tmp/dummy-ssh/id_rsa -var=environment=ci -var=domain= -var=elastic_ip_allocation_id= -var=cloudflare_api_token= -var=cloudflare_zone_id=" \
            --format=json --out-file=/tmp/infracost-aws.json
      - name: Run Infracost on Hetzner
        run: |
          infracost breakdown --path=terraform/hetzner \
            --terraform-plan-flags="-var=hcloud_token=dummy_token -var=environment=ci" \
            --format=json --out-file=/tmp/infracost-hetzner.json
      - name: Post Infracost comment
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost-aws.json /tmp/infracost-hetzner.json
