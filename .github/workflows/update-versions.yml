name: Update Versions

on:
  push:
    branches: [main, dev]
    paths:
      - ansible/requirements-deploy.txt
      - ansible/group_vars/all.yml
      - .github/actions/setup-terraform/action.yml
      - .github/workflows/update-versions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-terraform

      - name: Extract versions
        run: |
          ANSIBLE=$(grep -oP '^ansible==\K.*' ansible/requirements-deploy.txt)
          GRAFANA=$(grep -oP "default\('[0-9]+\.[0-9]+\.[0-9]+" ansible/group_vars/all.yml | grep -oP "[0-9]+\.[0-9]+\.[0-9]+")
          TERRAFORM=$(terraform --version | head -1 | grep -oP '\d+\.\d+')

          cat > versions.json <<EOF
          {
            "terraform": "$TERRAFORM",
            "ansible": "$ANSIBLE",
            "grafana": "$GRAFANA"
          }
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "No version changes"
          else
            git commit -m "chore: update versions.json"
            git push
          fi
