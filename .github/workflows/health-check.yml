name: Weekly Server Update

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, prod-hetz, dev-hetz, dev-aws]
        default: prod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'schedule' && fromJSON('["prod", "prod-hetz"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    name: Update ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-terraform

      - name: Record start time
        id: start
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          PROD_EIP: ${{ secrets.PROD_EIP }}
          PROD_ACCESS_KEY: ${{ secrets.PROD_ACCESS_KEY }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_REGION: ${{ secrets.PROD_REGION }}
          DEV_AWS_ACCESS_KEY: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          DEV_AWS_SECRET_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          DEV_AWS_REGION: ${{ secrets.DEV_AWS_REGION }}
          DEV_AWS_EIP: ${{ secrets.DEV_AWS_EIP }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null
          echo "TG_TOKEN=$TG_TOKEN" >> "$GITHUB_ENV"

      - name: Resolve server IP
        id: server-ip
        run: |
          ENV="${{ matrix.target }}"
          case "$ENV" in
            prod)
              IP="${{ secrets.PROD_EIP }}"
              if [[ "$IP" == eipalloc-* ]]; then
                export AWS_ACCESS_KEY_ID="${{ secrets.PROD_ACCESS_KEY }}"
                export AWS_SECRET_ACCESS_KEY="${{ secrets.PROD_SECRET_KEY }}"
                export AWS_DEFAULT_REGION="${{ secrets.PROD_REGION }}"
                IP=$(aws ec2 describe-addresses --allocation-ids "$IP" \
                     --query 'Addresses[0].PublicIp' --output text)
              fi
              DOMAIN="dreamseed.online"
              ;;
            prod-hetz)
              export TF_TOKEN_app_terraform_io="${{ secrets.TF_API_TOKEN }}"
              export TF_WORKSPACE="prod-hetz"
              cd terraform/hetzner
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4)
              cd ../..
              DOMAIN="dreamseed.online"
              ;;
            dev-hetz)
              export TF_TOKEN_app_terraform_io="${{ secrets.TF_API_TOKEN }}"
              export TF_WORKSPACE="dev-hetz"
              cd terraform/hetzner
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4)
              cd ../..
              DOMAIN="hetz.vitalikuts.online"
              ;;
            dev-aws)
              IP="${{ secrets.DEV_AWS_EIP }}"
              if [[ "$IP" == eipalloc-* ]]; then
                export AWS_ACCESS_KEY_ID="${{ secrets.DEV_AWS_ACCESS_KEY }}"
                export AWS_SECRET_ACCESS_KEY="${{ secrets.DEV_AWS_SECRET_KEY }}"
                export AWS_DEFAULT_REGION="${{ secrets.DEV_AWS_REGION }}"
                IP=$(aws ec2 describe-addresses --allocation-ids "$IP" \
                     --query 'Addresses[0].PublicIp' --output text)
              fi
              DOMAIN="aws.vitalikuts.online"
              ;;
          esac
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Update all packages
        id: update
        run: |
          set +e
          IP="${{ steps.server-ip.outputs.ip }}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ubuntu@$IP"

          $SSH "true" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "::notice::SSH unreachable"
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== Before: available updates ==="
          BEFORE=$($SSH "apt list --upgradable 2>/dev/null | grep -v 'Listing...'")
          TOTAL=$(echo "$BEFORE" | grep -c .)
          SECURITY=$($SSH "apt list --upgradable 2>/dev/null | grep -c '\-security' || true")
          echo "Total: $TOTAL ($SECURITY security)"

          echo "=== Running apt upgrade ==="
          $SSH "sudo apt-get update -qq && sudo apt-get upgrade -y 2>&1" | tail -5

          echo "=== After: remaining updates ==="
          AFTER=$($SSH "apt list --upgradable 2>/dev/null | grep -v 'Listing...'")
          AFTER_COUNT=$(echo "$AFTER" | grep -c .)
          echo "Remaining: $AFTER_COUNT"

          echo "=== Reboot required ==="
          $SSH "test -f /var/run/reboot-required" 2>/dev/null && echo "REBOOT REQUIRED" || echo "No reboot needed"

          echo "=== Services check ==="
          for svc in nginx php8.3-fpm mariadb victoria-metrics grafana-server fail2ban telegram-bot; do
            $SSH "systemctl is-active $svc" 2>/dev/null | grep -q active && echo "[OK] $svc" || echo "[FAIL] $svc"
          done

          echo "status=ok" >> "$GITHUB_OUTPUT"
          echo "before=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "security=$SECURITY" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER_COUNT" >> "$GITHUB_OUTPUT"

      - name: Notify
        if: always()
        env:
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
        run: |
          STATUS="${{ steps.update.outputs.status }}"
          BEFORE="${{ steps.update.outputs.before }}"
          AFTER="${{ steps.update.outputs.after }}"
          SECURITY="${{ steps.update.outputs.security }}"
          DOMAIN="${{ steps.server-ip.outputs.domain }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))

          N=$'\n'
          if [ "$STATUS" = "unreachable" ]; then
            MSG="❌ *Server Update* — ${{ matrix.target }}${N}📅 $(date '+%Y-%m-%d %H:%M')${N}SSH unreachable"
          elif [ "${BEFORE:-0}" = "0" ]; then
            MSG="✅ *Server Update* — ${{ matrix.target }}${N}📅 $(date '+%Y-%m-%d %H:%M') ⏱ ${ELAPSED}s${N}🖥 ${DOMAIN}${N}No updates available"
          else
            MSG="✅ *Server Update* — ${{ matrix.target }}${N}📅 $(date '+%Y-%m-%d %H:%M') ⏱ ${ELAPSED}s${N}🖥 ${DOMAIN}${N}${N}Before: ${BEFORE} (${SECURITY} security)${N}After:  ${AFTER} remaining"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" > /dev/null || true

      - name: Write job summary
        if: always()
        run: |
          DOMAIN="${{ steps.server-ip.outputs.domain }}"
          IP="${{ steps.server-ip.outputs.ip }}"
          STATUS="${{ steps.update.outputs.status }}"
          BEFORE="${{ steps.update.outputs.before }}"
          AFTER="${{ steps.update.outputs.after }}"
          SECURITY="${{ steps.update.outputs.security }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))

          M="$GITHUB_STEP_SUMMARY"
          echo "## Weekly Server Update — ${{ matrix.target }}" >> "$M"
          echo "" >> "$M"
          echo "| | |" >> "$M"
          echo "|---|---|" >> "$M"
          echo "| **Domain** | ${DOMAIN} |" >> "$M"
          echo "| **Server** | ${IP} |" >> "$M"
          echo "| **Duration** | ${ELAPSED}s |" >> "$M"
          echo "| **Status** | ${STATUS} |" >> "$M"
          echo "| **Before** | ${BEFORE:-?} (${SECURITY:-?} security) |" >> "$M"
          echo "| **After** | ${AFTER:-?} remaining |" >> "$M"
