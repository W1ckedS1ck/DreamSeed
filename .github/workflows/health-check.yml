name: Weekly Server Update

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, prod-hetz, dev-hetz, dev-aws]
        default: prod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'schedule' && fromJSON('["prod", "prod-hetz"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    name: Update ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-terraform

      - name: Record start time
        id: start
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          PROD_EIP: ${{ secrets.PROD_EIP }}
          PROD_ACCESS_KEY: ${{ secrets.PROD_ACCESS_KEY }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_REGION: ${{ secrets.PROD_REGION }}
          DEV_AWS_ACCESS_KEY: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          DEV_AWS_SECRET_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          DEV_AWS_REGION: ${{ secrets.DEV_AWS_REGION }}
          DEV_AWS_EIP: ${{ secrets.DEV_AWS_EIP }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null
          echo "TG_TOKEN=$TG_TOKEN" >> "$GITHUB_ENV"

      - name: Resolve server IP
        id: server-ip
        run: |
          ENV="${{ matrix.target }}"
          case "$ENV" in
            prod)
              IP="${{ secrets.PROD_EIP }}"
              if [[ "$IP" == eipalloc-* ]]; then
                export AWS_ACCESS_KEY_ID="${{ secrets.PROD_ACCESS_KEY }}"
                export AWS_SECRET_ACCESS_KEY="${{ secrets.PROD_SECRET_KEY }}"
                export AWS_DEFAULT_REGION="${{ secrets.PROD_REGION }}"
                IP=$(aws ec2 describe-addresses --allocation-ids "$IP" \
                     --query 'Addresses[0].PublicIp' --output text)
              fi
              DOMAIN="dreamseed.online"
              ;;
            prod-hetz)
              export TF_TOKEN_app_terraform_io="${{ secrets.TF_API_TOKEN }}"
              export TF_WORKSPACE="prod-hetz"
              cd terraform/hetzner
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4)
              cd ../..
              DOMAIN="dreamseed.online"
              ;;
            dev-hetz)
              export TF_TOKEN_app_terraform_io="${{ secrets.TF_API_TOKEN }}"
              export TF_WORKSPACE="dev-hetz"
              cd terraform/hetzner
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4)
              cd ../..
              DOMAIN="hetz.vitalikuts.online"
              ;;
            dev-aws)
              IP="${{ secrets.DEV_AWS_EIP }}"
              if [[ "$IP" == eipalloc-* ]]; then
                export AWS_ACCESS_KEY_ID="${{ secrets.DEV_AWS_ACCESS_KEY }}"
                export AWS_SECRET_ACCESS_KEY="${{ secrets.DEV_AWS_SECRET_KEY }}"
                export AWS_DEFAULT_REGION="${{ secrets.DEV_AWS_REGION }}"
                IP=$(aws ec2 describe-addresses --allocation-ids "$IP" \
                     --query 'Addresses[0].PublicIp' --output text)
              fi
              DOMAIN="aws.vitalikuts.online"
              ;;
          esac
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Update apt packages (safe subset)
        id: update
        run: |
          set +e
          IP="${{ steps.server-ip.outputs.ip }}"
          SSH="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ubuntu@$IP"

          echo "=== SSH connectivity ==="
          $SSH "true" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "UPDATE_STATUS=unreachable" >> "$GITHUB_ENV"
            echo "test_summary=SSH UNREACHABLE" >> "$GITHUB_OUTPUT"
            echo "test_updated=0" >> "$GITHUB_OUTPUT"
            echo "test_pending=0" >> "$GITHUB_OUTPUT"
            echo "test_reboot=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== Before: upgradable packages ==="
          UPGRADABLE=$($SSH "apt list --upgradable 2>/dev/null | grep -v 'Listing...' | sed 's/\/.*//'")
          TOTAL=$(echo "$UPGRADABLE" | grep -c .)
          echo "Total upgradable: $TOTAL"
          echo "$UPGRADABLE" | sed 's/^/- /'

          echo "=== Running apt update ==="
          $SSH "sudo apt update -qq" 2>&1 | tail -1

          echo "=== Upgrading safe packages ==="
          SAFE_PKGS="nginx certbot fail2ban openssl rclone jq rsync unzip bind9-dnsutils python3-pymysql debsums apt-show-versions"
          UPGRADE_OUTPUT=$($SSH "sudo apt-get install --only-upgrade -y $SAFE_PKGS 2>&1")
          UPDATED=$(echo "$UPGRADE_OUTPUT" | grep "^Setting up " | sed 's/Setting up //;s/ (.*\.\.\.)//' || true)
          UPDATED_COUNT=$(echo "$UPDATED" | grep -c .)
          echo "Updated: $UPDATED_COUNT packages"
          [ -n "$UPDATED" ] && echo "$UPDATED" | sed 's/^/- /' || echo "(none)"

          echo "=== Still pending (skipped: php, mariadb, kernel...) ==="
          BEFORE_LIST=$(echo "$UPGRADABLE" | sort)
          AFTER_LIST=$(echo "$UPDATED" | sed 's/ .*//' | sort)
          PENDING=$(comm -23 <(echo "$BEFORE_LIST") <(echo "$AFTER_LIST") 2>/dev/null || echo "$UPGRADABLE")
          PENDING_COUNT=$(echo "$PENDING" | grep -c .)
          [ "$PENDING_COUNT" -gt 0 ] && echo "$PENDING" | sed 's/^/- /' || echo "(none)"

          echo "=== Reboot check ==="
          $SSH "test -f /var/run/reboot-required" 2>/dev/null && REBOOT="yes" || REBOOT="no"
          [ "$REBOOT" = "yes" ] && echo "⚠️ Reboot required" || echo "No reboot needed"

          echo "=== Restarting updated services ==="
          $SSH "sudo systemctl restart nginx fail2ban 2>/dev/null; echo done"

          echo "=== Verifying services ==="
          for svc in nginx php8.3-fpm mariadb victoria-metrics grafana-server; do
            $SSH "systemctl is-active $svc" 2>/dev/null | grep -q active && echo "[OK] $svc" || echo "[FAIL] $svc"
          done

          echo "updated_count=$UPDATED_COUNT" >> "$GITHUB_OUTPUT"
          echo "updated_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$UPDATED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "pending_count=$PENDING_COUNT" >> "$GITHUB_OUTPUT"
          echo "pending_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PENDING" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "total_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "reboot=$REBOOT" >> "$GITHUB_OUTPUT"
          echo "test_summary=$TOTAL available → $UPDATED_COUNT updated ($PENDING_COUNT pending)" >> "$GITHUB_OUTPUT"
          echo "UPDATE_STATUS=ok" >> "$GITHUB_ENV"

      - name: Notify
        if: always()
        env:
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
        run: |
          STATUS_ICON="✅"; [ "${{ env.UPDATE_STATUS }}" = "unreachable" ] && STATUS_ICON="❌"
          SUMMARY="${{ steps.update.outputs.test_summary }}"
          UPDATED_COUNT="${{ steps.update.outputs.updated_count }}"
          PENDING_COUNT="${{ steps.update.outputs.pending_count }}"
          REBOOT="${{ steps.update.outputs.reboot }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))

          REBOOT_LINE=""; [ "$REBOOT" = "yes" ] && REBOOT_LINE=" ⚠️ Reboot required"
          MSG="${STATUS_ICON} *Weekly Update* — ${{ matrix.target }}
          📅 $(date '+%Y-%m-%d %H:%M')  ⏱ ${ELAPSED}s
          🖥 ${{ steps.server-ip.outputs.domain }}

          Updated: ${UPDATED_COUNT:-0}
          Pending: ${PENDING_COUNT:-0}${REBOOT_LINE}"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" > /dev/null || true

      - name: Write job summary
        if: always()
        run: |
          IP="${{ steps.server-ip.outputs.ip }}"
          DOMAIN="${{ steps.server-ip.outputs.domain }}"
          STATUS="${{ env.UPDATE_STATUS }}"
          SUMMARY="${{ steps.update.outputs.test_summary }}"
          UPDATED_COUNT="${{ steps.update.outputs.updated_count }}"
          UPDATED_LIST="${{ steps.update.outputs.updated_list }}"
          PENDING_COUNT="${{ steps.update.outputs.pending_count }}"
          PENDING_LIST="${{ steps.update.outputs.pending_list }}"
          TOTAL="${{ steps.update.outputs.total_count }}"
          REBOOT="${{ steps.update.outputs.reboot }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))

          M="$GITHUB_STEP_SUMMARY"
          echo "## Weekly Server Update" >> "$M"
          echo "" >> "$M"
          echo "| | |" >> "$M"
          echo "|---|---|" >> "$M"
          echo "| **Target** | ${{ matrix.target }} |" >> "$M"
          echo "| **Domain** | ${DOMAIN} |" >> "$M"
          echo "| **Server** | ${IP} |" >> "$M"
          echo "| **Duration** | ${ELAPSED}s |" >> "$M"
          echo "| **Status** | ${STATUS} |" >> "$M"
          echo "| **Available** | ${TOTAL} |" >> "$M"
          echo "| **Updated** | ${UPDATED_COUNT:-0} |" >> "$M"
          echo "| **Pending** | ${PENDING_COUNT:-0} |" >> "$M"
          echo "| **Reboot** | ${REBOOT} |" >> "$M"
