name: Grafana Cloud Dashboards

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace (prod or dev)'
        required: true
        default: 'dev'
        type: choice
        options:
          - prod
          - dev

concurrency:
  group: grafana-cloud-${{ inputs.workspace }}
  cancel-in-progress: false

env:

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Display Deployment Info
        run: |
          if [[ "${{ inputs.workspace }}" == "prod" ]]; then
            echo "##[group]🔴 PRODUCTION DEPLOYMENT - Workspace: prod"
            echo "Target: PRODUCTION"
            echo "##[endgroup]"
          else
            echo "##[group]🟢 DEV DEPLOYMENT - Workspace: dev"
            echo "Target: DEV"
            echo "##[endgroup]"
          fi

      - uses: ./.github/actions/setup-terraform
        with:
          cli-config-credentials-token: ${{ secrets.TF_API_TOKEN }}

      - name: Set TF_WORKSPACE
        env:
          WORKSPACE_INPUT: ${{ inputs.workspace }}
        run: |
          echo "TF_WORKSPACE=$WORKSPACE_INPUT" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=$WORKSPACE_INPUT" >> "$GITHUB_ENV"
          if [[ "$WORKSPACE_INPUT" == "prod" ]]; then
            echo "DEPLOY_ORG=Grafana Cloud (Production)" >> "$GITHUB_ENV"
            echo "DEPLOY_EMOJI=🔴" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ORG=Grafana Cloud (Dev)" >> "$GITHUB_ENV"
            echo "DEPLOY_EMOJI=🟢" >> "$GITHUB_ENV"
          fi

      - name: Write terraform.tfvars.json
        working-directory: terraform/grafana
        env:
          WORKSPACE_INPUT: ${{ inputs.workspace }}
        run: |
          if [[ "$WORKSPACE_INPUT" == "prod" ]]; then
            jq -n \
              --arg url "${{ secrets.PROD_GRAFANA_CLOUD_URL }}" \
              --arg token "${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}" \
              --arg sm_token "${{ secrets.PROD_SM_ACCESS_TOKEN }}" \
              --arg domain "dreamseed.online" \
              --arg sm_url "https://synthetic-monitoring-api-us-east-0.grafana.net" \
              '{grafana_cloud_url: $url, grafana_cloud_token: $token, sm_access_token: $sm_token, domain: $domain, sm_url: $sm_url, sm_enabled: ($sm_token | length > 0)}' \
              > terraform.tfvars.json
          else
            jq -n \
              --arg url "${{ secrets.DEV_GRAFANA_CLOUD_URL }}" \
              --arg token "${{ secrets.DEV_GRAFANA_CLOUD_SA_TOKEN }}" \
              --arg sm_token "${{ secrets.DEV_SM_ACCESS_TOKEN }}" \
              --arg domain "hetz.vitalikuts.online" \
              --arg sm_url "https://synthetic-monitoring-api-eu-north-0.grafana.net" \
              '{grafana_cloud_url: $url, grafana_cloud_token: $token, sm_access_token: $sm_token, domain: $domain, sm_url: $sm_url, sm_enabled: ($sm_token | length > 0)}' \
              > terraform.tfvars.json
          fi

      - name: Init dashboards cache
        working-directory: terraform/grafana
        run: bash init-dashboards.sh

      - name: Terraform Init
        working-directory: terraform/grafana
        run: terraform init -upgrade=true

      - name: Terraform Plan
        working-directory: terraform/grafana
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform/grafana
        run: terraform apply -auto-approve

      - name: Verify folder exists
        run: |
          FOLDER_UID=$(terraform output -raw folder_uid 2>/dev/null || echo "")
          if [ -n "$FOLDER_UID" ]; then
            echo "Folder UID from state: $FOLDER_UID"
          else
            echo "No folder in state — skipping verification"
          fi

      - name: Terraform State Output
        working-directory: terraform/grafana
        run: terraform output -json || echo "No outputs"

      - name: Generate Summary
        working-directory: terraform/grafana
        if: always()
        run: |
          {
            echo "## $DEPLOY_EMOJI Grafana Cloud Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Target** | \`$DEPLOY_TARGET\` |"
            echo "| **Organization** | $DEPLOY_ORG |"
            echo ""
            echo "### 📊 Dashboards"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          OUTPUT=$(terraform output -json 2>/dev/null || echo "{}")
          echo "$OUTPUT" | jq -r '.dashboard_uids.value | to_entries[] | "- **\(.key | ascii_upcase)** — UID: `\(.value)`"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(none)" >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "### 🔍 Synthetic Monitoring Checks"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$OUTPUT" | jq -r '.sm_check_ids.value | to_entries[] | "- \(.key): `\(.value)`"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(none)" >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "### 📁 Folder"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FOLDER=$(echo "$OUTPUT" | jq -r '.folder_uid.value // "N/A"' 2>/dev/null)
          echo "\`$FOLDER\`" >> "$GITHUB_STEP_SUMMARY"
