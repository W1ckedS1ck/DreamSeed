name: Grafana Cloud Dashboards

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace (prod or dev)'
        required: true
        default: 'dev'
        type: choice
        options:
          - prod
          - dev

concurrency:
  group: grafana-cloud-${{ github.event.inputs.workspace }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.5"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-terraform
        with:
          cli-config-credentials-token: ${{ secrets.TF_API_TOKEN }}

      - name: Set TF_WORKSPACE
        env:
          WORKSPACE_INPUT: ${{ github.event.inputs.workspace }}
        run: |
          echo "TF_WORKSPACE=$WORKSPACE_INPUT" >> "$GITHUB_ENV"

      - name: Write terraform.tfvars.json
        working-directory: terraform/grafana
        env:
          WORKSPACE_INPUT: ${{ github.event.inputs.workspace }}
        run: |
          if [[ "$WORKSPACE_INPUT" == "prod" ]]; then
            jq -n \
              --arg url "${{ secrets.PROD_GRAFANA_CLOUD_URL }}" \
              --arg token "${{ secrets.PROD_GRAFANA_CLOUD_SA_TOKEN }}" \
              --arg sm_token "${{ secrets.PROD_SM_ACCESS_TOKEN }}" \
              --arg domain "dreamseed.online" \
              --arg sm_url "https://synthetic-monitoring-api-us-east-0.grafana.net" \
              '{grafana_cloud_url: $url, grafana_cloud_token: $token, sm_access_token: $sm_token, domain: $domain, sm_url: $sm_url, sm_enabled: ($sm_token | length > 0)}' \
              > terraform.tfvars.json
          else
            jq -n \
              --arg url "${{ secrets.DEV_GRAFANA_CLOUD_URL }}" \
              --arg token "${{ secrets.DEV_GRAFANA_CLOUD_SA_TOKEN }}" \
              --arg sm_token "${{ secrets.DEV_SM_ACCESS_TOKEN }}" \
              --arg domain "hetz.vitalikuts.online" \
              --arg sm_url "https://synthetic-monitoring-api-eu-north-0.grafana.net" \
              '{grafana_cloud_url: $url, grafana_cloud_token: $token, sm_access_token: $sm_token, domain: $domain, sm_url: $sm_url, sm_enabled: ($sm_token | length > 0)}' \
              > terraform.tfvars.json
          fi

      - name: Init dashboards cache
        working-directory: terraform/grafana
        run: bash init-dashboards.sh

      - name: Terraform Init
        working-directory: terraform/grafana
        run: terraform init -upgrade=false

      - name: Terraform Plan
        working-directory: terraform/grafana
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform/grafana
        run: terraform apply -auto-approve

      - name: Terraform State Output
        working-directory: terraform/grafana
        run: terraform output -json || echo "No outputs"
