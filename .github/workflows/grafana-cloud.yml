name: Grafana Cloud Dashboards

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace (prod or dev)'
        required: true
        default: 'dev'
        type: choice
        options:
          - prod
          - dev

env:
  TF_VERSION: 1.15.5

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_CLOUD_TOKEN }}

      - name: Set TF_WORKSPACE
        run: |
          echo "TF_WORKSPACE=${{ github.event.inputs.workspace }}" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: terraform/grafana
        run: terraform init -upgrade=false

      - name: Set Grafana Cloud Credentials
        env:
          PROD_URL: ${{ secrets.PROD_GRAFANA_CLOUD_URL }}
          PROD_TOKEN: ${{ secrets.PROD_GRAFANA_CLOUD_SA_TOKEN }}
          PROD_SM_TOKEN: ${{ secrets.PROD_SM_ACCESS_TOKEN }}
          DEV_URL: ${{ secrets.DEV_GRAFANA_CLOUD_URL }}
          DEV_TOKEN: ${{ secrets.DEV_GRAFANA_CLOUD_SA_TOKEN }}
          DEV_SM_TOKEN: ${{ secrets.DEV_SM_ACCESS_TOKEN }}
        run: |
          if [[ "${{ github.event.inputs.workspace }}" == "prod" ]]; then
            URL="$PROD_URL"; TOKEN="$PROD_TOKEN"; SM_TOKEN="${PROD_SM_TOKEN:-}"; DOMAIN="dreamseed.online"
          else
            URL="$DEV_URL"; TOKEN="$DEV_TOKEN"; SM_TOKEN="${DEV_SM_TOKEN:-}"; DOMAIN="hetz.vitalikuts.online"
          fi
          SM_ENABLED=false
          [[ -n "$SM_TOKEN" ]] && SM_ENABLED=true
          cat > terraform/grafana/terraform.tfvars << EOF
          grafana_cloud_url     = "$URL"
          grafana_cloud_token   = "$TOKEN"
          sm_access_token       = "$SM_TOKEN"
          sm_enabled            = $SM_ENABLED
          domain                = "$DOMAIN"
          sm_stack_id           = 0
          sm_metrics_publisher_key = ""
          EOF

      - name: Terraform Plan
        working-directory: terraform/grafana
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/grafana
        run: terraform apply tfplan

      - name: Clean Up Credentials
        if: always()
        run: rm -f terraform/grafana/terraform.tfvars

      - name: Terraform State Output
        working-directory: terraform/grafana
        run: terraform output -json || echo "No outputs"
