name: "[B] GitHub Posture"

# The server stack has 28 alert rules; GitHub itself — the only path through
# which infrastructure can change — had none. This workflow watches the repo
# side: open security alerts, security switches, the branch ruleset and
# Actions hardening. It is read-only, and Telegram only receives new or
# resolved findings (the previous run is restored from the Actions cache).

on:
  schedule:
    # Daily, off the top of the hour to avoid the Actions cron stampede.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Fail the run when findings at this severity or above exist'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - critical
          - high
          - medium
          - any

concurrency:
  group: github-posture
  cancel-in-progress: false

# Default-deny: the audit only reads. security-events covers code scanning
# alerts. Secret scanning, Dependabot and repo settings need a fine-grained
# POSTURE_TOKEN (Secret scanning alerts: read, Dependabot alerts: read,
# Administration: read); without it a 403 becomes a medium finding rather
# than a silent gap.
permissions:
  contents: read
  security-events: read

jobs:
  posture:
    name: Posture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🚀 Start
        run: echo "GitHub Posture started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Mask secrets
        uses: $/.github/actions/mask-secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          POSTURE_TOKEN: ${{ secrets.POSTURE_TOKEN }}
          POSTURE_HEARTBEAT_KEY: ${{ secrets.POSTURE_HEARTBEAT_KEY }}
        with:
          vars: |
            TG_TOKEN
            TG_CHAT_ID
            TG_THREAD_ID
            POSTURE_TOKEN
            POSTURE_HEARTBEAT_KEY

      - name: Restore previous report
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: .posture-cache
          key: github-posture-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            github-posture-

      - name: Install Python dependencies
        continue-on-error: true
        run: pip install --quiet --require-hashes -r ci/requirements.txt

      - name: Evaluate posture
        id: evaluate
        env:
          POSTURE_TOKEN: ${{ secrets.POSTURE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FAIL_ON: ${{ inputs.fail_on }}
        run: |
          mkdir -p posture
          BASELINE=()
          if [[ -f .posture-cache/github-posture.json ]]; then
            BASELINE=(--baseline .posture-cache/github-posture.json)
          fi
          # Exit 3 = --fail-on threshold breached: the notify steps still run,
          # and the threshold is enforced last. Anything else is a real crash.
          set +e
          python3 scripts/github_posture.py \
            --repo "$GITHUB_REPOSITORY" \
            --ci-workflow .github/workflows/ci.yml \
            --write-dir posture \
            --fail-on "${FAIL_ON:-none}" \
            "${BASELINE[@]}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -ne 0 && $rc -ne 3 ]]; then
            exit "$rc"
          fi

      - name: Write job summary
        if: always()
        run: |
          if [[ -f posture/github-posture.md ]]; then
            cat posture/github-posture.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Posture did not produce a report — see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
        run: |
          if [[ -f posture/github-posture.telegram.html ]]; then
            bash scripts/send_tg.sh "$(cat posture/github-posture.telegram.html)" HTML || true
          else
            echo "No new findings — Telegram not notified."
          fi

      - name: Notify failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/send_tg.sh "❌ <b>GitHub Posture</b> failed — <a href=\"$RUN_URL\">open run</a>" HTML || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-posture
          path: posture/
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare next baseline
        if: always()
        run: |
          mkdir -p .posture-cache
          cp posture/github-posture.json .posture-cache/github-posture.json 2>/dev/null || true

      - name: Save report as next baseline
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: .posture-cache
          key: github-posture-${{ github.run_id }}-${{ github.run_attempt }}

      # Dead-man's switch: Better Stack alerts when this stops arriving. It
      # covers the case no failure notification can: the schedule never fired.
      - name: Ping Better Stack heartbeat
        if: steps.evaluate.outcome == 'success'
        env:
          POSTURE_HEARTBEAT_KEY: ${{ secrets.POSTURE_HEARTBEAT_KEY }}
        run: |
          source scripts/common_functions.sh
          ping_heartbeat "$POSTURE_HEARTBEAT_KEY" || true

      # Last on purpose: a threshold breach fails the run only after everything
      # above (summary, Telegram, baseline cache, heartbeat) has happened.
      - name: Enforce --fail-on threshold
        if: always() && steps.evaluate.outputs.rc == '3'
        env:
          FAIL_ON: ${{ inputs.fail_on }}
        run: |
          echo "Open findings at or above '${FAIL_ON}' — failing the run."
          exit 1
