name: TestBench

on:
  workflow_dispatch:
    inputs:
      server_type:
        description: 'Hetzner server type'
        required: true
        type: choice
        options:
          - cx33
          - cax21
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

jobs:
  bench:
    name: ${{ inputs.action == 'destroy' && 'Destroy' || 'Deploy' }} testhetz-${{ inputs.server_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.TESTHETZ_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/testhetz
          chmod 600 ~/.ssh/testhetz
          ssh-keygen -y -f ~/.ssh/testhetz > ~/.ssh/testhetz.pub
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/testhetz.pub)" >> "$GITHUB_ENV"

      - name: Deploy
        if: inputs.action == 'deploy'
        id: deploy
        working-directory: terraform/testhetz
        env:
          TF_VAR_hcloud_token: ${{ secrets.TESTHETZ_HCLOUD_TOKEN }}
          TF_VAR_server_type: ${{ inputs.server_type }}
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          terraform init -upgrade=false
          terraform apply -auto-approve

          IP=$(terraform output -raw server_ipv4)
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "✅ testhetz-${{ inputs.server_type }} created!"
          echo "   IP: $IP"
          echo "=========================================="

      - name: Wait for SSH
        if: inputs.action == 'deploy'
        env:
          IP: ${{ steps.deploy.outputs.server_ip }}
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
              -i ~/.ssh/testhetz "ubuntu@$IP" 'true' 2>/dev/null; then
              echo "SSH ready (attempt $i)"
              break
            fi
            [ "$i" -eq 30 ] && { echo "SSH timeout"; exit 1; }
            sleep 5
          done

      - name: Wait for cloud-init
        if: inputs.action == 'deploy'
        env:
          IP: ${{ steps.deploy.outputs.server_ip }}
        run: |
          echo "Waiting for cloud-init..."
          if ssh -i ~/.ssh/testhetz "ubuntu@$IP" \
            "timeout 300 cloud-init status --wait" 2>/dev/null; then
            echo "cloud-init done"
          else
            for j in $(seq 1 15); do
              st=$(ssh -i ~/.ssh/testhetz "ubuntu@$IP" \
                'cloud-init status 2>/dev/null || echo unknown' 2>/dev/null || echo unknown)
              [[ "$st" == *"status: done"* ]] && { echo "cloud-init done"; break; }
              [[ "$st" == *"status: error"* ]] && { echo "cloud-init error"; exit 1; }
              [ "$j" -eq 15 ] && { echo "cloud-init timeout"; exit 1; }
              sleep 5
            done
          fi

      - name: Done — ready to benchmark
        if: inputs.action == 'deploy'
        run: |
          echo ""
          echo "=========================================="
          echo "✅ testhetz-${{ inputs.server_type }} ready!"
          echo "   IP: ${{ steps.deploy.outputs.server_ip }}"
          echo "   SSH: ssh -i ~/.ssh/testhetz ubuntu@${{ steps.deploy.outputs.server_ip }}"
          echo "   Run: ssh ubuntu@${{ steps.deploy.outputs.server_ip }} 'cd Geekbench-* && ./geekbench6'"
          echo "=========================================="

      - name: Destroy
        if: inputs.action == 'destroy'
        working-directory: terraform/testhetz
        env:
          TF_VAR_hcloud_token: ${{ secrets.TESTHETZ_HCLOUD_TOKEN }}
          TF_VAR_server_type: ${{ inputs.server_type }}
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          terraform init -upgrade=false
          terraform destroy -auto-approve

          echo "=========================================="
          echo "✅ testhetz-${{ inputs.server_type }} destroyed!"
          echo "=========================================="
