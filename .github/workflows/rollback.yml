name: "[M] Rollback"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, dev-aws, dev-hetz, prod-hetz]
      confirm:
        description: 'Prod confirmation — type "rollback prod"'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: env-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ startsWith(inputs.environment, 'prod') && 'production' || '' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🚀 Start
        run: echo "Rollback started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - uses: $/.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}

      - uses: $/.github/actions/setup-terraform
        with:
          cli-config-credentials-token: ${{ secrets.TF_API_TOKEN }}

      - name: Record start time
        id: start
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Get server IP
        id: server-ip
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          ROLLBACK_ENV: ${{ inputs.environment }}
        run: |
          TF_TOKEN="$TF_API_TOKEN"

          ENV="$ROLLBACK_ENV"

          case "$ENV" in
            prod)
              export TF_TOKEN_app_terraform_io="$TF_TOKEN"
              export TF_WORKSPACE="prod"
              cd terraform/aws
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4)
              cd ../..
              ;;
            dev-aws)
              export TF_TOKEN_app_terraform_io="$TF_TOKEN"
              export TF_WORKSPACE="dev-aws"
              cd terraform/aws
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4 2>/dev/null || echo "")
              cd ../..
              ;;
            dev-hetz|prod-hetz)
              export TF_TOKEN_app_terraform_io="$TF_TOKEN"
              export TF_WORKSPACE="$ENV"
              cd terraform/hetzner
              terraform init -upgrade=false > /dev/null
              IP=$(terraform output -raw server_ipv4)
              cd ../..
              ;;
          esac

          if [ -z "$IP" ]; then
            echo "ERROR: Could not find IP for environment $ENV"
            exit 1
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Found server IP: $IP"

      - name: Validate prod confirmation
        if: inputs.environment == 'prod' || inputs.environment == 'prod-hetz'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "rollback prod" ]]; then
            echo "::error::To rollback prod you must set confirm = 'rollback prod'"
            exit 1
          fi
          echo "Prod rollback confirmed"

      - name: Restore latest backup
        id: restore
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SCRIPTS_DIR=$(grep -E '^scripts_dir_remote:' ansible/group_vars/all.yml | sed "s/.*: *\"//;s/\"$//")
          SCRIPTS_DIR="${SCRIPTS_DIR:-/home/ubuntu/Scripts}"
          OUTPUT=$(ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key \
              ubuntu@"$SERVER_IP" \
              "bash ${SCRIPTS_DIR}/RESTORE_ALL.sh --auto-latest" 2>&1)
          echo "$OUTPUT"
          # Parse summary lines (last occurrence of each)
          PROJECT=$(echo "$OUTPUT" | grep "^Project:" | tail -1 | sed 's/.*: //')
          DB=$(echo "$OUTPUT" | grep "^DB:" | tail -1 | sed 's/.*: //')
          REDIS=$(echo "$OUTPUT" | grep "^Redis:" | tail -1 | sed 's/.*: //')
          SITE=$(echo "$OUTPUT" | grep "^Site:" | tail -1 | sed 's/.*: //')
          TIME=$(echo "$OUTPUT" | grep "^Time:" | tail -1 | sed 's/.*: //')
          {
            echo "project=$PROJECT"
            echo "db=$DB"
            echo "redis=$REDIS"
            echo "site=$SITE"
            echo "time=$TIME"
          } >> "$GITHUB_OUTPUT"

      - name: Set domain
        id: domain
        env:
          DOMAIN_ENV: ${{ inputs.environment }}
        run: |
          ENV="$DOMAIN_ENV"
          case "$ENV" in
            prod)       DOMAIN="dreamseed.online" ;;
            prod-hetz)  DOMAIN="dreamseed.online" ;;
            dev-aws)    DOMAIN="aws.vitalikuts.online" ;;
            dev-hetz)   DOMAIN="hetz.vitalikuts.online" ;;
          esac
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Health check domain: $DOMAIN"

      - name: Health check
        id: health
        run: |
          DOMAIN="${{ steps.domain.outputs.domain }}"
          for i in 1 2 3 4 5; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 \
              "http://$DOMAIN" || echo "000")
            if [[ "$http_code" =~ ^(200|301|302)$ ]]; then
              echo "HTTP $http_code — OK"
              break
            fi
            echo "Attempt $i/5: HTTP $http_code, waiting 5s..."
            sleep 5
            if [[ $i -eq 5 ]]; then echo "HTTP health check failed"; exit 1; fi
          done
          for i in 1 2 3; do
            https_code=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 \
              "https://$DOMAIN" || echo "000")
            if [[ "$https_code" =~ ^(200|301|302)$ ]]; then
              echo "HTTPS $https_code — OK"
              exit 0
            fi
            echo "HTTPS attempt $i/3: $https_code, waiting 3s..."
            sleep 3
          done
          echo "HTTPS health check failed (HTTP was OK, SSL may be broken)"
          exit 1

      - name: Send completion notification
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          RESTORE_PROJECT: ${{ steps.restore.outputs.project }}
          RESTORE_DB: ${{ steps.restore.outputs.db }}
          RESTORE_REDIS: ${{ steps.restore.outputs.redis }}
          RESTORE_SITE: ${{ steps.restore.outputs.site }}
          RESTORE_TIME: ${{ steps.restore.outputs.time }}
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          RESTORE="${{ steps.restore.outcome }}"
          HEALTH="${{ steps.health.outcome }}"
          if [[ "$RESTORE" == "success" && "$HEALTH" == "success" ]]; then
            STATUS="✅ ROLLBACK OK"
          elif [[ "$RESTORE" != "success" ]]; then
            STATUS="❌ RESTORE FAILED"
          else
            STATUS="⚠️  SITE UNHEALTHY"
          fi
          MSG=$(printf '%s — Rollback Deploy\n📅 %s\n\n📝 Project: %s\n🗄️ DB: %s\n♻️ Redis: %s\n🌐 Site: %s\n⏱️ Time: %s\n🖥 %s %s' \
            "$STATUS" \
            "$(date '+%Y-%m-%d %H:%M')" \
            "$RESTORE_PROJECT" \
            "$RESTORE_DB" \
            "$RESTORE_REDIS" \
            "$RESTORE_SITE" \
            "$RESTORE_TIME" \
            "$SERVER_IP" \
            "$ENVIRONMENT")

          bash "$GITHUB_WORKSPACE/scripts/send_tg.sh" "$MSG" Markdown || true

      - name: Write job summary
        if: always()
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          RESTORE_PROJECT: ${{ steps.restore.outputs.project }}
          RESTORE_DB: ${{ steps.restore.outputs.db }}
          RESTORE_REDIS: ${{ steps.restore.outputs.redis }}
          RESTORE_SITE: ${{ steps.restore.outputs.site }}
          RESTORE_TIME: ${{ steps.restore.outputs.time }}
          SUMMARY_ENV: ${{ inputs.environment }}
        run: |
          RESTORE="${{ steps.restore.outcome }}"
          HEALTH="${{ steps.health.outcome }}"
          if [[ "$RESTORE" == "success" && "$HEALTH" == "success" ]]; then
            STATUS="✅ ROLLBACK OK"
          elif [[ "$RESTORE" != "success" ]]; then
            STATUS="❌ RESTORE FAILED"
          else
            STATUS="⚠️ SITE UNHEALTHY"
          fi

          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch || 0 }} ))

          M="$GITHUB_STEP_SUMMARY"
          {
            echo "## Rollback Deploy — ${STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Environment** | $SUMMARY_ENV |"
            echo "| **Server** | $SERVER_IP |"
            echo "| **Domain** | ${{ steps.domain.outputs.domain }} |"
            echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "### Restore"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Project | $RESTORE_PROJECT |"
            echo "| DB | $RESTORE_DB |"
            echo "| Redis | $RESTORE_REDIS |"
            echo "| Site | $RESTORE_SITE |"
            echo "| Duration | $RESTORE_TIME |"
          } >> "$M"

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          shred -u ~/.vault_pass_dreamseed 2>/dev/null || rm -f ~/.vault_pass_dreamseed
          rm -f ~/.ssh/deploy_key.pub
