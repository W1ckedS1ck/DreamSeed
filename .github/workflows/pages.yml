name: "[Docs] Publish Code Map to Pages"

on:
  push:
    branches: [main]
    paths:
      - docs/codemap/**
      - docs/*.md
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish code map
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/codemap/codemap.html _site/index.html
          cp docs/codemap/codemap.html _site/codemap.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment
