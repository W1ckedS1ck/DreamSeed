name: Infracost
on:
  pull_request:
    types: [opened, synchronize, closed, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          path: terraform/aws
