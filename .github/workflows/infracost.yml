name: Infracost

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}

      - uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - run: infracost breakdown --path=terraform/aws --path=terraform/hetzner --format=json --out-file=/tmp/base.json

      - name: Print breakdown cost
        run: python3 scripts/infracost_summary.py

      - uses: actions/checkout@v4

      - run: infracost diff --path=terraform/aws --path=terraform/hetzner --format=json --compare-to=/tmp/base.json --out-file=/tmp/diff.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: infracost comment github --path=/tmp/diff.json --repo=${{ github.repository }} --github-token=${{ github.token }} --pull-request=${{ github.event.pull_request.number }} --behavior=update

      - name: Print cost estimate
        if: github.event_name != 'pull_request'
        run: cat /tmp/diff.json | python3 -m json.tool || true
