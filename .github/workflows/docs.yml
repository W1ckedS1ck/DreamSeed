name: "[Docs] Code Map + Wiki Sync"

on:
  push:
    branches: [main, dev]
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'scripts/**'
      - '.github/**'
      - 'lib/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codemap-freshness:
    name: Code Map freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Regenerate code map and verify committed copy matches
        run: |
          # --check compares fresh build vs committed, ignoring volatile fields.
          python3 docs/codemap/gen_codemap.py --check

  publish-code-map:
    # Pages site stays main-only; dev only syncs the wiki (see sync-wiki).
    if: github.ref_name == 'main'
    name: Publish Code Map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Regenerate code map
        run: python3 docs/codemap/gen_codemap.py

      - name: Warn if committed copy is stale
        run: |
          if ! git diff --quiet -- docs/codemap/codemap.html docs/codemap/codemap.json docs/codemap/codemap.lock; then
            M="${GITHUB_STEP_SUMMARY:-}"
            if [ -n "$M" ]; then
              echo "> The committed \`codemap.*\` copy is older than this run. To keep the repo in sync, run \`python3 docs/codemap/gen_codemap.py\` locally and commit the result." >> "$M"
            fi
          fi

      - name: Write job summary
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, sys
          with open("docs/codemap/codemap.json") as fh:
              doc = json.load(fh)
          nodes = len(doc["nodes"])
          edges = len(doc["edges"])
          flows = len(doc["flows"])
          graph = doc["graph_hash"]
          sha = doc["generated_from_commit"][:12]
          owner, name = os.environ["REPO"].split("/")
          generator = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/blob/main/docs/codemap/gen_codemap.py"
          summary = (
              f"**Codemap:** {nodes} nodes · {edges} edges · {flows} flows\n\n"
              f"`graph {graph}` · commit `{sha}`\n\n"
              f"[Pages site](https://{owner}.github.io/{name}/) · [generator]({generator})\n"
          )
          with open(sys.argv[1], "a") as out:
              out.write(summary)
          PY

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/codemap/codemap.html _site/index.html
          cp docs/codemap/codemap.html _site/codemap.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment

  sync-wiki:
    name: Sync to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: wiki-sync
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync docs
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp repo/docs/*.md wiki/ 2>/dev/null || true
          rm -rf wiki/adr && cp -r repo/docs/adr wiki/adr 2>/dev/null || true
          rm -f wiki/private.md wiki/.DS_Store 2>/dev/null || true

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "count=$(git status --porcelain | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "Sync docs/ from ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git push

      - name: Write job summary
        run: |
          {
            echo "**Wiki sync:** ${{ steps.sync.outputs.count }} file(s) pushed to the wiki from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:12}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
