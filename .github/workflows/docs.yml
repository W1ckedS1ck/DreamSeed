name: "[Docs] Code Map + Wiki Sync"

on:
  push:
    branches: [main, dev]
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'scripts/**'
      - '.github/**'
      - 'lib/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-code-map:
    # Pages site stays main-only; dev only syncs the wiki (see sync-wiki).
    if: github.ref_name == 'main'
    name: Publish Code Map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same group as deploy.yml/test-restore.yml — all three replace the whole
    # Pages site, so they must serialize instead of racing each other.
    concurrency:
      group: pages-site
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Regenerate code map
        run: python3 docs/codemap/gen_codemap.py

      - name: Write job summary
        env:
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, sys
          with open("docs/codemap/codemap.json") as fh:
              doc = json.load(fh)
          nodes = len(doc["nodes"])
          edges = len(doc["edges"])
          flows = len(doc["flows"])
          graph = doc["graph_hash"]
          sha = doc["generated_from_commit"][:12]
          owner, name = os.environ["REPO"].split("/")
          generator = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/blob/main/docs/codemap/gen_codemap.py"
          summary = (
              f"**Codemap:** {nodes} nodes · {edges} edges · {flows} flows\n\n"
              f"`graph {graph}` · commit `{sha}`\n\n"
              f"[Pages site](https://{owner}.github.io/{name}/) · [generator]({generator})\n"
          )
          with open(sys.argv[1], "a") as out:
              out.write(summary)
          PY

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/codemap/codemap.html _site/index.html
          cp docs/codemap/codemap.html _site/codemap.html

      # Pages artifacts replace the whole site: absorb the newest live-site
      # artifacts first, then keep this run's files — publishing can only ever
      # grow the site (screenshots from deploy/restore runs must survive).
      - name: Merge with the currently live site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=20" --jq '([.artifacts[] | select(.expired == false) | .workflow_run.id] | unique | .[0:9] | .[])')
          merged=0
          for id in $IDS; do
            if [ "$id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            dl="/tmp/pages-site-live-$id"
            if ! gh run download "$id" -n github-pages -D "$dl"; then
              echo "::warning::could not download live site artifact from run $id"
              continue
            fi
            # upload-pages-artifact ships one tarball, not loose files — unpack
            # it, or the union would copy artifact.tar instead of the site.
            mkdir -p "$dl/site"
            if ! tar -xf "$dl/artifact.tar" -C "$dl/site"; then
              echo "::warning::could not unpack live site artifact from run $id"
              continue
            fi
            # older publishes leaked artifact.tar into the site — never re-add it
            find "$dl/site" -name artifact.tar -delete
            # --update=none: never clobber the code map this run just built
            cp -r --update=none "$dl/site/." _site/
            merged=$((merged + 1))
          done
          if [ "$merged" -eq 0 ]; then
            echo "::warning::no previous site artifact merged — this publish may replace existing files"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          # Default is 1 day: the merge chain above can only union artifacts that
          # still exist, so a quiet >24h stretch would reset the site.
          retention-days: 7

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment

  sync-wiki:
    name: Sync to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: wiki-sync
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync docs
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp repo/docs/*.md wiki/ 2>/dev/null || true
          rm -rf wiki/adr && cp -r repo/docs/adr wiki/adr 2>/dev/null || true
          rm -f wiki/private.md wiki/.DS_Store 2>/dev/null || true

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "count=$(git status --porcelain | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "Sync docs/ from ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          # Token-free remote URL: GH_TOKEN is expanded only inside the
          # credential helper (from env), never appearing in git's argv or in
          # .git/config the way an https://x-access-token@ URL would.
          git remote set-url origin "https://github.com/${{ github.repository }}.wiki.git"
          # shellcheck disable=SC2016 # ${GH_TOKEN} must expand inside the helper, not here
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f' push

      - name: Write job summary
        run: |
          {
            echo "**Wiki sync:** ${{ steps.sync.outputs.count }} file(s) pushed to the wiki from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:12}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
