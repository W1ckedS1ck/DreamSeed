name: "[Docs] Code Map + Wiki Sync"

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'scripts/**'
      - '.github/**'
      - 'lib/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-code-map:
    name: Publish Code Map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Regenerate code map
        run: python3 docs/codemap/gen_codemap.py

      - name: Warn if committed copy is stale
        run: |
          if ! git diff --quiet -- docs/codemap/codemap.html docs/codemap/codemap.json docs/codemap/codemap.lock; then
            M="${GITHUB_STEP_SUMMARY:-}"
            if [ -n "$M" ]; then
              echo "> The committed \`codemap.*\` copy is older than this run. To keep the repo in sync, run \`python3 docs/codemap/gen_codemap.py\` locally and commit the result." >> "$M"
            fi
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/codemap/codemap.html _site/index.html
          cp docs/codemap/codemap.html _site/codemap.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment

  sync-wiki:
    name: Sync to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp repo/docs/*.md wiki/ 2>/dev/null || true
          rm -f wiki/private.md wiki/.DS_Store 2>/dev/null || true

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi

          git add -A
          git commit -m "Sync docs/ from main (${{ github.sha }})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git push
