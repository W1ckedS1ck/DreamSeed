name: Cloudflare Cache Rules

on:
  workflow_dispatch:
    inputs:
      zone:
        description: 'Cloudflare zone (domain)'
        required: true
        type: choice
        options:
          - aws.vitalikuts.online
          - dreamseed.online
          - hetz.vitalikuts.online
      action:
        description: 'Plan (safe — no changes), Apply, or Destroy'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

concurrency:
  group: cloudflare-cache-${{ inputs.zone }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cache-rules:
    name: Cloudflare Cache — ${{ inputs.zone }} (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349458ad0a1e2e3ac98506f32caae53 # v3
        with:
          terraform_version: "1.11.3"

      - name: Write terraform.tfvars.json
        working-directory: terraform/cloudflare
        env:
          ZONE: ${{ inputs.zone }}
        run: |
          if [[ "$ZONE" == "aws.vitalikuts.online" || "$ZONE" == "hetz.vitalikuts.online" ]]; then
            TOKEN="${{ secrets.DEV_CLOUDFLARE_API_TOKEN }}"
          elif [[ "$ZONE" == "dreamseed.online" ]]; then
            TOKEN="${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}"
          else
            echo "Unknown zone: $ZONE"
            exit 1
          fi
          jq -n \
            --arg token "$TOKEN" \
            --arg zone "$ZONE" \
            '{cloudflare_api_token: $token, zone_name: $zone}' \
            > terraform.tfvars.json

      - name: Terraform Init
        working-directory: terraform/cloudflare
        run: terraform init

      - name: Terraform Plan (apply)
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: terraform/cloudflare
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee tfplan.txt
          echo "has_changes=$([ -s tfplan.txt ] && grep -q 'No changes.' tfplan.txt || echo 'true')" >> "$GITHUB_OUTPUT"

      - name: Summary — Plan
        if: inputs.action == 'plan'
        run: |
          {
            echo "## ☁️ Cloudflare Cache Rules — Plan for ${{ inputs.zone }}"
            echo ""
            echo "**Action:** Plan only — no changes made"
            echo ""
            echo '```'
            cat terraform/cloudflare/tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: terraform/cloudflare
        run: terraform apply -auto-approve tfplan

      - name: Summary — Apply
        if: inputs.action == 'apply'
        run: |
          {
            echo "## ☁️ Cloudflare Cache Rules — Applied for ${{ inputs.zone }}"
            echo ""
            echo "| Rule | Effect |"
            echo "|------|--------|"
            echo "| \`/manager/*\` | Bypass cache (admin area) |"
            echo "| Cookie \`PHPSESSID\` | Bypass cache (logged-in users) |"
            echo "| Everything else | Cache with Edge TTL 1h |"
            echo ""
            echo '```'
            terraform -chdir=terraform/cloudflare output -json
            echo '```'
            echo ""
            echo "### ✅ How to revert"
            echo "Run this workflow again with **destroy** action, or delete rules manually:"
            echo "Cloudflare Dashboard → Rules → Cache Rules"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan (destroy)
        if: inputs.action == 'destroy'
        working-directory: terraform/cloudflare
        run: terraform plan -destroy -no-color -out=tfdestroy 2>&1 | tee tfdestroy.txt

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: terraform/cloudflare
        run: terraform apply -auto-approve tfdestroy

      - name: Summary — Destroy
        if: inputs.action == 'destroy'
        run: |
          {
            echo "## ☁️ Cloudflare Cache Rules — Destroyed for ${{ inputs.zone }}"
            echo ""
            echo "All cache rules have been removed. Back to default Cloudflare behavior."
            echo ""
            echo '```'
            cat terraform/cloudflare/tfdestroy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
