name: "CF Purge (one-shot)"

# Temporary helper: purges the whole Cloudflare zone from CI, because the
# token lives only in repository secrets. Runs only when the pushed commit
# message contains the "[cf-purge]" marker, so normal pushes are unaffected.
# Safe to delete once the deploy workflow purges on its own.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[cf-purge]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge dreamseed.online
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          ZONE="dreamseed.online"
          # Zone IDs are not secret (see CLAUDE.md); using the id directly avoids
          # the GET /zones listing call, which is rate limited (HTTP 429).
          ZONE_ID="3f6dd6599b5b95ee73a0e08b70292858"

          if [[ -z "${CF_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi

          echo "Purging $ZONE ($ZONE_ID)"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -m 30 -o /tmp/purge.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"purge_everything":true}' \
              "$API/zones/$ZONE_ID/purge_cache")
            echo "attempt $attempt -> HTTP $code"
            cat /tmp/purge.json | jq -c '{success, errors}' || true
            if [[ "$code" == "200" ]] && jq -e '.success == true' >/dev/null < /tmp/purge.json; then
              exit 0
            fi
            [[ "$code" == "429" ]] || exit 1
            sleep $(( attempt * 5 ))
          done

          echo "::error::Cloudflare purge failed after retries"
          exit 1
