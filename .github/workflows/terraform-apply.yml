name: "[M] TF: Infra + Cloudflare"

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options: [aws, hetzner, cloudflare]
      workspace:
        description: 'Terraform workspace'
        required: true
        type: choice
        options: [dev-aws, prod, dev-hetz, prod-hetz, cloudflare, cloudflare-prod]
      mode:
        description: 'Apply mode'
        required: true
        type: choice
        options: [apply, refresh-only]
        default: apply

concurrency:
  group: env-${{ inputs.workspace }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: TF ${{ inputs.mode }} ${{ inputs.workspace }} (${{ inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ (startsWith(inputs.workspace, 'prod') || inputs.workspace == 'cloudflare-prod') && 'production' || '' }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🚀 Start
        run: echo "Terraform apply started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Mask secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HETZ_PROD: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HETZ_DEV: ${{ secrets.HCLOUD_TOKEN }}
          SSH_KEY: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
        run: |
          for v in "$CF_TOKEN" "$HETZ_PROD" "$HETZ_DEV" "$SSH_KEY"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done

      - uses: ./.github/actions/setup-terraform

      - name: Record start time
        id: start
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set provider env vars
        env:
          PROV: ${{ inputs.provider }}
          WS: ${{ inputs.workspace }}
          PROD_ACCESS_KEY: ${{ secrets.PROD_ACCESS_KEY }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_REGION: ${{ secrets.PROD_REGION }}
          DEV_AWS_ACCESS_KEY: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          DEV_AWS_SECRET_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          DEV_AWS_REGION: ${{ secrets.DEV_AWS_REGION }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_HETZ_TOKEN: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HETZ_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          write_env() { printf '%s\n' "$1" >> "$GITHUB_ENV"; }
          write_env "TF_DIR=terraform/$PROV"
          write_env "TF_WORKSPACE=$WS"
          case "$WS" in
            prod*)
              IS_PROD=true
              ;;
            *)
              IS_PROD=false
              ;;
          esac
          if [ "$PROV" = "aws" ]; then
            if [ "$IS_PROD" = "true" ]; then
              write_env "AWS_ACCESS_KEY_ID=$PROD_ACCESS_KEY"
              write_env "AWS_SECRET_ACCESS_KEY=$PROD_SECRET_KEY"
              write_env "AWS_DEFAULT_REGION=$PROD_REGION"
            else
              write_env "AWS_ACCESS_KEY_ID=$DEV_AWS_ACCESS_KEY"
              write_env "AWS_SECRET_ACCESS_KEY=$DEV_AWS_SECRET_KEY"
              write_env "AWS_DEFAULT_REGION=$DEV_AWS_REGION"
            fi
            write_env "TF_VAR_environment=$WS"
          fi
          if [ "$PROV" = "cloudflare" ]; then
            write_env "TF_VAR_cloudflare_api_token=$CF_TOKEN"
            case "$WS" in
              cloudflare-prod) write_env "TF_VAR_domain=dreamseed.online" ;;
              *)              write_env "TF_VAR_domain=vitalikuts.online" ;;
            esac
          fi
          if [ "$PROV" = "hetzner" ]; then
            if [ "$IS_PROD" = "true" ]; then
              write_env "TF_VAR_hcloud_token=$PROD_HETZ_TOKEN"
              write_env "TF_VAR_server_type=cx33"
              write_env "TF_VAR_ssh_key_name=Vitali.pub"
              write_env "TF_VAR_enable_primary_ip=true"
            else
              write_env "TF_VAR_hcloud_token=$HETZ_TOKEN"
              write_env "TF_VAR_server_type=cx23"
              write_env "TF_VAR_ssh_key_name=Vitali.pub"
              write_env "TF_VAR_primary_ip_name=primary_ip-1"
            fi
            write_env "TF_VAR_environment=$WS"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Remove stale resources from state
        if: inputs.mode == 'refresh-only' && inputs.provider == 'hetzner'
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: |
          terraform state rm hcloud_primary_ip.main 2>/dev/null || true
          terraform state rm hcloud_ssh_key.ci_key 2>/dev/null || true
          terraform state rm hcloud_ssh_key.ci_key[0] 2>/dev/null || true
          echo "Stale resources removed from state"

      - name: Terraform ${{ inputs.mode }}
        working-directory: ${{ env.TF_DIR }}
        env:
          SSH_KEY_SECRET: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
        run: |
          MODE_FLAG=""
          [ "${{ inputs.mode }}" = "refresh-only" ] && MODE_FLAG="-refresh-only"
          if [ "${{ inputs.provider }}" = "aws" ]; then
            case "${{ inputs.workspace }}" in
              prod)    : ;;
              dev-aws) : ;;
              *)       echo "::error::Unknown workspace ${{ inputs.workspace }} for AWS provider"; exit 1 ;;
            esac
            echo "$SSH_KEY_SECRET" > /tmp/key.pub
            terraform apply -auto-approve -input=false $MODE_FLAG \
              -var="ssh_public_key_path=/tmp/key.pub" \
              -var="environment=${{ inputs.workspace }}"
          elif [ "${{ inputs.provider }}" = "cloudflare" ]; then
            terraform apply -auto-approve -input=false $MODE_FLAG
          else
            terraform apply -auto-approve -input=false $MODE_FLAG \
              -var="environment=${{ inputs.workspace }}"
          fi

      - name: Write job summary
        if: always()
        run: |
          MODE="${{ inputs.mode }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))
          RESULT="${{ job.status == 'success' && '✅' || '❌' }}"

          M="$GITHUB_STEP_SUMMARY"
          {
            echo "## Terraform ${MODE} ${RESULT}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Provider** | ${{ inputs.provider }} |"
            echo "| **Workspace** | ${{ inputs.workspace }} |"
            echo "| **Mode** | ${MODE} |"
            echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$M"
