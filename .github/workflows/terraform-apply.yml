name: Terraform Apply (no Ansible)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options: [aws, hetzner, cloudflare]
      workspace:
        description: 'Terraform workspace'
        required: true
        type: choice
        options: [dev-aws, prod, dev-hetz, prod-hetz, cloudflare, cloudflare-prod]
      mode:
        description: 'Apply mode'
        required: true
        type: choice
        options: [apply, refresh-only]
        default: apply

concurrency:
  group: tf-${{ inputs.workspace }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    name: TF ${{ inputs.mode }} ${{ inputs.workspace }} (${{ inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-terraform

      - name: Record start time
        id: start
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set provider env vars
        run: |
          echo "TF_DIR=terraform/${{ inputs.provider }}" >> "$GITHUB_ENV"
          echo "TF_WORKSPACE=${{ inputs.workspace }}" >> "$GITHUB_ENV"
          case "${{ inputs.workspace }}" in
            prod*)
              IS_PROD=true
              ;;
            *)
              IS_PROD=false
              ;;
          esac
          if [ "${{ inputs.provider }}" = "aws" ]; then
            if [ "$IS_PROD" = "true" ]; then
              echo "AWS_ACCESS_KEY_ID=${{ secrets.PROD_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.PROD_SECRET_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=${{ secrets.PROD_REGION }}" >> "$GITHUB_ENV"
              echo "TF_VAR_elastic_ip_allocation_id=${{ secrets.PROD_EIP }}" >> "$GITHUB_ENV"
            else
              echo "AWS_ACCESS_KEY_ID=${{ secrets.DEV_AWS_ACCESS_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_AWS_SECRET_KEY }}" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=${{ secrets.DEV_AWS_REGION }}" >> "$GITHUB_ENV"
              echo "TF_VAR_elastic_ip_allocation_id=${{ secrets.DEV_AWS_EIP }}" >> "$GITHUB_ENV"
            fi
            echo "TF_VAR_environment=${{ inputs.workspace }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.provider }}" = "cloudflare" ]; then
            echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> "$GITHUB_ENV"
            case "${{ inputs.workspace }}" in
              cloudflare-prod) echo "TF_VAR_domain=dreamseed.online" >> "$GITHUB_ENV" ;;
              *)              echo "TF_VAR_domain=vitalikuts.online" >> "$GITHUB_ENV" ;;
            esac
          fi
          if [ "${{ inputs.provider }}" = "hetzner" ]; then
            if [ "$IS_PROD" = "true" ]; then
              echo "TF_VAR_hcloud_token=${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}" >> "$GITHUB_ENV"
            else
              echo "TF_VAR_hcloud_token=${{ secrets.HCLOUD_TOKEN }}" >> "$GITHUB_ENV"
              echo "TF_VAR_server_type=cx23" >> "$GITHUB_ENV"
            fi
            echo "TF_VAR_environment=${{ inputs.workspace }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Remove stale resources from state
        if: inputs.mode == 'refresh-only' && inputs.provider == 'hetzner'
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: |
          terraform state rm hcloud_primary_ip.main 2>/dev/null || true
          terraform state rm hcloud_ssh_key.ci_key 2>/dev/null || true
          terraform state rm hcloud_ssh_key.ci_key[0] 2>/dev/null || true
          echo "Stale resources removed from state"

      - name: Terraform ${{ inputs.mode }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          MODE_FLAG=""
          [ "${{ inputs.mode }}" = "refresh-only" ] && MODE_FLAG="-refresh-only"
          if [ "${{ inputs.provider }}" = "aws" ]; then
            case "${{ inputs.workspace }}" in
              prod)    SSH_KEY_SECRET="${{ secrets.VITALI_SSH_PUBLIC_KEY }}" ;;
              dev-aws) SSH_KEY_SECRET="${{ secrets.VITALI_SSH_PUBLIC_KEY }}" ;;
              *)       echo "::error::Unknown workspace ${{ inputs.workspace }} for AWS provider"; exit 1 ;;
            esac
            echo "$SSH_KEY_SECRET" > /tmp/key.pub
            terraform apply -auto-approve -input=false $MODE_FLAG \
              -var="ssh_public_key_path=/tmp/key.pub" \
              -var="environment=${{ inputs.workspace }}"
          elif [ "${{ inputs.provider }}" = "cloudflare" ]; then
            terraform apply -auto-approve -input=false $MODE_FLAG
          else
            terraform apply -auto-approve -input=false $MODE_FLAG \
              -var="ssh_key_name=" \
              -var="ssh_public_key=" \
              -var="environment=${{ inputs.workspace }}"
          fi

      - name: Write job summary
        if: always()
        run: |
          MODE="${{ inputs.mode }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))
          RESULT="${{ job.status == 'success' && '✅' || '❌' }}"

          M="$GITHUB_STEP_SUMMARY"
          echo "## Terraform ${MODE} ${RESULT}" >> "$M"
          echo "" >> "$M"
          echo "| | |" >> "$M"
          echo "|---|---|" >> "$M"
          echo "| **Provider** | ${{ inputs.provider }} |" >> "$M"
          echo "| **Workspace** | ${{ inputs.workspace }} |" >> "$M"
          echo "| **Mode** | ${MODE} |" >> "$M"
          echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |" >> "$M"
          echo "| **Commit** | ${{ github.sha }} |" >> "$M"
          echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> "$M"
