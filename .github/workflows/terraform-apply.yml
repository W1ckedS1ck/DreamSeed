name: "[M] TF: Infra + Cloudflare"

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options: [aws, hetzner, cloudflare]
      workspace:
        description: 'Terraform workspace'
        required: true
        type: choice
        options: [dev-aws, prod, dev-hetz, prod-hetz, cloudflare, cloudflare-prod]
      mode:
        description: 'Apply mode'
        required: true
        type: choice
        options: [apply, refresh-only]
        default: apply

concurrency:
  group: env-${{ inputs.workspace }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: TF plan ${{ inputs.workspace }} (${{ inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      plan_fp: ${{ steps.plan.outputs.plan_fp }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🚀 Start
        run: echo "Terraform plan started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Mask secrets
        uses: $/.github/actions/mask-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_HETZ_HCLOUD_TOKEN: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          VITALI_SSH_PUBLIC_KEY: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
        with:
          vars: |
            CLOUDFLARE_API_TOKEN
            PROD_HETZ_HCLOUD_TOKEN
            HCLOUD_TOKEN
            VITALI_SSH_PUBLIC_KEY

      - uses: $/.github/actions/setup-terraform

      - name: Set provider env vars
        env:
          PROV: ${{ inputs.provider }}
          WS: ${{ inputs.workspace }}
          PROD_ACCESS_KEY: ${{ secrets.PROD_ACCESS_KEY }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_REGION: ${{ secrets.PROD_REGION }}
          DEV_AWS_ACCESS_KEY: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          DEV_AWS_SECRET_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          DEV_AWS_REGION: ${{ secrets.DEV_AWS_REGION }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_HETZ_TOKEN: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HETZ_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          write_env() { printf '%s\n' "$1" >> "$GITHUB_ENV"; }
          write_env "TF_DIR=terraform/$PROV"
          write_env "TF_WORKSPACE=$WS"
          case "$WS" in
            prod*)
              IS_PROD=true
              ;;
            *)
              IS_PROD=false
              ;;
          esac
          if [ "$PROV" = "aws" ]; then
            if [ "$IS_PROD" = "true" ]; then
              write_env "AWS_ACCESS_KEY_ID=$PROD_ACCESS_KEY"
              write_env "AWS_SECRET_ACCESS_KEY=$PROD_SECRET_KEY"
              write_env "AWS_DEFAULT_REGION=$PROD_REGION"
            else
              write_env "AWS_ACCESS_KEY_ID=$DEV_AWS_ACCESS_KEY"
              write_env "AWS_SECRET_ACCESS_KEY=$DEV_AWS_SECRET_KEY"
              write_env "AWS_DEFAULT_REGION=$DEV_AWS_REGION"
            fi
            write_env "TF_VAR_environment=$WS"
          fi
          if [ "$PROV" = "cloudflare" ]; then
            write_env "TF_VAR_cloudflare_api_token=$CF_TOKEN"
            case "$WS" in
              cloudflare-prod) write_env "TF_VAR_domain=dreamseed.online" ;;
              *)              write_env "TF_VAR_domain=vitalikuts.online" ;;
            esac
          fi
          if [ "$PROV" = "hetzner" ]; then
            if [ "$IS_PROD" = "true" ]; then
              write_env "TF_VAR_hcloud_token=$PROD_HETZ_TOKEN"
              write_env "TF_VAR_server_type=cx33"
              write_env "TF_VAR_ssh_key_name=Vitali.pub"
              write_env "TF_VAR_enable_primary_ip=true"
            else
              write_env "TF_VAR_hcloud_token=$HETZ_TOKEN"
              write_env "TF_VAR_server_type=cx23"
              write_env "TF_VAR_os_image=${{ vars.DEV_HETZ_OS_IMAGE || 'ubuntu-24.04' }}"
              write_env "TF_VAR_ssh_key_name=Vitali.pub"
              write_env "TF_VAR_primary_ip_name=primary_ip-1"
            fi
            write_env "TF_VAR_environment=$WS"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        env:
          SSH_KEY_SECRET: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          TF_MODE: ${{ inputs.mode }}
          PROV: ${{ inputs.provider }}
          WS: ${{ inputs.workspace }}
        run: |
          MODE_FLAG=""
          [ "$TF_MODE" = "refresh-only" ] && MODE_FLAG="-refresh-only"
          EXTRA_VARS=()
          if [ "$PROV" = "aws" ]; then
            case "$WS" in
              prod)    : ;;
              dev-aws) : ;;
              *)       echo "::error::Unknown workspace $WS for AWS provider"; exit 1 ;;
            esac
            echo "$SSH_KEY_SECRET" > /tmp/key.pub
            EXTRA_VARS+=(-var="ssh_public_key_path=/tmp/key.pub" -var="environment=$WS")
          elif [ "$PROV" = "hetzner" ]; then
            EXTRA_VARS+=(-var="environment=$WS")
          fi
          # TFC remote backend can't save a plan; fingerprint the diff so apply can verify it.
          terraform plan -no-color -input=false -detailed-exitcode -lock-timeout=10m $MODE_FLAG \
            "${EXTRA_VARS[@]}" 2>&1 | tee /tmp/plan.txt
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) echo "Plan: no changes" ;;
            2) echo "Plan: changes detected — review the diff in the job summary, then approve apply" ;;
            *) echo "::error::terraform plan failed (rc=$rc)"; exit "$rc" ;;
          esac
          # Hash the change set only (skip refresh noise); empty diff = stable constant.
          PLAN_FP=$(awk '/Terraform will perform the following actions|Changes to Outputs:|Note: Objects have changed outside of Terraform/{p=1} p && (/^[[:space:]]*(#|[~+-]) / || /^Plan:/ || /^Changes to Outputs/ || /^No changes\./)' /tmp/plan.txt | sha256sum | cut -d' ' -f1)
          echo "plan_fp=$PLAN_FP" >> "$GITHUB_OUTPUT"
          echo "Plan fingerprint: $PLAN_FP"

      - name: Write plan summary
        if: always()
        env:
          TF_MODE: ${{ inputs.mode }}
          TF_PROVIDER: ${{ inputs.provider }}
          TF_WORKSPACE_IN: ${{ inputs.workspace }}
        run: |
          M="$GITHUB_STEP_SUMMARY"
          {
            echo "## Terraform plan — $TF_PROVIDER / $TF_WORKSPACE_IN (${TF_MODE})"
            echo ""
            if [ -f /tmp/plan.txt ]; then
              echo '```'
              cat /tmp/plan.txt
              echo '```'
            else
              echo "_Plan failed — no diff available._"
            fi
          } >> "$M"

  apply:
    name: TF ${{ inputs.mode }} ${{ inputs.workspace }} (${{ inputs.provider }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ (startsWith(inputs.workspace, 'prod') || inputs.workspace == 'cloudflare-prod') && 'production' || '' }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🚀 Start
        run: echo "Terraform apply started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Mask secrets
        uses: $/.github/actions/mask-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_HETZ_HCLOUD_TOKEN: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          VITALI_SSH_PUBLIC_KEY: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
        with:
          vars: |
            CLOUDFLARE_API_TOKEN
            PROD_HETZ_HCLOUD_TOKEN
            HCLOUD_TOKEN
            VITALI_SSH_PUBLIC_KEY

      - uses: $/.github/actions/setup-terraform

      - name: Record start time
        id: start
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set provider env vars
        env:
          PROV: ${{ inputs.provider }}
          WS: ${{ inputs.workspace }}
          PROD_ACCESS_KEY: ${{ secrets.PROD_ACCESS_KEY }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_REGION: ${{ secrets.PROD_REGION }}
          DEV_AWS_ACCESS_KEY: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          DEV_AWS_SECRET_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          DEV_AWS_REGION: ${{ secrets.DEV_AWS_REGION }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD_HETZ_TOKEN: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HETZ_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          write_env() { printf '%s\n' "$1" >> "$GITHUB_ENV"; }
          write_env "TF_DIR=terraform/$PROV"
          write_env "TF_WORKSPACE=$WS"
          case "$WS" in
            prod*)
              IS_PROD=true
              ;;
            *)
              IS_PROD=false
              ;;
          esac
          if [ "$PROV" = "aws" ]; then
            if [ "$IS_PROD" = "true" ]; then
              write_env "AWS_ACCESS_KEY_ID=$PROD_ACCESS_KEY"
              write_env "AWS_SECRET_ACCESS_KEY=$PROD_SECRET_KEY"
              write_env "AWS_DEFAULT_REGION=$PROD_REGION"
            else
              write_env "AWS_ACCESS_KEY_ID=$DEV_AWS_ACCESS_KEY"
              write_env "AWS_SECRET_ACCESS_KEY=$DEV_AWS_SECRET_KEY"
              write_env "AWS_DEFAULT_REGION=$DEV_AWS_REGION"
            fi
            write_env "TF_VAR_environment=$WS"
          fi
          if [ "$PROV" = "cloudflare" ]; then
            write_env "TF_VAR_cloudflare_api_token=$CF_TOKEN"
            case "$WS" in
              cloudflare-prod) write_env "TF_VAR_domain=dreamseed.online" ;;
              *)              write_env "TF_VAR_domain=vitalikuts.online" ;;
            esac
          fi
          if [ "$PROV" = "hetzner" ]; then
            if [ "$IS_PROD" = "true" ]; then
              write_env "TF_VAR_hcloud_token=$PROD_HETZ_TOKEN"
              write_env "TF_VAR_server_type=cx33"
              write_env "TF_VAR_ssh_key_name=Vitali.pub"
              write_env "TF_VAR_enable_primary_ip=true"
            else
              write_env "TF_VAR_hcloud_token=$HETZ_TOKEN"
              write_env "TF_VAR_server_type=cx23"
              write_env "TF_VAR_os_image=${{ vars.DEV_HETZ_OS_IMAGE || 'ubuntu-24.04' }}"
              write_env "TF_VAR_ssh_key_name=Vitali.pub"
              write_env "TF_VAR_primary_ip_name=primary_ip-1"
            fi
            write_env "TF_VAR_environment=$WS"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Verify the approved plan is unchanged
        working-directory: ${{ env.TF_DIR }}
        env:
          SSH_KEY_SECRET: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          TF_MODE: ${{ inputs.mode }}
          PROV: ${{ inputs.provider }}
          WS: ${{ inputs.workspace }}
          APPROVED_FP: ${{ needs.plan.outputs.plan_fp }}
        run: |
          MODE_FLAG=""
          [ "$TF_MODE" = "refresh-only" ] && MODE_FLAG="-refresh-only"
          EXTRA_VARS=()
          if [ "$PROV" = "aws" ]; then
            case "$WS" in
              prod)    : ;;
              dev-aws) : ;;
              *)       echo "::error::Unknown workspace $WS for AWS provider"; exit 1 ;;
            esac
            echo "$SSH_KEY_SECRET" > /tmp/key.pub
            EXTRA_VARS+=(-var="ssh_public_key_path=/tmp/key.pub" -var="environment=$WS")
          elif [ "$PROV" = "hetzner" ]; then
            EXTRA_VARS+=(-var="environment=$WS")
          fi
          # Re-plan and compare with the approved change set.
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -lock-timeout=10m $MODE_FLAG \
            "${EXTRA_VARS[@]}" > /tmp/plan-apply.txt 2>&1
          rc=$?
          set -e
          case "$rc" in
            0|2) ;;
            *) cat /tmp/plan-apply.txt; echo "::error::terraform plan failed (rc=$rc)"; exit "$rc" ;;
          esac
          FP=$(awk '/Terraform will perform the following actions|Changes to Outputs:|Note: Objects have changed outside of Terraform/{p=1} p && (/^[[:space:]]*(#|[~+-]) / || /^Plan:/ || /^Changes to Outputs/ || /^No changes\./)' /tmp/plan-apply.txt | sha256sum | cut -d' ' -f1)
          echo "approved=$APPROVED_FP"
          echo "current =$FP"
          if [ "$FP" != "$APPROVED_FP" ]; then
            echo "::error::Infrastructure changed after the plan was approved — refusing to apply"
            exit 1
          fi
          echo "Plan fingerprint matches the approved plan"

      - name: Terraform ${{ inputs.mode }}
        working-directory: ${{ env.TF_DIR }}
        env:
          SSH_KEY_SECRET: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          TF_MODE: ${{ inputs.mode }}
          PROV: ${{ inputs.provider }}
          WS: ${{ inputs.workspace }}
        run: |
          # Change set verified above; apply re-plans (TFC cannot apply a saved plan).
          MODE_FLAG=""
          [ "$TF_MODE" = "refresh-only" ] && MODE_FLAG="-refresh-only"
          EXTRA_VARS=()
          if [ "$PROV" = "aws" ]; then
            case "$WS" in
              prod)    : ;;
              dev-aws) : ;;
              *)       echo "::error::Unknown workspace $WS for AWS provider"; exit 1 ;;
            esac
            echo "$SSH_KEY_SECRET" > /tmp/key.pub
            EXTRA_VARS+=(-var="ssh_public_key_path=/tmp/key.pub" -var="environment=$WS")
          elif [ "$PROV" = "hetzner" ]; then
            EXTRA_VARS+=(-var="environment=$WS")
          fi
          terraform apply -auto-approve -no-color -input=false -lock-timeout=10m $MODE_FLAG "${EXTRA_VARS[@]}"

      - name: Write job summary
        if: always()
        env:
          TF_MODE: ${{ inputs.mode }}
          TF_PROVIDER: ${{ inputs.provider }}
          TF_WORKSPACE_IN: ${{ inputs.workspace }}
        run: |
          MODE="$TF_MODE"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))
          RESULT="${{ job.status == 'success' && '✅' || '❌' }}"

          M="$GITHUB_STEP_SUMMARY"
          {
            echo "## Terraform ${MODE} ${RESULT}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Provider** | $TF_PROVIDER |"
            echo "| **Workspace** | $TF_WORKSPACE_IN |"
            echo "| **Mode** | ${MODE} |"
            echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$M"
