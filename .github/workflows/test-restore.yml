name: "[B] Restore Test"

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud provider for ephemeral test server
        required: true
        type: choice
        options:
          - hetzner
          - aws
        default: hetzner
      keep_server:
        description: Keep server alive after test (for debugging)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: restore-test
  cancel-in-progress: false

env:
  PROVIDER: ${{ inputs.provider || 'hetzner' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-restore:
    name: Test backup restoration (${{ inputs.provider || 'hetzner' }})
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-terraform

      - name: Record start time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
        id: start_time

      - uses: ./.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - uses: ./.github/actions/setup-env
        with:
          tg_token: ${{ secrets.TG_TOKEN }}
          tg_chat_id: ${{ vars.TG_CHAT_ID }}
          tg_thread_id: ${{ vars.TG_THREAD_ID }}
          db_pass: ${{ secrets.DB_PASS }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          prod_hetz_hcloud_token: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          grafana_pass: ${{ secrets.GRAFANA_PASS }}
          betteruptime_api_token: ${{ secrets.BETTERUPTIME_API_TOKEN }}
          betteruptime_backup_key: ${{ secrets.BETTERUPTIME_BACKUP_KEY }}
          betteruptime_gdrive_key: ${{ secrets.BETTERUPTIME_GDRIVE_KEY }}
          betteruptime_report_daily_key: ${{ secrets.BETTERUPTIME_REPORT_DAILY_KEY }}
          betteruptime_report_weekly_key: ${{ secrets.BETTERUPTIME_REPORT_WEEKLY_KEY }}
          betteruptime_verify_key: ${{ secrets.BETTERUPTIME_VERIFY_KEY }}
          betteruptime_check_services_key: ${{ secrets.BETTERUPTIME_CHECK_SERVICES_KEY }}
          dev_grafana_cloud_url: ${{ secrets.DEV_GRAFANA_CLOUD_URL }}
          dev_grafana_cloud_username: ${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}
          dev_grafana_cloud_token: ${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}
          prod_grafana_cloud_url: ${{ secrets.PROD_GRAFANA_CLOUD_URL }}
          prod_grafana_cloud_username: ${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}
          prod_grafana_cloud_token: ${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}
          dev_aws_access_key: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          dev_aws_secret_key: ${{ secrets.DEV_AWS_SECRET_KEY }}
          dev_aws_region: ${{ secrets.DEV_AWS_REGION }}
          dev_aws_eip: ${{ secrets.DEV_AWS_EIP }}
          prod_access_key: ${{ secrets.PROD_ACCESS_KEY }}
          prod_secret_key: ${{ secrets.PROD_SECRET_KEY }}
          prod_region: ${{ secrets.PROD_REGION }}
          prod_eip: ${{ secrets.PROD_EIP }}
          user_ssh_public_key: ${{ secrets.USER_SSH_PUBLIC_KEY }}
          vitali_ssh_public_key: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          rclone_crypt_password: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          ubuntu_pro_token: ${{ secrets.UBUNTU_PRO_TOKEN }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
          rclone_conf_base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Write target config constants
        run: |
          cat >> secrets/.env << 'EOF'
          HETZNER_SSH_KEY_NAME=Vitali.pub
          HETZNER_PRIMARY_IP_NAME=primary_ip-1
          EOF

      - name: Setup SSH config
        run: |
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Load secrets and export TF vars
        run: |
          source secrets/.env
          python3 << 'PYEOF'
          import json, os, re
          SKIP_KEYS = {
              "DEV_GRAFANA_CLOUD_USERNAME", "PROD_GRAFANA_CLOUD_USERNAME",
              "DEV_AWS_REGION", "PROD_REGION", "HETZNER_LOCATION",
          }
          for k, v in os.environ.items():
              if k in SKIP_KEYS or not v:
                  continue
              if re.match(r"^(PROD_|DEV_|DEV_AWS_|DEV_HETZ_|PROD_HETZ_|PROD_GRAFANA_|DEV_GRAFANA_)", k):
                  print(f"::add-mask::{v}")
              if k in ("CLOUDFLARE_API_TOKEN", "DB_PASS", "TG_TOKEN", "GRAFANA_PASS",
                       "HCLOUD_TOKEN", "BETTERUPTIME_API_TOKEN",
                       "VAULT_PASSWORD", "RCLONE_CONF_BASE64", "RCLONE_CRYPT_PASSWORD",
                       "UBUNTU_PRO_TOKEN"):
                  print(f"::add-mask::{v}")
          PYEOF

          if [ "$PROVIDER" = "aws" ]; then
            {
              echo "AWS_ACCESS_KEY_ID=$DEV_AWS_ACCESS_KEY"
              echo "AWS_SECRET_ACCESS_KEY=$DEV_AWS_SECRET_KEY"
              echo "AWS_DEFAULT_REGION=${DEV_AWS_REGION:-us-west-1}"
              echo "TF_VAR_environment=test"
              echo "TF_VAR_ssh_public_key_path=${HOME}/.ssh/deploy_key.pub"
              [[ -n "${UBUNTU_PRO_TOKEN:-}" ]] && echo "TF_VAR_ubuntu_pro_token=$UBUNTU_PRO_TOKEN"
              echo "SSH_KEY=${SSH_KEY:-${HOME}/.ssh/deploy_key}"
            } >> "$GITHUB_ENV"
          else
            {
              [[ -n "${UBUNTU_PRO_TOKEN:-}" ]] && echo "TF_VAR_ubuntu_pro_token=$UBUNTU_PRO_TOKEN"
              echo "TF_VAR_hcloud_token=$HCLOUD_TOKEN"
              echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/deploy_key.pub)"
              echo "TF_VAR_ssh_key_name=${HETZNER_SSH_KEY_NAME:-Vitali.pub}"
              [[ -n "${HETZNER_PRIMARY_IP_NAME:-}" ]] && echo "TF_VAR_primary_ip_name=$HETZNER_PRIMARY_IP_NAME"
              echo "TF_VAR_enable_primary_ip=true"
              echo "TF_VAR_environment=test"
              echo "TF_VAR_server_type=cx23"
              echo "SSH_KEY=${SSH_KEY:-${HOME}/.ssh/deploy_key}"
              python3 -c "import json, os; k=open(os.path.expanduser('~/.ssh/deploy_key.pub')).read().strip(); print(f'TF_VAR_additional_ssh_keys={json.dumps([k])}')"
            } >> "$GITHUB_ENV"
          fi

      - name: Resolve Cloudflare zone ID
        id: cf_zone
        run: |
          source secrets/.env
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "zone_id=" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_ZONE_ID=" >> secrets/.env
            exit 0
          fi
          DOMAIN="test.dreamseed.online"
          DOT_COUNT="${DOMAIN//[^.]}"
          if [ ${#DOT_COUNT} -ge 2 ]; then
            ZONE_LOOKUP="${DOMAIN#*.}"
          else
            ZONE_LOOKUP="$DOMAIN"
          fi
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_LOOKUP" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null || echo "")
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_ZONE_ID=$ZONE_ID" >> secrets/.env
          if [ -n "$ZONE_ID" ]; then
            echo "::add-mask::$ZONE_ID"
          fi

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible

      - name: Terraform Init
        working-directory: terraform/${{ inputs.provider || 'hetzner' }}
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: test
        run: |
          terraform init -input=false -no-color

      - name: Terraform Apply
        id: terraform
        working-directory: terraform/${{ inputs.provider || 'hetzner' }}
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: test
          TF_VAR_environment: test
        run: |
          for try in 1 2; do
            if terraform apply -auto-approve -no-color; then
              break
            fi
            if [ "$try" -lt 2 ]; then
              echo "Attempt $try/2 failed, retrying in 10s..."
              sleep 10
            else
              echo "Terraform apply failed after 2 attempts"
              exit 1
            fi
          done
          echo "server_ipv4=$(terraform output -raw server_ipv4)" >> "$GITHUB_OUTPUT"
          {
            echo "### Server connection"
            echo '```'
            echo "IP:  $(terraform output -raw server_ipv4)"
            echo "SSH: ssh -i ~/.ssh/deploy_key ubuntu@$(terraform output -raw server_ipv4)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture server SSH host key
        run: |
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ssh-keygen -R "$SERVER_IP" 2>/dev/null || true
          for _ in $(seq 1 15); do
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done

      - name: Provision & wait
        run: |
          set -a
          source secrets/.env
          set +a
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"

          # --- DNS ---
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "[SKIP] DNS update: no Cloudflare token or zone ID"
          else
            CF_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=test.dreamseed.online" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            RECORD_ID=$(echo "$CF_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')" 2>/dev/null || echo "")
            if [ -n "$RECORD_ID" ]; then
              CF_RESP=$(curl -s --retry 3 --retry-delay 5 -X PUT "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"test.dreamseed.online\",\"content\":\"$SERVER_IP\",\"proxied\":false}")
            else
              CF_RESP=$(curl -s --retry 3 --retry-delay 5 -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"test.dreamseed.online\",\"content\":\"$SERVER_IP\",\"proxied\":false}")
            fi
            if echo "$CF_RESP" | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)" 2>/dev/null; then
              echo "[OK] DNS: test.dreamseed.online -> $SERVER_IP"
            else
              echo "[WARN] DNS update failed"
            fi
          fi

          # --- Wait for SSH ---
          echo "[$(date +%H:%M:%S)] Waiting for SSH on $SERVER_IP..."
          if [ "$PROVIDER" = "aws" ]; then
            MAX_ATTEMPTS=40; SLEEP_SEC=10
          else
            MAX_ATTEMPTS=90; SLEEP_SEC=2
          fi
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if ssh -q -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
                -o BatchMode=yes -o PasswordAuthentication=no \
                -i "$SSH_KEY" "ubuntu@$SERVER_IP" 'true' 2>/dev/null; then
              echo "[$(date +%H:%M:%S)] SSH ready (attempt $i)"
              break
            fi
            if [ $((i % 5)) -eq 0 ]; then
              echo "[$(date +%H:%M:%S)] SSH attempt $i/$MAX_ATTEMPTS..."
            fi
            [ "$i" -eq $MAX_ATTEMPTS ] && {
              echo "[$(date +%H:%M:%S)] SSH never became available"
              ssh -v -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
                -o BatchMode=yes -i "$SSH_KEY" "ubuntu@$SERVER_IP" "exit 0" 2>&1 || true
              exit 1
            }
            sleep $SLEEP_SEC
          done

          # --- Wait for cloud-init ---
          echo "[$(date +%H:%M:%S)] Waiting for cloud-init (max 5 min)..."
          CI_START=$(date +%s)
          for j in $(seq 1 150); do
            ci_out=$(ssh -i "$SSH_KEY" -o ConnectTimeout=10 "ubuntu@$SERVER_IP" \
              'cloud-init status 2>/dev/null' 2>/dev/null || echo "unknown")
            ci_elapsed=$(( $(date +%s) - CI_START ))
            case "$ci_out" in
              *"status: done"*|*"No pending"*)
                echo "[$(date +%H:%M:%S)] Cloud-init done (${ci_elapsed}s)"
                break
                ;;
              *"status: error"*)
                echo "[$(date +%H:%M:%S)] Cloud-init status: error"
                exit 1
                ;;
              *)
                if [ $((j % 5)) -eq 0 ] || [ "$j" -eq 1 ]; then
                  echo "[$(date +%H:%M:%S)] Cloud-init: running (${ci_elapsed}s)..."
                fi
                ;;
            esac
            [ "$j" -eq 150 ] && {
              echo "[$(date +%H:%M:%S)] Cloud-init timeout after ${ci_elapsed}s"
              exit 1
            }
            sleep 2
          done

          # --- Wait for apt lock ---
          echo "[$(date +%H:%M:%S)] Waiting for apt lock to release..."
          APT_START=$(date +%s)
          ssh -i "$SSH_KEY" "ubuntu@$SERVER_IP" \
            "while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done" 2>/dev/null || true
          APT_ELAPSED=$(( $(date +%s) - APT_START ))
          [ "$APT_ELAPSED" -gt 0 ] && echo "[$(date +%H:%M:%S)] Apt lock released (${APT_ELAPSED}s)" || true
          sleep 5

      - name: Generate config
        run: |
          set -a
          source secrets/.env
          set +a
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"

          cat > ansible/inventory/hosts-test.yml <<EOF
          all:
            hosts:
              dreamseed:
                ansible_host: ${SERVER_IP}
                ansible_user: ubuntu
                ansible_ssh_private_key_file: ~/.ssh/deploy_key
                ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
            vars:
              web_server: nginx
              domain: test.dreamseed.online
              server_ip: ${SERVER_IP}
              db_name: modx_db
              admin_email: admin@dreamseed.online
          EOF

          (umask 177; envsubst > /tmp/test_vault.yml <<'EOF'
          db_pass: "${DB_PASS}"
          server_ip: "${{ steps.terraform.outputs.server_ipv4 }}"
          web_server: nginx
          domain: test.dreamseed.online
          domain_www: false
          deploy_env: test
          php_version: "8.3"
          cloudflare_api_token: "${CLOUDFLARE_API_TOKEN}"
          ssl_cf_dns_enabled: false
          grafana_admin_password: "${GRAFANA_PASS}"
          grafana_cloud_url: "${DEV_GRAFANA_CLOUD_URL}"
          grafana_cloud_username: "${DEV_GRAFANA_CLOUD_USERNAME}"
          grafana_cloud_token: "${DEV_GRAFANA_CLOUD_TOKEN}"
          scripts_dir: "${PWD}/scripts"
          secrets_dir: "${PWD}/secrets"
          ssh_public_key_path: "${HOME}/.ssh/deploy_key.pub"
          rclone_crypt_password: "${RCLONE_CRYPT_PASSWORD}"
          EOF
          )

      - name: Deploy Base packages
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-01-base.yml -e @/tmp/test_vault.yml

      - name: Deploy DB + Security (parallel)
        run: |
          set +e
          pids=()
          cd ansible
          ansible-playbook -i inventory/hosts-test.yml playbook-03-db.yml -e @/tmp/test_vault.yml & pids+=($!)
          ansible-playbook -i inventory/hosts-test.yml playbook-04-security.yml -e @/tmp/test_vault.yml & pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          set -e
          [ "$failed" -eq 0 ] || exit 1

      - name: Deploy Nginx + PHP + SSL
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-02-web.yml -e @/tmp/test_vault.yml

      - name: Deploy Phase 3 — monitoring + backup (parallel)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
        run: |
          set +e
          pids=()
          cd ansible
          ansible-playbook -i inventory/hosts-test.yml playbook-05-monitor.yml -e @/tmp/test_vault.yml & pids+=($!)
          ansible-playbook -i inventory/hosts-test.yml playbook-06-backup.yml -e @/tmp/test_vault.yml & pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          set -e
          [ "$failed" -eq 0 ] || exit 1

      - name: Deploy Grafana
        run: cd ansible && ansible-playbook -i inventory/hosts-test.yml playbook-07-grafana.yml -e @/tmp/test_vault.yml

      - name: Wait for stack to settle
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          for i in $(seq 1 10); do
            vm_ok=$(ssh ubuntu@"$SERVER_IP" "curl -sf http://127.0.0.1:8428/health 2>/dev/null || echo 'not_ready'" 2>/dev/null || echo "not_ready")
            [ "$vm_ok" = "OK" ] && echo "VictoriaMetrics ready" && break
            [ "$i" -eq 10 ] && echo "Warning: VictoriaMetrics not ready"
            sleep 2
          done
          sleep 5

      - name: Record initial content count
        id: initial_content
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          ROWS=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM modx_site_content' 2>/dev/null || echo 0")
          echo "content_rows_before=$ROWS" >> "$GITHUB_OUTPUT"
          echo "Initial content rows: $ROWS"

      - name: Create backup via smart_backup.sh
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          # Force fresh backup by removing marker file (hash-skip would skip otherwise)
          ssh ubuntu@"$SERVER_IP" "rm -f /home/ubuntu/backups/.project_marker" 2>/dev/null || true
          echo "=== Running smart_backup.sh ==="
          set +e
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/smart_backup.sh" 2>&1
          RC=$?
          set -e
          echo "Backup exit code: $RC"
          echo "--- Backup files ---"
          ssh ubuntu@"$SERVER_IP" "find /home/ubuntu/backups/ -name '*.tar.gz' -o -name '*.sql.gz' 2>/dev/null | head -10 || echo 'No backup files found'" 2>&1 || true
          echo "--- Backup logs ---"
          ssh ubuntu@"$SERVER_IP" "cat /home/ubuntu/backups/logs/backup_*.log 2>/dev/null || echo 'No log files'" 2>&1 || true

      - name: Verify backup files exist
        id: verify_backup
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Local backups ==="
          ssh ubuntu@"$SERVER_IP" "ls -lh /home/ubuntu/backups/project/ 2>/dev/null || echo 'No project backups'"
          ssh ubuntu@"$SERVER_IP" "ls -lh /home/ubuntu/backups/db/ 2>/dev/null || echo 'No DB backups'"
          PROJ_COUNT=$(ssh ubuntu@"$SERVER_IP" "ls -1 /home/ubuntu/backups/project/DreamSeed_*.tar.gz 2>/dev/null | wc -l" || echo 0)
          DB_COUNT=$(ssh ubuntu@"$SERVER_IP" "ls -1 /home/ubuntu/backups/db/db_*.sql.gz 2>/dev/null | wc -l" || echo 0)
          echo "Project backups: $PROJ_COUNT"
          echo "DB backups: $DB_COUNT"
          if [ "$PROJ_COUNT" -lt 1 ] || [ "$DB_COUNT" -lt 1 ]; then
            echo "::error::Backup creation failed — no backup files found"
            exit 1
          fi
          # Verify backup freshness — newest file must be <5 min old
          PROJ_AGE=$(ssh ubuntu@"$SERVER_IP" \
            "echo \$(( \$(date +%s) - \$(stat -c '%Y' \$(ls -t /home/ubuntu/backups/project/DreamSeed_*.tar.gz 2>/dev/null | head -1) 2>/dev/null || echo 0) ))" \
            2>/dev/null || echo 999)
          DB_AGE=$(ssh ubuntu@"$SERVER_IP" \
            "echo \$(( \$(date +%s) - \$(stat -c '%Y' \$(ls -t /home/ubuntu/backups/db/db_*.sql.gz 2>/dev/null | head -1) 2>/dev/null || echo 0) ))" \
            2>/dev/null || echo 999)
          echo "Newest project backup age: ${PROJ_AGE}s"
          echo "Newest DB backup age: ${DB_AGE}s"
          if [ "${PROJ_AGE:-999}" -gt 300 ] || [ "${DB_AGE:-999}" -gt 300 ]; then
            echo "::error::Backup freshness check failed — backups older than 5 minutes"
            exit 1
          fi
          echo "[PASS] Fresh backup verified (both <5 min old)"
          echo "project_count=$PROJ_COUNT" >> "$GITHUB_OUTPUT"
          echo "db_count=$DB_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload backup to GDrive
        id: gdrive_upload
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Uploading backup to GDrive ==="
          set +e
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/upload_backups_to_gdrive.sh" 2>&1
          GDRIVE_RC=$?
          set -e
          if [ "$GDRIVE_RC" -ne 0 ]; then
            echo "::warning::GDrive upload failed (exit $GDRIVE_RC) — restore will use local backup only"
            echo "gdrive_status=fail" >> "$GITHUB_OUTPUT"
          else
            echo "gdrive_status=ok" >> "$GITHUB_OUTPUT"
          fi
          echo "=== Checking cloud backups ==="
          echo "Upload log:"
          ssh ubuntu@"$SERVER_IP" "tail -5 /home/ubuntu/backups/logs/upload_*.log 2>/dev/null" 2>&1 || true
          echo "GDrive listing (latest):"
          ssh ubuntu@"$SERVER_IP" "rclone lsf gdrive-crypt:DreamSeed/backups/project/ --max-depth 1 2>/dev/null | sort -r | head -3 || rclone lsf gdrive:DreamSeed/backups/project/ --max-depth 1 2>/dev/null | sort -r | head -3 || echo 'No GDrive backups'" 2>/dev/null || true

      - name: Verify backup archives integrity
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Running verify_backups.sh ==="
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/verify_backups.sh" 2>&1 || true

      - name: Check Grafana proxy
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Checking Grafana via nginx proxy ==="
          # shellcheck disable=SC2029
          GRAFANA_OK=$(ssh ubuntu@"$SERVER_IP" "curl -sk --resolve test.dreamseed.online:443:127.0.0.1 --max-time 5 https://test.dreamseed.online/grafana/api/health 2>/dev/null | grep -c '\"database\": \"ok\"' || true")
          if [ "$GRAFANA_OK" -lt 1 ]; then
            # shellcheck disable=SC2029
            GRAFANA_OK=$(ssh ubuntu@"$SERVER_IP" "curl -sk --resolve test.dreamseed.online:443:$SERVER_IP --max-time 5 https://test.dreamseed.online/grafana/api/health 2>/dev/null | grep -c '\"database\": \"ok\"' || true")
          fi
          if [ "$GRAFANA_OK" -ge 1 ]; then
            echo "[PASS] Grafana reachable via nginx proxy"
          else
            echo "[WARN] Grafana via nginx proxy: not reachable"
          fi

      - name: Record artifact hashes
        id: artifact_hash
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Recording artifact hashes before destroy ==="
          PROJ_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "project_hash=$PROJ_HASH" >> "$GITHUB_OUTPUT"
          echo "Project hash: $PROJ_HASH"
          # Exclude modx_session — sessions are in Redis, not DB
          DB_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT CONCAT(table_name,\":\",COUNT(*)) FROM information_schema.tables WHERE table_schema=\"modx_db\" AND table_name != \"modx_session\" GROUP BY table_name ORDER BY table_name' 2>/dev/null | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "db_hash=$DB_HASH" >> "$GITHUB_OUTPUT"
          echo "DB hash: $DB_HASH"
          # Record Redis session count for comparison
          REDIS_SESSIONS=$(ssh ubuntu@"$SERVER_IP" "redis-cli DBSIZE 2>/dev/null | awk '{print \$2}'" || echo "0")
          echo "redis_sessions_before=$REDIS_SESSIONS" >> "$GITHUB_OUTPUT"
          echo "Redis sessions before destroy: $REDIS_SESSIONS"

      - name: Destroy data — simulate disaster
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Destroying data to simulate disaster ==="
          ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SET FOREIGN_KEY_CHECKS=0; SELECT CONCAT(\"DROP TABLE IF EXISTS \", table_name, \";\") FROM information_schema.tables WHERE table_schema=\"modx_db\"' | mysql modx_db" 2>&1
          SSH_EXIT=$?
          echo "DROP TABLES exit code: $SSH_EXIT"
          ssh ubuntu@"$SERVER_IP" "sudo rm -rf /var/www/html/* 2>/dev/null; sudo find /var/www/html -maxdepth 1 -name '.*' -not -name '.' -not -name '..' -delete 2>/dev/null; echo 'Project files destroyed'"
          TBL_COUNT=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=\"modx_db\"' 2>/dev/null || echo 0")
          echo "Tables after destruction: $TBL_COUNT (expect 0)"
          FILE_COUNT=$(ssh ubuntu@"$SERVER_IP" "ls -1 /var/www/html/ 2>/dev/null | wc -l" || echo 0)
          echo "Files in web_root after destruction: $FILE_COUNT (expect 0)"

      - name: Restore from backup via RESTORE_ALL.sh
        id: restore
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          RESTORE_START=$(date +%s)
          echo "=== Running RESTORE_ALL.sh --auto-latest ==="
          set +e
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest" 2>&1
          RC=$?
          set -e
          RESTORE_ELAPSED=$(( $(date +%s) - RESTORE_START ))
          echo "RESTORE_ALL exit code: $RC"
          echo "restore_exit_code=$RC" >> "$GITHUB_OUTPUT"
          echo "restore_duration=${RESTORE_ELAPSED}s" >> "$GITHUB_OUTPUT"
          echo "Restore duration: ${RESTORE_ELAPSED}s"
          if [ "$RC" -ne 0 ]; then
            echo "::error::RESTORE_ALL.sh failed (exit $RC)"
          fi

      - name: Restart fail2ban after restore (nginx stop/start breaks pyinotify)
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          # shellcheck disable=SC2029
          command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" ubuntu@"$SERVER_IP" \
            "sudo systemctl restart fail2ban"

      - name: Verify restored content
        id: verify_content
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Verifying restored content ==="
          # shellcheck disable=SC2029
          DOMAIN=$(ssh ubuntu@"$SERVER_IP" \
            "grep -hs 'server_name' /etc/nginx/sites-available/*.conf 2>/dev/null | grep -v 'server_name _' | awk '{print \$2}' | tr -d ';' | head -1" 2>/dev/null || echo "localhost")
          echo "domain=$DOMAIN"

          # shellcheck disable=SC2029
          HTTP_CODE=$(ssh ubuntu@"$SERVER_IP" \
            "curl -sk --resolve '$DOMAIN:443:127.0.0.1' -o /dev/null -w '%{http_code}' --max-time 10 'https://$DOMAIN/'" 2>/dev/null || echo "000")
          echo "site_http=$HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "[PASS] Site HTTP $HTTP_CODE"
          else
            echo "[FAIL] Site returned HTTP $HTTP_CODE"
          fi

          # shellcheck disable=SC2029
          ADMINER_CODE=$(ssh ubuntu@"$SERVER_IP" \
            "curl -sk --resolve '$DOMAIN:443:127.0.0.1' -o /dev/null -w '%{http_code}' --max-time 5 'https://$DOMAIN/adminer-4.8.1-mysql.php'" 2>/dev/null || echo "000")
          echo "adminer_http=$ADMINER_CODE"
          if [ "$ADMINER_CODE" = "403" ]; then
            echo "[PASS] Adminer blocked (HTTP 403)"
          else
            echo "[FAIL] Adminer returned HTTP $ADMINER_CODE (expected 403)"
          fi

          if ssh ubuntu@"$SERVER_IP" "test -f /var/www/html/index.php" 2>/dev/null; then
            echo "[PASS] index.php exists"
          else
            echo "[FAIL] index.php missing"
          fi

          if ssh ubuntu@"$SERVER_IP" "test -f /var/www/html/core/config/config.inc.php" 2>/dev/null; then
            echo "[PASS] config exists"
          else
            echo "[FAIL] config missing"
          fi

          ROWS=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM modx_site_content' 2>/dev/null || echo 0")
          echo "content_rows=$ROWS"
          ROWS_BEFORE="${{ steps.initial_content.outputs.content_rows_before }}"
          echo "Before: $ROWS_BEFORE, After: $ROWS"
          if [ "${ROWS:-0}" -gt 0 ]; then
            echo "[PASS] DB content restored ($ROWS rows)"
          else
            echo "[FAIL] DB content empty"
          fi

          TBL_COUNT=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=\"modx_db\"'" 2>/dev/null || echo 0)
          echo "table_count=$TBL_COUNT"
          if [ "${TBL_COUNT:-0}" -ge 50 ]; then
            echo "[PASS] DB tables: $TBL_COUNT"
          else
            echo "[FAIL] DB tables: ${TBL_COUNT:-0} (expected 50+)"
          fi

          {
            echo "restore_content_rows=$ROWS"
            echo "restore_table_count=$TBL_COUNT"
            echo "restore_http_code=$HTTP_CODE"
          } >> "$GITHUB_OUTPUT"

          if [ "${ROWS:-0}" -eq 0 ] || [ "${TBL_COUNT:-0}" -lt 50 ]; then
            echo "::error::Restore verification failed — no content restored"
            exit 1
          fi

      - name: Validate restored artifacts
        id: validate_hash
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          echo "=== Validating restored artifacts ==="

          NEW_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          OLD_HASH="${{ steps.artifact_hash.outputs.project_hash }}"
          echo "Project hash before: $OLD_HASH"
          echo "Project hash after:  $NEW_HASH"
          if [ "$NEW_HASH" = "$OLD_HASH" ] && [ "$NEW_HASH" != "FAILED" ]; then
            echo "[PASS] Project files restored with identical content"
            echo "project_hash_match=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[FAIL] Project files hash mismatch or missing"
            echo "project_hash_match=no" >> "$GITHUB_OUTPUT"
          fi

          NEW_DB=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT CONCAT(table_name,\":\",COUNT(*)) FROM information_schema.tables WHERE table_schema=\"modx_db\" AND table_name != \"modx_session\" GROUP BY table_name ORDER BY table_name' 2>/dev/null | md5sum | cut -d' ' -f1" || echo "FAILED")
          OLD_DB="${{ steps.artifact_hash.outputs.db_hash }}"
          echo "DB hash before: $OLD_DB"
          echo "DB hash after:  $NEW_DB"
          if [ "$NEW_DB" = "$OLD_DB" ] && [ "$NEW_DB" != "FAILED" ]; then
            echo "[PASS] Database restored with identical table structure"
            echo "db_hash_match=yes" >> "$GITHUB_OUTPUT"
          else
            echo "[FAIL] Database hash mismatch"
            echo "db_hash_match=no" >> "$GITHUB_OUTPUT"
          fi

          # Verify Redis sessions — should have sessions when DB modx_session is empty
          REDIS_AFTER=$(ssh ubuntu@"$SERVER_IP" 'redis-cli DBSIZE 2>/dev/null | awk "{print \$2}"' || echo "0")
          DB_SESSION_COUNT=$(ssh ubuntu@"$SERVER_IP" 'mysql modx_db -N -e "SELECT COUNT(*) FROM modx_session" 2>/dev/null' || echo "-1")
          echo "Redis sessions after restore: $REDIS_AFTER"
          echo "DB modx_session rows: $DB_SESSION_COUNT"
          echo "redis_sessions_after=$REDIS_AFTER" >> "$GITHUB_OUTPUT"
          echo "db_session_count=$DB_SESSION_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$DB_SESSION_COUNT" = "0" ] && [ "${REDIS_AFTER:-0}" -gt 0 ]; then
            echo "[PASS] Redis sessions active (DB sessions empty) — Redis session handler working"
          elif [ "$DB_SESSION_COUNT" = "-1" ]; then
            echo "[WARN] modx_session table not found"
          else
            echo "[INFO] DB sessions: $DB_SESSION_COUNT, Redis: $REDIS_AFTER"
          fi

          echo "=== PHP error log (last 20 lines) ==="
          ssh ubuntu@"$SERVER_IP" "sudo tail -20 /var/log/php*-fpm.log 2>/dev/null || echo 'No PHP-FPM log found'" 2>&1 || true
          PHP_ERRORS=$(ssh ubuntu@"$SERVER_IP" "sudo cat /var/log/php*-fpm.log 2>/dev/null | grep -ci 'PHP Fatal error' || true")
          if [ "${PHP_ERRORS:-0}" -eq 0 ]; then
            echo "[PASS] No PHP Fatal errors after restore"
          else
            echo "[WARN] $PHP_ERRORS PHP Fatal errors found after restore"
          fi

          echo "=== MODX cache ==="
          CACHE_DIRS=$(ssh ubuntu@"$SERVER_IP" "ls /var/www/html/core/cache/ 2>/dev/null | wc -l" || echo 0)
          echo "Cache entries: $CACHE_DIRS"

      - name: Check Faro RUM + Promtail
        run: |
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"

          echo "=== Faro RUM ==="
          if ssh ubuntu@"$SERVER_IP" "curl -skS 'https://test.dreamseed.online/' | grep -q 'faro-web-sdk'"; then
            echo "[PASS] Faro RUM injected"
          else
            echo "[INFO] Faro RUM not found (not configured in CI)"
          fi

          echo "=== Promtail ==="
          if ssh ubuntu@"$SERVER_IP" "systemctl is-active promtail &>/dev/null"; then
            echo "[PASS] Promtail active"
          else
            echo "[INFO] Promtail not running (not configured in CI)"
          fi

      - name: Run full service tests
        id: service_tests
        run: |
          set -o pipefail
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          DB_NAME=modx_db ./.github/scripts/test-restored-server.sh "${{ steps.terraform.outputs.server_ipv4 }}" \
            | tee /dev/stderr | grep -E '^(test_summary|test_fails|memory_usage|memory_pct|response_time_ms|cloud_project|cloud_db|cloud_redis|redis_cloud_backups|redis_session_keys|session_handler_ok|exporter_node|exporter_mysql|exporter_redis|exporter_web|exporter_vm|modx_manager_code|cron_jobs)=' >> "$GITHUB_OUTPUT"

      - name: Run disk check
        id: disk
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          DISK_USAGE=$(ssh ubuntu@$SERVER_IP \
            "df -h / | awk 'NR==2 {print \$5}' | sed 's/%//'" || echo "?")
          echo "disk_usage=$DISK_USAGE" >> "$GITHUB_OUTPUT"
          echo "Disk usage: $DISK_USAGE%"
          echo "--- Top disk consumers ---"
          ssh ubuntu@$SERVER_IP \
            "sudo du -sh /* 2>/dev/null | sort -rh | head -10" || true
          [ "${DISK_USAGE:-100}" -lt 90 ] && echo "[PASS] Disk space OK" || echo "[WARN] Disk space low"

      - name: Detect SSL type
        id: ssl
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          LE_CERT=$(ssh ubuntu@"$SERVER_IP" "test -f /etc/letsencrypt/live/test.dreamseed.online/fullchain.pem && echo yes || echo no" 2>/dev/null || echo "no")
          if [ "$LE_CERT" = "yes" ]; then
            echo "ssl_status=letsencrypt" >> "$GITHUB_OUTPUT"
            echo "SSL: Let's Encrypt"
          else
            echo "ssl_status=self-signed" >> "$GITHUB_OUTPUT"
            echo "SSL: self-signed (cloudflare disabled)"
          fi

      - name: Server info on failure
        if: failure() && steps.terraform.outputs.server_ipv4 != ''
        run: |
          echo "============================================"
          echo "❌ Tests failed — diagnostics below (server will be destroyed after this step)"
          echo "Server IP: ${{ steps.terraform.outputs.server_ipv4 }}"
          echo "SSH: ssh -i ~/.ssh/deploy_key ubuntu@${{ steps.terraform.outputs.server_ipv4 }}"
          echo "Domain: https://test.dreamseed.online/"
          echo ""
          echo "=== FAIL diagnostics ==="
          echo "1. Backup not created → check smart_backup.sh logs:"
          echo "   ssh ubuntu@${{ steps.terraform.outputs.server_ipv4 }} 'cat /home/ubuntu/backups/logs/backup_*.log | tail -30'"
          echo "2. RESTORE_ALL failed → SSH and run manually:"
          echo "   ssh ubuntu@${{ steps.terraform.outputs.server_ipv4 }} 'bash -x /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest 2>&1 | tail -50'"
          echo "3. Service test failed → check which:"
          echo "   grep FAIL /tmp/restore_test_output.txt 2>/dev/null || true"
          echo "4. VM logs: ssh ubuntu@${{ steps.terraform.outputs.server_ipv4 }} 'sudo journalctl -u victoria-metrics --no-pager -n 30'"
          echo ""
          echo "To keep server for debugging, re-run workflow after temporarily commenting the destroy step."
          echo "============================================"

      - name: Send Telegram failure alert
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          source secrets/.env
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="$HEAD_REF"
          SERVER_IP="${{ steps.terraform.outputs.server_ipv4 }}"
          MSG="❌ *Restore Test FAILED*
          📅 $(date '+%Y-%m-%d %H:%M')
          🖥 ${SERVER_IP:-N/A}
          🔖 \`${BRANCH}\` @ \`${COMMIT_SHORT}\`
          See GitHub Actions for details."
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" > /dev/null || true

      - name: Keep server for debugging
        if: always() && inputs.keep_server && steps.terraform.outputs.server_ipv4 != ''
        run: |
          echo "::notice::Server kept alive: ${{ steps.terraform.outputs.server_ipv4 }}"
          echo "SSH: ssh -i ~/.ssh/deploy_key ubuntu@${{ steps.terraform.outputs.server_ipv4 }}"

      - name: Terraform Destroy
        id: destroy
        if: always() && steps.terraform.outputs.server_ipv4 != '' && !inputs.keep_server
        working-directory: terraform/${{ inputs.provider || 'hetzner' }}
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: test
          TF_VAR_environment: test
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DEV_AWS_REGION }}
        run: |
          # Skip destroy if no resources exist (TFC shows "Errored" on empty state destroy)
          RESOURCES=$(terraform state list 2>/dev/null | wc -l)
          if [ "$RESOURCES" -eq 0 ]; then
            echo "No resources to destroy — workspace already empty"
            exit 0
          fi
          set +e
          terraform destroy -auto-approve -no-color 2>&1 | tee /tmp/tf_destroy.log
          tf_exit=${PIPESTATUS[0]}
          set -e
          sync
          if [[ $tf_exit -ne 0 ]]; then
            grep -q "Destroy complete" /tmp/tf_destroy.log || { echo "Terraform destroy failed (exit $tf_exit)"; exit 1; }
            echo "Destroy OK (exit $tf_exit ignored — empty state after destroy)"
          else
            echo "Destroy OK"
          fi

      - name: Send Telegram report
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -a
          source secrets/.env
          set +a

          ok() { if [ "$1" = "success" ]; then echo "✅"; else echo "❌"; fi; }
          ok_destroy() { if [ "$1" = "success" ]; then echo "✅"; elif [ "$1" = "skipped" ]; then echo "⏭️"; fi; }
          ok_yn() { if [ "$1" = "yes" ]; then echo "✅"; else echo "❌"; fi; }
          exp_status() { if [ "$1" -ge 1 ]; then echo "✅"; else echo "❌"; fi; }

          RESTORE_EXIT="${{ steps.restore.outputs.restore_exit_code }}"
          RESTORE_OK="❌"; [ "$RESTORE_EXIT" = "0" ] && RESTORE_OK="✅"
          RESTORE_TIME="${{ steps.restore.outputs.restore_duration }}"

          TESTS="${{ steps.service_tests.outcome }}"
          DESTROY="${{ steps.destroy.outcome }}"
          ROWS="${{ steps.verify_content.outputs.restore_content_rows }}"
          TABLES="${{ steps.verify_content.outputs.restore_table_count }}"
          HTTP_CODE="${{ steps.verify_content.outputs.restore_http_code }}"
          SUMMARY="${{ steps.service_tests.outputs.test_summary }}"
          FAILS="${{ steps.service_tests.outputs.test_fails }}"
          BACKUP_FILES="${{ steps.verify_backup.outputs.project_count }}+1+${{ steps.verify_backup.outputs.db_count }}"

          GDRIVE_STATUS="${{ steps.gdrive_upload.outputs.gdrive_status }}"
          GDRIVE_ICON="☁️"; [ "$GDRIVE_STATUS" = "ok" ] && GDRIVE_ICON="☁️ " || GDRIVE_ICON="☁️❌"
          RESTORE_SRC="local"; [ "$GDRIVE_STATUS" = "ok" ] && RESTORE_SRC="GDrive"

          PROJ_HASH_OK="${{ steps.validate_hash.outputs.project_hash_match }}"
          DB_HASH_OK="${{ steps.validate_hash.outputs.db_hash_match }}"
          [ "$PROJ_HASH_OK" = "yes" ] && PROJ_ICON="✅" || PROJ_ICON="❌"
          [ "$DB_HASH_OK" = "yes" ] && DB_ICON="✅" || DB_ICON="❌"

          [ "${{ job.status }}" = "success" ] && STATUS="✅" || STATUS="❌"
          ELAPSED=$(( $(date +%s) - ${{ steps.start_time.outputs.start_epoch }} ))
          MINS=$(( ELAPSED / 60 ))
          SECS=$(( ELAPSED % 60 ))
          FAIL_DETAIL=""
          [ -n "$FAILS" ] && [ "$FAILS" != "none" ] && FAIL_DETAIL=" ⚠️ $FAILS"

          SSL_ICON="❓"
          SSL_STATUS="${{ steps.ssl.outputs.ssl_status }}"
          [ "$SSL_STATUS" = "letsencrypt" ] && SSL_ICON="✅"
          [ "$SSL_STATUS" = "self-signed" ] && SSL_ICON="⚠️"

          DISK_USAGE="${{ steps.disk.outputs.disk_usage }}"
          DISK_ICON="✅"; [ -n "$DISK_USAGE" ] && [ "$DISK_USAGE" -ge 80 ] && DISK_ICON="⚠️"

          MEM_PCT="${{ steps.service_tests.outputs.memory_pct }}"
          RESP_TIME="${{ steps.service_tests.outputs.response_time_ms }}"
          MODX_MANAGER="${{ steps.service_tests.outputs.modx_manager_code }}"
          CRON_JOBS="${{ steps.service_tests.outputs.cron_jobs }}"
          EXP_NODE="${{ steps.service_tests.outputs.exporter_node }}"
          EXP_MYSQL="${{ steps.service_tests.outputs.exporter_mysql }}"
          EXP_REDIS="${{ steps.service_tests.outputs.exporter_redis }}"
          EXP_WEB="${{ steps.service_tests.outputs.exporter_web }}"
          EXP_VM="${{ steps.service_tests.outputs.exporter_vm }}"
          CLOUD_PROJ="${{ steps.service_tests.outputs.cloud_project }}"
          CLOUD_DB="${{ steps.service_tests.outputs.cloud_db }}"
          CLOUD_REDIS="${{ steps.service_tests.outputs.cloud_redis }}"
          SESSION_HANDLER="${{ steps.service_tests.outputs.session_handler_ok }}"
          REDIS_KEYS="${{ steps.service_tests.outputs.redis_session_keys }}"

          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="$HEAD_REF"

          MSG=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "📦 *Restore Test* $STATUS" \
            "📅 $(date '+%Y-%m-%d %H:%M')  ⏱ ${MINS}m ${SECS}s" \
            "🖥 ${{ steps.terraform.outputs.server_ipv4 }}" \
            "🔖 \`${BRANCH}\` @ \`${COMMIT_SHORT}\`" \
            "" \
            "🔄 *Restore* ${RESTORE_OK} ${ROWS:-0} rows · ${TABLES:-0} tables · HTTP ${HTTP_CODE:-?} · ${RESTORE_TIME%s}s" \
            "  Source: ${RESTORE_SRC}" \
            "📁 *Backup* ✅ ${BACKUP_FILES} files  ${GDRIVE_ICON} GDrive ${GDRIVE_STATUS}" \
            "  ☁️ ${CLOUD_PROJ:-?} proj / ${CLOUD_DB:-?} db / ${CLOUD_REDIS:-?} red" \
            "  Hash: ${PROJ_ICON} project · ${DB_ICON} DB" \
            "" \
            "🌐 *Web* HTTP ${HTTP_CODE:-?} (${RESP_TIME:-?}ms) · mgr ${MODX_MANAGER:-?}" \
            "" \
            "💾 *Memory* ${MEM_PCT:-?}%  🖴 *Disk* ${DISK_ICON} ${DISK_USAGE:-?}%" \
            "" \
            "📊 *Services* $(ok $TESTS) ${SUMMARY:-?}${FAIL_DETAIL}" \
            "  Cron: ${CRON_JOBS:-?} jobs" \
            "  Exporters: $(exp_status "$EXP_NODE") node $(exp_status "$EXP_MYSQL") mysql $(exp_status "$EXP_REDIS") redis $(exp_status "$EXP_WEB") web $(exp_status "$EXP_VM") vm" \
            "🗄️ *Sessions* $(ok_yn "$SESSION_HANDLER") handler · $( [ -n "$REDIS_KEYS" ] && echo "${REDIS_KEYS} keys" || echo '?' )" \
            "🔒 *SSL* ${SSL_ICON} ${SSL_STATUS:-?}" \
            "🗑️ *Destroy* $(ok_destroy $DESTROY)")

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" > /dev/null || true

      - name: Cleanup temp files and DNS
        if: always()
        run: |
          set -a
          source secrets/.env
          set +a
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          shred -u ~/.vault_pass_dreamseed 2>/dev/null || rm -f ~/.vault_pass_dreamseed
          shred -u secrets/.env 2>/dev/null || rm -f secrets/.env
          rm -f ~/.ssh/deploy_key.pub ~/.ssh/config
          rm -f /tmp/test_vault.yml ansible/inventory/hosts-test.yml
          echo "Temp files cleaned"

          RECORD_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=test.dreamseed.online" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          if [ -n "$RECORD_ID" ]; then
            DEL_RESP=$(curl -s --retry 3 --retry-delay 5 -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            if echo "$DEL_RESP" | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)" 2>/dev/null; then
              echo "DNS record deleted"
            else
              echo "::warning::DNS record deletion failed"
            fi
          else
            echo "No DNS record found to delete"
          fi

      - name: Write job summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ok_yn() { [ "$1" = "yes" ] && echo "✅" || echo "❌"; }

          RESTORE_EXIT="${{ steps.restore.outputs.restore_exit_code }}"
          RESTORE_OK="❌"; [ "$RESTORE_EXIT" = "0" ] && RESTORE_OK="✅"
          RESTORE_TIME="${{ steps.restore.outputs.restore_duration }}"
          ROWS="${{ steps.verify_content.outputs.restore_content_rows }}"
          TABLES="${{ steps.verify_content.outputs.restore_table_count }}"
          HTTP_CODE="${{ steps.verify_content.outputs.restore_http_code }}"
          SUMMARY="${{ steps.service_tests.outputs.test_summary }}"
          FAILS="${{ steps.service_tests.outputs.test_fails }}"
          BACKUP_FILES="${{ steps.verify_backup.outputs.project_count }}+${{ steps.verify_backup.outputs.db_count }}"
          PROJ_HASH_OK="${{ steps.validate_hash.outputs.project_hash_match }}"
          DB_HASH_OK="${{ steps.validate_hash.outputs.db_hash_match }}"
          SSL_STATUS="${{ steps.ssl.outputs.ssl_status }}"
          DISK_USAGE="${{ steps.disk.outputs.disk_usage }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start_time.outputs.start_epoch }} ))
          [ -n "$FAILS" ] && [ "$FAILS" != "none" ] && FAIL_LINE="⚠️ **${FAILS}**" || FAIL_LINE=""

          M="$GITHUB_STEP_SUMMARY"
          echo "## Restore Test ${{ job.status == 'success' && '✅' || '❌' }}" >> "$M"
          echo "" >> "$M"
          echo "| | |" >> "$M"
          echo "|---|---|" >> "$M"
          echo "| **Provider** | ${{ env.PROVIDER }} |" >> "$M"
          echo "| **Commit** | \`${COMMIT_SHA}\` on \`${HEAD_REF}\` |" >> "$M"
          echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |" >> "$M"
          echo "| **Server** | ${{ steps.terraform.outputs.server_ipv4 }} |" >> "$M"
          echo "| **SSL** | ${SSL_STATUS} |" >> "$M"
          echo "| **Disk** | ${DISK_USAGE}% |" >> "$M"
          echo "" >> "$M"
          echo "### Backup" >> "$M"
          echo "| Metric | Status |" >> "$M"
          echo "|---|---|" >> "$M"
          echo "| Local files | ${BACKUP_FILES} |" >> "$M"
          echo "| GDrive | ${{ steps.gdrive_upload.outputs.gdrive_status }} |" >> "$M"
          echo "| Hash match | $(ok_yn "$PROJ_HASH_OK") $(ok_yn "$DB_HASH_OK") project/DB |" >> "$M"
          echo "" >> "$M"
          echo "### Restore" >> "$M"
          echo "| Metric | Value |" >> "$M"
          echo "|---|---|" >> "$M"
          echo "| Result | ${RESTORE_OK} |" >> "$M"
          echo "| Content rows | ${ROWS} |" >> "$M"
          echo "| DB tables | ${TABLES} |" >> "$M"
          echo "| HTTP code | ${HTTP_CODE} |" >> "$M"
          echo "| Duration | ${RESTORE_TIME} |" >> "$M"
          echo "" >> "$M"
          echo "### Service Tests: ${SUMMARY} ${FAIL_LINE}" >> "$M"
