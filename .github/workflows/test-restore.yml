name: "[B] Restore Test"

# Full disaster-recovery drill on an ephemeral Hetzner server.
# The deployment phase runs the REAL deploy.sh (target "test") instead of a
# hand-rolled copy of its phases, so every code path that ships to production
# is exercised. The test then validates BOTH restore paths:
#   1. local restore (backups present on the server)
#   2. cloud restore (local backups removed -> RESTORE_ALL pulls from GDrive,
#      the same path [M] Rollback uses)
# Server is destroyed afterwards regardless of outcome.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      keep_server:
        description: 'Keep server alive after test (for debugging)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # pages/id-token scoped to publish-preview job only — not needed workflow-wide

concurrency:
  group: restore-test
  cancel-in-progress: false

env:
  DOMAIN: test.vitalikuts.online
  SERVER_TYPE: cx23

jobs:
  restore-test:
    name: Restore test (Hetzner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      server_ip: ${{ steps.server-ip.outputs.ip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform

      - uses: ./.github/actions/setup-ansible

      - name: Record start time
        id: start_time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - uses: ./.github/actions/setup-env
        with:
          tg_token: ${{ secrets.TG_TOKEN }}
          tg_chat_id: ${{ vars.TG_CHAT_ID }}
          tg_thread_id: ${{ vars.TG_THREAD_ID }}
          db_pass: ${{ secrets.DB_PASS }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_firewall_token: ${{ secrets.CLOUDFLARE_FIREWALL_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          prod_hetz_hcloud_token: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          grafana_pass: ${{ secrets.GRAFANA_PASS }}
          betteruptime_api_token: ${{ secrets.BETTERUPTIME_API_TOKEN }}
          betteruptime_backup_key: ${{ secrets.BETTERUPTIME_BACKUP_KEY }}
          betteruptime_gdrive_key: ${{ secrets.BETTERUPTIME_GDRIVE_KEY }}
          betteruptime_report_daily_key: ${{ secrets.BETTERUPTIME_REPORT_DAILY_KEY }}
          betteruptime_report_weekly_key: ${{ secrets.BETTERUPTIME_REPORT_WEEKLY_KEY }}
          betteruptime_verify_key: ${{ secrets.BETTERUPTIME_VERIFY_KEY }}
          betteruptime_check_services_key: ${{ secrets.BETTERUPTIME_CHECK_SERVICES_KEY }}
          dev_grafana_cloud_url: ${{ secrets.DEV_GRAFANA_CLOUD_URL }}
          dev_grafana_cloud_username: ${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}
          dev_grafana_cloud_token: ${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}
          prod_grafana_cloud_url: ${{ secrets.PROD_GRAFANA_CLOUD_URL }}
          prod_grafana_cloud_username: ${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}
          prod_grafana_cloud_token: ${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}
          loki_url: ${{ vars.LOKI_URL }}
          loki_username: ${{ vars.LOKI_USERNAME }}
          faro_collector_url: ${{ vars.FARO_COLLECTOR_URL }}
          dev_aws_access_key: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          dev_aws_secret_key: ${{ secrets.DEV_AWS_SECRET_KEY }}
          dev_aws_region: ${{ secrets.DEV_AWS_REGION }}
          prod_access_key: ${{ secrets.PROD_ACCESS_KEY }}
          prod_secret_key: ${{ secrets.PROD_SECRET_KEY }}
          prod_region: ${{ secrets.PROD_REGION }}
          user_ssh_public_key: ${{ secrets.USER_SSH_PUBLIC_KEY }}
          vitali_ssh_public_key: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          rclone_crypt_password: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
          rclone_conf_base64: ${{ secrets.RCLONE_CONF_BASE64 }}
          ubuntu_pro_token: ${{ secrets.UBUNTU_PRO_TOKEN }}

      - name: Setup config
        run: |
          cat >> secrets/.env << 'EOF'
          DEV_HETZ_SSH_KEY_NAME=Vitali.pub
          DEV_HETZ_PRIMARY_IP_NAME=primary_ip-1
          DEV_HETZ_SERVER_TYPE=cx23
          EOF

      # --- Phase 1: full deploy through the real deploy.sh (target "test") ---
      - name: Deploy via deploy.sh (test)
        id: deploy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          PYTHONUNBUFFERED: 1
          GIT_REF: ${{ github.ref_name }}
        run: |
          chmod +x deploy.sh
          set +e
          stdbuf -oL ./deploy.sh test -n -p 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Record server IP
        id: server-ip
        if: always()
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          IP=$(TF_TOKEN_app_terraform_io="$TF_API_TOKEN" TF_WORKSPACE=test \
            terraform -chdir=terraform/hetzner output -raw server_ipv4 2>/dev/null || echo "")
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Server IP: ${IP:-unknown}"

      # --- Phase 2: create a backup, simulate disaster, restore ---
      - name: Create backup via smart_backup.sh
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/smart_backup.sh" 2>&1
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/upload_backups_to_gdrive.sh" 2>&1
          echo "backup_files=$(ssh ubuntu@"$SERVER_IP" 'ls /home/ubuntu/backups/project/ | wc -l')" >> "$GITHUB_OUTPUT"

      - name: Record pre-restore hashes
        id: artifact_hash
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          PROJ_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "project_hash=$PROJ_HASH" >> "$GITHUB_OUTPUT"
          echo "Project hash: $PROJ_HASH"
          DB_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "mysql modx_db -N -e 'SELECT CONCAT(table_name,\":\",COUNT(*)) FROM information_schema.tables WHERE table_schema=\"modx_db\" AND table_name != \"modx_session\" GROUP BY table_name ORDER BY table_name' 2>/dev/null | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "db_hash=$DB_HASH" >> "$GITHUB_OUTPUT"
          echo "DB hash: $DB_HASH"
          REDIS_SESSIONS=$(ssh ubuntu@"$SERVER_IP" "redis-cli --scan --pattern 'PHPREDIS_SESSION:*' 2>/dev/null | wc -l" || echo "0")
          echo "redis_sessions_before=$REDIS_SESSIONS" >> "$GITHUB_OUTPUT"
          echo "Redis sessions before destroy: $REDIS_SESSIONS"

      - name: Destroy data — simulate disaster
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          echo "=== Destroying data to simulate disaster ==="
          ssh ubuntu@"$SERVER_IP" "sudo rm -rf /var/www/html/* /var/www/html/.[!.]* 2>/dev/null; sudo rm -rf /var/www/html" || true
          ssh ubuntu@"$SERVER_IP" "sudo mysql -e 'DROP DATABASE modx_db; CREATE DATABASE modx_db;'" || true
          # FLUSHALL/FLUSHDB are renamed off (redis.conf hardening), so clear via scan+del
          ssh ubuntu@"$SERVER_IP" "redis-cli --scan | xargs -r redis-cli del >/dev/null; echo \"Redis cleared — keys remaining: \$(redis-cli dbsize)\"" || true

      # --- Restore path 1: local backups (present on server) ---
      - name: Restore (LOCAL) via RESTORE_ALL.sh
        id: restore_local
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i "$SSH_KEY" \
            ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest" 2>&1
          RC=$?
          set -e
          echo "restore_local_exit=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -eq 0 ] || exit "$RC"

      - name: Verify restored content (LOCAL)
        id: verify_local
        if: steps.restore_local.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          REDIS_SESSIONS_BEFORE: ${{ steps.artifact_hash.outputs.redis_sessions_before }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          HTTP_CODE=$(ssh ubuntu@"$SERVER_IP" "curl -sk --resolve ${{ env.DOMAIN }}:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 10 'https://${{ env.DOMAIN }}/'" 2>/dev/null || echo "000")
          echo "local_http=$HTTP_CODE"
          echo "local_http=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          NEW_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "local_project_hash=$NEW_HASH (want ${{ steps.artifact_hash.outputs.project_hash }})"
          echo "local_project_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          REDIS_AFTER=$(ssh ubuntu@"$SERVER_IP" "redis-cli --scan --pattern 'PHPREDIS_SESSION:*' 2>/dev/null | wc -l" || echo "0")
          echo "local_redis_sessions=$REDIS_AFTER (before destroy: $REDIS_SESSIONS_BEFORE)"
          echo "local_redis_sessions=$REDIS_AFTER" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ] && [ "$NEW_HASH" = "${{ steps.artifact_hash.outputs.project_hash }}" ]; then
            echo "local_restore=pass"
            echo "local_restore=pass" >> "$GITHUB_OUTPUT"
          else
            echo "local_restore=fail"
            echo "local_restore=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # --- Restore path 2: cloud restore (local backups removed -> GDrive) ---
      - name: Remove local backups (force cloud restore path)
        if: steps.restore_local.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          ssh ubuntu@"$SERVER_IP" "rm -rf /home/ubuntu/backups/project /home/ubuntu/backups/db /home/ubuntu/backups/redis" 2>&1
          echo "Local backups removed — RESTORE_ALL will fall through to GDrive"

      - name: Restore (CLOUD) via RESTORE_ALL.sh
        id: restore_cloud
        if: steps.restore_local.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i "$SSH_KEY" \
            ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest" 2>&1
          RC=$?
          set -e
          echo "restore_cloud_exit=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -eq 0 ] || exit "$RC"

      - name: Verify restored content (CLOUD)
        id: verify_cloud
        if: steps.restore_cloud.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          REDIS_SESSIONS_BEFORE: ${{ steps.artifact_hash.outputs.redis_sessions_before }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -i "$SSH_KEY" "$@"; }
          HTTP_CODE=$(ssh ubuntu@"$SERVER_IP" "curl -sk --resolve ${{ env.DOMAIN }}:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 10 'https://${{ env.DOMAIN }}/'" 2>/dev/null || echo "000")
          echo "cloud_http=$HTTP_CODE"
          echo "cloud_http=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          NEW_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "cloud_project_hash=$NEW_HASH (want ${{ steps.artifact_hash.outputs.project_hash }})"
          echo "cloud_project_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          REDIS_AFTER=$(ssh ubuntu@"$SERVER_IP" "redis-cli --scan --pattern 'PHPREDIS_SESSION:*' 2>/dev/null | wc -l" || echo "0")
          echo "cloud_redis_sessions=$REDIS_AFTER (before destroy: $REDIS_SESSIONS_BEFORE)"
          echo "cloud_redis_sessions=$REDIS_AFTER" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ] && [ "$NEW_HASH" = "${{ steps.artifact_hash.outputs.project_hash }}" ]; then
            echo "cloud_restore=pass"
            echo "cloud_restore=pass" >> "$GITHUB_OUTPUT"
          else
            echo "cloud_restore=fail"
            echo "cloud_restore=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run full service tests
        id: service_tests
        if: steps.restore_cloud.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        shell: bash
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          DB_NAME=modx_db .github/scripts/test-restored-server.sh "$SERVER_IP" 2>&1 | tee /dev/stderr | grep -E '^(test_summary|test_fails)=' >> "$GITHUB_OUTPUT"

      # --- Phase 3: screenshot (taken right before teardown; shown inline in the
      #     publish-preview job below, like deploy.yml — no download link) ---
      - name: Capture site screenshot
        if: always() && steps.server-ip.outputs.ip != ''
        uses: ./.github/actions/capture-screenshot
        with:
          url: "https://${{ env.DOMAIN }}/"
          output: /tmp/pages-screenshot/test-restore.png

      - name: Check screenshot exists
        id: shot_check
        if: always() && steps.server-ip.outputs.ip != ''
        run: |
          if ls /tmp/pages-screenshot/*.png >/dev/null 2>&1; then
            echo "exists=yes"
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no"
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload screenshot to Pages
        if: steps.shot_check.outputs.exists == 'yes'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: /tmp/pages-screenshot

      - name: Upload screenshots
        if: steps.shot_check.outputs.exists == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restore-test-screenshots
          path: /tmp/pages-screenshot/*.png
          retention-days: 30

      # --- Phase 4: teardown ---
      - name: Destroy test server
        if: always() && inputs.keep_server == false
        id: destroy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          CI_DESTROY_CONFIRM: "yes"
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          chmod +x deploy.sh
          set +e
          stdbuf -oL ./deploy.sh test -x 2>&1 | tee /tmp/destroy.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -q "Destroy complete" /tmp/destroy.log || { echo "Terraform destroy failed (exit $rc)"; exit 1; }
            echo "Destroy OK (exit $rc ignored — empty state after destroy)"
          fi

      - name: Write job summary
        if: always()
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          REDIS_SESSIONS_BEFORE: ${{ steps.artifact_hash.outputs.redis_sessions_before }}
          LOCAL_REDIS_SESSIONS: ${{ steps.verify_local.outputs.local_redis_sessions }}
          CLOUD_REDIS_SESSIONS: ${{ steps.verify_cloud.outputs.cloud_redis_sessions }}
          TEST_SUMMARY: ${{ steps.service_tests.outputs.test_summary }}
          TEST_FAILS: ${{ steps.service_tests.outputs.test_fails }}
        run: |
          RESTORE_LOCAL="${{ steps.restore_local.outcome }}"
          RESTORE_CLOUD="${{ steps.restore_cloud.outcome }}"
          DEPLOY="${{ steps.deploy.outcome }}"
          ELAPSED=$(( $(date +%s) - ${{ steps.start_time.outputs.start_epoch }} ))
          if [[ "$DEPLOY" == "success" && "$RESTORE_LOCAL" == "success" && "$RESTORE_CLOUD" == "success" ]]; then
            STATUS="✅ RESTORE TEST OK"
          else
            STATUS="❌ FAILED (deploy=$DEPLOY local=$RESTORE_LOCAL cloud=$RESTORE_CLOUD)"
          fi
          M="$GITHUB_STEP_SUMMARY"
          {
            echo "## Restore Test — ${STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Server** | $SERVER_IP |"
            echo "| **Domain** | ${{ env.DOMAIN }} |"
            echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "### Restore paths"
            echo "| Path | Status | HTTP | Hash match | Redis sessions |"
            echo "|---|---|---|---|---|"
            echo "| **Local** | ${{ steps.restore_local.outcome }} | ${{ steps.verify_local.outputs.local_http }} | ${{ steps.verify_local.outputs.local_project_hash == steps.artifact_hash.outputs.project_hash && '✅' || '❌' }} | $LOCAL_REDIS_SESSIONS |"
            echo "| **Cloud (GDrive, rollback path)** | ${{ steps.restore_cloud.outcome }} | ${{ steps.verify_cloud.outputs.cloud_http }} | ${{ steps.verify_cloud.outputs.cloud_project_hash == steps.artifact_hash.outputs.project_hash && '✅' || '❌' }} | $CLOUD_REDIS_SESSIONS |"
            echo ""
            echo "### Artifacts (pre-disaster)"
            echo "| | |"
            echo "|---|---|"
            echo "| **Project hash** | \`${{ steps.artifact_hash.outputs.project_hash }}\` |"
            echo "| **DB hash** | \`${{ steps.artifact_hash.outputs.db_hash }}\` |"
            echo "| **Redis sessions before** | $REDIS_SESSIONS_BEFORE |"
            echo ""
            echo "### Service tests (after cloud restore)"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Summary | $TEST_SUMMARY |"
            echo "| Failures | $TEST_FAILS |"
            echo ""
            echo "### Evidence"
            echo "📸 Screenshot preview published inline in the **Publish screenshot preview** job below — refresh in ~1 min"
          } >> "$M"

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          shred -u ~/.vault_pass_dreamseed 2>/dev/null || rm -f ~/.vault_pass_dreamseed
          shred -u secrets/.env 2>/dev/null || rm -f secrets/.env
          shred -u secrets/rclone.conf 2>/dev/null || rm -f secrets/rclone.conf
          rm -f ~/.ssh/deploy_key.pub ~/.ssh/config

  publish-preview:
    name: Publish screenshot preview
    needs: restore-test
    # Publish whenever a server actually existed (screenshot captured before
    # teardown) — even when the restore test failed, so the evidence is visible
    # under the spoiler instead of a dead "Download screenshot" link.
    if: needs.restore-test.outputs.server_ip != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy screenshot preview
        id: pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Write preview summary
        run: |
          M="${GITHUB_STEP_SUMMARY:-}"
          [[ -z "$M" ]] && exit 0
          {
            echo "<details><summary>📸 Restore Test screenshot</summary>"
            echo ""
            echo "![restore-test](${{ steps.pages.outputs.page_url }}test-restore.png?t=${{ github.run_id }})"
            echo ""
            echo "</details>"
          } >> "$M"
