name: "[B] Restore Test"

# Full disaster-recovery drill on an ephemeral Hetzner server.
# The deployment phase runs the REAL deploy.sh (target "test") instead of a
# hand-rolled copy of its phases, so every code path that ships to production
# is exercised. The test then validates BOTH restore paths:
#   1. local restore (backups present on the server)
#   2. cloud restore (local backups removed -> RESTORE_ALL pulls from GDrive,
#      the same path [M] Rollback uses)
# The ephemeral server is destroyed after every run (failed ones included — an
# unattended scheduled failure must not leak a server); keep_server=true forces keep.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      keep_server:
        description: 'Keep server alive after test (for debugging)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # pages/id-token scoped to publish-preview job only — not needed workflow-wide

concurrency:
  group: restore-test
  cancel-in-progress: false

env:
  DOMAIN: test.vitalikuts.online
  SERVER_TYPE: cx23

jobs:
  restore-test:
    name: Restore test (Hetzner)
    runs-on: ubuntu-latest
    # 60 min was cut short on a Google-throttled day (cloud restore 81s → 688s).
    timeout-minutes: 90
    outputs:
      server_ip: ${{ steps.server-ip.outputs.ip }}
      screenshot: ${{ steps.shot_check.outputs.exists }}

    steps:
      # Silence the "hint: Using 'master' as the initial branch" noise emitted by
      # git init inside actions/checkout (no init.defaultBranch is set in the
      # runner image). Must run before checkout.
      - name: Silence git default-branch hint
        run: git config --global advice.defaultBranchName false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-terraform

      - uses: $/.github/actions/setup-ansible

      - name: Record start time
        id: start_time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - uses: $/.github/actions/setup-env
        with:
          tg_token: ${{ secrets.TG_TOKEN }}
          tg_chat_id: ${{ vars.TG_CHAT_ID }}
          tg_thread_id: ${{ vars.TG_THREAD_ID }}
          db_pass: ${{ secrets.DB_PASS }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_firewall_token: ${{ secrets.CLOUDFLARE_FIREWALL_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          prod_hetz_hcloud_token: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          grafana_pass: ${{ secrets.GRAFANA_PASS }}
          betteruptime_api_token: ${{ secrets.BETTERUPTIME_API_TOKEN }}
          betteruptime_backup_key: ${{ secrets.BETTERUPTIME_BACKUP_KEY }}
          betteruptime_gdrive_key: ${{ secrets.BETTERUPTIME_GDRIVE_KEY }}
          betteruptime_report_daily_key: ${{ secrets.BETTERUPTIME_REPORT_DAILY_KEY }}
          betteruptime_report_weekly_key: ${{ secrets.BETTERUPTIME_REPORT_WEEKLY_KEY }}
          betteruptime_verify_key: ${{ secrets.BETTERUPTIME_VERIFY_KEY }}
          betteruptime_check_services_key: ${{ secrets.BETTERUPTIME_CHECK_SERVICES_KEY }}
          dev_grafana_cloud_url: ${{ secrets.DEV_GRAFANA_CLOUD_URL }}
          dev_grafana_cloud_username: ${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}
          dev_grafana_cloud_token: ${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}
          prod_grafana_cloud_url: ${{ secrets.PROD_GRAFANA_CLOUD_URL }}
          prod_grafana_cloud_username: ${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}
          prod_grafana_cloud_token: ${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}
          loki_url: ${{ vars.LOKI_URL }}
          loki_username: ${{ vars.LOKI_USERNAME }}
          faro_collector_url: ${{ vars.FARO_COLLECTOR_URL }}
          dev_aws_access_key: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          dev_aws_secret_key: ${{ secrets.DEV_AWS_SECRET_KEY }}
          dev_aws_region: ${{ secrets.DEV_AWS_REGION }}
          prod_access_key: ${{ secrets.PROD_ACCESS_KEY }}
          prod_secret_key: ${{ secrets.PROD_SECRET_KEY }}
          prod_region: ${{ secrets.PROD_REGION }}
          user_ssh_public_key: ${{ secrets.USER_SSH_PUBLIC_KEY }}
          vitali_ssh_public_key: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          rclone_crypt_password: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
          rclone_conf_base64: ${{ secrets.RCLONE_CONF_BASE64 }}
          ubuntu_pro_token: ${{ secrets.UBUNTU_PRO_TOKEN }}

      - name: Setup config
        run: |
          cat >> secrets/.env << 'EOF'
          DEV_HETZ_SSH_KEY_NAME=Vitali.pub
          DEV_HETZ_SERVER_TYPE=cx23
          # Ephemeral test server: create a dedicated Primary IP
          # (dreamseed-main-test) instead of attaching dev-hetz's shared
          # primary_ip-1 — a Primary IP can only be bound to one server, so
          # test and dev-hetz must not share it. Override the vault's
          # prefixed+unprefixed values (last-wins parser).
          DEV_HETZ_PRIMARY_IP_NAME=
          HETZNER_PRIMARY_IP_NAME=
          HETZNER_ENABLE_PRIMARY_IP=true
          EOF

      # --- Phase 1: full deploy through the real deploy.sh (target "test") ---
      - name: Deploy via deploy.sh (test)
        id: deploy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          PYTHONUNBUFFERED: 1
          GIT_REF: ${{ github.ref_name }}
        run: |
          chmod +x deploy.sh
          set +e
          stdbuf -oL ./deploy.sh test -n -p 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Record server IP
        id: server-ip
        if: always()
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          IP=$(TF_TOKEN_app_terraform_io="$TF_API_TOKEN" TF_WORKSPACE=test \
            terraform -chdir=terraform/hetzner output -raw server_ipv4 2>/dev/null || echo "")
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "ts_deploy=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Server IP: ${IP:-unknown}"

      # --- Phase 2: create a backup, simulate disaster, restore ---
      # Deterministic Redis check: seed a sentinel session BEFORE smart_backup so
      # it lands in the local RDB. The LOCAL restore must bring it back verbatim.
      # The CLOUD path restores PROD's RDB (no sentinel by design), so there we
      # only assert Redis is non-empty. Counts alone prove nothing (TTL decay +
      # prod data on the cloud path).
      - name: Seed Redis sentinel session
        id: sentinel
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          KEY="PHPREDIS_SESSION:restoretest-${{ github.run_id }}"
          VAL="sentinel-${{ github.run_id }}"
          # Inline the literals (GitHub-expanded) so nothing expands client-side
          # inside the remote command (shellcheck SC2029).
          GOT=$(ssh ubuntu@"$SERVER_IP" "redis-cli set 'PHPREDIS_SESSION:restoretest-${{ github.run_id }}' 'sentinel-${{ github.run_id }}' EX 86400 >/dev/null && redis-cli get 'PHPREDIS_SESSION:restoretest-${{ github.run_id }}'" || echo "")
          echo "sentinel_key=$KEY" >> "$GITHUB_OUTPUT"
          echo "sentinel_val=$VAL" >> "$GITHUB_OUTPUT"
          echo "Sentinel seeded: $KEY = $GOT"

      # Recorded BEFORE smart_backup: db_hash must be taken as close to the
      # dump moment as this layout allows — putting it after the backup would
      # insert the whole gdrive upload between the reference and the dump.
      - name: Record pre-restore hashes
        id: artifact_hash
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          PROJ_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "project_hash=$PROJ_HASH" >> "$GITHUB_OUTPUT"
          echo "Project hash: $PROJ_HASH"
          DB_HASH=$(.github/scripts/db_content_hash.sh "$SERVER_IP" || echo "FAILED")
          echo "db_hash=$DB_HASH" >> "$GITHUB_OUTPUT"
          echo "DB hash: $DB_HASH"
          REDIS_SESSIONS=$(ssh ubuntu@"$SERVER_IP" "redis-cli --scan --pattern 'PHPREDIS_SESSION:*' 2>/dev/null | wc -l" || echo "0")
          echo "redis_sessions_before=$REDIS_SESSIONS" >> "$GITHUB_OUTPUT"
          echo "Redis sessions before destroy: $REDIS_SESSIONS"

      - name: Create backup via smart_backup.sh
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/smart_backup.sh" 2>&1
          ssh ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/upload_backups_to_gdrive.sh" 2>&1

      # The upload script tees ALL output to its own log on the server, so a
      # silent failure here would go unnoticed (and uploads also mask errors on
      # <1h-old boxes). Proves THIS run's upload pipeline landed fresh backups
      # in the *-test/ paths. The cloud restore below deliberately consumes
      # PROD paths instead — the real [M] Rollback path — never these fresh
      # ones, so the two checks cover different failure modes.
      - name: Verify cloud upload (fresh backup present in *-test/ paths)
        id: verify_upload
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          PROJ=$(ssh ubuntu@"$SERVER_IP" "ls /home/ubuntu/backups/project/DreamSeed_*.tar.gz 2>/dev/null | head -1 | xargs -r basename" || true)
          DB=$(ssh ubuntu@"$SERVER_IP" "ls /home/ubuntu/backups/db/db_*.sql.gz 2>/dev/null | head -1 | xargs -r basename" || true)
          echo "local_project=$PROJ"
          echo "local_db=$DB"
          # Project archive may be skipped when unchanged (smart_backup marker);
          # DB/Redis are always produced. Compare against the *-test/ cloud dirs.
          OUT=$(ssh ubuntu@"$SERVER_IP" "rclone lsf 'gdrive-crypt:DreamSeed/backups/project-test/' --files-only 2>/dev/null; rclone lsf 'gdrive-crypt:DreamSeed/backups/db-test/' --files-only 2>/dev/null")
          FAILED=0
          if [ -n "$PROJ" ]; then
            if printf '%s\n' "$OUT" | grep -qxF "$PROJ"; then
              echo "cloud_project=present"
            else
              echo "cloud_project=MISSING"
              FAILED=1
            fi
          else
            echo "cloud_project=skipped (unchanged)"
          fi
          if [ -n "$DB" ]; then
            if printf '%s\n' "$OUT" | grep -qxF "$DB"; then
              echo "cloud_db=present"
            else
              echo "cloud_db=MISSING"
              FAILED=1
            fi
          fi
          if [ "$FAILED" -eq 0 ]; then
            echo "cloud_upload=pass"
            echo "cloud_upload=pass" >> "$GITHUB_OUTPUT"
          else
            echo "cloud_upload=fail"
            echo "cloud_upload=fail" >> "$GITHUB_OUTPUT"
            echo "::error::Fresh backup not found in cloud *-test/ paths"
            exit 1
          fi

      - name: Destroy data — simulate disaster
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          echo "=== Destroying data to simulate disaster ==="
          # Unmount the MODX cache tmpfs first (rm can't remove a busy mountpoint).
          ssh ubuntu@"$SERVER_IP" "mountpoint -q /var/www/html/core/cache && sudo umount /var/www/html/core/cache 2>/dev/null; sudo rm -rf /var/www/html/* /var/www/html/.[!.]* 2>/dev/null; sudo rm -rf /var/www/html" || true
          ssh ubuntu@"$SERVER_IP" "sudo mysql -e 'DROP DATABASE modx_db; CREATE DATABASE modx_db;'" || true
          # FLUSHALL/FLUSHDB are renamed off (redis.conf hardening), so clear via scan+del
          ssh ubuntu@"$SERVER_IP" "redis-cli --scan | xargs -r redis-cli del >/dev/null; echo \"Redis cleared — keys remaining: \$(redis-cli dbsize)\"" || true

      # --- Restore path 1: local backups (present on server) ---
      - name: Restore (LOCAL) via RESTORE_ALL.sh
        id: restore_local
        if: steps.deploy.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i "$SSH_KEY" \
            ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest" 2>&1 | tee /tmp/restore_local.out
          RC=${PIPESTATUS[0]}
          set -e
          echo "restore_local_exit=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -eq 0 ] || exit "$RC"

      - name: Verify restored content (LOCAL)
        id: verify_local
        if: steps.restore_local.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          REDIS_SESSIONS_BEFORE: ${{ steps.artifact_hash.outputs.redis_sessions_before }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          HTTP_CODE=$(ssh ubuntu@"$SERVER_IP" "curl -sk --resolve ${{ env.DOMAIN }}:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 10 'https://${{ env.DOMAIN }}/'" 2>/dev/null || echo "000")
          echo "local_http=$HTTP_CODE"
          echo "local_http=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          NEW_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "local_project_hash=$NEW_HASH (want ${{ steps.artifact_hash.outputs.project_hash }})"
          echo "local_project_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          NEW_DB_HASH=$(.github/scripts/db_content_hash.sh "$SERVER_IP" || echo "FAILED")
          echo "local_db_hash=$NEW_DB_HASH (want ${{ steps.artifact_hash.outputs.db_hash }})"
          echo "local_db_hash=$NEW_DB_HASH" >> "$GITHUB_OUTPUT"
          REDIS_AFTER=$(ssh ubuntu@"$SERVER_IP" "redis-cli --scan --pattern 'PHPREDIS_SESSION:*' 2>/dev/null | wc -l" || echo "0")
          echo "local_redis_sessions=$REDIS_AFTER (before destroy: $REDIS_SESSIONS_BEFORE)"
          echo "local_redis_sessions=$REDIS_AFTER" >> "$GITHUB_OUTPUT"
          SENTINEL=$(ssh ubuntu@"$SERVER_IP" "redis-cli get '${{ steps.sentinel.outputs.sentinel_key }}'" 2>/dev/null || echo "")
          echo "local_sentinel=$SENTINEL (want ${{ steps.sentinel.outputs.sentinel_val }})"
          echo "local_sentinel=$SENTINEL" >> "$GITHUB_OUTPUT"
          echo "ts_local=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ] && [ "$NEW_HASH" = "${{ steps.artifact_hash.outputs.project_hash }}" ] && [ "$SENTINEL" = "${{ steps.sentinel.outputs.sentinel_val }}" ] && [ "$NEW_DB_HASH" = "${{ steps.artifact_hash.outputs.db_hash }}" ]; then
            echo "local_restore=pass"
            echo "local_restore=pass" >> "$GITHUB_OUTPUT"
          else
            echo "local_restore=fail (http=$HTTP_CODE hash=$NEW_HASH sentinel='$SENTINEL' db='$NEW_DB_HASH')"
            echo "local_restore=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # --- Restore path 2: cloud restore (local backups removed -> GDrive) ---
      - name: Remove local backups (force cloud restore path)
        if: steps.restore_local.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          ssh ubuntu@"$SERVER_IP" "rm -rf /home/ubuntu/backups/project /home/ubuntu/backups/db /home/ubuntu/backups/redis /home/ubuntu/backups/tiles" 2>&1
          echo "Local backups removed — RESTORE_ALL will fall through to GDrive"

      - name: Restore (CLOUD) via RESTORE_ALL.sh
        id: restore_cloud
        if: steps.restore_local.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          set +e
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i "$SSH_KEY" \
            ubuntu@"$SERVER_IP" "bash /home/ubuntu/Scripts/RESTORE_ALL.sh --auto-latest" 2>&1 | tee /tmp/restore_cloud.out
          RC=${PIPESTATUS[0]}
          set -e
          echo "restore_cloud_exit=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" -eq 0 ] || exit "$RC"

      - name: Verify restored content (CLOUD)
        id: verify_cloud
        if: steps.restore_cloud.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          REDIS_SESSIONS_BEFORE: ${{ steps.artifact_hash.outputs.redis_sessions_before }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          ssh() { command ssh -q -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$SSH_KEY" "$@"; }
          HTTP_CODE=$(ssh ubuntu@"$SERVER_IP" "curl -sk --resolve ${{ env.DOMAIN }}:443:127.0.0.1 -o /dev/null -w '%{http_code}' --max-time 10 'https://${{ env.DOMAIN }}/'" 2>/dev/null || echo "000")
          echo "cloud_http=$HTTP_CODE"
          echo "cloud_http=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          NEW_HASH=$(ssh ubuntu@"$SERVER_IP" \
            "find /var/www/html -type f -not -path '*/core/cache/*' -exec md5sum {} \; 2>/dev/null | sort -k2 | md5sum | cut -d' ' -f1" || echo "FAILED")
          echo "cloud_project_hash=$NEW_HASH (want ${{ steps.artifact_hash.outputs.project_hash }})"
          echo "cloud_project_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          REDIS_AFTER=$(ssh ubuntu@"$SERVER_IP" "redis-cli --scan --pattern 'PHPREDIS_SESSION:*' 2>/dev/null | wc -l" || echo "0")
          echo "cloud_redis_sessions=$REDIS_AFTER (before destroy: $REDIS_SESSIONS_BEFORE)"
          echo "cloud_redis_sessions=$REDIS_AFTER" >> "$GITHUB_OUTPUT"
          # Cloud path restores PROD's RDB, so no sentinel — assert Redis actually
          # came back non-empty instead of trusting a count.
          REDIS_DBSIZE=$(ssh ubuntu@"$SERVER_IP" "redis-cli dbsize" 2>/dev/null || echo "0")
          echo "cloud_redis_dbsize=$REDIS_DBSIZE" >> "$GITHUB_OUTPUT"
          echo "ts_cloud=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ] && [ "$NEW_HASH" = "${{ steps.artifact_hash.outputs.project_hash }}" ] && [ "${REDIS_DBSIZE:-0}" -gt 0 ]; then
            echo "cloud_restore=pass"
            echo "cloud_restore=pass" >> "$GITHUB_OUTPUT"
          else
            echo "cloud_restore=fail (http=$HTTP_CODE hash=$NEW_HASH redis_dbsize=$REDIS_DBSIZE)"
            echo "cloud_restore=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run full service tests
        id: service_tests
        if: steps.restore_cloud.outcome == 'success'
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        shell: bash
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          DB_NAME=modx_db .github/scripts/test-restored-server.sh "$SERVER_IP" 2>&1 | tee /dev/stderr | grep -E '^(test_summary|test_fails|cloud_tiles)=' >> "$GITHUB_OUTPUT"
          echo "ts_tests=$(date +%s)" >> "$GITHUB_OUTPUT"

      # --- Phase 3: screenshot (taken right before teardown; shown inline in the
      #     publish-preview job below, like deploy.yml — no download link) ---
      - name: Capture site screenshot
        if: always() && steps.server-ip.outputs.ip != ''
        uses: $/.github/actions/capture-screenshot
        with:
          url: "https://${{ env.DOMAIN }}/"
          output: /tmp/pages-screenshot/test-restore-${{ github.run_id }}.png

      - name: Check screenshot exists
        id: shot_check
        if: always() && steps.server-ip.outputs.ip != ''
        run: |
          if ls /tmp/pages-screenshot/*.png >/dev/null 2>&1; then
            echo "exists=yes"
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no"
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      # Pages artifacts replace the whole site — ship the code map too, so the
      # link in deploy summaries doesn't 404 after a restore drill publishes.
      - name: Copy code map into Pages content
        if: steps.shot_check.outputs.exists == 'yes'
        run: |
          # Map outputs are not committed — regenerate from this checkout.
          python3 docs/codemap/gen_codemap.py
          cp docs/codemap/codemap.html /tmp/pages-screenshot/index.html
          cp docs/codemap/codemap.html /tmp/pages-screenshot/codemap.html

      # Upload as a plain artifact; the publish job merges it with the other
      # publisher's site and uploads the combined github-pages artifact
      # (upload-pages-artifact is fixed to that name, so it must run only once).
      - name: Stage site content for Pages
        if: steps.shot_check.outputs.exists == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-own
          path: /tmp/pages-screenshot
          if-no-files-found: error

      - name: Upload screenshots
        if: steps.shot_check.outputs.exists == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restore-test-screenshots
          path: /tmp/pages-screenshot/*.png
          retention-days: 30

      # Collect server-side logs before teardown so a mid-test failure (e.g.
      # SSH refused by fail2ban) leaves evidence instead of a dead server.
      - name: Collect server logs
        if: always() && steps.server-ip.outputs.ip != ''
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          SSH_KEY="${SSH_KEY:-${HOME}/.ssh/deploy_key}"
          mkdir -p /tmp/restore-logs/server
          set +e
          for f in /var/log/fail2ban.log /var/log/auth.log /var/log/syslog /var/log/nginx/error.log; do
            ssh -q -o LogLevel=ERROR -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              -i "$SSH_KEY" ubuntu@"$SERVER_IP" "sudo tail -n 200 $f" > "/tmp/restore-logs/server/$(basename "$f")" 2>&1
          done
          ssh -q -o LogLevel=ERROR -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            -i "$SSH_KEY" ubuntu@"$SERVER_IP" "sudo fail2ban-client status sshd" > /tmp/restore-logs/server/fail2ban-sshd.txt 2>&1
          set -e
          ls -la /tmp/restore-logs/server/

      - name: Scrub secrets from deploy log
        if: always()
        uses: $/.github/actions/scrub-log
        with:
          log-path: /tmp/deploy.log
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Scrub secrets from destroy log
        if: always()
        uses: $/.github/actions/scrub-log
        with:
          log-path: /tmp/destroy.log
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Upload test logs (deploy/destroy/server)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restore-test-logs
          path: |
            /tmp/deploy.log
            /tmp/destroy.log
            /tmp/restore-logs/**
          if-no-files-found: ignore
          retention-days: 7

      # --- Phase 4: teardown ---
      # Always tear down unless keep_server=true: logs are already collected
      # above, and an unattended scheduled failure must not leak a server.
      - name: Destroy test server
        if: ${{ always() && inputs.keep_server == false && steps.server-ip.outputs.ip != '' }}
        id: destroy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          CI_DESTROY_CONFIRM: "yes"
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
        run: |
          chmod +x deploy.sh
          set +e
          # -n passed so WEB_SERVER is resolved and the header shows the real
          # web server instead of a blank field during destroy (cli.sh requires
          # -n/-a only for deploy, not destroy).
          stdbuf -oL ./deploy.sh test -x -n 2>&1 | tee /tmp/destroy.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -q "Destroy complete" /tmp/destroy.log || { echo "Terraform destroy failed (exit $rc)"; exit 1; }
            echo "Destroy OK (exit $rc ignored — empty state after destroy)"
          fi

      - name: Write job summary
        if: always()
        env:
          SERVER_IP: ${{ steps.server-ip.outputs.ip }}
          LOCAL_SENTINEL: ${{ steps.verify_local.outputs.local_sentinel }}
          SENTINEL_VAL: ${{ steps.sentinel.outputs.sentinel_val }}
          CLOUD_REDIS_DBSIZE: ${{ steps.verify_cloud.outputs.cloud_redis_dbsize }}
          CLOUD_TILES: ${{ steps.service_tests.outputs.cloud_tiles }}
          TEST_SUMMARY: ${{ steps.service_tests.outputs.test_summary }}
          TEST_FAILS: ${{ steps.service_tests.outputs.test_fails }}
          TS_DEPLOY: ${{ steps.server-ip.outputs.ts_deploy }}
          TS_LOCAL: ${{ steps.verify_local.outputs.ts_local }}
          TS_CLOUD: ${{ steps.verify_cloud.outputs.ts_cloud }}
          TS_TESTS: ${{ steps.service_tests.outputs.ts_tests }}
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
          KEEP_SERVER: ${{ inputs.keep_server }}
        run: |
          set +e
          RESTORE_LOCAL="${{ steps.restore_local.outcome }}"
          RESTORE_CLOUD="${{ steps.restore_cloud.outcome }}"
          DEPLOY="${{ steps.deploy.outcome }}"
          START_EPOCH=${{ steps.start_time.outputs.start_epoch }}
          ELAPSED=$(( $(date +%s) - START_EPOCH ))
          if [[ "$DEPLOY" == "success" && "$RESTORE_LOCAL" == "success" && "$RESTORE_CLOUD" == "success" && "$TEST_SUMMARY" == *"F:0"* ]]; then
            STATUS="✅ RESTORE TEST OK"
          else
            STATUS="❌ FAILED (deploy=$DEPLOY local=$RESTORE_LOCAL cloud=$RESTORE_CLOUD tests='$TEST_SUMMARY')"
          fi

          # Which archive each path actually restored (from RESTORE_ALL output).
          # tail -1 = the final status line (✅/❌ + rollback warning), not the
          # bare-filename selection echo printed at restore start.
          prov_line() {
            P=""; D=""; R=""; T=""
            [ -f "$1" ] || return 0
            P=$(grep '^Project: ' "$1" | tail -1 | sed 's/^Project: //')
            D=$(grep '^DB: ' "$1" | tail -1 | sed 's/^DB: //')
            R=$(grep '^Redis: ' "$1" | tail -1 | sed 's/^Redis: //')
            T=$(grep '^Tiles: ' "$1" | tail -1 | sed 's/^Tiles: //')
          }
          prov_line /tmp/restore_local.out; LP="$P"; LD="$D"; LR="$R"; LT="$T"
          prov_line /tmp/restore_cloud.out; CP="$P"; CD="$D"; CR="$R"; CT="$T"
          # A cloud rollback against a >6h-old dump means the backup pipeline
          # stalled (same 6h threshold RESTORE_ALL warns on).
          AGE_NOTE=""
          CD_TS=$(printf '%s' "$CD" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}' | head -1)
          if [ -n "$CD_TS" ]; then
            # "2026-09-24_10-00" -> date "2026-09-24 10:00" (GNU date won't
            # parse a hyphen as the time separator).
            CD_TIME=${CD_TS##*_}
            CD_EPOCH=$(date -d "${CD_TS%%_*} ${CD_TIME/-/:}" +%s 2>/dev/null || echo 0)
            CD_AGE_H=$(( ($(date +%s) - CD_EPOCH) / 3600 ))
            if [ "$CD_EPOCH" -gt 0 ] && [ "$CD_AGE_H" -ge 6 ]; then
              AGE_NOTE=" — ⚠️ cloud DB dump is ${CD_AGE_H}h old"
            fi
          fi

          case "${CLOUD_TILES:-}" in
            no_local_tiles_dir) TILES_ROW="no tiles dir on server" ;;
            ''|0)               TILES_ROW="❌ not in cloud" ;;
            *)                  TILES_ROW="✅ cloud ($CLOUD_TILES)" ;;
          esac

          if [ -n "$SENTINEL_VAL" ] && [ "$LOCAL_SENTINEL" = "$SENTINEL_VAL" ]; then
            SENTINEL_ROW="✅ restored verbatim"
          else
            SENTINEL_ROW="❌ '${LOCAL_SENTINEL:-missing}'"
          fi

          dur() { if [ "${1:-0}" -gt 0 ] && [ "${2:-0}" -gt 0 ]; then echo "$(( ($2 - $1) / 60 ))m $(( ($2 - $1) % 60 ))s"; else echo "n/a"; fi; }
          ART="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          M="$GITHUB_STEP_SUMMARY"
          {
            echo "## Restore Test — ${STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Server** | $SERVER_IP |"
            echo "| **Domain** | ${{ env.DOMAIN }} |"
            echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s (to summary) |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link]($ART) |"
            echo ""
            echo "### Restore paths"
            echo "| Path | Status | HTTP | Project hash | DB match | Redis proof |"
            echo "|---|---|---|---|---|---|"
            echo "| **Local** | ${{ steps.restore_local.outcome }} | ${{ steps.verify_local.outputs.local_http }} | ${{ steps.verify_local.outputs.local_project_hash == steps.artifact_hash.outputs.project_hash && '✅' || '❌' }} | ${{ steps.verify_local.outputs.local_db_hash == steps.artifact_hash.outputs.db_hash && '✅' || '❌' }} | $SENTINEL_ROW |"
            echo "| **Cloud (GDrive, rollback path)** | ${{ steps.restore_cloud.outcome }} | ${{ steps.verify_cloud.outputs.cloud_http }} | ${{ steps.verify_cloud.outputs.cloud_project_hash == steps.artifact_hash.outputs.project_hash && '✅' || '❌' }} | n/a (prod dump) | dbsize=$CLOUD_REDIS_DBSIZE |"
            echo "| **Cloud upload (fresh)** | ${{ steps.verify_upload.outputs.cloud_upload }} | n/a | n/a | n/a | n/a |"
            echo ""
            echo "### Backup provenance${AGE_NOTE}"
            echo "| Path | Project | DB | Redis | Tiles |"
            echo "|---|---|---|---|---|"
            echo "| **Local** | ${LP:-—} | ${LD:-—} | ${LR:-—} | ${LT:-—} |"
            echo "| **Cloud (prod paths)** | ${CP:-—} | ${CD:-—} | ${CR:-—} | ${CT:-—} |"
            echo ""
            echo "### Timings"
            echo "| Phase | Duration |"
            echo "|---|---|"
            echo "| Deploy | $(dur "$START_EPOCH" "$TS_DEPLOY") |"
            echo "| Local restore | $(dur "$TS_DEPLOY" "$TS_LOCAL") |"
            echo "| Cloud restore | $(dur "$TS_LOCAL" "$TS_CLOUD") |"
            echo "| Service tests | $(dur "$TS_CLOUD" "$TS_TESTS") |"
            echo ""
            echo "### Artifacts (pre-disaster)"
            echo "| | |"
            echo "|---|---|"
            echo "| **Project hash** | \`${{ steps.artifact_hash.outputs.project_hash }}\` |"
            echo "| **DB hash** | \`${{ steps.artifact_hash.outputs.db_hash }}\` |"
            echo ""
            echo "### Service tests (after cloud restore)"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Summary | $TEST_SUMMARY |"
            echo "| Failures | $TEST_FAILS |"
            echo "| Tiles in cloud | $TILES_ROW |"
            echo ""
            echo "### Evidence"
            if [ "${{ steps.shot_check.outputs.exists }}" = "yes" ]; then
              echo "📸 Screenshot preview published inline in the **Publish screenshot preview** job below — refresh in ~1 min"
            else
              echo "📸 Screenshot: not captured in this run — no preview published"
            fi
            echo "📎 Artifacts (logs, screenshots): [run artifacts]($ART#artifacts)"
            echo ""
            echo "<sub>Runner note: \`ubuntu-latest\` migrates to Ubuntu 26 from 2026-10-19 — pin the label if a break appears.</sub>"
            if [[ "$DESTROY_OUTCOME" != "success" ]]; then
              echo ""
              echo "### ⚠️ Server may still exist (destroy did not complete)"
              if [[ "$KEEP_SERVER" == "true" ]]; then
                echo "Requested via \`keep_server=true\` — intentionally kept."
              elif [[ -z "$SERVER_IP" ]]; then
                echo "No server IP recorded (deploy failed early) — destroy was skipped. Verify the \`test\` Terraform workspace is empty."
              else
                echo "The destroy step did not complete — check its log; the \`test\` workspace may still hold \`$SERVER_IP\`."
              fi
              if [[ -n "$SERVER_IP" ]]; then
                echo ""
                echo "SSH: \`ssh -i ~/.ssh/Vitali.pem ubuntu@$SERVER_IP\`"
              fi
              echo ""
              echo "To tear it down: re-run this workflow with **keep_server = false** (any run that records a server IP destroys it)."
              echo ""
              echo "Note: the next run reuses an existing \`test\` server instead of recreating it."
            fi
          } >> "$M"

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          shred -u ~/.vault_pass_dreamseed 2>/dev/null || rm -f ~/.vault_pass_dreamseed
          shred -u secrets/.env 2>/dev/null || rm -f secrets/.env
          shred -u secrets/rclone.conf 2>/dev/null || rm -f secrets/rclone.conf
          rm -f ~/.ssh/deploy_key.pub ~/.ssh/config

  publish-preview:
    name: Publish screenshot preview
    needs: restore-test
    # Publish whenever a server actually existed (screenshot captured before
    # teardown) — even when the restore test failed, so the evidence is visible
    # under the spoiler instead of a dead "Download screenshot" link.
    if: needs.restore-test.outputs.server_ip != '' && needs.restore-test.outputs.screenshot == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages-site
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      # Pages artifacts replace the whole site: absorb the newest live-site
      # artifacts (union of what is/recently was published by both workflows),
      # then add this run's files — publishing can only ever grow the site.
      - name: Merge with the currently live site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-site
          gh run download "$GITHUB_RUN_ID" -n pages-own -D /tmp/pages-site
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=20" --jq '([.artifacts[] | select(.expired == false) | .workflow_run.id] | unique | .[0:9] | .[])')
          merged=0
          for id in $IDS; do
            if [ "$id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            if gh run download "$id" -n github-pages -D "/tmp/pages-site-live-$id"; then
              # --update=none (not -n, non-portable): never clobber this run's
              # files, but keep every older run's screenshots/code map.
              cp -r --update=none "/tmp/pages-site-live-$id/." /tmp/pages-site/
              merged=$((merged + 1))
            else
              echo "::warning::could not download live site artifact from run $id"
            fi
          done
          if [ "$merged" -eq 0 ]; then
            echo "::warning::no previous site artifact merged — this publish may replace existing files"
          fi

      - name: Upload merged site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: /tmp/pages-site

      - name: Deploy screenshot preview
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Write preview summary
        run: |
          M="${GITHUB_STEP_SUMMARY:-}"
          [[ -z "$M" ]] && exit 0
          {
            echo "<details><summary>📸 Restore Test screenshot</summary>"
            echo ""
            echo "![restore-test](${{ steps.pages.outputs.page_url }}test-restore-${{ github.run_id }}.png)"
            echo ""
            echo "</details>"
          } >> "$M"
