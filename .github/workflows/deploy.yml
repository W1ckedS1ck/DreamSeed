name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, dev-aws, dev-hetz]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [deploy, destroy]
        default: deploy
      web_server:
        description: 'Web server (deploy only)'
        required: true
        type: choice
        options: [nginx, apache]
        default: nginx
      server_ip:
        description: 'Skip Terraform — reconfigure existing server IP (deploy only)'
        required: false
        type: string
      confirm:
        description: 'Destroy confirmation — type "destroy prod" to destroy prod, "destroy dev" for dev'
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: ${{ inputs.action == 'destroy' && 'Destroy' || 'Deploy' }} ${{ inputs.environment }}${{ inputs.action == 'deploy' && format(' ({0})', inputs.web_server) || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-terraform

      - name: Setup Ansible
        if: inputs.action == 'deploy'
        uses: ./.github/actions/setup-ansible

      - uses: ./.github/actions/setup-secrets
        with:
          env-file-b64: ${{ secrets.ENV_FILE_BASE64 }}
          vault-pass: ${{ secrets.VAULT_PASSWORD }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          rclone-conf-b64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Deploy
        if: inputs.action == 'deploy'
        id: deploy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          # deploy.sh loads secrets/.env internally — no need to source here
          ENV="${{ inputs.environment }}"
          WEB_SRV="${{ inputs.web_server }}"
          SERVER_IP="${{ inputs.server_ip }}"

          [[ -z "$ENV" ]] && { echo "Missing environment"; exit 1; }

          WEB_FLAG="-n"
          [[ "$WEB_SRV" == "apache" ]] && WEB_FLAG="-a"

          IP_FLAG=""
          [[ -n "$SERVER_IP" ]] && IP_FLAG="-i $SERVER_IP"

          # shellcheck disable=SC2086
          ./deploy.sh "$ENV" $WEB_FLAG $IP_FLAG -p

      - name: Destroy
        if: inputs.action == 'destroy'
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          DESTROY_CONFIRM: ${{ inputs.confirm }}
        run: |
          ssh-keygen -y -f ~/.ssh/Vitali.pem > ~/.ssh/Vitali.pub
          export SSH_PUBLIC_KEY_PATH=~/.ssh/Vitali.pub

          ENV="${{ inputs.environment }}"

          # Prod requires typing "destroy prod"
          if [[ "$ENV" == "prod" ]]; then
            if [[ "$DESTROY_CONFIRM" != "destroy prod" ]]; then
              echo "ERROR: To destroy prod you must set confirm = 'destroy prod'"
              exit 1
            fi
          else
            # Dev envs require typing "destroy dev"
            if [[ "$DESTROY_CONFIRM" != "destroy dev" ]]; then
              echo "ERROR: To destroy a dev environment you must set confirm = 'destroy dev'"
              exit 1
            fi
          fi

          export CI_DESTROY_CONFIRM=yes
          ./deploy.sh "$ENV" -n -x

      - name: Notify failure
        if: failure()
        run: |
          source secrets/.env
          MSG="❌ *Deploy failed* — ${{ inputs.environment }}
          Action: ${{ inputs.action }}
          📅 $(date '+%Y-%m-%d %H:%M')"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "text=$MSG" > /dev/null || true
