name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, dev-aws, dev-hetz]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [deploy, destroy]
        default: deploy
      web_server:
        description: 'Web server (deploy only)'
        required: true
        type: choice
        options: [nginx, apache]
        default: nginx
      server_ip:
        description: 'Skip Terraform — reconfigure existing server IP (deploy only)'
        required: false
        type: string
      confirm:
        description: 'Destroy confirmation — type "destroy prod" to destroy prod, "destroy dev" for dev'
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: ${{ inputs.action == 'destroy' && 'Destroy' || 'Deploy' }} ${{ inputs.environment }}${{ inputs.action == 'deploy' && format(' ({0})', inputs.web_server) || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-terraform

      - name: Setup Ansible
        if: inputs.action == 'deploy'
        uses: ./.github/actions/setup-ansible

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.TG_TOKEN }}"
          echo "::add-mask::${{ secrets.TG_CHAT_ID }}"
          echo "::add-mask::${{ secrets.TG_THREAD_ID }}"
          echo "::add-mask::${{ secrets.DB_PASS }}"
          echo "::add-mask::${{ secrets.CLOUDFLARE_API_TOKEN }}"
          echo "::add-mask::${{ secrets.CF_ZONE_ID }}"
          echo "::add-mask::${{ secrets.HCLOUD_TOKEN }}"
          echo "::add-mask::${{ secrets.GRAFANA_PASS }}"
          echo "::add-mask::${{ secrets.BETTERUPTIME_API_TOKEN }}"
          echo "::add-mask::${{ secrets.SSH_PRIVATE_KEY }}"
          echo "::add-mask::${{ secrets.VAULT_PASSWORD }}"
          echo "::add-mask::${{ secrets.RCLONE_CONF_BASE64 }}"
          echo "::add-mask::${{ secrets.USER_SSH_PUBLIC_KEY }}"
          echo "::add-mask::${{ secrets.DEV_GRAFANA_CLOUD_PUSH_URL }}"
          echo "::add-mask::${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}"
          echo "::add-mask::${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}"
          echo "::add-mask::${{ secrets.PROD_GRAFANA_CLOUD_PUSH_URL }}"
          echo "::add-mask::${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}"
          echo "::add-mask::${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}"

      - name: Setup secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          DB_PASS: ${{ secrets.DB_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GRAFANA_PASS: ${{ secrets.GRAFANA_PASS }}
          BETTERUPTIME_API_TOKEN: ${{ secrets.BETTERUPTIME_API_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_BASE64 }}
          USER_SSH_PUBLIC_KEY: ${{ secrets.USER_SSH_PUBLIC_KEY }}
          DEV_GRAFANA_CLOUD_PUSH_URL: ${{ secrets.DEV_GRAFANA_CLOUD_PUSH_URL }}
          DEV_GRAFANA_CLOUD_USERNAME: ${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}
          DEV_GRAFANA_CLOUD_TOKEN: ${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}
          PROD_GRAFANA_CLOUD_PUSH_URL: ${{ secrets.PROD_GRAFANA_CLOUD_PUSH_URL }}
          PROD_GRAFANA_CLOUD_USERNAME: ${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}
          PROD_GRAFANA_CLOUD_TOKEN: ${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}
        run: |
          mkdir -p secrets ~/.ssh

          {
            echo "TG_TOKEN=$TG_TOKEN"
            echo "TG_CHAT_ID=$TG_CHAT_ID"
            echo "TG_THREAD_ID=$TG_THREAD_ID"
            echo "DB_PASS=$DB_PASS"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_ZONE_ID=$CF_ZONE_ID"
            echo "HCLOUD_TOKEN=$HCLOUD_TOKEN"
            echo "GRAFANA_PASS=$GRAFANA_PASS"
            echo "BETTERUPTIME_API_TOKEN=$BETTERUPTIME_API_TOKEN"
            echo "SSH_PRIVATE_KEY_PATH=${HOME}/.ssh/deploy_key"
            echo "SSH_PUBLIC_KEY_PATH=${HOME}/.ssh/deploy_key.pub"
            echo "ADDITIONAL_SSH_KEYS=\"$USER_SSH_PUBLIC_KEY\""

            echo "DEV_GRAFANA_CLOUD_URL=$DEV_GRAFANA_CLOUD_PUSH_URL"
            echo "DEV_GRAFANA_CLOUD_USERNAME=$DEV_GRAFANA_CLOUD_USERNAME"
            echo "DEV_GRAFANA_CLOUD_TOKEN=$DEV_GRAFANA_CLOUD_TOKEN"

            echo "PROD_GRAFANA_CLOUD_URL=$PROD_GRAFANA_CLOUD_PUSH_URL"
            echo "PROD_GRAFANA_CLOUD_USERNAME=$PROD_GRAFANA_CLOUD_USERNAME"
            echo "PROD_GRAFANA_CLOUD_TOKEN=$PROD_GRAFANA_CLOUD_TOKEN"

            # Use existing "Vitali" key and Primary IP in Hetzner Cloud
            echo "HETZNER_SSH_KEY_NAME=Vitali"
            echo "HETZNER_PRIMARY_IP_NAME=primary_ip-1"
          } > secrets/.env
          chmod 600 secrets/.env

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null

          echo -n "$VAULT_PASSWORD" > ~/.vault_pass_dreamseed
          chmod 600 ~/.vault_pass_dreamseed

          [[ -n "$RCLONE_CONF_B64" ]] && echo "$RCLONE_CONF_B64" | base64 -d > secrets/rclone.conf && chmod 600 secrets/rclone.conf

      - name: Deploy
        if: inputs.action == 'deploy'
        id: deploy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          # deploy.sh loads secrets/.env internally — no need to source here
          ENV="${{ inputs.environment }}"
          WEB_SRV="${{ inputs.web_server }}"
          SERVER_IP="${{ inputs.server_ip }}"

          [[ -z "$ENV" ]] && { echo "Missing environment"; exit 1; }

          DEPLOY_ARGS=("$ENV")
          [[ "$WEB_SRV" == "apache" ]] && DEPLOY_ARGS+=("-a") || DEPLOY_ARGS+=("-n")
          [[ -n "$SERVER_IP" ]] && DEPLOY_ARGS+=("-i" "$SERVER_IP")
          DEPLOY_ARGS+=("-p")

          ./deploy.sh "${DEPLOY_ARGS[@]}"

      - name: Destroy
        if: inputs.action == 'destroy'
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          DESTROY_CONFIRM: ${{ inputs.confirm }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          export SSH_PUBLIC_KEY_PATH=~/.ssh/deploy_key.pub

          ENV="${{ inputs.environment }}"

          # Prod requires typing "destroy prod"
          if [[ "$ENV" == "prod" ]]; then
            if [[ "$DESTROY_CONFIRM" != "destroy prod" ]]; then
              echo "ERROR: To destroy prod you must set confirm = 'destroy prod'"
              exit 1
            fi
          else
            # Dev envs require typing "destroy dev"
            if [[ "$DESTROY_CONFIRM" != "destroy dev" ]]; then
              echo "ERROR: To destroy a dev environment you must set confirm = 'destroy dev'"
              exit 1
            fi
          fi

          export CI_DESTROY_CONFIRM=yes
          ./deploy.sh "$ENV" -x

      - name: Notify failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: |
          MSG="❌ *Deploy failed* — ${{ inputs.environment }}
          Action: ${{ inputs.action }}
          📅 $(date '+%Y-%m-%d %H:%M')"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "parse_mode=MarkdownV2" \
            --data-urlencode "text=$MSG" > /dev/null || true
