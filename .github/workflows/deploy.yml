name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, dev-aws, dev-hetz]
      web_server:
        description: 'Web server'
        required: true
        type: choice
        options: [nginx, apache]
        default: nginx
      server_ip:
        description: 'Skip Terraform — reconfigure existing server IP (leave empty for full deploy)'
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} (${{ inputs.web_server }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Setup Ansible
        run: |
          pip install ansible PyMySQL --quiet
          ansible-galaxy collection install community.mysql ansible.posix

      - name: Reconstruct secrets
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_BASE64 }}
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p secrets
          echo "$ENV_FILE_B64" | base64 -d > secrets/.env
          chmod 600 secrets/.env

          echo -n "$VAULT_PASS" > ~/.vault_pass_dreamseed
          chmod 600 ~/.vault_pass_dreamseed

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/Vitali.pem
          chmod 600 ~/.ssh/Vitali.pem

          if [ -n "$RCLONE_CONF_B64" ]; then
            echo "$RCLONE_CONF_B64" | base64 -d > secrets/rclone.conf
            chmod 600 secrets/rclone.conf
          fi

      - name: Deploy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          ssh-keygen -y -f ~/.ssh/Vitali.pem > ~/.ssh/Vitali.pub
          export SSH_PUBLIC_KEY_PATH=~/.ssh/Vitali.pub

          WEB_FLAG="-n"
          [[ "${{ inputs.web_server }}" == "apache" ]] && WEB_FLAG="-a"

          IP_FLAG=""
          [[ -n "${{ inputs.server_ip }}" ]] && IP_FLAG="-i ${{ inputs.server_ip }}"

          # shellcheck disable=SC2086
          ./deploy.sh "${{ inputs.environment }}" $WEB_FLAG $IP_FLAG
