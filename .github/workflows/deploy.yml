name: "[M] Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [prod, dev-aws, dev-hetz, prod-hetz]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [deploy, destroy]
        default: deploy
      web_server:
        description: 'Web server (deploy only)'
        required: true
        type: choice
        options: [nginx, apache]
        default: nginx
      server_ip:
        description: 'Skip Terraform — reconfigure existing server IP (deploy only)'
        required: false
        type: string
      mode:
        description: 'Playbook execution mode (deploy only)'
        required: false
        type: choice
        options: [parallel, sequential]
        default: parallel
      skip_dns:
        description: 'Skip Cloudflare DNS update (default: update)'
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Destroy confirmation — type "destroy <environment>" to confirm (e.g., destroy prod, destroy dev-aws)'
        required: false
        type: string

concurrency:
  group: env-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  ACTIONS_RUNNER_DEBUG: false

jobs:
  deploy:
    name: ${{ inputs.action == 'destroy' && 'Destroy' || 'Deploy' }} ${{ inputs.environment }}${{ inputs.action == 'deploy' && format(' ({0})', inputs.web_server) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ startsWith(inputs.environment, 'prod') && 'production' || '' }}
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-terraform

      - name: Setup Ansible
        if: inputs.action == 'deploy'
        uses: $/.github/actions/setup-ansible

      - name: Prepare
        id: start
        run: |
          echo "Workflow started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/setup-secrets
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - uses: $/.github/actions/setup-env
        with:
          tg_token: ${{ secrets.TG_TOKEN }}
          tg_chat_id: ${{ vars.TG_CHAT_ID }}
          tg_thread_id: ${{ vars.TG_THREAD_ID }}
          db_pass: ${{ secrets.DB_PASS }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_firewall_token: ${{ secrets.CLOUDFLARE_FIREWALL_TOKEN }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          prod_hetz_hcloud_token: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          grafana_pass: ${{ secrets.GRAFANA_PASS }}
          betteruptime_api_token: ${{ secrets.BETTERUPTIME_API_TOKEN }}
          betteruptime_backup_key: ${{ secrets.BETTERUPTIME_BACKUP_KEY }}
          betteruptime_gdrive_key: ${{ secrets.BETTERUPTIME_GDRIVE_KEY }}
          betteruptime_report_daily_key: ${{ secrets.BETTERUPTIME_REPORT_DAILY_KEY }}
          betteruptime_report_weekly_key: ${{ secrets.BETTERUPTIME_REPORT_WEEKLY_KEY }}
          betteruptime_verify_key: ${{ secrets.BETTERUPTIME_VERIFY_KEY }}
          betteruptime_check_services_key: ${{ secrets.BETTERUPTIME_CHECK_SERVICES_KEY }}
          dev_grafana_cloud_url: ${{ secrets.DEV_GRAFANA_CLOUD_URL }}
          dev_grafana_cloud_username: ${{ secrets.DEV_GRAFANA_CLOUD_USERNAME }}
          dev_grafana_cloud_token: ${{ secrets.DEV_GRAFANA_CLOUD_TOKEN }}
          prod_grafana_cloud_url: ${{ secrets.PROD_GRAFANA_CLOUD_URL }}
          prod_grafana_cloud_username: ${{ secrets.PROD_GRAFANA_CLOUD_USERNAME }}
          prod_grafana_cloud_token: ${{ secrets.PROD_GRAFANA_CLOUD_TOKEN }}
          loki_url: ${{ vars.LOKI_URL }}
          loki_username: ${{ vars.LOKI_USERNAME }}
          loki_url_prod: ${{ vars.LOKI_URL_PROD }}
          loki_username_prod: ${{ vars.LOKI_USERNAME_PROD }}
          environment: ${{ inputs.environment }}
          faro_collector_url: ${{ vars.FARO_COLLECTOR_URL }}
          faro_collector_url_prod: ${{ vars.FARO_COLLECTOR_URL_PROD }}
          dev_aws_access_key: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          dev_aws_secret_key: ${{ secrets.DEV_AWS_SECRET_KEY }}
          dev_aws_region: ${{ secrets.DEV_AWS_REGION }}
          prod_access_key: ${{ secrets.PROD_ACCESS_KEY }}
          prod_secret_key: ${{ secrets.PROD_SECRET_KEY }}
          prod_region: ${{ secrets.PROD_REGION }}
          user_ssh_public_key: ${{ secrets.USER_SSH_PUBLIC_KEY }}
          vitali_ssh_public_key: ${{ secrets.VITALI_SSH_PUBLIC_KEY }}
          rclone_crypt_password: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
          rclone_conf_base64: ${{ secrets.RCLONE_CONF_BASE64 }}
          ubuntu_pro_token: ${{ secrets.UBUNTU_PRO_TOKEN }}

      - name: Target config
        run: |
          cat >> secrets/.env << 'EOF'
          DEV_HETZ_SSH_KEY_NAME=Vitali.pub
          DEV_HETZ_PRIMARY_IP_NAME=primary_ip-1
          DEV_HETZ_SERVER_TYPE=cx23
          PROD_HETZ_SERVER_TYPE=cx33
          PROD_HETZ_SSH_KEY_NAME=Vitali.pub
          PROD_HETZ_PRIMARY_IP_NAME=
          PROD_HETZ_ENABLE_PRIMARY_IP=true
          EOF

      - name: Deploy
        if: inputs.action == 'deploy'
        id: deploy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          PYTHONUNBUFFERED: 1
          GIT_REF: ${{ github.ref_name }}
          SERVER_IP: ${{ inputs.server_ip }}
          DEPLOY_ENV: ${{ inputs.environment }}
          WEB_SRV_INPUT: ${{ inputs.web_server }}
          SKIP_DNS_INPUT: ${{ inputs.skip_dns }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          chmod +x deploy.sh
          : > /tmp/deploy.log

          ENV="$DEPLOY_ENV"
          WEB_SRV="$WEB_SRV_INPUT"

          [[ -z "$ENV" ]] && { echo "Missing environment"; exit 1; }

          # Strict IPv4 validation — blocks shell injection and malformed values
          if [[ -n "$SERVER_IP" ]]; then
            [[ "$SERVER_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || {
              echo "::error::Invalid server_ip '$SERVER_IP' — expected IPv4 address"
              exit 1
            }
            IFS=. read -r _o1 _o2 _o3 _o4 <<< "$SERVER_IP"
            if (( 10#${_o1} > 255 || 10#${_o2} > 255 || 10#${_o3} > 255 || 10#${_o4} > 255 )); then
              echo "::error::Invalid server_ip '$SERVER_IP' — octets must be 0-255"
              exit 1
            fi
          fi

          DEPLOY_ARGS=("$ENV")
          [[ "$WEB_SRV" == "apache" ]] && DEPLOY_ARGS+=("-a") || DEPLOY_ARGS+=("-n")
          [[ -n "$SERVER_IP" ]] && DEPLOY_ARGS+=("-i" "$SERVER_IP")
          [[ "$SKIP_DNS_INPUT" == "true" ]] && DEPLOY_ARGS+=("--no-dns")
          [[ "$MODE_INPUT" == "parallel" ]] && DEPLOY_ARGS+=("-p")

          set +e
          stdbuf -oL ./deploy.sh "${DEPLOY_ARGS[@]}" 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          set -e

          if [[ -z "$SERVER_IP" ]]; then
            ip=$(grep -oP '^  Server\s+\K\d+\.\d+\.\d+\.\d+' /tmp/deploy.log 2>/dev/null || true)
            [[ -n "$ip" ]] && echo "server_ip=$ip" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$rc" -eq 0 ]]; then
            if grep -q 'GRAFANA_FALLBACK_FAILED=true' /tmp/deploy.log 2>/dev/null; then
              echo "::warning::Grafana fallback failed — deploy degraded (dashboards/alerting may be missing)"
            elif grep -qE '❌ CRITICAL|ERROR!|Traceback \(|^Error:|^✗ Error|fatal: \[.*\]: FAILED!' /tmp/deploy.log 2>/dev/null; then
              echo "::error::Deploy reported failures despite exit code 0"
              rc=1
            fi
          fi

          perl -pe 's/\e\[[\d;]*[mK]//g' /tmp/deploy.log > /tmp/deploy-summary.txt
          exit "$rc"

      - name: Scrub secrets from deploy log
        if: always() && inputs.action == 'deploy' && failure()
        uses: $/.github/actions/scrub-log
        with:
          log-path: /tmp/deploy.log
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Upload deploy log (debug)
        if: always() && inputs.action == 'deploy' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-log-${{ inputs.environment }}
          path: /tmp/deploy.log
          retention-days: 2

      - name: Post-deploy
        if: always() && inputs.action == 'deploy'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          SERVER_IP_INPUT: ${{ inputs.server_ip }}
          DEPLOY_ENV: ${{ inputs.environment }}
          WEB_INPUT: ${{ inputs.web_server }}
          SKIP_DNS_INPUT: ${{ inputs.skip_dns }}
        run: |
          ENV="$DEPLOY_ENV"
          WEB="$WEB_INPUT"
          SKIP_DNS="$SKIP_DNS_INPUT"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))
          DEPLOY_STATUS="${{ steps.deploy.outcome }}"

          GRAFANA_DEGRADED=false
          if [ -f /tmp/deploy-summary.txt ] && grep -q 'GRAFANA_FALLBACK_FAILED=true' /tmp/deploy-summary.txt 2>/dev/null; then
            GRAFANA_DEGRADED=true
          fi

          # --- Deploy summary ---
          SERVER_IP="${{ steps.deploy.outputs.server_ip }}"
          SERVER_IP="${SERVER_IP:-$SERVER_IP_INPUT}"
          if [ "$DEPLOY_STATUS" = "success" ]; then
            RESULT="✅"
          else
            RESULT="❌"
          fi

          M="${GITHUB_STEP_SUMMARY:-}"
          if [ -n "$M" ]; then
            {
              echo "## Deploy ${RESULT}"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| 🌐 **Environment** | ${ENV} |"
              echo "| 🖥 **Web server** | ${WEB} |"
              echo "| 📡 **Server IP** | ${SERVER_IP:-new} |"
              echo "| ✅ **DNS update** | $([ "${SKIP_DNS}" = "true" ] && echo "skipped" || echo "yes") |"
              echo "| ⏱ **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |"
              echo "| 🔗 **Commit** | ${{ github.sha }} |"
              echo "| 🔗 **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
              echo "| 📸 **Screenshot preview** | published in a separate job below — refresh in ~1 min |"
              if [ "$GRAFANA_DEGRADED" = "true" ]; then
                echo "| ⚠ **Grafana** | degraded — fallback failed (dashboards/alerting may be missing) |"
              fi
            } >> "$M"
          fi

          # --- Append deploy log ---
          LOG=/tmp/deploy-summary.txt
          if [ -f "$LOG" ]; then
            {
              echo '<details><summary>📄 Deploy result</summary><pre><code>'
              sed -n '
                /^[[:space:]]*▸ Post-deploy checks/,/^$/{
                  /^[[:space:]]*$/d
                  p
                }
                /^[[:space:]]*Step[[:space:]]*Time/,/^[[:space:]]*Total[[:space:]]/{
                  /^[[:space:]]*$/d
                  p
                }
                /^[[:space:]]*✓ Deployment Successful/,/^[[:space:]]*Log:/{
                  /^[[:space:]]*$/d
                  p
                }
              ' "$LOG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
              echo '</code></pre></details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Telegram notification (only on success) ---
          if [ "$DEPLOY_STATUS" = "success" ]; then
            MSG="✅ *Deploy complete* — ${ENV}
            Server: ${SERVER_IP:-new}
            🖥 ${WEB}
            📅 $(date '+%Y-%m-%d %H:%M')"
            if [ "$GRAFANA_DEGRADED" = "true" ]; then
              MSG+="
            ⚠ *Grafana degraded* — fallback failed (dashboards may be missing)"
            fi
            bash "$GITHUB_WORKSPACE/scripts/send_tg.sh" "$MSG" Markdown || true
          fi

      - name: Add code map to Pages artifact
        if: success() && inputs.action == 'deploy'
        run: |
          if [ -f docs/codemap/codemap.html ]; then
            mkdir -p /tmp/pages-screenshot
            cp docs/codemap/codemap.html /tmp/pages-screenshot/index.html
            cp docs/codemap/codemap.html /tmp/pages-screenshot/codemap.html
          fi

      - name: Capture site screenshot
        if: success() && inputs.action == 'deploy'
        uses: $/.github/actions/capture-screenshot
        with:
          url: "https://${{ inputs.environment == 'prod' && 'dreamseed.online' || inputs.environment == 'prod-hetz' && 'dreamseed.online' || inputs.environment == 'dev-aws' && 'aws.vitalikuts.online' || inputs.environment == 'dev-hetz' && 'hetz.vitalikuts.online' || '' }}/"
          output: /tmp/pages-screenshot/${{ inputs.environment }}.png

      - name: Upload screenshot to Pages
        if: success() && inputs.action == 'deploy'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: /tmp/pages-screenshot

      - name: Destroy
        if: inputs.action == 'destroy'
        id: destroy
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          DESTROY_CONFIRM: ${{ inputs.confirm }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          export SSH_PUBLIC_KEY_PATH=~/.ssh/deploy_key.pub

          chmod +x deploy.sh

          ENV="$DEPLOY_ENV"

          if [[ "$DESTROY_CONFIRM" != "destroy $ENV" ]]; then
            echo "ERROR: To destroy $ENV you must set confirm = 'destroy $ENV' (exactly)"
            exit 1
          fi

          export CI_DESTROY_CONFIRM=yes
          set +e
          stdbuf -oL ./deploy.sh "$ENV" -x 2>&1 | tee /tmp/deploy.log
          rc=${PIPESTATUS[0]}
          set -e

          # Parse destroy output for job summary
          if [[ "$rc" -eq 0 ]]; then
            if grep -qE '❌ CRITICAL|^\s*✗ |^Error:|ERROR!' /tmp/deploy.log 2>/dev/null; then
              echo "::error::Destroy reported failures despite exit code 0"
              rc=1
            fi
          fi

          ip=$(grep -oP '^  Server IP: \K[\d.]+' /tmp/deploy.log 2>/dev/null || true)
          [[ -n "$ip" ]] && echo "server_ip=$ip" >> "$GITHUB_OUTPUT"

          resources=$(grep -oP 'Destroy complete! Resources: \K\d+' /tmp/deploy.log 2>/dev/null || true)
          [[ -n "$resources" ]] && echo "resources_destroyed=$resources" >> "$GITHUB_OUTPUT"

          grep -q "✓ SSL certificates backed up" /tmp/deploy.log 2>/dev/null && echo "ssl_backed_up=yes" >> "$GITHUB_OUTPUT" || echo "ssl_backed_up=no" >> "$GITHUB_OUTPUT"
          grep -q "✓ Cloudflare DNS: deleted" /tmp/deploy.log 2>/dev/null && echo "dns_cleaned=yes" >> "$GITHUB_OUTPUT" || echo "dns_cleaned=no" >> "$GITHUB_OUTPUT"
          grep -q "✓ Ubuntu Pro detached" /tmp/deploy.log 2>/dev/null && echo "ubuntu_pro_detached=yes" >> "$GITHUB_OUTPUT" || echo "ubuntu_pro_detached=no" >> "$GITHUB_OUTPUT"

          exit "$rc"

      - name: Scrub secrets from destroy log
        if: always() && inputs.action == 'destroy' && failure()
        uses: $/.github/actions/scrub-log
        with:
          log-path: /tmp/deploy.log
          vault-password: ${{ secrets.VAULT_PASSWORD }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          rclone-conf-base64: ${{ secrets.RCLONE_CONF_BASE64 }}

      - name: Upload deploy log (debug)
        if: always() && inputs.action == 'destroy' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-destroy-log-${{ inputs.environment }}
          path: /tmp/deploy.log
          retention-days: 2
          if-no-files-found: ignore

      - name: Notify failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          FAIL_ENV: ${{ inputs.environment }}
          FAIL_ACTION: ${{ inputs.action }}
        run: |
          MSG="❌ *Deploy failed* — $FAIL_ENV
          Action: $FAIL_ACTION
          📅 $(date '+%Y-%m-%d %H:%M')"
          bash "$GITHUB_WORKSPACE/scripts/send_tg.sh" "$MSG" Markdown || true

      - name: Write destroy summary
        if: always() && inputs.action == 'destroy'
        env:
          DESTROY_ENV: ${{ inputs.environment }}
        run: |
          ENV="$DESTROY_ENV"
          ELAPSED=$(( $(date +%s) - ${{ steps.start.outputs.start_epoch }} ))
          RESULT="${{ job.status == 'success' && '✅' || '❌' }}"
          IP="${{ steps.destroy.outputs.server_ip }}"
          RESOURCES="${{ steps.destroy.outputs.resources_destroyed }}"
          SSL="${{ steps.destroy.outputs.ssl_backed_up }}"
          DNS="${{ steps.destroy.outputs.dns_cleaned }}"
          PRO="${{ steps.destroy.outputs.ubuntu_pro_detached }}"

          M="${GITHUB_STEP_SUMMARY:-}"
          [[ -z "$M" ]] && exit 0
          {
            echo "## Destroy ${RESULT}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Environment** | ${ENV} |"
            echo "| **Server IP** | ${IP:-unknown} |"
            echo "| **Resources destroyed** | ${RESOURCES:-0} |"
            echo "| **SSL backed up** | ${SSL} |"
            echo "| **DNS cleaned** | ${DNS} |"
            echo "| **Ubuntu Pro detached** | ${PRO} |"
            echo "| **Duration** | $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$M"

      - name: Grafana deployment annotation
        # Vertical marker on all Grafana dashboards — correlate incidents with
        # releases. Non-fatal by design: a failed annotation never fails deploy.
        if: >-
          ${{ always() && ((inputs.action == 'deploy' && steps.deploy.outcome == 'success')
              || (inputs.action == 'destroy' && steps.destroy.outcome == 'success')) }}
        env:
          ENV_NAME: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          WEB_SERVER: ${{ inputs.web_server }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_IP: ${{ steps.deploy.outputs.server_ip }}
          PROD_SA_TOKEN: ${{ secrets.PROD_GRAFANA_CLOUD_SA_TOKEN }}
          DEV_SA_TOKEN: ${{ secrets.DEV_GRAFANA_CLOUD_SA_TOKEN }}
        run: |
          case "$ENV_NAME" in
            prod|prod-hetz)
              GRAFANA_URL="https://dreamseed.grafana.net"; TOKEN="$PROD_SA_TOKEN" ;;
            *)
              GRAFANA_URL="https://vitalikuts.grafana.net"; TOKEN="$DEV_SA_TOKEN" ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::warning::No Grafana SA token for $ENV_NAME — annotation skipped"
            exit 0
          fi

          IP_PART=""
          [ -n "$SERVER_IP" ] && IP_PART=", ip $SERVER_IP"
          VERB="Deploy"; [ "$ACTION" = "destroy" ] && VERB="Destroy"

          TAGS=$(jq -nc --arg e "$ENV_NAME" --arg a "$ACTION" \
            '["dreamseed", $a, $e] + (if $a == "deploy" then ["web"] else [] end)')
          PAYLOAD=$(jq -nc \
            --argjson tags "$TAGS" \
            --arg text "$(printf '%s %s (%s%s) — commit %.7s · run #%s' "$VERB" "$ENV_NAME" "$WEB_SERVER" "$IP_PART" "$GIT_SHA" "$RUN_ID")" \
            --argjson time "$(date +%s000)" \
            '{tags: $tags, text: $text, time: $time}')

          CFG=$(mktemp); chmod 600 "$CFG"
          printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" > "$CFG"
          CODE=000
          for i in 1 2 3; do
            CODE=$(curl -sS --max-time 15 -o /tmp/ga-resp.json -w '%{http_code}' \
              -X POST --config "$CFG" -H 'Content-Type: application/json' \
              -d "$PAYLOAD" "$GRAFANA_URL/api/annotations" || echo 000)
            echo "annotation attempt $i: HTTP $CODE"
            grep -q '"id"' /tmp/ga-resp.json 2>/dev/null && break
            # First hit on a sleeping instance returns 503 Loading but wakes it.
            [ "$i" -lt 3 ] && sleep 20
          done
          shred -u "$CFG" 2>/dev/null || rm -f "$CFG"
          if grep -q '"id"' /tmp/ga-resp.json 2>/dev/null; then
            echo "::notice::Grafana annotation created ($(jq -r '.id' /tmp/ga-resp.json))"
          else
            echo "::warning::Grafana annotation failed after retries (HTTP $CODE) — non-fatal"
          fi

      - name: Cleanup secrets
        if: always()
        run: |
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          shred -u ~/.vault_pass_dreamseed 2>/dev/null || rm -f ~/.vault_pass_dreamseed
          shred -u secrets/.env 2>/dev/null || rm -f secrets/.env
          shred -u secrets/rclone.conf 2>/dev/null || rm -f secrets/rclone.conf
          rm -f ~/.ssh/deploy_key.pub

  publish-preview:
    name: Publish screenshot preview
    needs: deploy
    if: needs.deploy.result == 'success' && inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy screenshot preview
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Write preview summary
        env:
          PREVIEW_ENV: ${{ inputs.environment }}
        run: |
          M="${GITHUB_STEP_SUMMARY:-}"
          [[ -z "$M" ]] && exit 0
          {
            echo "<details><summary>📸 Screenshot — $PREVIEW_ENV</summary>"
            echo ""
            echo "![$PREVIEW_ENV](${{ steps.pages.outputs.page_url }}$PREVIEW_ENV.png?t=${{ github.run_id }})"
            echo ""
            echo "</details>"
            echo ""
            echo "### 🗺 Code map"
            echo ""
            echo "[Open interactive code map](${{ steps.pages.outputs.page_url }}codemap.html?t=${{ github.run_id }})"
          } >> "$M"
