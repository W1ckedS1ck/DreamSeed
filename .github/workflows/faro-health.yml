name: Faro health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query prod Frontend Observability logs
        env:
          GRAFANA_URL: https://dreamseed.grafana.net
          SA_TOKEN: ${{ secrets.PROD_GRAFANA_CLOUD_SA_TOKEN }}
        run: |
          set -uo pipefail
          auth=(-H "Authorization: Bearer $SA_TOKEN")
          echo "== apps =="
          curl -sS --max-time 20 "${auth[@]}" "$GRAFANA_URL/api/plugin-proxy/grafana-kowalski-app/api-proxy/api/v1/app" \
            | jq -r '.[] | [.id,.name,.lastReceivedDataAt] | @tsv'
          base="$GRAFANA_URL/api/datasources/proxy/uid/grafanacloud-logs/loki/api/v1"
          now=$(date -u +%s)
          queries=(
            'sum(count_over_time({app_id="1704"}[24h])) by (kind)'
            'sum(count_over_time({app_id="1704"}[1h])) by (kind)'
            'sum(count_over_time({app_id="1704", kind="exception"}[24h]))'
            'sum(count_over_time({app_id="1704", kind="exception"}[1h]))'
            'sum(count_over_time({app_id="1704"} | logfmt | level="error" [24h]))'
            'sum(count_over_time({app_id="1704"} | logfmt | level="error" [1h]))'
            'sum(count_over_time({app_id="1704"} | logfmt | event_name="faro.performance.resource" | event_data_httpStatus=~"[45][0-9][0-9]" [24h]))'
            'sum(count_over_time({app_id="1704"} | logfmt | event_name="faro.performance.resource" | event_data_httpStatus=~"[45][0-9][0-9]" [1h]))'
          )
          for q in "${queries[@]}"; do
            echo "-- $q"
            curl -sS --max-time 20 "${auth[@]}" --get "$base/query" \
              --data-urlencode "query=$q" --data-urlencode "time=$now" \
              | jq -c 'if .status=="success" then {status, result: [.data.result[]? | {labels: .metric, value: .value[1]}]} else . end'
          done
