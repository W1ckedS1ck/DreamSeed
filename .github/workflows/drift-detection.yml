name: "[B] Drift Detection"

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - '.github/workflows/drift-detection.yml'
  schedule:
    - cron: '5 7 * * *'  # 07:05 UTC daily
  workflow_dispatch:

concurrency:
  group: drift-detection-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-drift:
    name: Detect drift — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.provider == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod-hetz
            tf_dir: terraform/hetzner
            tf_workspace: prod-hetz
            environment: prod-hetz
            provider: prod
          - target: prod
            tf_dir: terraform/aws
            tf_workspace: prod
            environment: prod
            provider: prod
          - target: dev-aws
            tf_dir: terraform/aws
            tf_workspace: dev-aws
            environment: dev-aws
            provider: dev
          - target: dev-hetz
            tf_dir: terraform/hetzner
            tf_workspace: dev-hetz
            environment: dev-hetz
            provider: dev
          - target: cloudflare
            tf_dir: terraform/cloudflare
            tf_workspace: cloudflare
            environment: cloudflare
            provider: dev
          - target: cloudflare-prod
            tf_dir: terraform/cloudflare
            tf_workspace: cloudflare-prod
            environment: cloudflare-prod
            provider: prod
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: ${{ matrix.tf_workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🚀 Start
        run: echo "Drift detection started at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Mask secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
        run: |
          for v in "$TG_TOKEN" "$TG_CHAT_ID" "$TG_THREAD_ID"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done

      - uses: ./.github/actions/setup-terraform

      - name: Set up credentials
        env:
          PROD_ACCESS_KEY: ${{ secrets.PROD_ACCESS_KEY }}
          PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
          PROD_REGION: ${{ secrets.PROD_REGION }}
          DEV_AWS_ACCESS_KEY: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          DEV_AWS_SECRET_KEY: ${{ secrets.DEV_AWS_SECRET_KEY }}
          DEV_AWS_REGION: ${{ secrets.DEV_AWS_REGION }}
          PROD_HETZ_HCLOUD_TOKEN: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "${{ matrix.target }}" in
            prod)
              echo "AWS_ACCESS_KEY_ID=$PROD_ACCESS_KEY" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=$PROD_SECRET_KEY" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=$PROD_REGION" >> "$GITHUB_ENV"
              echo "TF_VAR_aws_region=$PROD_REGION" >> "$GITHUB_ENV"
              echo "TF_VAR_environment=prod" >> "$GITHUB_ENV"
              echo "TF_VAR_ssh_public_key_path=/tmp/ssh.pub" >> "$GITHUB_ENV"
              ;;
            dev-aws)
              echo "AWS_ACCESS_KEY_ID=$DEV_AWS_ACCESS_KEY" >> "$GITHUB_ENV"
              echo "AWS_SECRET_ACCESS_KEY=$DEV_AWS_SECRET_KEY" >> "$GITHUB_ENV"
              echo "AWS_DEFAULT_REGION=$DEV_AWS_REGION" >> "$GITHUB_ENV"
              echo "TF_VAR_aws_region=$DEV_AWS_REGION" >> "$GITHUB_ENV"
              echo "TF_VAR_environment=dev-aws" >> "$GITHUB_ENV"
              echo "TF_VAR_ssh_public_key_path=/tmp/ssh.pub" >> "$GITHUB_ENV"
              ;;
            prod-hetz)
              echo "TF_VAR_hcloud_token=$PROD_HETZ_HCLOUD_TOKEN" >> "$GITHUB_ENV"
              echo "TF_VAR_environment=prod-hetz" >> "$GITHUB_ENV"
              echo "TF_VAR_server_type=cx33" >> "$GITHUB_ENV"
              echo "TF_VAR_ssh_key_name=Vitali.pub" >> "$GITHUB_ENV"
              echo "TF_VAR_enable_primary_ip=true" >> "$GITHUB_ENV"
              ;;
            dev-hetz)
              echo "TF_VAR_hcloud_token=$HCLOUD_TOKEN" >> "$GITHUB_ENV"
              echo "TF_VAR_environment=dev-hetz" >> "$GITHUB_ENV"
              echo "TF_VAR_server_type=cx23" >> "$GITHUB_ENV"
              echo "TF_VAR_ssh_key_name=Vitali.pub" >> "$GITHUB_ENV"
              echo "TF_VAR_primary_ip_name=primary_ip-1" >> "$GITHUB_ENV"
              ;;
            cloudflare)
              echo "TF_VAR_cloudflare_api_token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
              echo "TF_VAR_domain=vitalikuts.online" >> "$GITHUB_ENV"
              ;;
            cloudflare-prod)
              echo "TF_VAR_cloudflare_api_token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
              echo "TF_VAR_domain=dreamseed.online" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Create dummy SSH key for plan
        if: contains(matrix.target, 'aws')
        run: ssh-keygen -t rsa -b 4096 -f /tmp/ssh -N "" -C "drift-test" || true

      - name: Terraform Init
        working-directory: ${{ matrix.tf_dir }}
        run: terraform init -input=false

      - name: Detect Drift
        id: plan
        working-directory: ${{ matrix.tf_dir }}
        run: |
          # All backends are remote (Terraform Cloud) — plan without -out.
          terraform plan -detailed-exitcode -no-color -input=false 2>&1 | tee /tmp/plan.log
          rc=${PIPESTATUS[0]}
          CHANGES=$(grep -c '^  #' /tmp/plan.log || true)

          if [ "$rc" -eq 1 ]; then
            echo "::error::Terraform plan failed for ${{ matrix.target }} — check credentials, state, or provider."
            exit 1
          fi

          if [ "$CHANGES" -gt 0 ]; then
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
            echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            echo "changes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Show plan details
        if: steps.plan.outputs.has_drift == 'true'
        working-directory: ${{ matrix.tf_dir }}
        run: |
          echo "## Drift Details for ${{ matrix.target }}"
          grep -E "^  #|^  +" /tmp/plan.log | head -20

      - name: Report and notify drift (prod only)
        if: steps.plan.outputs.has_drift == 'true' && matrix.provider == 'prod'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Infrastructure drift detected on ${{ matrix.target }}! Review the plan output above."
          MSG="🔴 *Drift detected* — ${{ matrix.target }}
          Changes: ${{ steps.plan.outputs.changes }}
          🔗 $RUN_URL
          📅 $(date '+%Y-%m-%d %H:%M')"
          bash "$GITHUB_WORKSPACE/scripts/send_tg.sh" "$MSG" Markdown || true
          exit 1

      - name: Log drift (dev — no fail)
        if: steps.plan.outputs.has_drift == 'true' && matrix.provider == 'dev'
        run: |
          echo "::notice::Drift detected on ${{ matrix.target }} (dev) — ${{ steps.plan.outputs.changes }} changes. Not failing CI."

      - name: Write job summary
        if: always()
        run: |
          DRIFT="${{ steps.plan.outputs.has_drift }}"
          CHANGES="${{ steps.plan.outputs.changes }}"
          PLAN="${{ steps.plan.outcome }}"
          if [ "$PLAN" = "failure" ]; then
            STATUS="❌ Plan failed"
          elif [ "$DRIFT" = "true" ]; then
            STATUS="⚠️ Drift ($CHANGES changes)"
          else
            STATUS="✅ No drift"
          fi

          {
            echo "## Drift Detection — ${{ matrix.target }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${STATUS} |"
            echo "| **Provider** | ${{ matrix.provider }} |"
            echo "| **Commit** | ${{ github.sha }} |"
            echo "| **Run** | [link](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  wake-grafana:
    name: Wake Grafana Cloud instances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Grafana Cloud free/paid instances can fall into a "Loading" state after a
    # long idle period — the API returns 503 {"code":"Loading",...} until someone
    # activates it in the web UI. This daily ping wakes both dev and prod so the
    # grafana-cloud.yml workflow doesn't fail on a sleeping instance. It also
    # surfaces invalid tokens (401) early, before an apply run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wake dev instance
        id: dev-wake
        env:
          DEV_SA_TOKEN: ${{ secrets.DEV_GRAFANA_CLOUD_SA_TOKEN }}
        run: |
          if [ -z "$DEV_SA_TOKEN" ]; then
            echo "dev_http=NO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "dev dev_http=NO_TOKEN"
            exit 0
          fi
          CODE=$(curl -sS --max-time 30 -o /tmp/gc-dev.json -w "%{http_code}" \
            -H "Authorization: Bearer $DEV_SA_TOKEN" \
            "https://vitalikuts.grafana.net/api/folders" || echo "000")
          echo "dev_http=$CODE" >> "$GITHUB_OUTPUT"
          echo "dev dev_http=$CODE"
      - name: Wake prod instance
        id: prod-wake
        env:
          PROD_SA_TOKEN: ${{ secrets.PROD_GRAFANA_CLOUD_SA_TOKEN }}
        run: |
          if [ -z "$PROD_SA_TOKEN" ]; then
            echo "prod_http=NO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "prod prod_http=NO_TOKEN"
            exit 0
          fi
          CODE=$(curl -sS --max-time 30 -o /tmp/gc-prod.json -w "%{http_code}" \
            -H "Authorization: Bearer $PROD_SA_TOKEN" \
            "https://dreamseed.grafana.net/api/folders" || echo "000")
          echo "prod_http=$CODE" >> "$GITHUB_OUTPUT"
          echo "prod prod_http=$CODE"
      - name: Notify on sleeping/invalid instance
        if: steps.dev-wake.outputs.dev_http != '200' || steps.prod-wake.outputs.prod_http != '200'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          DEV_HTTP: ${{ steps.dev-wake.outputs.dev_http }}
          PROD_HTTP: ${{ steps.prod-wake.outputs.prod_http }}
        run: |
          MSG="⚠️ *Grafana Cloud wake check* — instance not responding
          dev: HTTP ${DEV_HTTP:-000} (expect 200)
          prod: HTTP ${PROD_HTTP:-000} (expect 200)
          HTTP 503 'Loading' = instance asleep — activate in grafana.com UI
          HTTP 401 = token invalid — rotate in GitHub Secrets"
          bash "$GITHUB_WORKSPACE/scripts/send_tg.sh" "$MSG" Markdown || true
      - name: Write job summary
        if: always()
        run: |
          M="$GITHUB_STEP_SUMMARY"
          [[ -z "$M" ]] && exit 0
          {
            echo "## Grafana Cloud wake check"
            echo ""
            echo "| Instance | HTTP |"
            echo "|---|---|"
            echo "| dev (vitalikuts.grafana.net) | ${{ steps.dev-wake.outputs.dev_http }} |"
            echo "| prod (dreamseed.grafana.net) | ${{ steps.prod-wake.outputs.prod_http }} |"
          } >> "$M"
