name: Drift Detection

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 7 * * *'  # 07:05 UTC daily
  workflow_dispatch:

concurrency:
  group: drift-detection
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  drift-prod-hetz:
    name: Detect drift — Hetzner prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: prod-hetz
      TF_VAR_hcloud_token: ${{ secrets.PROD_HETZ_HCLOUD_TOKEN }}
      TF_VAR_environment: prod-hetz

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-terraform

      - name: Terraform Init
        working-directory: terraform/hetzner
        run: terraform init

      - name: Detect Drift
        id: plan
        working-directory: terraform/hetzner
        run: |
          terraform plan -detailed-exitcode -no-color \
            -var="ssh_key_name=Vitali.pub" \
            -out=/tmp/prod-hetz.tfplan 2>&1 | tee /tmp/plan.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 1 ]; then
            echo "::error::Terraform plan failed for Hetzner prod — check credentials, state, or provider."
            exit 1
          fi
          # Detect drift from plan output (exit code unreliable with TFC remote execution — always 0)
          # Only flag drift when resources change (>0 change/destroy), not just adds (empty workspace)
          if grep -qE '^Plan: [0-9]+ to add, [0-9]+ to change, [1-9][0-9]* to destroy[.]?$' /tmp/plan.log ||
             grep -qE '^Plan: [0-9]+ to add, [1-9][0-9]* to change' /tmp/plan.log; then
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report and notify drift
        if: steps.plan.outputs.exit_code == '2'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Infrastructure drift detected on Hetzner prod! Review the plan output above."
          MSG="🔴 *Drift detected* — Hetzner prod
          🔗 $RUN_URL
          📅 $(date '+%Y-%m-%d %H:%M')"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            ${TG_THREAD_ID:+-d "message_thread_id=${TG_THREAD_ID}"} \
            --data-urlencode "parse_mode=MarkdownV2" \
            --data-urlencode "text=$MSG" > /dev/null || true
          exit 1
